{"id":"b122","after":122,"lv":"N3","k":"短文","title":"図書館[としょかん]からの 連絡[れんらく]","text":"山口[やまぐち] 様[さま]\nご予約[よやく]いただいた 本[ほん]「日本[にほん]の 城[しろ]」が 用意[ようい]できました。十[じゅう]月[がつ] 二十日[はつか]（金[きん]）まで、一階[いっかい]の カウンターで お預[あず]かりして います。\n期間[きかん]を すぎると、次[つぎ]に 予約[よやく]して いる 方[ほう]に お回[まわ]しします。\n受[う]け取[と]りには、図書館[としょかん]カードが 必要[ひつよう]です。カードさえ あれば、ご家族[かぞく]の 方[ほう]が 代[か]わりに 受[う]け取[と]る ことも できます。\nさくら市立図書館[しりつとしょかん]","ko":"야마구치 님\n예약하신 책 『일본의 성』이 준비되었습니다. 10월 20일(금)까지 1층 카운터에서 보관하고 있습니다.\n기간이 지나면 다음에 예약하신 분께 넘깁니다.\n수령에는 도서관 카드가 필요합니다. 카드만 있으면 가족분이 대신 받으실 수도 있습니다.\n사쿠라 시립도서관","gloss":[["城[しろ]","성"],["預[あず]かる","맡아 두다"],["回[まわ]す","넘기다"],["受[う]け取[と]る","받다"],["〜さえ 〜ば","~만 ~하면"],["代[か]わりに","대신에"]],"qs":[{"c":["g:122"],"q":"山口[やまぐち]さんの 家族[かぞく]が 本[ほん]を 受[う]け取[と]る ために 必要[ひつよう]な ものは 何[なん]ですか。","o":["山口[やまぐち]さんが 書[か]いた 手紙[てがみ]","山口[やまぐち]さんの 図書館[としょかん]カード","予約[よやく]の 番号[ばんごう]","家族[かぞく]の 身分証明書[みぶんしょうめいしょ]"],"ex":"「カードさえあれば、ご家族[かぞく]の方[ほう]が代[か]わりに受[う]け取[と]ることもできます」. 〜さえ〜ば(Day 122).","a":1}],"more":[{"k":"中文","title":"時間[じかん]さえ あれば","text":"「時間[じかん]さえ あれば、もっと 本[ほん]を 読[よ]むのに」「お金[かね]さえ あれば、旅行[りょこう]に 行[い]くのに」。こんな ことを 言[い]った ことは ないだろうか。私[わたし]も 学生[がくせい]の ころは、よく そう 思[おも]って いた。\n社会人[しゃかいじん]に なって、ある 程度[ていど]の お金[かね]は 自由[じゆう]に 使[つか]える ように なった。ところが、今度[こんど]は 時間[じかん]が ない。そして 不思議[ふしぎ]な ことに、休[やす]みの 日[ひ]で 時間[じかん]が ある 時[とき]でも、結局[けっきょく] 本[ほん]は 読[よ]まなかった。疲[つか]れて いる、天気[てんき]が いい、見[み]たい テレビが ある。理由[りゆう]は いくらでも 見[み]つかった。\nそこで 気[き]が ついた。私[わたし]に 足[た]りなかったのは、時間[じかん]でも お金[かね]でもなく、「本当[ほんとう]に やりたい」と いう 気持[きも]ちだったのかもしれない。本当[ほんとう]に やりたい ことなら、人[ひと]は 時間[じかん]を 作[つく]るものだ。\n今[いま]、私[わたし]は 寝[ね]る 前[まえ]の 十五分[じゅうごふん]だけ 本[ほん]を 読[よ]む ことに して いる。たった 十五分[じゅうごふん]でも、一[いっ]か月[げつ][げつ]で 二[に]冊[さつ]は 読[よ]める。「〜さえ あれば」と 言[い]う 前[まえ]に、今[いま] ある もので できる ことを 探[さが]す ほうが いいと 思[おも]う。","ko":"\"시간만 있으면 책을 더 읽을 텐데\" \"돈만 있으면 여행을 갈 텐데\". 이런 말을 한 적은 없을까. 나도 학생 때는 자주 그렇게 생각했다.\n사회인이 되어 어느 정도의 돈은 자유롭게 쓸 수 있게 되었다. 그런데 이번에는 시간이 없다. 그리고 이상하게도 쉬는 날이라 시간이 있을 때조차 결국 책은 읽지 않았다. 피곤하다, 날씨가 좋다, 보고 싶은 텔레비전이 있다. 이유는 얼마든지 찾을 수 있었다.\n그래서 깨달았다. 나에게 부족했던 것은 시간도 돈도 아니라 \"정말 하고 싶다\"는 마음이었는지도 모른다. 정말 하고 싶은 일이라면 사람은 시간을 만드는 법이다.\n지금 나는 자기 전 15분만 책을 읽기로 하고 있다. 고작 15분이라도 한 달에 두 권은 읽을 수 있다. \"~만 있으면\"이라고 말하기 전에 지금 있는 것으로 할 수 있는 일을 찾는 편이 좋다고 생각한다.","gloss":[["ある 程度[ていど]","어느 정도"],["不思議[ふしぎ]","이상함"],["いくらでも","얼마든지"],["足[た]りない","부족하다"],["〜ものだ","~하는 법이다"]],"qs":[{"c":["g:122"],"q":"休[やす]みの 日[ひ]に 時間[じかん]が あっても、筆者[ひっしゃ]が 本[ほん]を 読[よ]まなかったのは なぜですか。","o":["お金[かね]が なかったから","疲[つか]れて 寝[ね]て いたから","読[よ]みたい 本[ほん]が なかったから","読[よ]まない 理由[りゆう]を 自分[じぶん]で 見[み]つけて いたから"],"ex":"피곤·날씨·텔레비전… 「理由[りゆう]はいくらでも見[み]つかった」 → 안 읽을 이유를 스스로 찾고 있었다.","a":3},{"c":["g:122"],"q":"筆者[ひっしゃ]が いちばん 言[い]いたい ことは 何[なん]ですか。","o":["社会人[しゃかいじん]は 学生[がくせい]より 時間[じかん]が ない。","毎日[まいにち] 十五分[じゅうごふん] 本[ほん]を 読[よ]むべきだ。","条件[じょうけん]が そろうのを 待[ま]つより、今[いま] できる ことを 始[はじ]める ほうが いい。","時間[じかん]と お金[かね]は どちらも 大切[たいせつ]だ。"],"ex":"마지막 문장 「今[いま]あるものでできることを探[さが]すほうがいい」.","a":2}]},{"k":"情報検索","title":"スポーツジムの 会員[かいいん]","text":"【フィットネスクラブ みどり　会員[かいいん]の 種類[しゅるい]】\n会員[かいいん]の 種類[しゅるい]　　　　利用[りよう]できる 時間[じかん]　　　　　　　　　月会費[げっかいひ]\nフルタイム　　　　　全営業時間[ぜんえいぎょうじかん]　　　　　　　　　　　九[きゅう]千[せん]八[はっ]百[ぴゃく]円[えん]\nデイタイム　　　　　平日[へいじつ] 十時[じゅうじ]〜十[じゅう]七[しち]時[じ]　　　　　　　六[ろく]千[せん]五[ご]百[ひゃく]円[えん]\nナイト　　　　　　　平日[へいじつ] 十[じゅう]九[く]時[じ]〜二[に]十[じゅう]三[さん]時[じ]　　　　　六[ろく]千[せん]八[はっ]百[ぴゃく]円[えん]\nホリデー　　　　　　土[ど]・日[にち]・祝日[しゅくじつ]の 全営業時間[ぜんえいぎょうじかん]　　　五[ご]千[せん]五[ご]百[ひゃく]円[えん]\n◆ 営業時間[えいぎょうじかん]：平日[へいじつ] 七時[しちじ]〜二[に]十[じゅう]三[さん]時[じ]、土[ど]・日[にち]・祝日[しゅくじつ] 九時[くじ]〜二[に]十[じゅう]時[じ]。毎週[まいしゅう] 木曜日[もくようび]は 休[やす]み。\n◆ 入会金[にゅうかいきん] 五[ご]千[せん]円[えん]、事務手数料[じむてすうりょう] 二[に]千[せん]円[えん]が 入会時[にゅうかいじ]に 必要[ひつよう]です。\n◆ 今月[こんげつ]の キャンペーン：今月中[こんげつちゅう]に 入会[にゅうかい]すると、入会金[にゅうかいきん]が 無料[むりょう]に なり、最初[さいしょ]の 月[つき]の 会費[かいひ]が 半額[はんがく]に なります。\n◆ 学生[がくせい]（高校生[こうこうせい]・大学生[だいがくせい]）は、学生証[がくせいしょう]さえ 見[み]せれば、どの 会員[かいいん]でも 月会費[げっかいひ]が 千円[せんえん] 安[やす]く なります。\n◆ プールの 利用[りよう]は、別[べつ]に 一回[いっかい] 三[さん]百[びゃく]円[えん] かかります。","ko":"[피트니스 클럽 미도리 회원 종류]\n풀타임: 전체 영업시간, 월회비 9800엔 / 데이타임: 평일 10~17시, 6500엔 / 나이트: 평일 19~23시, 6800엔 / 홀리데이: 토·일·공휴일 전체 영업시간, 5500엔\n◆ 영업시간: 평일 7~23시, 토·일·공휴일 9~20시. 매주 목요일 휴무.\n◆ 입회금 5000엔, 사무 수수료 2000엔이 가입 시 필요합니다.\n◆ 이번 달 캠페인: 이번 달 안에 가입하면 입회금이 무료가 되고 첫 달 회비가 반값이 됩니다.\n◆ 학생(고등학생·대학생)은 학생증만 보여 주면 어느 회원이든 월회비가 1000엔 싸집니다.\n◆ 수영장 이용은 별도로 1회 300엔이 듭니다.","gloss":[["フィットネスクラブ","피트니스 클럽"],["会員[かいいん]","회원"],["種類[しゅるい]","종류"],["月会費[げっかいひ]","월회비"],["営業時間[えいぎょうじかん]","영업시간"],["入会金[にゅうかいきん]","입회금"],["事務手数料[じむてすうりょう]","사무 수수료"],["キャンペーン","캠페인"]],"qs":[{"c":["g:122"],"q":"会社員[かいしゃいん]の 鈴木[すずき]さんは 平日[へいじつ]は 仕事[しごと]で 夜[よる] 八時[はちじ]まで 会社[かいしゃ]に います。平日[へいじつ]の 夜[よる]と 週末[しゅうまつ]に 通[かよ]いたいです。どの 会員[かいいん]が いいですか。","o":["ナイト","フルタイム","ホリデー","デイタイム"],"ex":"평일 밤 + 주말 둘 다 → 모든 시간에 쓸 수 있는 풀타임뿐이에요.","a":1},{"c":["g:122"],"q":"大学生[だいがくせい]の リンさんが 今月[こんげつ] ホリデー会員[かいいん]に なります。入会[にゅうかい]する 時[とき]に 払[はら]う お金[かね]は いくらですか。(最初[さいしょ]の 月[つき]の 会費[かいひ]も 入会時[にゅうかいじ]に 払[はら]います)","o":["四[よん]千[せん]二[に]百[ひゃく]五[ご]十[じゅう]円[えん]","六[ろく]千[せん]五[ご]百[ひゃく]円[えん]","二[に]千[せん]二[に]百[ひゃく]五[ご]十[じゅう]円[えん]","七[なな]千[せん]二[に]百[ひゃく]五[ご]十[じゅう]円[えん]"],"ex":"월회비 5500−1000(학생)=4500엔, 첫 달 반값 2250엔. 입회금 무료, 수수료 2000엔 → 4250엔.","a":0}]}]},
{"id":"b126","after":126,"lv":"N3","k":"短文","title":"部長[ぶちょう]からの メッセージ","text":"営業部[えいぎょうぶ]の みなさん\n来月[らいげつ]から 新[あたら]しい 商品[しょうひん]の 販売[はんばい]が 始[はじ]まります。これに ともなって、毎週[まいしゅう] 月曜日[げつようび]の 朝[あさ]に 短[みじか]い 会議[かいぎ]を 開[ひら]く ことに しました。\n会議[かいぎ]では、前[まえ]の 週[しゅう]の 売[う]り上[あ]げと、お客様[きゃくさま]からの 意見[いけん]を 一人[ひとり]ずつ 報告[ほうこく]して もらいます。資料[しりょう]は 簡単[かんたん]な もので かまいません。\n部長[ぶちょう] 森[もり]","ko":"영업부 여러분\n다음 달부터 신상품 판매가 시작됩니다. 이에 따라 매주 월요일 아침에 짧은 회의를 열기로 했습니다.\n회의에서는 지난주 매출과 고객 의견을 한 사람씩 보고해 주시기 바랍니다. 자료는 간단한 것이어도 괜찮습니다.\n부장 모리","gloss":[["販売[はんばい]","판매"],["〜に ともなって","~에 따라"],["売[う]り上[あ]げ","매출"],["かまわない","괜찮다"]],"qs":[{"c":["g:126"],"q":"営業部[えいぎょうぶ]の 人[ひと]が 月曜日[げつようび]の 会議[かいぎ]で しなければ ならない ことは 何[なん]ですか。","o":["新[あたら]しい 商品[しょうひん]を 売[う]り始[はじ]める。","新[あたら]しい 商品[しょうひん]の 資料[しりょう]を 詳[くわ]しく 作[つく]る。","会議[かいぎ]の 時間[じかん]を 決[き]める。","先週[せんしゅう]の 売[う]り上[あ]げと 客[きゃく]の 意見[いけん]を 報告[ほうこく]する。"],"ex":"「前[まえ]の週[しゅう]の売[う]り上[あ]げと、お客様[きゃくさま]からの意見[いけん]を一人[ひとり]ずつ報告[ほうこく]」. 자료는 간단해도 된다고 했어요.","a":3}],"more":[{"k":"中文","title":"年[とし]を とるとともに","text":"年[とし]を とるとともに、時間[じかん]が 早[はや]く 過[す]ぎる ように 感[かん]じる。子[こ]どもの ころの 夏休[なつやす]みは 永遠[えいえん]に 続[つづ]く ような 気[き]が したのに、今[いま]は 一年[いちねん]が あっと いう 間[ま]に 終[お]わって しまう。\nこの 感[かん]じ方[ほう]に ついては、いろいろな 説明[せつめい]が ある。その 一[ひと]つは、「新[あたら]しい 経験[けいけん]が 減[へ]るから」と いう ものだ。子[こ]どもの ころは 毎日[まいにち]が 初[はじ]めての ことばかりで、一日[いちにち]一日[いちにち]が 強[つよ]く 記憶[きおく]に 残[のこ]る。ところが 大人[おとな]に なると、同[おな]じ ような 毎日[まいにち]を 繰[く]り返[かえ]す ので、思[おも]い出[だ]す ことが 少[すく]なく、時間[じかん]が 短[みじか]く 感[かん]じられると いうのだ。\nもし そうなら、大人[おとな]でも 新[あたら]しい ことを 始[はじ]めれば、時間[じかん]を 長[なが]く 感[かん]じられるはずだ。私[わたし]は 去年[きょねん]から 月[つき]に 一回[いっかい]、行[い]った ことの ない 店[みせ]で 食事[しょくじ]を する ことに した。小[ちい]さな ことだが、去年[きょねん]の 一年[いちねん]は 前[まえ]の 年[とし]より 少[すこ]しだけ 長[なが]かった ような 気[き]が する。","ko":"나이를 먹음에 따라 시간이 빨리 지나가는 것처럼 느껴진다. 어릴 때 여름방학은 영원히 계속될 것 같은 기분이 들었는데, 지금은 1년이 눈 깜짝할 사이에 끝나 버린다.\n이 느낌에 대해서는 여러 설명이 있다. 그중 하나는 \"새로운 경험이 줄기 때문\"이라는 것이다. 어릴 때는 매일이 처음 하는 일투성이라 하루하루가 강하게 기억에 남는다. 그런데 어른이 되면 비슷한 매일을 되풀이하기 때문에 떠올릴 일이 적어서 시간이 짧게 느껴진다는 것이다.\n만약 그렇다면 어른이라도 새로운 일을 시작하면 시간을 길게 느낄 수 있을 것이다. 나는 작년부터 한 달에 한 번 가 본 적 없는 가게에서 식사를 하기로 했다. 작은 일이지만 작년 1년은 그 전 해보다 조금 길었던 것 같은 기분이 든다.","gloss":[["〜とともに","~함에 따라"],["永遠[えいえん]","영원"],["あっと いう 間[ま]","눈 깜짝할 사이"],["説[せつ]","설"],["記憶[きおく]","기억"]],"qs":[{"c":["g:126"],"q":"大人[おとな]が 時間[じかん]を 短[みじか]く 感[かん]じる 理由[りゆう]として、文章[ぶんしょう]に 書[か]いて ある ものは どれですか。","o":["夏休[なつやす]みが ないから","仕事[しごと]が 忙[いそが]しくて 休[やす]みが ないから","子[こ]どもより 体[からだ]が 疲[つか]れやすいから","同[おな]じ ような 毎日[まいにち]で、記憶[きおく]に 残[のこ]る ことが 少[すく]ないから"],"ex":"비슷한 매일의 반복 → 떠올릴 일이 적음 → 시간이 짧게 느껴진다. 〜とともに(Day 126).","a":3},{"c":["g:126"],"q":"筆者[ひっしゃ]が 新[あたら]しい 店[みせ]で 食事[しょくじ]を する ように したのは なぜですか。","o":["いつもの 店[みせ]が 閉[し]まったから","友達[ともだち]に すすめられたから","新[あたら]しい 経験[けいけん]を して、時間[じかん]を 長[なが]く 感[かん]じたかったから","おいしい 料理[りょうり]が 好[す]きだから"],"ex":"새 경험이 시간을 길게 느끼게 한다는 설을 직접 시험해 본 거예요.","a":2}]},{"k":"長文","title":"ゴミが 増[ふ]える 一方[いっぽう]の 町[まち]","text":"私[わたし]の 住[す]む 海辺[うみべ]の 町[まち]では、夏[なつ]に なると 海岸[かいがん]の ゴミが 増[ふ]える 一方[いっぽう]だ。ペットボトル、花火[はなび]の ごみ、食[た]べ物[もの]の 袋[ふくろ]。朝[あさ]、散歩[さんぽ]を すると、砂浜[すなはま]の あちこちに 前[まえ]の 夜[よる]の ゴミが 残[のこ]って いる。\n町[まち]は ゴミ箱[はこ]を 増[ふ]やしたり、看板[かんばん]を 立[た]てたり して きたが、あまり 効果[こうか]は なかった。ゴミ箱[はこ]は すぐに いっぱいに なり、その 周[まわ]りに さらに ゴミが 置[お]かれる ように なったのだ。\nそこで、三[さん]年[ねん]前[まえ]、町[まち]の 高校生[こうこうせい]たちが ある アイデアを 出[だ]した。ゴミ箱[はこ]を 減[へ]らす 代[か]わりに、海岸[かいがん]の 入口[いりぐち]で 小[ちい]さな ゴミ袋[ぶくろ]を 配[くば]り、「自分[じぶん]の ゴミは 持[も]って 帰[かえ]って ください」と 声[こえ]を かけるのだ。袋[ふくろ]には、高校生[こうこうせい]が 描[か]いた 海[うみ]の 生[い]き物[もの]の 絵[え]が 印刷[いんさつ]されて いる。\n最初[さいしょ]は「そんな ことで 変[か]わるはずが ない」と 言[い]う 大人[おとな]も 多[おお]かった。ところが、一年[いちねん]目[め]の 夏[なつ]が 終[お]わると、海岸[かいがん]の ゴミは 前[まえ]の 年[とし]の 半分[はんぶん] 以下[いか]に なった。袋[ふくろ]を もらった 人[ひと]に 話[はなし]を 聞[き]くと、「高校生[こうこうせい]に 直接[ちょくせつ] 頼[たの]まれると、捨[す]てにくい」「絵[え]が かわいくて、使[つか]いたく なった」と いう 声[こえ]が 多[おお]かった そうだ。\nこの 話[はなし]から 分[わ]かるのは、ルールや 設備[せつび]だけでは 人[ひと]の 行動[こうどう]は なかなか 変[か]わらない と いう ことだ。人[ひと]が 動[うご]くのは、だれかの 気持[きも]ちが 伝[つた]わった 時[とき]なのだろう。今年[ことし]も 海岸[かいがん]の 入口[いりぐち]には、日[ひ]に 焼[や]けた 高校生[こうこうせい]たちが 袋[ふくろ]を 持[も]って 立[た]って いる。","ko":"내가 사는 바닷가 마을에서는 여름이 되면 해안 쓰레기가 늘기만 한다. 페트병, 불꽃놀이 쓰레기, 음식 봉지. 아침에 산책을 하면 모래사장 여기저기에 전날 밤의 쓰레기가 남아 있다.\n마을은 쓰레기통을 늘리거나 간판을 세우거나 해 왔지만 그다지 효과는 없었다. 쓰레기통은 금방 가득 차고 그 주변에 쓰레기가 더 놓이게 된 것이다.\n그래서 3년 전 마을 고등학생들이 어떤 아이디어를 냈다. 쓰레기통을 줄이는 대신 해안 입구에서 작은 쓰레기봉투를 나눠 주며 \"자기 쓰레기는 가지고 돌아가 주세요\"라고 말을 거는 것이다. 봉투에는 고등학생이 그린 바다 생물 그림이 인쇄되어 있다.\n처음에는 \"그런 걸로 바뀔 리가 없다\"고 말하는 어른도 많았다. 그런데 첫해 여름이 끝나자 해안 쓰레기는 전년의 절반 이하가 되었다. 봉투를 받은 사람에게 이야기를 들어 보니 \"고등학생이 직접 부탁하면 버리기 어렵다\" \"그림이 귀여워서 쓰고 싶어졌다\"는 목소리가 많았다고 한다.\n이 이야기에서 알 수 있는 것은 규칙이나 설비만으로는 사람의 행동이 좀처럼 바뀌지 않는다는 것이다. 사람이 움직이는 것은 누군가의 마음이 전해졌을 때일 것이다. 올해도 해안 입구에는 햇볕에 그을린 고등학생들이 봉투를 들고 서 있다.","gloss":[["海辺[うみべ]","바닷가"],["〜一方[いっぽう]だ","~하기만 한다"],["ペットボトル","페트병"],["砂浜[すなはま]","모래사장"],["あちこち","여기저기"],["効果[こうか]","효과"],["アイデア","아이디어"],["〜代[か]わりに","~하는 대신"],["生[い]き物[もの]","생물"],["〜はずが ない","~할 리가 없다"],["設備[せつび]","설비"],["日[ひ]に 焼[や]ける","햇볕에 타다"]],"qs":[{"c":["g:126"],"q":"ゴミ箱[はこ]を 増[ふ]やした 結果[けっか]、どう なりましたか。","o":["ゴミ箱[はこ]の 周[まわ]りにも ゴミが 置[お]かれた。","海岸[かいがん]の ゴミが 減[へ]った。","看板[かんばん]が 必要[ひつよう]なく なった。","ゴミ箱[はこ]が 足[た]りなく なった。"],"ex":"「ゴミ箱[はこ]はすぐにいっぱいになり、その周[まわ]りにさらにゴミが置​かれるようになった」.","a":0},{"c":["g:126"],"q":"高校生[こうこうせい]たちの アイデアは どんな ものでしたか。","o":["ゴミを 捨[す]てた 人[ひと]に 注意[ちゅうい]する。","袋[ふくろ]を 渡[わた]して、ゴミを 持[も]ち帰[かえ]るように 頼[たの]む。","海岸[かいがん]に 新[あたら]しい 看板[かんばん]を 立[た]てる。","ゴミ箱[はこ]に 絵[え]を 描[か]く。"],"ex":"쓰레기통을 줄이는 대신 봉투를 나눠 주고 \"가지고 돌아가 달라\"고 말을 건다.","a":1},{"c":["g:126"],"q":"袋[ふくろ]を もらった 人[ひと]たちは、なぜ ゴミを 持[も]って 帰[かえ]ったと 言[い]って いますか。","o":["罰金[ばっきん]が あるから","海[うみ]が 好[す]きだから","ゴミ箱[はこ]が なかったから","高校生[こうこうせい]に 頼[たの]まれたし、袋[ふくろ]も 気[き]に 入[はい]ったから"],"ex":"「高校[こうこう]生[なま]に直[なお]接​頼[たの]まれると、捨[す]てにくい」「絵[え]がかわいくて、使[つか]いたくなった」.","a":3},{"c":["g:126"],"q":"筆者[ひっしゃ]は この 話[はなし]から 何[なに]が 分[わ]かると 言[い]って いますか。","o":["高校生[こうこうせい]は 大人[おとな]より 頭[あたま]が いい。","ゴミ箱[はこ]は 少[すく]ない ほうが いい。","看板[かんばん]は 効果[こうか]が ない。","人[ひと]の 行動[こうどう]を 変[か]えるのは、ルールより 人[ひと]の 気持[きも]ちだ。"],"ex":"「人[ひと]が動[うご]くのは、だれかの気持[きも]ちが伝[つた]わった時[とき]なのだろう」. 쓰레기통을 줄이자는 게 결론은 아니에요.","a":3}]}]},
{"id":"b129","after":129,"lv":"N3","k":"短文","title":"商品[しょうひん]の 感想[かんそう]","text":"この 掃除機[そうじき]は 値段[ねだん]の わりに よく 吸[す]うので、とても 満足[まんぞく]して います。軽[かる]いので、階段[かいだん]の 掃除[そうじ]も 楽[らく]です。\nただ、音[おと]が 思[おも]って いたより 大[おお]きいので、夜[よる] 遅[おそ]く 使[つか]うのは 少[すこ]し 気[き]に なります。また、ゴミを 捨[す]てる 時[とき]に 手[て]が 汚[よご]れやすいのが 残念[ざんねん]です。\n全体[ぜんたい]として、一人[ひとり]暮[く]らしの 人[ひと]には おすすめです。","ko":"이 청소기는 가격에 비해 잘 빨아들여서 아주 만족하고 있습니다. 가벼워서 계단 청소도 편합니다.\n다만 소리가 생각보다 커서 밤늦게 쓰는 건 조금 신경이 쓰입니다. 또 쓰레기를 버릴 때 손이 더러워지기 쉬운 점이 아쉽습니다.\n전체적으로 혼자 사는 사람에게는 추천합니다.","gloss":[["感想[かんそう]","감상"],["掃除機[そうじき]","청소기"],["〜わりに","~에 비해"],["吸[す]う","빨아들이다"],["満足[まんぞく]","만족"],["気[き]に なる","신경 쓰이다"],["全体[ぜんたい]","전체"]],"qs":[{"c":["g:129"],"q":"この 人[ひと]が 掃除機[そうじき]に ついて よく ないと 思[おも]って いる ことは 何[なん]ですか。","o":["値段[ねだん]が 高[たか]い こと","重[おも]くて 使[つか]いにくい こと","ゴミを あまり 吸[す]わない こと","音[おと]が 大[おお]きい こと"],"ex":"불만은 소리가 큰 것과 손이 더러워지기 쉬운 것. 〜わりに(Day 129)는 \"~에 비해\".","a":3}],"more":[{"k":"中文","title":"年[とし]の わりに","text":"祖母[そぼ]は 今年[ことし] 八[はち]十[じゅう]五[ご]歳[さい]に なるが、年[とし]の わりに とても 元気[げんき]だ。毎朝[まいあさ] 六時[ろくじ]に 起[お]きて、近所[きんじょ]の 公園[こうえん]で 体操[たいそう]を して から、自分[じぶん]で 朝[あさ]ご飯[はん]を 作[つく]る。最近[さいきん]は スマホも 使[つか]える ように なり、孫[まご]の 私[わたし]に 毎日[まいにち] 写真[しゃしん]を 送[おく]って くる。\n先日[せんじつ]、祖母[そぼ]に「元気[げんき]の 秘密[ひみつ]は 何[なん]」と 聞[き]いて みた。祖母[そぼ]は 少[すこ]し 考[かんが]えて から、「毎日[まいにち]、何[なに]か 一[ひと]つ 新[あたら]しい ことを する ことかな」と 答[こた]えた。昨日[きのう]は 新[あたら]しい レシピで 料理[りょうり]を 作[つく]り、今日[きょう]は 初[はじ]めて 通[とお]る 道[みち]で 散歩[さんぽ]を した そうだ。「年[とし]を とると、新[あたら]しい ことが 面倒[めんどう]に なる。でも、面倒[めんどう]だと 思[おも]う ことを やめたら、本当[ほんとう]に 年[とし]を とって しまうのよ」と 祖母[そぼ]は 笑[わら]った。\n私[わたし]は まだ 二[に]十代[だい]だが、最近[さいきん] 面倒[めんどう]な ことを 避[さ]けて ばかり いた。年[とし]の わりに 若[わか]い 祖母[そぼ]と、年[とし]の わりに 元気[げんき]の ない 私[わたし]。少[すこ]し 恥[は]ずかしく なった。","ko":"할머니는 올해 85세가 되시지만 나이에 비해 아주 건강하시다. 매일 아침 6시에 일어나 동네 공원에서 체조를 하고 나서 직접 아침밥을 만드신다. 요즘은 스마트폰도 쓸 수 있게 되어 손주인 나에게 매일 사진을 보내 오신다.\n지난번 할머니께 \"건강 비결이 뭐예요?\" 하고 여쭤보았다. 할머니는 잠시 생각하고 나서 \"매일 뭔가 하나 새로운 걸 하는 거려나\"라고 대답하셨다. 어제는 새 레시피로 요리를 만들고 오늘은 처음 지나가는 길로 산책을 했다고 한다. \"나이를 먹으면 새로운 일이 귀찮아져. 하지만 귀찮다고 생각하는 걸 그만두면 정말로 늙어 버리는 거야\"라며 할머니는 웃으셨다.\n나는 아직 20대지만 요즘 귀찮은 일을 피하기만 하고 있었다. 나이에 비해 젊은 할머니와 나이에 비해 기운이 없는 나. 조금 부끄러워졌다.","gloss":[["体操[たいそう]","체조"],["孫[まご]","손주"],["秘密[ひみつ]","비결, 비밀"],["レシピ","레시피"],["避[さ]ける","피하다"],["恥[は]ずかしい","부끄럽다"]],"qs":[{"c":["g:129"],"q":"祖母[そぼ]の 元気[げんき]の 秘密[ひみつ]は 何[なん]ですか。","o":["毎日[まいにち] 新[あたら]しい ことを 一[ひと]つ する こと","毎朝[まいあさ] 早[はや]く 起[お]きる こと","スマホで 写真[しゃしん]を 撮[と]る こと","毎日[まいにち] 同[おな]じ 道[みち]を 散歩[さんぽ]する こと"],"ex":"「毎日[まいにち]、何[なに]か一[ひと]つ新[あたら]しいことをすることかな」. 체조·스마트폰은 생활 모습이지 비결이 아니에요.","a":0},{"c":["g:129"],"q":"筆者[ひっしゃ]が「恥[は]ずかしく なった」のは なぜですか。","o":["祖母[そぼ]の 写真[しゃしん]を 見[み]なかったから","若[わか]いのに、面倒[めんどう]な ことを 避[さ]けて いたから","スマホが うまく 使[つか]えないから","祖母[そぼ]より 早[はや]く 起[お]きられないから"],"ex":"20대인데 귀찮은 일만 피하고 있었다 → 나이에 비해(わりに) 기운 없는 나.","a":1}]},{"k":"情報検索","title":"宅配便[たくはいびん]の 料金[りょうきん]","text":"【ひかり宅配便[たくはいびん]　料金表[りょうきんひょう]（同[おな]じ 地方[ちほう]の 中[なか]で 送[おく]る 場合[ばあい]）】\nサイズ（たて・よこ・高[たか]さの 合計[ごうけい]）　重[おも]さ　　　　　料金[りょうきん]\n六[ろく]十[じゅう]サイズ（六[ろく]十[じゅう]センチまで）　　　　二[に]キロまで　　九[きゅう]百[ひゃく]円[えん]\n八[はち]十[じゅう]サイズ（八[はち]十[じゅう]センチまで）　　　　五[ご]キロまで　　千百円[せんひゃくえん]\n百[ひゃく]サイズ（百[ひゃく]センチまで）　　　　　　十[じゅっ]キロまで　　千[せん]四[よん]百[ひゃく]円[えん]\n百[ひゃく]二[に]十[じゅう]サイズ（百[ひゃく]二[に]十[じゅう]センチまで）　　十[じゅう]五[ご]キロまで　千[せん]七[なな]百[ひゃく]円[えん]\n◆ サイズと 重[おも]さの どちらか 大[おお]きい ほうで 料金[りょうきん]が 決[き]まります。\n◆ ほかの 地方[ちほう]へ 送[おく]る 場合[ばあい]は、上[うえ]の 料金[りょうきん]に 三[さん]百[びゃく]円[えん]〜八[はっ]百[ぴゃく]円[えん]が 加[くわ]わります。\n◆ コンビニに 持[も]って 行[い]って 送[おく]ると、一個[いっこ]に つき 百円[ひゃくえん] 引[ひ]きます。\n◆ 時間指定[じかんしてい]：午前中[ごぜんちゅう] / 十四時[じゅうよじ]〜十[じゅう]六[ろく]時[じ] / 十[じゅう]六[ろく]時[じ]〜十八時[じゅうはちじ] / 十八時[じゅうはちじ]〜二[に]十[じゅう]時[じ] / 十[じゅう]九[く]時[じ]〜二十一時[にじゅういちじ]（無料[むりょう]）\n◆ 冷[つめ]たい まま 送[おく]りたい 物[もの]は「クール便[びん]」を ご利用[りよう]ください（プラス 三[さん]百[びゃく]円[えん]）。","ko":"[히카리 택배 요금표(같은 지방 안에서 보내는 경우)]\n60사이즈(60cm까지) 2kg까지 900엔 / 80사이즈(80cm까지) 5kg까지 1100엔 / 100사이즈(100cm까지) 10kg까지 1400엔 / 120사이즈(120cm까지) 15kg까지 1700엔\n◆ 사이즈와 무게 중 큰 쪽으로 요금이 정해집니다.\n◆ 다른 지방으로 보내는 경우 위 요금에 300~800엔이 더해집니다.\n◆ 편의점에 가져가서 보내면 1개당 100엔 할인합니다.\n◆ 시간 지정: 오전 중 / 14~16시 / 16~18시 / 18~20시 / 19~21시(무료)\n◆ 차가운 채로 보내고 싶은 물건은 \"쿨 택배\"를 이용해 주세요(300엔 추가).","gloss":[["宅配便[たくはいびん]","택배"],["料金表[りょうきんひょう]","요금 {"id":"b133","after":133,"lv":"N3","k":"短文","title":"旅行[りょこう]会社[かいしゃ]からの お知[し]らせ","text":"お客様[きゃくさま]各位[かくい]\nご予約[よやく]の「秋[あき]の 京都[きょうと] 一日[いちにち]ツアー」は、参加者[さんかしゃ]が 最低人数[さいていにんずう]の 十人[じゅうにん]に 達[たっ]しなかったため、中止[ちゅうし]と させて いただきます。\n代[か]わりに、十一月[じゅういちがつ] 二十三日[にじゅうさんにち]の 同[おな]じ ツアーへの 変更[へんこう]か、全額[ぜんがく]の 返金[へんきん]の どちらかを お選[えら]びいただけます。十一月[じゅういちがつ] 十日[とおか]までに ご連絡[れんらく]ください。ご連絡[れんらく]が ない 場合[ばあい]は、返金[へんきん]と させて いただきます。","ko":"고객 여러분께\n예약하신 \"가을 교토 당일 투어\"는 참가자가 최소 인원 10명에 이르지 않아 취소하게 되었습니다.\n대신 11월 23일 같은 투어로 변경하시거나 전액 환불 중 하나를 선택하실 수 있습니다. 11월 10일까지 연락해 주십시오. 연락이 없는 경우에는 환불 처리하겠습니다.","gloss":[["ツアー","투어"],["最低人数[さいていにんずう]","최소 인원"],["達[たっ]する","이르다"],["〜させて いただく","~하겠습니다(겸양)"],["変更[へんこう]","변경"],["返金[へんきん]","환불"]],"qs":[{"c":["g:133"],"q":"お客[きゃく]さんが 何[なに]も 連絡[れんらく]しなかった 場合[ばあい]、どう なりますか。","o":["お金[かね]の 半分[はんぶん]が 返[かえ]って くる。","払[はら]った お金[かね]が 全部[ぜんぶ] 返[かえ]って くる。","二十三日[にじゅうさんにち]の ツアーに 変更[へんこう]される。","ツアーに 参加[さんか]できる。"],"ex":"「ご連絡[れんらく]がない場合[ばあい]は、返金[へんきん]とさせていただきます」.","a":1}],"more":[{"k":"中文","title":"手書[てが]きの 手紙[てがみ]","text":"メールや メッセージアプリで 何[なん]でも 連絡[れんらく]できる 時代[じだい]に、手書[てが]きの 手紙[てがみ]を 書[か]く 人[ひと]は 少[すく]なく なった。私[わたし]も 年賀状[ねんがじょう] 以外[いがい]で 手紙[てがみ]を 書[か]く ことは ほとんど ない。\nところが 先月[せんげつ]、転勤[てんきん]した 先輩[せんぱい]から 手書[てが]きの 手紙[てがみ]が 届[とど]いた。新[あたら]しい 職場[しょくば]の 様子[ようす]や、引[ひ]っ越[こ]した 町[まち]の 話[はなし]が、少[すこ]し くせの ある 字[じ]で 三[さん]枚[まい]も 書[か]いて あった。\n内容[ないよう]だけなら、メールでも 伝[つた]えられる だろう。しかし、私[わたし]は その 手紙[てがみ]を 何度[なんど]も 読[よ]み返[かえ]した。字[じ]の 大[おお]きさや、途中[とちゅう]で 書[か]き直[なお]した 跡[あと]から、先輩[せんぱい]が どんな 気持[きも]ちで これを 書[か]いたのかが 想像[そうぞう]できる 気[き]が したのだ。\nメールに 比[くら]べて、手紙[てがみ]は 時間[じかん]も 手間[てま]も かかる。でも、その 手間[てま]こそが、相手[あいて]を 思[おも]う 気持[きも]ちの 表[あらわ]れなのかもしれない。私[わたし]も 今週末[こんしゅうまつ]、先輩[せんぱい]に 返事[へんじ]を 書[か]いて みようと 思[おも]う。","ko":"메일이나 메신저 앱으로 무엇이든 연락할 수 있는 시대에 손으로 쓴 편지를 쓰는 사람은 적어졌다. 나도 연하장 외에 편지를 쓰는 일은 거의 없다.\n그런데 지난달 전근 간 선배에게서 손으로 쓴 편지가 왔다. 새 직장의 모습이나 이사한 동네 이야기가 조금 버릇 있는 글씨로 세 장이나 쓰여 있었다.\n내용만이라면 메일로도 전할 수 있을 것이다. 하지만 나는 그 편지를 몇 번이나 다시 읽었다. 글씨 크기나 중간에 고쳐 쓴 흔적에서 선배가 어떤 마음으로 이걸 썼는지 상상할 수 있을 것 같은 기분이 들었던 것이다.\n메일에 비해 편지는 시간도 품도 든다. 하지만 그 こ]し 違[ちが]う 気持[きも]ちに なる。","ko":"일본어에는 \"もったいない(아깝다)\"라는 말이 있다. 아직 쓸 수 있는 물건을 버리거나 헛되이 하는 것을 아까워하는 마음을 나타내는 말이다. 몇 년 전에는 이 말이 세계의 환경 운동에서도 소개되어 화제가 되었다.\n우리 어머니는 그야말로 \"もったいない\"인 사람이다. 깨끗한 종이봉투나 상자는 전부 모아 둔다. 망가진 우산 천으로 에코백을 만든 적도 있다. 어릴 때 나는 물건으로 가득한 집이 조금 부끄러웠다.\n그런데 최근 \"물건을 버리는\" 것을 권하는 책이 잘 팔리고 있다. 쓰지 않는 물건을 과감히 버리면 방이 정리될 뿐 아니라 마음도 가벼워진다는 것이다. 나도 혼자 살기 시작했을 때 이 사고방식에 끌려서 옷이나 책을 마구 버렸다.\n언뜻 \"もったいない\"와 \"버리기\"는 반대 사고방식처럼 보인다. 하지만 정말 그럴까. 최근 나는 이 둘이 같은 곳에서 오는 것이 아닐까 생각하게 되었다. 둘 다 \"물건을 소중히 하고 싶다\"는 마음이다. 어머니는 물건을 끝까지 다 써서, 나는 정말 필요한 물건만 가져서 물건을 소중히 하려고 하는 것이다.\n중요한 것은 \"버리느냐 남겨 두느냐\"가 아니라 그 물건과 어떻게 지낼지를 스스로 생각하는 것이리라. 어머니 집 벽장에 있는 종이봉투 더미를 봐도 지금은 조금 다른 기분이 든다.","gloss":[["もったいない","아깝다"],["惜[お]しむ","아까워하다"],["環境[かんきょう]運動[うんどう]","환경 운동"],["話題[わだい]","화제"],["まさに","그야말로"],["取[と]って おく","남겨 두다"],["布[ぬの]","천"],["片付[かたづ]く","정리되다"],["ひかれる","끌리다"],["どんどん","마구, 잇달아"],["一見[いっけん]","언뜻"],["使[つか]い切[き]る","다 쓰다"],["山[やま]","더미"]],"qs":[{"c":["g:133"],"q":"子[こ]どもの ころ、筆者[ひっしゃ]は 母[はは]の 家[いえ]を どう 思[おも]って いましたか。","o":["きれいで 気[き]に 入[はい]って いた。","物[もの]が 多[おお]すぎて、少[すこ]し 恥[は]ずかしかった。","物[もの]が 少[すく]なくて さびしかった。","環境[かんきょう]に いいと 思[おも]って いた。"],"ex":"「物[もの]でいっぱいの家[いえ]が少[すこ]し恥[は]ずかしかった」.","a":1},{"c":["g:133"],"q":"「物[もの]を 捨[す]てる」ことを すすめる 本[ほん]は、どんな いい 点[てん]が あると 言[い]って いますか。","o":["部屋[へや]も 気持[きも]ちも すっきり する。","お金[かね]が たまる。","環境[かんきょう]に よい。","新[あたら]しい 物[もの]が 買[か]える。"],"ex":"「部屋[へや]が片付[かたづ]くだけでなく、心[こころ]も軽[かる]くなる」.","a":0},{"c":["g:133"],"q":"筆者[ひっしゃ]は「もったいない」と「捨[す]てる」を どう 考[かんが]える ように なりましたか。","o":["「捨[す]てる」ほうが 正[ただ]しい。","どちらも 物[もの]を 大切[たいせつ]に したい 気持[きも]ちから 来[き]て いる。","「もったいない」ほうが 正[ただ]しい。","まったく 反対[はんたい]の 考[かんが]え方[かた]だ。"],"ex":"「この二[ふた]つは同[おな]じところから来[き]ているのではないか…どちらも、『物[もの]を大切[たいせつ]にしたい』という気持[きも]ちだ」.","a":1},{"c":["g:133"],"q":"この 文章[ぶんしょう]で 筆者[ひっしゃ]が いちばん 言[い]いたい ことは 何[なん]ですか。","o":["母[はは]の 考[かんが]え方[ほう]は 古[ふる]い。","使[つか]わない 物[もの]は すぐに 捨[す]てるべきだ。","紙袋[かみぶくろ]や 箱[はこ]は 取[と]って おいた ほうが いい。","物[もの]と どう 付[つ]き合[あ]うかを 自分[じぶん]で 考[かんが]える ことが 大切[たいせつ]だ。"],"ex":"마지막 단락 「その物[もの]とどう付[つ]き合[あ]うかを自分[じぶん]で考[かんが]えることだろう」. {"id":"b136","after":136,"lv":"N3","k":"短文","title":"アパートの 管理人[かんりにん]から","text":"203号室[ごうしつ]の 方[かた]へ\n最近[さいきん]、夜[よる] 十一時[じゅういちじ]すぎに 洗濯機[せんたくき]を 使[つか]う 音[おと]が 下[した]の 部屋[へや]に 響[ひび]いて いると いう 相談[そうだん]が ありました。\nこのアパートでは、夜[よる] 十時[じゅうじ]から 朝[あさ] 七時[しちじ]までは 洗濯機[せんたくき]や 掃除機[そうじき]を 使[つか]わない ことに なって います。\nご協力[きょうりょく]を お願[ねが]いします。\n管理人[かんりにん]","ko":"203호실 분께\n최근 밤 11시 넘어서 세탁기를 쓰는 소리가 아래층 방에 울린다는 상담이 있었습니다.\n이 아파트에서는 밤 10시부터 아침 7시까지는 세탁기나 청소기를 사용하지 않기로 되어 있습니다.\n협조 부탁드립니다.\n관리인","gloss":[["管理人[かんりにん]","관리인"],["〜号室[ごうしつ]","~호실"],["響[ひび]く","울리다"]],"qs":[{"c":["g:136"],"q":"管理人[かんりにん]は 203号室[ごうしつ]の 人[ひと]に 何[なに]を 頼[たの]んで いますか。","o":["洗濯機[せんたくき]を 新[あたら]しく する ように","下[した]の 部屋[へや]の 人[ひと]に 謝[あやま]る ように","夜[よる] 遅[おそ]くに 洗濯機[せんたくき]を 使[つか]わない ように","朝[あさ] 七時[しちじ]前[まえ]に 洗濯[せんたく]する ように"],"ex":"밤 10시~아침 7시에는 세탁기를 쓰지 않는 규칙을 지켜 달라는 부탁이에요.","a":2}],"more":[{"k":"中文","title":"料理[りょうり]に 加[くわ]えて","text":"去年[きょねん]から、月[つき]に 一度[いちど]、近所[きんじょ]の 公民館[こうみんかん]で「みんなの 食堂[しょくどう]」の 手伝[てつだ]いを して いる。一人[ひとり]で 食事[しょくじ]を する ことが 多[おお]い 子[こ]どもや お年寄[としよ]りが、安[やす]い 値段[ねだん]で 温[あたた]かい ご飯[はん]を 食[た]べられる 場所[ばしょ]だ。\n最初[さいしょ]は、料理[りょうり]を 作[つく]るのが 私[わたし]の 仕事[しごと]だと 思[おも]って いた。ところが、通[かよ]い始[はじ]めて すぐ、ここで 大切[たいせつ]なのは 料理[りょうり]に 加[くわ]えて「一緒[いっしょ]に 食[た]べる 人[ひと]が いる こと」だと 分[わ]かった。\nある 男[おとこ]の子[こ]は、いつも 一人[ひとり]で 来[き]て、黙[だま]って 食[た]べて すぐ 帰[かえ]って いた。何回目[なんかいめ]かの 時[とき]、私[わたし]は 隣[となり]に 座[すわ]って、学校[がっこう]の 話[はなし]を 聞[き]いて みた。最初[さいしょ]は「別[べつ]に」しか 言[い]わなかったが、次[つぎ]の 月[つき]には、自分[じぶん]から サッカーの 試合[しあい]の 話[はなし]を して くれた。\nご飯[はん]を 作[つく]る ことは、だれにでも できる。でも、「また 来[き]たい」と 思[おも]って もらえる 場所[ばしょ]を 作[つく]るのは、そう 簡単[かんたん]では ない。来月[らいげつ]は、その 子[こ]の 試合[しあい]の 結果[けっか]を 聞[き]くのが 今[いま]から 楽[たの]しみだ。","ko":"작년부터 한 달에 한 번 동네 공민관에서 \"모두의 식당\" 일을 돕고 있다. 혼자 식사하는 일이 많은 아이나 노인이 싼 가격에 따뜻한 밥을 먹을 수 있는 곳이다.\n처음에는 요리를 만드는 것이 내 일이라고 생각했다. 그런데 다니기 시작하자마자 여기서 중요한 것은 요리에 더해 \"함께 먹을 사람이 있는 것\"이라는 걸 알았다.\n어떤 남자아이는 늘 혼자 와서 말없이 먹고 바로 돌아갔다. 몇 번째인가에 나는 옆에 앉아 학교 이야기를 물어보았다. 처음에는 \"별로\"라고만 했지만 다음 달에는 스스로 축구 시합 이야기를 해 주었다.\n밥을 만드는 것은 누구나 할 수 있다. 하지만 \"또 오고 싶다\"고 생각하게 되는 곳을 만드는 것은 그렇게 간단하지 않다. 다음 달에는 그 아이의 시합 결과를 듣 {"id":"b140","after":140,"lv":"N3","k":"短文","title":"コーチからの メール","text":"チームの みなさん\n来週[らいしゅう]の 試合[しあい]に 向[む]けて、今週[こんしゅう]は 毎日[まいにち] 練習[れんしゅう]を します。\nけがを しない ためには、練習[れんしゅう]の 前[まえ]の 準備運動[じゅんびうんどう]を しっかり する ことだ。今週[こんしゅう]は 特[とく]に 寒[さむ]く なるので、いつもより 十分[じゅっぷん] 長[なが]く 体[からだ]を 温[あたた]めて から 練習[れんしゅう]を 始[はじ]めましょう。\n体調[たいちょう]が 悪[わる]い 人[ひと]は 無理[むり]を しないで、必[かなら]ず 連絡[れんらく]して ください。\nコーチ 佐藤[さとう]","ko":"팀 여러분\n다음 주 시합을 대비해 이번 주는 매일 연습합니다.\n부상을 입지 않으려면 연습 전 준비 운동을 확실히 하는 것이 중요하다. 이번 주는 특히 추워지니 평소보다 10분 더 길게 몸을 데운 뒤 연습을 시작합시다.\n몸 상태가 나쁜 사람은 무리하지 말고 반드시 연락해 주세요.\n코치 사토","gloss":[["コーチ","코치"],["〜に 向[む]けて","~을 향해, 대비해"],["〜ことだ","~하는 것이 중요하다(충고)"],["準備運動[じゅんびうんどう]","준비 운동"],["体調[たいちょう]","몸 상태"],["無理[むり]","무리"]],"qs":[{"c":["g:140"],"q":"コーチが いちばん 伝[つた]えたい ことは 何[なん]ですか。","o":["けがを しない ように 準備運動[じゅんびうんどう]を 長[なが]めに する。","寒[さむ]いので 練習[れんしゅう]を 休[やす]む。","試合[しあい]の 日[ひ]を 変[か]える。","体調[たいちょう]が 悪[わる]い 人[ひと]も 練習[れんしゅう]に 来[く]る。"],"ex":"〜ことだ(Day 140)는 충고 \"~하는 게 좋다\". 추우니 준비 운동을 10분 더 길게.","a":0}],"more":[{"k":"中文","title":"聞[き]き上手[じょうず]に なるには","text":"「話[はな]し上手[じょうず]より 聞[き]き上手[じょうず]に なりなさい」と 祖父[そふ]は よく 言[い]って いた。若[わか]い ころの 私[わたし]は、その 意味[いみ]が よく 分[わ]からなかった。人[ひと]に 好[す]かれるには、面白[おもしろ]い 話[はなし]を する ことが 大切[たいせつ]だと 思[おも]って いたからだ。\n社会人[しゃかいじん]に なって、営業[えいぎょう]の 仕事[しごと]を 始[はじ]めた。最初[さいしょ]の 一年[いちねん]は、商品[しょうひん]の 説明[せつめい]を 一生懸命[いっしょうけんめい] 練習[れんしゅう]したが、なかなか 売[う]れなかった。そんな 時[とき]、成績[せいせき]の いい 先輩[せんぱい]の 仕事[しごと]に ついて 行[い]く 機会[きかい]が あった。驚[おどろ]いた ことに、先輩[せんぱい]は 商品[しょうひん]の 話[はなし]を ほとんど しなかった。お客[きゃく]さんの 話[はなし]を うなずきながら 聞[き]き、時々[ときどき]「それで、どう なさったんですか」と 質問[しつもん]するだけだった。\n帰[かえ]りに 理由[りゆう]を 聞[き]くと、先輩[せんぱい]は「お客[きゃく]さんが 本当[ほんとう]に 困[こま]って いる ことは、聞[き]かないと 分[わ]からない。それが 分[わ]かれば、何[なに]を すすめれば いいかは 自然[しぜん]に 分[わ]かる」と 言[い]った。聞[き]き上手[じょうず]に なるには、まず 自分[じぶん]が 話[はな]したい 気持[きも]ちを おさえる ことだ、とも。祖父[そふ]の 言葉[ことば]の 意味[いみ]が、やっと 分[わ]かった 気[き]が した。","ko":"\"말 잘하는 사람보다 잘 들어 주는 사람이 되거라\" 하고 할아버지는 자주 말씀하셨다. 젊었을 때 나는 그 의미를 잘 몰랐다. 사람들에게 호감을 사려면 재미있는 이야기를 하는 것이 중요하다고 생각했기 때문이다.\n사회인이 되어 영업 일을 시작했다. 첫 1년은 상품 설명을 열심히 연습했지만 좀처럼 팔리지 않았다. 그럴 때 성적이 좋은 선배의 일에 따라갈 기회가 있었다. 놀랍게도 선배는 상품 이야기를 거의 하지 않았다. 손님의 이야기를 고개를 끄덕이며 듣고 가끔 \"그래서 어떻게 하셨어요?\"라고 질문할 뿐이었다.\n돌아오는 길에 이유를 묻자 선배는 \"손님이 정말로 곤란해하는 건 들어 보지 않으면 몰라. 그걸 알면 뭘 권하면 되는지는 자연히 알게 돼\"라고 말했다. 잘 들어 주는 사람이 되려면 먼저 자기가 말하고 싶은 마음을 누르는 것이 중요하다고도. 할아버지 말씀의 의미를 겨우 안 것 같은 기분이 들었다.","gloss":[["聞[き]き上手[じょうず]","잘 들어 주는 사람"],["好[す]かれる","호감을 사다"],["営業[えいぎょう]","영업"],["うなずく","고개를 끄덕이다"],["なさる","하시다"],["自然[しぜん]に","자연히"],["おさえる","누르다"]],"qs":[{"c":["g:140"],"q":"先輩[せんぱい]は お客[きゃく]さんと 会[あ]った 時[とき]、どう して いましたか。","o":["商品[しょうひん]の 説明[せつめい]を 詳[くわ]しく した。","話[はなし]を よく 聞[き]いて、時々[ときどき] 質問[しつもん]した。","何[なに]も 話[はな]さずに 帰[かえ]った。","面白[おもしろ]い 話[はなし]を して 笑[わら]わせた。"],"ex":"고개를 끄덕이며 듣고 가끔 질문할 뿐이었어요.","a":1},{"c":["g:140"],"q":"先輩[せんぱい]に よると、聞[き]き上手[じょうず]に なるには まず 何[なに]が 必要[ひつよう]ですか。","o":["お客[きゃく]さんに 好[す]かれる こと","自分[じぶん]が 話[はな]したい 気持[きも]ちを おさえる こと","たくさん 質問[しつもん]を 考[かんが]えて おく こと","商品[しょうひん]に ついて よく 知[し]る こと"],"ex":"「まず自分[じぶん]が話[はな]したい気持[きも]ちをおさえることだ」. 〜ことだ(Day 140).","a":1}]},{"k":"長文","title":"寝[ね]る 前[まえ]の スマホ","text":"寝[ね]る 前[まえ]に スマホを 見[み]ない ほうが いい、と いう 話[はなし]は よく 聞[き]く。画面[がめん]の 光[ひかり]が 脳[のう]を 起[お]こして しまい、眠[ねむ]りが 浅[あさ]く なるからだと いう。分[わ]かっては いても、ついつい 布団[ふとん]の 中[なか]で 動画[どうが]を 見[み]て しまう 人[ひと]は 多[おお]いだろう。私[わたし]も その 一人[ひとり]だった。\nある 時[とき]、睡眠[すいみん]の 専門家[せんもんか]が 書[か]いた 記事[きじ]を 読[よ]んで、考[かんが]え方[ほう]が 変[か]わった。その 専門家[せんもんか]に よると、問題[もんだい]は 光[ひかり]だけでは ない。もっと 大[おお]きな 問題[もんだい]は、スマホの 情報[じょうほう]が「次々[つぎつぎ]に 続[つづ]く」ことだと いう。一[ひと]つ 動画[どうが]を 見終[みお]わると、すぐに 次[つぎ]の おすすめが 出[で]て くる。ニュースも SNSも、終[お]わりが ない。だから、「あと 少[すこ]しだけ」が 一時間[いちじかん]に なって しまうのだ。\n専門家[せんもんか]は、スマホを 完全[かんぜん]に やめる 必要[ひつよう]は ないと 言[い]う。その 代[か]わりに、「終[お]わりの ある もの」を 選[えら]ぶ ことを すすめて いる。たとえば、一本[いっぽん]だけ 決[き]めた 映画[えいが]を 見[み]る、紙[かみ]の 本[ほん]を 一​章[しょう]だけ 読[よ]む、などだ。終[お]わりが はっきり して いれば、そこで 自然[しぜん]に やめられる。\nさっそく 私[わたし]も 試[ため]して みた。寝[ね]る 前[まえ]は スマホを 机[つくえ]の 上[うえ]に 置[お]いて、短[みじか]い 小説[しょうせつ]を 一​話[はなし]だけ 読[よ]む ことに した。最初[さいしょ]の 数日[すうじつ]は 落[お]ち着[つ]かなかったが、一週間[いっしゅうかん] ほど たつと、前[まえ]より 早[はや]く 眠[ねむ]れる ように なった。朝[あさ] 起[お]きた 時[とき]の 体[からだ]の 軽[かる]さも 違[ちが]う。\n大切[たいせつ]なのは、我慢[がまん]する ことでは なく、自分[じぶん]で「ここで 終[お]わり」と 決[き]められる ように する ことなのだろう。スマホが 悪[わる]いのでは なく、使[つか]い方次第[かたしだい]なのだ。","ko":"자기 전에 스마트폰을 보지 않는 편이 좋다는 이야기는 자주 듣는다. 화면의 빛이 뇌를 깨워 버려서 잠이 얕아지기 때문이라고 한다. 알고는 있어도 그만 이불 속에서 동영상을 보고 마는 사람이 많을 것이다. 나도 그중 한 명이었다.\n어느 날 수면 전문가가 쓴 기사를 읽고 생각이 바뀌었다. 그 전문가에 따르면 문제는 빛만이 아니다. 더 큰 문제는 스마트폰의 정보가 \"끊임없이 이어지는\" 것이라고 한다. 동영상 하나를 다 보면 바로 다음 추천이 나온다. 뉴스도 SNS도 끝이 없다. 그래서 \"조금만 더\"가 한 시간이 되어 버리는 것이다.\n전문가는 스마트폰을 완전히 끊을 필요는 없다고 말한다. 그 대신 \"끝이 있는 것\"을 고르라고 권한다. 예를 들어 미리 정한 영화 한 편을 본다, 종이책을 한 장(章)만 읽는다, 같은 것이다. 끝이 분명하면 거기서 자연스럽게 멈출 수 있다.\n나도 바로 시험해 보았다. 자기 전에는 스마트폰을 책상 위에 두고 짧은 소설을 한 편만 읽기로 했다. 처음 며칠은 안절부절못했지만 일주일쯤 지나자 전보다 빨리 잠들 수 있게 되었다. 아침에 일어났을 때 몸이 가벼운 것도 다르다.\n중요한 것은 참는 것이 아니라 스스로 \"여기서 끝\"이라고 정할 수 있게 하는 것이리라. 스마트폰이 나쁜 것이 아니라 쓰기 나름인 것이다.","gloss":[["脳[のう]","뇌"],["眠[ねむ]り","잠"],["浅[あさ]い","얕다"],["ついつい","그만"],["布団[ふとん]","이불"],["動画[どうが]","동영상"],["睡眠[すいみん]","수면"],["専門家[せんもんか]","전문가"],["記事[きじ]","기사"],["次々[つぎつぎ]に","잇달아"],["完全[かんぜん]に","완전히"],["〜章[しょう]","~장(章)"],["さっそく","바로"],["〜話[はなし]","~화, ~편"],["落[お]ち着[つ]かない","안절부절못하다"],["〜次第[しだい]","~하기 나름"]],"qs":[{"c":["g:140"],"q":"専門家[せんもんか]が いちばん 大[おお]きな 問題[もんだい]だと 言[い]って いるのは 何[なん]ですか。","o":["スマホが 重[おも]い こと","画面[がめん]の 光[ひかり]が 強[つよ]い こと","動画[どうが]が 面白[おもしろ]くない こと","スマホの 情報[じょうほう]には 終[お]わりが ない こと"],"ex":"「もっと大[おお]きな問題[もんだい]は、スマホの情報[じょうほう]が『次[つぎ]々​に続[つづ]く』こと」. 빛은 일부 원인일 뿐이에요.","a":3},{"c":["g:140"],"q":"専門家[せんもんか]は 寝[ね]る 前[まえ]に どう する ことを すすめて いますか。","o":["終[お]わりが はっきり して いる ものを 選[えら]ぶ。","スマホを 完全[かんぜん]に やめる。","ニュースを 読[よ]む。","動画[どうが]を 一時間[いちじかん]だけ 見[み]る。"],"ex":"「『終[お]わりのあるもの』を選[えら]ぶことをすすめている」. 완전히 끊을 필요는 없다고 했어요.","a":0},{"c":["g:140"],"q":"筆者[ひっしゃ]が 試[ため]した 結果[けっか]、どう なりましたか。","o":["小説[しょうせつ]を 読[よ]むのが 嫌[いや]に なった。","スマホを 使[つか]わなく なった。","前[まえ]より 早[はや]く 眠[ねむ]れる ように なった。","朝[あさ] 起[お]きるのが つらく なった。"],"ex":"「一週間[いっしゅうかん]ほどたつと、前[まえ]より早[はや]く眠[ねむ]れるようになった」.","a":2},{"c":["g:140"],"q":"「スマホが 悪[わる]いのでは なく、使[つか]い方次第[かたしだい]なのだ」とは どういう 意味[いみ]ですか。","o":["スマホを 使[つか]わない ほうが いい。","スマホの 使[つか]い方[ほう]は 難[むずか]しい。","スマホは 体[からだ]に いい。","どう 使[つか]うかに よって、いいか 悪[わる]いかが 決[き]まる。"],"ex":"〜次第(Day 116)는 \"~에 따라 결정된다\".", {"id":"b143","after":143,"lv":"N3","k":"短文","title":"店[みせ]の お知[し]らせ","text":"いつも ご来店[らいてん] ありがとうございます。\n当店[とうてん]は、建物[たてもの]の 工事[こうじ]の ため、三月[さんがつ] 一日[ついたち]から 三十一日[さんじゅういちにち]まで 休業[きゅうぎょう]いたします。\n休業中[きゅうぎょうちゅう]は、ホームページからの 注文[ちゅうもん]だけ 受[う]け付[つ]けます。商品[しょうひん]は 通常[つうじょう]どおり お届[とど]けしますが、届[とど]くまでに 一週間[いっしゅうかん]ほど かかる 場合[ばあい]が あります。\n四月[しがつ] 一日[ついたち]から 通常[つうじょう]の 営業[えいぎょう]に 戻[もど]ります。","ko":"항상 내점해 주셔서 감사합니다.\n저희 가게는 건물 공사로 인해 3월 1일부터 31일까지 휴업합니다.\n휴업 중에는 홈페이지 주문만 받습니다. 상품은 평소대로 배송하지만 도착까지 일주일 정도 걸리는 경우가 있습니다.\n4월 1일부터 정상 영업으로 돌아갑니다.","gloss":[["来店[らいてん]","내점"],["休業[きゅうぎょう]","휴업"],["通常[つうじょう]","통상, 평소"]],"qs":[{"c":["g:143"],"q":"三月[さんがつ]に この 店[みせ]の 商品[しょうひん]を 買[か]いたい 人[ひと]は どう しますか。","o":["四月[しがつ]まで 待[ま]たなければ ならない。","ホームページで 注文[ちゅうもん]する。","店[みせ]に 行[い]って 買[か]う。","電話[でんわ]で 注文[ちゅうもん]する。"],"ex":"휴업 중에는 「ホームページからの注[つ]文​だけ受[う]け付[つ]けます」.","a":1}],"more":[{"k":"中文","title":"雨[あめ]ばかりで","text":"今年[ことし]の 梅雨[つゆ]は、毎日[まいにち] 雨[あめ]ばかりで 本当[ほんとう]に 気分[きぶん]が 重[おも]い。洗濯物[せんたくもの]は 乾[かわ]かないし、自転車[じてんしゃ]にも 乗[の]れない。部屋[へや]の 中[なか]は 湿気[しっけ]で べたべたする。\nそんな 中[なか]、小学生[しょうがくせい]の 娘[むすめ]が「雨[あめ]の 日[ひ]の いい ところ探[さが]し」を 始[はじ]めた。毎晩[まいばん]、その 日[ひ]に 見[み]つけた いい ことを ノートに 一[ひと]つ 書[か]くのだ。「かたつむりを 三匹[さんびき] 見[み]た」「傘[かさ]に 当[あ]たる 雨[あめ]の 音[おと]が 音楽[おんがく]みたいだった」「いつもより 図書館[としょかん]が 空[あ]いて いた」。\n最初[さいしょ]は 子[こ]どもの 遊[あそ]びだと 思[おも]って いた。しかし、一緒[いっしょ]に ノートを 見[み]て いるうちに、私[わたし]も 雨[あめ]の 日[ひ]を 少[すこ]し 違[ちが]う 目[め]で 見[み]る ように なった。駅[えき]までの 道[みち]の あじさいが こんなに きれいだったとは、今[いま]まで 気[き]が つかなかった。\n雨[あめ]の 量[りょう]は 変[か]わらない。変[か]わったのは、私[わたし]たちの 見方[みかた]だけだ。娘[むすめ]の ノートは、もう 半分[はんぶん]以上[いじょう] うまって いる。","ko":"올해 장마는 매일 비만 와서 정말 기분이 무겁다. 빨래는 마르지 않고 자전거도 탈 수 없다. 방 안은 습기로 끈적끈적하다.\n그런 가운데 초등학생 딸이 \"비 오는 날의 좋은 점 찾기\"를 시작했다. 매일 밤 그날 발견한 좋은 일을 노트에 하나 쓰는 것이다. \"달팽이를 세 마리 봤다\" \"우산에 부딪히는 빗소리가 음악 같았다\" \"평소보다 도서관이 한산했다\".\n처음에는 아이의 놀이라고 생각했다. 하지만 함께 노트를 보는 사이에 나도 비 오는 날을 조금 다른 눈으로 보게 되었다. 역까지 가는 길의 수국이 이렇게 예뻤다는 것을 지금까지 몰랐다.\n비의 양은 변하지 않았다. 변한 것은 우리가 보는 방식뿐이다. 딸의 노트는 벌써 절반 이상 채워져 있다.","gloss":[["〜ばかり","~만"],["梅雨[つゆ]","장마"],["湿気[しっけ]","습기"],["べたべた","끈적끈적"],["かたつむり","달팽이"],["〜匹[ひき] {"id":"b147","after":147,"lv":"N3","k":"短文","title":"先生[せんせい]への 連絡[れんらく]","text":"中村先生[なかむらせんせい]\n明日[あした]の 授業[じゅぎょう]ですが、朝[あさ]から 熱[ねつ]が あり、病院[びょういん]に 行[い]く ため、欠席[けっせき]させて いただきます。\n来週[らいしゅう]の 小[しょう]テストの 範囲[はんい]を 教[おし]えて いただけないでしょうか。もし 配[くば]られる プリントが あれば、同[おな]じ クラスの 山田[やまだ]さんに 預[あず]けて いただけると 助[たす]かります。\nよろしく お願[ねが]いいたします。\nキム・ミンジュン","ko":"나카무라 선생님\n내일 수업 말씀인데요, 아침부터 열이 있어 병원에 가야 해서 결석하겠습니다.\n다음 주 쪽지 시험 범위를 알려 주실 수 있을까요? 혹시 나눠 주실 프린트가 있다면 같은 반 야마다 씨에게 맡겨 주시면 감사하겠습니다.\n잘 부탁드립니다.\n김민준","gloss":[["欠席[けっせき]","결석"],["小[しょう]テスト","쪽지 시험"],["範囲[はんい]","범위"],["プリント","프린트"],["預[あず]ける","맡기다"],["助[たす]かる","도움이 되다"]],"qs":[{"c":["g:147"],"q":"キムさんが 先生[せんせい]に 頼[たの]んで いない ことは 何[なん]ですか。","o":["欠席[けっせき]を 認[みと]める こと","テストの 範囲[はんい]を 教[おし]える こと","プリントを 山田[やまだ]さんに 渡[わた]す こと","授業[じゅぎょう]の 時間[じかん]を 変[か]える こと"],"ex":"부탁한 건 결석·시험 범위·프린트 맡기기. 수업 시간 변경은 언급하지 않았어요. 〜させていただく(Day 152 미리보기).","a":3}],"more":[{"k":"中文","title":"もし 宝[たから]くじが 当[あ]たったと したら","text":"「もし 宝[たから]くじで 一億[いちおく]円[えん] 当[あ]たったと したら、何[なに]を する？」。先日[せんじつ]、会社[かいしゃ]の 昼休[ひるやす]みに こんな 話[はなし]に なった。家[いえ]を 買[か]う、世界一周[せかいいっしゅう]の 旅行[りょこう]に 行[い]く、会社[かいしゃ]を 辞[や]める。みんな 楽[たの]しそうに 答[こた]えて いた。\nところが、ある 調査[ちょうさ]に よると、高額[こうがく]の 宝[たから]くじに 当[あ]たった 人[ひと]の 多[おお]くが、数年後[すうねんご]には「当[あ]たる 前[まえ]の ほうが 幸[しあわ]せだった」と 感[かん]じて いる そうだ。急[きゅう]に お金[かね]が 入[はい]って、生活[せいかつ]が 大[おお]きく 変[か]わると、友人[ゆうじん]や 家族[かぞく]との 関係[かんけい]が うまく いかなく なったり、お金[かね]の 使[つか]い方[ほう]が 分[わ]からなく なったり する ことが あると いう。\nそう 考[かんが]えると、幸[しあわ]せは お金[かね]の 量[りょう]だけでは 決[き]まらないのだろう。昼休[ひるやす]みの 話[はなし]の 最後[さいご]に、ある 先輩[せんぱい]が「一億[いちおく]円[えん] あったら？ 今[いま]と 同[おな]じ 生活[せいかつ]を して、少[すこ]しだけ いい 肉[にく]を 食[た]べるよ」と 言[い]った。みんな 笑[わら]ったが、私[わたし]には それが いちばん 賢[かしこ]い 答[こた]えに 思[おも]えた。","ko":"\"만약 복권으로 1억 엔에 당첨된다면 뭘 할래?\" 지난번 회사 점심시간에 이런 이야기가 나왔다. 집을 산다, 세계 일주 여행을 간다, 회사를 그만둔다. 모두 즐겁게 대답했다.\n그런데 어느 조사에 따르면 고액 복권에 당첨된 사람의 상당수가 몇 년 후에는 \"당첨되기 전이 더 행복했다\"고 느낀다고 한다. 갑자기 돈이 들어와 생활이 크게 바뀌면 친구나 가족과의 관계가 잘 안 되거나 돈 쓰는 법을 모르게 되거나 하는 일이 있다고 한다.\n그렇게 생각하면 행복은 돈의 양만으로는 정해지지 않는 것이리라. 점심시간 이야기 마지막에 한 선배가 \"1억 엔이 있다면? 지금과 같은 생활을 하고 조금 좋은 고기를 먹을래\"라고 말했다. 모두 웃었지만 나에게는 그것이 가장 현명한 대답으로 여겨졌다.","gloss":[["宝[たから]くじ","복권"],["当[あ]たる","당첨되다"],["〜と したら","~라고 한다면"],["一億[いちおく]","1억"],["世界一周[せかいいっしゅう]","세계 일주"],["高額[こうがく]","고액"],["関係[かんけい]","관계"],["賢[かしこ]い","현명하다"]],"qs":[{"c":["g:147"],"q":"調査[ちょうさ]に よると、宝[たから]くじに 当[あ]たった 人[ひと]は どう 感[かん]じる ことが 多[おお]いですか。","o":["当[あ]たる 前[まえ]の 生活[せいかつ]の ほうが よかった。","もっと お金[かね]が ほしい。","家族[かぞく]と 仲[なか]が よく なった。","会社[かいしゃ]を 辞[や]めて よかった。"],"ex":"「当[あ]たる前[まえ]のほうが幸[しあわ]せだった」. 〜としたら(Day 147)는 가정.","a":0},{"c":["g:147"],"q":"筆者[ひっしゃ]が 先輩[せんぱい]の 答[こた]えを「賢[かしこ]い」と 思[おも]ったのは なぜですか。","o":["みんなを 笑[わら]わせたから","お金[かね]が 増[ふ]えても 生活[せいかつ]を 大[おお]きく 変[か]えないから","一億[いちおく]円[えん]を 全部[ぜんぶ] 使[つか]うから","いい 肉[にく]は 健康[けんこう]に いいから"],"ex":"돈이 생겨 생활이 크게 바뀌면 불행해질 수 있다는 조사 결과와 이어져요.","a":1}]},{"k":"長文","title":"もし 言葉[ことば]が 通[つう]じなかったら","text":"初[はじ]めて 一人[ひとり]で 海外旅行[かいがいりょこう]に 行[い]った 時[とき]、私[わたし]は 小[ちい]さな ミスを した。空港[くうこう]から ホテルまでの バスを 降[お]りる 場所[ばしょ]を 間違[まちが]えたのだ。周[まわ]りは 知[し]らない 町[まち]で、スマホの 電池[でんち]も 切[き]れかけて いた。その 国[くに]の 言葉[ことば]は、あいさつ くらいしか 分[わ]からない。\n困[こま]って 立[た]って いると、果物屋[くだものや]の おじさんが 声[こえ]を かけて くれた。何[なに]を 言[い]って いるのかは 分[わ]からなかったが、私[わたし]が ホテルの 予約[よやく]の 紙[かみ]を 見[み]せると、おじさんは 大[おお]きく うなずいて、店[みせ]を 奥[おく]さんに 任[まか]せ、私[わたし]の スーツケースを 持[も]って 歩[ある]き出[だ]した。十五分[じゅうごふん]ほど 歩[ある]いて、ホテルの 前[まえ]に 着[つ]くと、おじさんは 笑[わら]って 手[て]を 振[ふ]り、走[はし]って 店[みせ]に 戻[もど]って 行[い]った。お礼[れい]の お金[かね]を 渡[わた]そうと したが、受[う]け取[と]って くれなかった。\nもし あの 時[とき]、言葉[ことば]が 通[つう]じて いたと したら、私[わたし]は 地図[ちず]アプリで 道[みち]を 調[しら]べて、一人[ひとり]で ホテルに 行[い]って いただろう。おじさんと 出会[であ]う ことも なかったはずだ。言葉[ことば]が 通[つう]じなかったからこそ、人[ひと]の 親切[しんせつ]に 助[たす]けられる 経験[けいけん]が できたのだ。\nもちろん、言葉[ことば]を 学[まな]ぶ ことは 大切[たいせつ]だ。私[わたし]も 帰国[きこく]してから、その 国[くに]の 言葉[ことば]を 少[すこ]しずつ 勉強[べんきょう]して いる。いつか もう 一度[いちど] あの 町[まち]に 行[い]って、おじさんに きちんと お礼[れい]を 言[い]いたいからだ。\n旅行[りょこう]の 思[おも]い出[で]と して 一番[いちばん] 心[こころ]に 残[のこ]って いるのは、有名[ゆうめい]な 観光地[かんこうち]では なく、あの 十五分[じゅうごふん]の 道[みち]のりだ。言葉[ことば]が 通[つう]じない 不便[ふべん]さは、時[とき]に、思[おも]いがけない 出会[であ]いを 運[はこ]んで くれる。","ko":"처음 혼자 해외여행을 갔을 때 나는 작은 실수를 했다. 공항에서 호텔까지 가는 버스에서 내릴 곳을 잘못 내린 것이다. 주변은 모르는 동네였고 스마트폰 배터리도 거의 다 되어 가고 있었다. 그 나라 말은 인사 정도밖에 모른다.\n곤란해서 서 있는데 과일 가게 아저씨가 말을 걸어 주었다. 무슨 말을 하는지는 몰랐지만 내가 호텔 예약 종이를 보여 주자 아저씨는 크게 고개를 끄덕이고 가게를 부인에게 맡긴 뒤 내 여행 가방을 들고 걷기 시작했다. 15분 정도 걸어 호텔 앞에 도착하자 아저씨는 웃으며 손을 흔들고 뛰어서 가게로 돌아갔다. 사례금을 건네려 했지만 받아 주지 않았다.\n만약 그때 말이 통했다면 나는 지도 앱으로 길을 찾아 혼자 호텔에 갔을 것이다. 아저씨를 만나는 일도 없었을 것이다. 말이 통하지 않았기 때문에야말로 사람의 친절에 도움을 받는 경험을 할 수 있었던 것이다.\n물론 언어를 배우는 것은 중요하다. 나도 귀국한 뒤로 그 나라 말을 조금씩 공부하고 있다. 언젠가 다시 그 동네에 가서 아저씨에게 제대로 감사 인사를 하고 싶기 때문이다.\n여행의 추억으로 가장 마음에 남아 있는 것은 유명한 관광지가 아니라 그 15분의 길이다. 말이 통하지 않는 불편함은 때로 뜻밖의 만남을 데려다준다.","gloss":[["電池[でんち]","배터리"],["切[き]れかける","거의 다 되어 가다"],["果物屋[くだものや]","과일 가게"],["奥[おく]さん","부인"],["任[まか]せる","맡기다"],["手[て]を 振[ふ]る","손을 흔들다"],["通[つう]じる","통하다"],["〜からこそ","~이기 때문에야말로"],["きちんと","제대로"],["観光地[かんこうち]","관광지"],["道[みち]のり","길, 거리"],["思[おも]いがけない","뜻밖의"]],"qs":[{"c":["g:147"],"q":"筆者[ひっしゃ]が 困[こま]って いたのは なぜですか。","o":["スーツケースを なくしたから","ホテルの 予約[よやく]が なかったから","果物屋[くだものや]の おじさんに 怒[おこ]られたから","知[し]らない 場所[ばしょ]で バスを 降[お]りて しまったから"],"ex":"「降[お]りる場所[ばしょ]を間違[まちが]えた」 + 배터리·언어 문제.","a":3},{"c":["g:147"],"q":"おじさんは 筆者[ひっしゃ]に 何[なに]を して くれましたか。","o":["地図[ちず]を 書[か]いて くれた。","ホテルに 電話[でんわ]を かけた。","ホテルまで 一緒[いっしょ]に 歩[ある]いて 案内[あんない]した。","バス停[てい]まで 連[つ]れて 行[い]った。"],"ex":"가방을 들고 15분 걸어 호텔 앞까지 데려다줬어요.","a":2},{"c":["g:147"],"q":"「言葉[ことば]が 通[つう]じて いたと したら」、どう なって いたと 筆者[ひっしゃ]は 考[かんが]えて いますか。","o":["一人[ひとり]で ホテルへ 行[い]き、おじさんとは 会[あ]わなかった。","その 国[くに]の 言葉[ことば]を 勉強[べんきょう]しなかった。","おじさんと もっと 話[はなし]が できた。","もっと 早[はや]く ホテルに 着[つ]いて いた。"],"ex":"「地図[ちず]アプリで…一人[ひとり]でホテルに行[い]っていただろう。おじさんと出会[であ]うこともなかったはずだ」. 〜としたら(Day 147).","a":0},{"c":["g:147"],"q":"筆者[ひっしゃ]が いちばん 言[い]いたい ことは 何[なん]ですか。","o":["海外旅行[かいがいりょこう]では 言葉[ことば]を 勉強[べんきょう]して おくべきだ。","言葉[ことば]が 通[つう]じない 不便[ふべん]さが、すてきな 出会[であ]いに つながる ことも ある。","スマホの 電池[でんち]に 気[き]を つけるべきだ。","有名[ゆうめい]な 観光地[かんこうち]は つまらない。"],"ex":"마지막 문장 「言葉[ことば]が通[つう]じない不便[ふべん]さは、時[とき]に、思[おも]いがけない出会[であ]いを運[はこ]んでくれる」.","a":1}]}]},
{"id":"b150","after":150,"lv":"N3","k":"短文","title":"会議[かいぎ]の 前[まえ]に","text":"チームの みなさん\n来週[らいしゅう]の 企画[きかく]会議[かいぎ]の 資料[しりょう]を 共有[きょうゆう]フォルダに 入[い]れました。会議[かいぎ]の 前[まえ]に 一度[いちど] 目[め]を 通[とお]して おいて ください。\n特[とく]に 三[さん]ページ目[め]の 予算[よさん]の 部分[ぶぶん]は、まだ 決[き]まって いない ところが あります。意見[いけん]が ある 方[ほう]は、会議[かいぎ]の 前日[ぜんじつ]までに メールで 送[おく]って いただけないでしょうか。\n吉田[よしだ]","ko":"팀 여러분\n다음 주 기획 회의 자료를 공유 폴더에 넣었습니다. 회의 전에 한 번 훑어봐 두세요.\n특히 3페이지의 예산 부분은 아직 정해지지 않은 곳이 있습니다. 의견이 있는 분은 회의 전날까지 메일로 보내 주실 수 없을까요?\n요시다","gloss":[["企画[きかく]","기획"],["共有[きょうゆう]フォルダ","공유 폴더"],["目[め]を 通[とお]す","훑어보다"],["予算[よさん]","예산"],["部分[ぶぶん]","부분"]],"qs":[{"c":["g:150"],"q":"吉田[よしだ]さんが みんなに してほしい ことは 何[なん]ですか。","o":["資料[しりょう]を 読[よ]んで、予算[よさん]に ついての 意見[いけん]が あれば 前日[ぜんじつ]までに 送[おく]る。","会議[かいぎ]の 日[ひ]に 意見[いけん]を 言[い]う。","資料[しりょう]を 印刷[いんさつ]して 持[も]って 来[く]る。","三[さん]ページ目[め]の 予算[よさん]を 決[き]める。"],"ex":"자료를 훑어보고, 예산 의견은 회의 전날까지 메일로.","a":0}],"more":[{"k":"中文","title":"それって おかしくないか","text":"私[わたし]の 職場[しょくば]では、毎朝[まいあさ] 九時[くじ]から 全員[ぜんいん]が 立[た]ったまま 十五分[じゅうごふん]の 朝礼[ちょうれい]を する。課長[かちょう]が その 日[ひ]の 予定[よてい]を 読[よ]み上[あ]げ、最後[さいご]に みんなで 会社[かいしゃ]の 目標[もくひょう]を 声[こえ]に 出[だ]して 言[い]う。十年[じゅうねん] 以上[いじょう] 続[つづ]いて いる 習慣[しゅうかん]だ。\n先月[せんげつ]、新[あたら]しく 入[はい]った 二[に]十代[だい]の 社員[しゃいん]が、会議[かいぎ]で こう 言[い]った。「予定[よてい]は メールで 送[おく]れば 一​分[ふん]で 読[よ]めます。毎朝[まいあさ] 十五分[じゅうごふん] ということは、一年[いちねん]で 六[ろく]十[じゅう]時間[じかん] 以上[いじょう]です。それって、もったいなくないでしょうか」。\n会議室[かいぎしつ]が 静[しず]かに なった。だれも 反対[はんたい]できなかったのだ。結局[けっきょく]、朝礼[ちょうれい]は 週[しゅう]に 一回[いっかい]、月曜日[げつようび]だけに なった。\n古[ふる]い 習慣[しゅうかん]を 変[か]えるのは 難[むずか]しい。「前[まえ]から そう して いるから」と いう 理由[りゆう]だけで 続[つづ]けて いる ことは、案外[あんがい] 多[おお]いのでは ないだろうか。新[あたら]しい 人[ひと]の「なぜ」は、組織[そしき]に とって 大切[たいせつ]な 意味[いみ]を 持[も]って いるのだと 思[おも]う。","ko":"우리 직장에서는 매일 아침 9시부터 전원이 선 채로 15분 동안 조회를 한다. 과장이 그날 예정을 읽어 주고 마지막에 다 같이 회사 목표를 소리 내어 말한다. 10년 넘게 계속되고 있는 습관이다.\n지난달 새로 들어온 20대 사원이 회의에서 이렇게 말했다. \"예정은 메일로 보내면 1분이면 읽을 수 있어요. 매일 아침 15분이라는 건 1년에 60시간 이상이에요. 그거 아깝지 않을까요?\"\n회의실이 조용해졌다. 아무도 반대하지 못했던 것이다. 결국 조회는 일주일에 한 번, 월요일만 하게 되었다.\n오래된 습관을 바꾸는 것은 어렵다. \"예전부터 그렇게 하고 있으니까\"라는 이유만으로 계속하고 있는 일은 의외로 많지 않을까. 새로운 사람의 \"왜?\"는 조직에게 중요한 의미를 갖고 있다고 생각한다.","gloss":[["朝礼[ちょうれい]","조회"],["課長[かちょう]","과장"],["読[よ]み上[あ]げる","소리 내어 읽다"],["目標[もくひょう]","목표"],["〜ないでしょうか","~하지 않을까요"],["反対[はんたい]","반대"],["案外[あんがい]","의외로"],["組織[そしき]","조직"]],"qs":[{"c":["g:150"],"q":"新[あたら]しい 社員[しゃいん]は 朝礼[ちょうれい]に ついて 何[なに]と 言[い]いましたか。","o":["座[すわ]って した ほうが いい。","目標[もくひょう]を もっと 大[おお]きい 声[こえ]で 言[い]うべきだ。","朝礼[ちょうれい]は 楽[たの]しい。","時間[じかん]が もったいない。"],"ex":"「一年[いちねん]で六[ろく]十[じゅう]時間[じかん]以上[いじょう]です。それって、もったいなくないでしょうか」. 〜ではないだろうか(Day 150)는 완곡한 주장.","a":3},{"c":["g:150"],"q":"筆者[ひっしゃ]は この 出来事[できごと]から どう 考[かんが]えましたか。","o":["朝礼[ちょうれい]は 毎日[まいにち] した ほうが いい。","古[ふる]い 習慣[しゅうかん]は すべて やめるべきだ。","新[あたら]しい 人[ひと]の 疑問[ぎもん]は、組織[そしき]に とって 大切[たいせつ]だ。","若[わか]い 社員[しゃいん]は 会議[かいぎ]で 意見[いけん]を 言[い]うべきでは ない。"],"ex":"마지막 문장 「新[あたら]しい人[ひと]の『なぜ』は、組[く]織​にとって大切[たいせつ]な意味[いみ]を持[も]っている」.","a":2}]},{"k":"情報検索","title":"市民農園[しみんのうえん]の 募集[ぼしゅう]","text":"【みどり市[し] 市民農園[しみんのうえん]　利用者[りようしゃ] 募集[ぼしゅう]】\n場所[ばしょ]　　　　　　　　区画[くかく]の 広[ひろ]さ　　区画数[くかくすう]　　年間[ねんかん] 利用料[りようりょう]　　その他[ほか]\nＡ 北公園[きたこうえん] 農園[のうえん]　　　十[じゅう]五[ご]平方[へいほう]メートル　三[さん]十[じゅう]　　　六[ろく]千[せん]円[えん]　　　　水道[すいどう]・物置[ものおき] あり\nＢ 川沿[かわそ]い 農園[のうえん]　　　三[さん]十[じゅう]平方[へいほう]メートル　二[に]十[じゅう]　　　一[いち]万[まん]円[えん]　　　　水道[すいどう] あり・駐車場[ちゅうしゃじょう] なし\nＣ 駅前[えきまえ] 農園[のうえん]　　　　十[じゅう]平方[へいほう]メートル　　十[じゅう]五[ご]　　　八[はっ]千[せん]円[えん]　　　　水道[すいどう]・物置[ものおき]・休憩所[きゅうけいじょ] あり\n◆ 利用[りよう]期間[きかん]：四月[しがつ] 一日[ついたち]〜翌年[よくねん] 三月[さんがつ] 三十一日[さんじゅういちにち]\n◆ 応募[おうぼ]できる 方[ほう]：市内[しない]に 住[す]んで いる 方[かた]（一​家族[かぞく] 一​区画[くかく]まで）\n◆ 応募[おうぼ]方法[ほうほう]：二[に]月[がつ] 二十八日[にじゅうはちにち]までに、往復[おうふく]はがきか 市[し]の ホームページから。区画数[くかくすう]より 多[おお]い 場合[ばあい]は 抽選[ちゅうせん]。\n◆ 初[はじ]めて 利用[りよう]する 方[ほう]は、三月[さんがつ]の 説明会[せつめいかい]（土曜日[どようび] 午前[ごぜん]）に 必[かなら]ず 参加[さんか]して ください。\n◆ 農薬[のうやく]は 使[つか]えません。また、木[き]を 植[う]える ことは できません。","ko":"[미도리시 시민 농원 이용자 모집]\nA 북공원 농원 15㎡, 30구획, 연 6000엔, 수도·창고 있음 / B 강변 농원 30㎡, 20구획, 연 10000엔, 수도 있음·주차장 없음 / C 역 앞 농원 10㎡, 15구획, 연 8000엔, 수도·창고·휴게소 있음\n◆ 이용 기간: 4월 1일~다음 해 3월 31일\n◆ 응모 자격: 시내 거주자(한 가족 한 구획까지)\n◆ 응모 방법: 2월 28일까지 왕복 엽서나 시 홈페이지로. 구획 수보다 많으면 추첨.\n◆ 처음 이용하는 분은 3월 설명회(토요일 오전)에 꼭 참가하세요.\n◆ 농약은 쓸 수 없습니다. 또 나무를 심을 수 없습니다.","gloss":[["農園[のうえん]","농원"],["利用者[りようしゃ]","이용자"],["区画[くかく]","구획"],["平方[へいほう]メートル","제곱미터"],["年間[ねんかん]","연간"],["物置[ものおき]","창고"],["〜沿[そ]い","~변"],["休憩所[きゅうけいじょ]","휴게소"],["翌年[よくねん]","다음 해"],["応募[おうぼ]","응모"],["抽選[ちゅうせん]","추첨"],["説明会[せつめいかい]","설명회"],["農薬[のうやく]","농약"],["植[う]える","심다"]],"qs":[{"c":["g:150"],"q":"車[くるま]で 通[かよ]いたい 森[もり]さんは、できるだけ 広[ひろ]い 区画[くかく]を 使[つか]いたいです。道具[どうぐ]を 置[お]く 場所[ばしょ]も 必要[ひつよう]です。どれに 応募[おうぼ]しますか。","o":["Ｃ","Ａ と Ｃ","Ｂ","Ａ"],"ex":"창고(物置[ものおき]) 있음: A·C. 둘 중 넓은 건 A(15㎡). B는 넓지만 창고 정보가 없고 주차장도 없어요. 한 가족 한 구획.","a":3},{"c":["g:150"],"q":"初[はじ]めて 利用[りよう]する 人[ひと]が しなければ ならない ことは 何[なん]ですか。","o":["木[き]を 植[う]える。","三月[さんがつ]の 説明会[せつめいかい]に 出[で]る。","市役所[しやくしょ]で 抽選[ちゅうせん]を 受[う]ける。","四月[しがつ]に はがきを 出[だ]す。"],"ex":"「初[はじ]めて利用[りよう]する方[ほう]は、三月[さんがつ]の説明会[せつめいかい]…に必[かなら]ず参加[さんか]してください」.","a":1}]}]},
{"id":"b154","after":154,"lv":"N3","k":"短文","title":"子[こ]どもの ころの 思[おも]い出[で]","text":"子[こ]どもの ころ、私[わたし]は 毎週[まいしゅう] ピアノ教室[きょうしつ]に 通[かよ]わされて いた。練習[れんしゅう]は 嫌[きら]いで、先生[せんせい]が 来[く]る 日[ひ]は 雨[あめ]が 降[ふ]れば いいと 思[おも]って いた。\nところが、大人[おとな]に なった 今[いま]、一番[いちばん] 感謝[かんしゃ]して いるのが あの ピアノだ。仕事[しごと]で 疲[つか]れた 夜[よる]、好[す]きな 曲[きょく]を ひくと、気持[きも]ちが 落[お]ち着[つ]く。やらされて いた ことが、今[いま]では 自分[じぶん]の 楽[たの]しみに なって いる。","ko":"어릴 때 나는 매주 피아노 교실에 억지로 다녀야 했다. 연습은 싫었고 선생님이 오는 날은 비가 오면 좋겠다고 생각했다.\n그런데 어른이 된 지금 가장 감사하고 있는 것이 그 피아노다. 일로 지친 밤에 좋아하는 곡을 치면 마음이 차분해진다. 억지로 하던 일이 지금은 나의 즐거움이 되어 있다.","gloss":[["〜させられる","억지로 ~하게 되다(사역수동)"],["感謝[かんしゃ]","감사"],["落[お]ち着[つ]く","차분해지다"]],"qs":[{"c":["g:154"],"q":"筆者[ひっしゃ]の 気持[きも]ちに 合[あ]う ものは どれですか。","o":["ピアノの 先生[せんせい]に 会[あ]いたい。","今[いま]も ピアノの 練習[れんしゅう]は 嫌[きら]いだ。","昔[むかし]は 嫌[いや]だった ピアノが、今[いま]は 役[やく]に 立[た]って いる。","子[こ]どもの ころから ピアノが 大好[だいす]きだった。"],"ex":"通​わされていた·やらされていた는 사역수동(Day 154) \"억지로 ~하게 되다\". 지금은 즐거움이 되었어요.","a":2}],"more":[{"k":"中文","title":"待[ま]たされる 時間[じかん]","text":"病院[びょういん]や 役所[やくしょ]で 待[ま]たされると、つい いらいら して しまう。予約[よやく]の 時間[じかん]に 行[い]ったのに 三十分[さんじゅっぷん] 待[ま]たされた 時[とき]など、文句[もんく]を 言[い]いたく なる。\nところが、ある 研究[けんきゅう]に よると、人[ひと]が 待[ま]ち時間[じかん]を どう 感[かん]じるかは、実際[じっさい]の 長[なが]さより「何[なに]も 分[わ]からない こと」に 大[おお]きく 影響[えいきょう]されるそうだ。「あと 何分[なんぷん] 待[ま]つのか」「なぜ 遅[おく]れて いるのか」が 分[わ]からないと、同[おな]じ 十分[じゅっぷん]でも 長[なが]く 感[かん]じる。反対[はんたい]に、「あと 十分[じゅっぷん]ほどです」と 一言[ひとこと] 説明[せつめい]されるだけで、ずっと 楽[らく]に 待[ま]てる という。\n実際[じっさい]、私[わたし]の 通[かよ]う 歯医者[はいしゃ]では、受付[うけつけ]の 画面[がめん]に「現在[げんざい] 待[ま]ち時間[じかん] 約[やく] 二十分[にじゅっぷん]」と 表示[ひょうじ]されて いる。それを 見[み]ると、近[ちか]くの コンビニに 行[い]ったり、本[ほん]を 読[よ]んだり して、時間[じかん]を 上手[じょうず]に 使[つか]う ことが できる。待[ま]つ 時間[じかん]を なくすのは 難[むずか]しくても、待[ま]つ 人[ひと]の 気持[きも]ちを 楽[らく]に する 工夫[くふう]は できるのだ。","ko":"병원이나 관공서에서 기다리게 되면 그만 짜증이 나 버린다. 예약 시간에 갔는데 30분이나 기다려야 했을 때 등은 불평을 하고 싶어진다.\n그런데 어느 연구에 따르면 사람이 대기 시간을 어떻게 느끼는가는 실제 길이보다 \"아무것도 모른다는 것\"에 크게 영향을 받는다고 한다. \"앞으로 몇 분 기다리는지\" \"왜 늦어지는지\"를 모르면 같은 10분이라도 길게 느낀다. 반대로 \"앞으로 10분 정도입니다\"라고 한마디 설명을 듣기만 해도 훨씬 편하게 기다릴 수 있다고 한다.\n실제로 내가 다니는 치과에서는 접수처 화면에 \"현재 대기 시간 약 20분\"이라고 표시되어 있다. 그걸 보면 근처 편의점에 가거나 책을 읽거나 해서 시간을 잘 쓸 수 있다. 기다리는 시간을 없애는 것은 어려워도 기다리는 사람의 마음을 편하게 하는 궁리는 할 수 있는 것이다.","gloss":[["役所[やくしょ]","관공서"],["いらいら","짜증"],["文句[もんく]","불평"],["影響[えいきょう]","영향"],["一言[ひとこと]","한마디"],["歯医者[はいしゃ]","치과"],["表示[ひょうじ]","표시"]],"qs":[{"c":["g:154"],"q":"研究[けんきゅう]に よると、待[ま]ち時間[じかん]が 長[なが]く 感[かん]じられるのは どんな 時[とき]ですか。","o":["あと どのくらい 待[ま]つのか 分[わ]からない 時[とき]","実際[じっさい]に 長[なが]く 待[ま]った 時[とき]","予約[よやく]を して いない 時[とき]","病院[びょういん]で 待[ま]つ 時[とき]"],"ex":"「『あと何分[なんぷん]待[ま]つのか』『なぜ遅[おく]れているのか』が分[わ]からないと、同[おな]じ十分[じゅっぷん]でも長[なが]く感[かん]じる」.","a":0},{"c":["g:154"],"q":"筆者[ひっしゃ]は 歯医者[はいしゃ]の 例[れい]で 何[なに]を 言[い]いたいのですか。","o":["待[ま]つ 時[とき]は コンビニに 行[い]くと いい。","情報[じょうほう]を 伝[つた]えれば、待[ま]つ 人[ひと]の 気持[きも]ちが 楽[らく]に なる。","待[ま]ち時間[じかん]を なくすのは 簡単[かんたん]だ。","歯医者[はいしゃ]の 待[ま]ち時間[じかん]は 短[みじか]い ほうが いい。"],"ex":"대기 시간을 표시해 주니 시간을 잘 쓸 수 있다 → 마음을 편하게 하는 궁리.","a":1}]},{"k":"長文","title":"「させられる」から「する」へ","text":"中学生[ちゅうがくせい]の 時[とき]、私[わたし]の 学校[がっこう]では 毎朝[まいあさ] 十分[じゅっぷん]間[かん]、読書[どくしょ]の 時間[じかん]が あった。好[す]きな 本[ほん]を 読[よ]めば いいのだが、当時[とうじ]の 私[わたし]は、それが 嫌[いや]で 仕方[しかた]が なかった。読[よ]まされて いる、と 感[かん]じて いたからだ。本[ほん]を 開[あ]いても 文字[もじ]を 目[め]で 追[お]うだけで、内容[ないよう]は 頭[あたま]に 入[はい]って こなかった。\n変[か]わったのは 二[に]年[ねん]生[せい]の 秋[あき]だ。図書委員[としょいいん]の 友達[ともだち]に すすめられて、ある 冒険[ぼうけん]小説[しょうせつ]を 手[て]に 取[と]った。主人公[しゅじんこう]が 島[しま]に 残[のこ]されて、一人[ひとり]で 生[い]き延[の]びる 話[はなし]だった。読[よ]み始[はじ]めると 止[と]まらなく なり、十分[じゅっぷん]間[かん]が 終[お]わっても 続[つづ]きが 気[き]に なって、休[やす]み時間[じかん]にも 読[よ]んだ。家[いえ]に 持[も]って 帰[かえ]って、夜中[よなか]まで 読[よ]んだ。\n不思議[ふしぎ]な ことに、同[おな]じ「朝[あさ]の 読書[どくしょ]」なのに、その 日[ひ]から 嫌[いや]では なくなった。決[き]められた 時間[じかん]に 決[き]められた 場所[ばしょ]で 読[よ]む という 点[てん]は、何[なに]も 変[か]わって いない。変[か]わったのは、私[わたし]の 中[なか]の「読[よ]みたい」と いう 気持[きも]ちだけだ。\n大人[おとな]に なって、仕事[しごと]でも 同[おな]じ ことを 感[かん]じる。上司[じょうし]に 言[い]われて 仕方[しかた]なく やる 仕事[しごと]は、時間[じかん]が 長[なが]く、疲[つか]れる。でも、同[おな]じ 仕事[しごと]でも、自分[じぶん]で 意味[いみ]を 見[み]つけると、驚[おどろ]くほど 楽[らく]に なる ことが ある。「させられる」と「する」の 違[ちが]いは、外[そと]から 見[み]ると 分[わ]からない。しかし、本人[ほんにん]に とっては 大[おお]きな 違[ちが]いなのだ。\nもちろん、いつも 自分[じぶん]から やりたいと 思[おも]える わけでは ない。それでも、「どうせ やるなら、何[なに]か 一[ひと]つ 面白[おもしろ]い ところを 探[さが]して みよう」と 考[かんが]える ように して いる。あの 冒険[ぼうけん]小説[しょうせつ]が、今[いま]の 私[わたし]に 教[おし]えて くれた ことだ。","ko":"중학생 때 우리 학교에서는 매일 아침 10분간 독서 시간이 있었다. 좋아하는 책을 읽으면 되는 것이었지만 당시 나는 그게 싫어서 견딜 수 없었다. 억지로 읽게 되고 있다고 느꼈기 때문이다. 책을 펼쳐도 글자를 눈으로 좇을 뿐 내용은 머리에 들어오지 않았다.\n바뀐 것은 2학년 가을이다. 도서위원인 친구의 권유로 어떤 모험 소설을 집어 들었다. 주인공이 섬에 남겨져 혼자 살아남는 이야기였다. 읽기 시작하자 멈출 수 없게 되어 10분이 끝나도 뒷이야기가 궁금해서 쉬는 시간에도 읽었다. 집에 가져가서 한밤중까지 읽었다.\n이상하게도 같은 \"아침 독서\"인데 그날부터 싫지 않게 되었다. 정해진 시간에 정해진 곳에서 읽는다는 점은 아무것도 바뀌지 않았다. 바뀐 것은 내 안의 \"읽고 싶다\"는 마음뿐이다.\n어른이 되어 일에서도 같은 것을 느낀다. 상사가 시켜서 어쩔 수 없이 하는 일은 시간이 길고 지친다. 하지만 같은 일이라도 스스로 의미를 찾으면 놀랄 만큼 편해지는 경우가 있다. \"하게 되는 것\"과 \"하는 것\"의 차이는 밖에서 보면 알 수 없다. 하지만 본인에게는 큰 차이인 것이다.\n물론 늘 스스로 하고 싶다고 생각할 수 있는 것은 아니다. 그래도 \"어차피 할 거라면 뭔가 하나 재미있는 점을 찾아보자\"고 생각하도록 하고 있다. 그 모험 소설이 지금의 나에게 가르쳐 준 것이다.","gloss":[["当時[とうじ]","당시"],["〜て 仕方[しかた]が ない","~해서 견딜 수 없다"],["文字[もじ]","글자"],["追[お]う","좇다"],["図書委員[としょいいん]","도서위원"],["冒険[ぼうけん]小説[しょうせつ]","모험 소설"],["主人公[しゅじんこう]","주인공"],["生[い]き延[の]びる","살아남다"],["続[つづ]き","뒷이야기"],["仕方[しかた]なく","어쩔 수 없이"],["本人[ほんにん]","본인"],["どうせ","어차피"]],"qs":[{"c":["g:154"],"q":"中学生[ちゅうがくせい]の ころ、筆者[ひっしゃ]が 朝[あさ]の 読書[どくしょ]を 嫌[いや]だと 思[おも]って いたのは なぜですか。","o":["十分[じゅっぷん]間[かん]では 短[みじか]すぎたから","文字[もじ]を 読[よ]むのが 苦手[にがて]だったから","自分[じぶん]の 意思[いし]で なく、読[よ]まされて いると 感[かん]じたから","読[よ]みたい 本[ほん]が 学校[がっこう]に なかったから"],"ex":"「読[よ]まされている、と感[かん]じていたから」. 사역수동(Day 154).","a":2},{"c":["g:154"],"q":"二[に]年[ねん]生[せい]の 秋[あき]に 何[なに]が 変[か]わりましたか。","o":["筆者[ひっしゃ]の 本[ほん]を 読[よ]みたい 気持[きも]ち","図書委員[としょいいん]の 仕事[しごと]","読書[どくしょ]を する 場所[ばしょ]","朝[あさ]の 読書[どくしょ]の 時間[じかん]"],"ex":"「変[か]わったのは、私[わたし]の中[なか]の『読[よ]みたい』という気持[きも]ちだけだ」. 시간·장소는 그대로였어요.","a":0},{"c":["g:154"],"q":"「『させられる』と『する』の 違[ちが]い」に ついて、筆者[ひっしゃ]は どう 言[い]って いますか。","o":["子[こ]どもの ころしか 感[かん]じない。","外[そと]から 見[み]ても すぐ 分[わ]かる。","仕事[しごと]では 違[ちが]いは ない。","外[そと]からは 見[み]えないが、本人[ほんにん]には 大[おお]きな 差[さ]が ある。"],"ex":"「外[そと]から見[み]ると分[わ]からない。しかし、本人[ほんにん]にとっては大[おお]きな違[ちが]いなのだ」.","a":3},{"c":["g:154"],"q":"今[いま]の 筆者[ひっしゃ]が 心[こころ]がけて いる ことは 何[なん]ですか。","o":["やりたくない 仕事[しごと]は 断[ことわ]る。","やらなければ ならない ことの 中[なか]に、面白[おもしろ]さを 探[さが]す。","上司[じょうし]に 意見[いけん]を 言[い]う。","毎朝[まいあさ] 十分[じゅっぷん]間[かん] 本[ほん]を 読[よ]む。"],"ex":"「どうせやるなら、何[なに]か一[ひと]つ面白[おもしろ]いところを探[さが]してみよう」.","a":1}]}]},
{"id":"b157","after":157,"lv":"N3","k":"短文","title":"ホテルの 案内[あんない]","text":"お客様[きゃくさま]へ\n本日[ほんじつ]は ご宿泊[しゅくはく] 誠[まこと]に ありがとうございます。\n朝食[ちょうしょく]は 二階[にかい]の レストランにて、六時[ろくじ]半[はん]から 九時[くじ]半[はん]まで ご用意[ようい]して おります。\nお部屋[へや]の 冷蔵庫[れいぞうこ]の 飲[の]み物[もの]は 有料[ゆうりょう]でございます。ご利用[りよう]の 際[さい]は、チェックアウトの 時[とき]に フロントで お支払[しはら]いください。\n何[なに]か ございましたら、内線[ないせん] 九[きゅう]番[ばん]まで お電話[でんわ]ください。","ko":"손님께\n오늘 숙박해 주셔서 대단히 감사합니다.\n조식은 2층 레스토랑에서 6시 반부터 9시 반까지 준비되어 있습니다.\n객실 냉장고의 음료는 유료입니다. 이용하실 때는 체크아웃 시 프런트에서 지불해 주십시오.\n무슨 일이 있으시면 내선 9번으로 전화 주십시오.","gloss":[["〜にて","~에서(격식)"],["有料[ゆうりょう]","유료"],["〜でございます","~입니다(정중)"],["〜の 際[さい]","~할 때"],["内線[ないせん]","내선"]],"qs":[{"c":["g:157"],"q":"冷蔵庫[れいぞうこ]の 飲[の]み物[もの]を 飲[の]んだ 場合[ばあい]、どう しますか。","o":["レストランで 払[はら]う。","飲[の]む 前[まえ]に フロントに 電話[でんわ]する。","帰[かえ]る 時[とき]に フロントで 払[はら]う。","払[はら]わなくて いい。"],"ex":"「チェックアウトの時[とき]にフロントでお支[ささ]払[はら]いください」. 〜でございます·〜ております(Day 157)는 정중어.","a":2}],"more":[{"k":"中文","title":"敬語[けいご]の 「おもてなし」","text":"デパートで アルバイトを 始[はじ]めて 三[さん]か月[げつ][げつ]。いちばん 苦労[くろう]して いるのは 敬語[けいご]だ。「こちらで ございます」「少々[しょうしょう] お待[ま]ちくださいませ」。最初[さいしょ]は、こんなに 丁寧[ていねい]に 話[はな]す 必要[ひつよう]が あるのかと 思[おも]って いた。\nある 日[ひ]、年配[ねんぱい]の お客様[きゃくさま]に 道[みち]を 聞[き]かれた。急[いそ]いで いた 私[わたし]は、つい「あっちです」と 言[い]って しまった。すると、隣[となり]に いた 先輩[せんぱい]が すぐに「大変[たいへん] 失礼[しつれい]いたしました。エレベーターは あちらでございます。ご案内[あんない]いたします」と 言[い]って、お客様[きゃくさま]を エレベーターまで 案内[あんない]した。\n後[あと]で 先輩[せんぱい]に 言[い]われた。「敬語[けいご]は 言葉[ことば]だけの 問題[もんだい]じゃ ないの。『あなたを 大切[たいせつ]に して います』って いう 気持[きも]ちを 形[かたち]に した ものなのよ」。\nそれから、私[わたし]は 敬語[けいご]を 「覚[おぼ]える もの」では なく、「気持[きも]ちを 伝[つた]える 道具[どうぐ]」だと 考[かんが]える ように なった。不思議[ふしぎ]な ことに、そう 思[おも]うと、前[まえ]より 自然[しぜん]に 言葉[ことば]が 出[で]て くる ように なった。","ko":"백화점에서 아르바이트를 시작한 지 석 달. 가장 고생하고 있는 것은 경어다. \"이쪽입니다\" \"잠시만 기다려 주십시오\". 처음에는 이렇게까지 정중하게 말할 필요가 있나 싶었다.\n어느 날 나이 지긋한 손님이 길을 물었다. 바빴던 나는 그만 \"저쪽이에요\"라고 말해 버렸다. 그러자 옆에 있던 선배가 바로 \"대단히 실례했습니다. 엘리베이터는 저쪽입니다. 안내해 드리겠습니다\"라고 말하고 손님을 엘리베이터까지 안내했다.\n나중에 선배가 말했다. \"경어는 말만의 문제가 아니야. '당신을 소중히 여기고 있습니다'라는 마음을 형태로 만든 거야.\"\n그 뒤로 나는 경어를 \"외우는 것\"이 아니라 \"마음을 전하는 도구\"라고 생각하게 되었다. 이상하게도 그렇게 생각하니 전보다 자연스럽게 말이 나오게 되었 {"id":"b164","after":164,"lv":"N3","k":"短文","title":"寮[りょう]の 注意[ちゅうい]","text":"寮生[りょうせい]の みなさんへ\n最近[さいきん]、台所[だいどころ]の 水道[すいどう]を 出[だ]しっぱなしに したまま 部屋[へや]に 戻[もど]る 人[ひと]が います。昨日[きのう]は 床[ゆか]が 水[みず]で ぬれて、下[した]の 階[かい]の 天井[てんじょう]に しみが できて しまいました。\n使[つか]い終[お]わったら、必[かなら]ず 水[みず]を 止[と]めて ください。電気[でんき]の つけっぱなしにも 気[き]を つけましょう。\n寮長[りょうちょう]","ko":"기숙사생 여러분께\n최근 부엌 수도를 틀어 놓은 채 방으로 돌아가는 사람이 있습니다. 어제는 바닥이 물에 젖어 아래층 천장에 얼룩이 생겨 버렸습니다.\n다 쓰면 반드시 물을 잠가 주세요. 전등을 켜 둔 채 두는 것도 주의합시다.\n기숙사장","gloss":[["寮生[りょうせい]","기숙사생"],["〜っぱなし","~한 채로 둠"],["床[ゆか]","바닥"],["天井[てんじょう]","천장"],["しみ","얼룩"],["寮長[りょうちょう]","기숙사장"]],"qs":[{"c":["g:164"],"q":"この 注意文[ちゅういぶん]で いちばん 伝[つた]えたい ことは 何[なん]ですか。","o":["台所[だいどころ]を 使[つか]わない。","水[みず]を 使[つか]った 後[あと]は 必[かなら]ず 止[と]める。","電気[でんき]を 早[はや]く 消[け]して 寝[ね]る。","下[した]の 階[かい]の 部屋[へや]を 掃除[そうじ]する。"],"ex":"〜っぱなし(Day 164)는 \"~한 채로 내버려 둠\". 수도를 반드시 잠그라는 게 핵심.","a":1}],"more":[{"k":"中文","title":"言[い]いっぱなし","text":"会議[かいぎ]で「これは いい アイデアですね。ぜひ やりましょう」と 言[い]う 人[ひと]は 多[おお]い。しかし、その 後[あと]、実際[じっさい]に 動[うご]く 人[ひと]は 意外[いがい]と 少[すく]ない。言[い]いっぱなしで、だれも 手[て]を つけないまま、いつの間[あいだ]にか 忘[わす]れられて しまう。\n私[わたし]の 前[まえ]の 職場[しょくば]にも、そう いう ことが 何度[なんど]も あった。ところが、今[いま]の 職場[しょくば]では、会議[かいぎ]の 最後[さいご]に 必[かなら]ず「だれが」「いつまでに」「何[なに]を」するかを 決[き]めて、ホワイトボードに 書[か]く ことに なって いる。そして、次[つぎ]の 会議[かいぎ]の 初[はじ]めに、それが どう なったかを 確認[かくにん]する。\n最初[さいしょ]は 少[すこ]し 面倒[めんどう]だと 感[かん]じた。しかし、この やり方[ほう]に 変[か]えてから、会議[かいぎ]で 決[き]まった ことが 実際[じっさい]に 進[すす]む ように なった。「いい アイデア」を 言[い]う ことは 簡単[かんたん]だ。大切[たいせつ]なのは、その 後[あと]の 小[ちい]さな 一​歩[ほ]を だれが 踏[ふ]み出[だ]すかなのだ。","ko":"회의에서 \"이건 좋은 아이디어네요. 꼭 합시다\"라고 말하는 사람은 많다. 하지만 그 후 실제로 움직이는 사람은 의외로 적다. 말만 해 놓고 아무도 손을 대지 않은 채 어느새 잊혀 버린다.\n내 전 직장에서도 그런 일이 여러 번 있었다. 그런데 지금 직장에서는 회의 마지막에 반드시 \"누가\" \"언제까지\" \"무엇을\" 할지 정해서 화이트보드에 쓰게 되어 있다. 그리고 다음 회의 처음에 그것이 어떻게 됐는지 확인한다.\n처음에는 조금 번거롭다고 느꼈다. 하지만 이 방식으로 바꾼 뒤 회의에서 정해진 것이 실제로 진행되게 되었다. \"좋은 아이디어\"를 말하는 것은 간단하다. 중요한 것은 그 후의 작은 한 걸음을 누가 내딛느냐인 것이다.","gloss":[["言[い]いっぱなし","말만 해 놓음"],["手[て]を つける","손을 대다"],["確認[かくにん]","확인"],["やり方[かた]","방식"],["踏[ふ]み出[だ]す","내딛다"]],"qs":[{"c":["g:164"],"q":"今[いま]の 職場[しょくば]の 会議[かいぎ]では、最後[さいご]に 何[なに]を しますか。","o":["次[つぎ]の 会議[かいぎ]の 日[ひ]を 決[き]める。","会議[かいぎ]の 感想[かんそう]を 言[い]う。","いい アイデアを 一[ひと]つ 選[えら]ぶ。","担当者[たんとうしゃ]と 期限[きげん]と 内容[ないよう]を 決[き]めて 書[か]く。"],"ex":"「だれが」「いつまでに」「何[なに]を」를 정해서 화이트보드에 쓴다 → 담당자·기한·내용.","a":3},{"c":["g:164"],"q":"筆者[ひっしゃ]が いちばん 言[い]いたい ことは 何[なん]ですか。","o":["前[まえ]の 職場[しょくば]の ほうが よかった。","アイデアを 言[い]うより、実際[じっさい]に 動[うご]き出[だ]す ことが 大切[たいせつ]だ。","会議[かいぎ]は 短[みじか]い ほうが いい。","ホワイトボードは 便利[べんり]だ。"],"ex":"마지막 문장 「大切[たいせつ]なのは、その後[あと]の小[ちい]さな一​​歩[ほ]をだれが踏[ふ]み出[だ]すかなのだ」.","a":1}]},{"k":"長文","title":"やりかけの 仕事[しごと]","text":"私[わたし]の 机[つくえ]の 引[ひ]き出[だ]しには、「やりかけ」の ものが たくさん 入[はい]って いる。途中[とちゅう]まで 読[よ]んだ 本[ほん]、半分[はんぶん]だけ 編[あ]んだ マフラー、最初[さいしょ]の 三[さん]ページで 止[と]まった 日記帳[ひきちょう]。新[あたら]しい ことを 始[はじ]めるのは 好[す]きなのだが、最後[さいご]まで 続[つづ]いた ためしが ない。\n以前[いぜん]は、そんな 自分[じぶん]が 嫌[いや]だった。何[なに]をしても 中途半端[ちゅうとはんぱ]で、根気[こんき]が ない 人間[にんげん]だと 思[おも]って いた。ところが、ある 本[ほん]を 読[よ]んで、少[すこ]し 考[かんが]え方[ほう]が 変[か]わった。\nその 本[ほん]に よると、人間[にんげん]の 脳[のう]は、終[お]わった ことより、やりかけの ことを よく 覚[おぼ]えて いる という。途中[とちゅう]で 止[と]まった ことは、脳[のう]の 中[なか]で「まだ 終[お]わって いない」と いう しるしが ついたまま 残[のこ]るのだそうだ。だから、ドラマが いい ところで「続[つづ]く」と 終[お]わると、次[つぎ]の 回[かい]が 気[き]に なって 仕方[しかた]が ないのだ。\nこの 話[はなし]を 読[よ]んで、私[わたし]は 引[ひ]き出[だ]しの 中[なか]の やりかけの ものを、もう 一度[いちど] 見直[みなお]して みた。すると、不思議[ふしぎ]な ことに、どれも 始[はじ]めた ころの 気持[きも]ちを はっきり 思[おも]い出[だ]せた。マフラーは、祖母[そぼ]に 編[あ]み方[ほう]を 教[おそ]わった 冬[ふゆ]に 始[はじ]めた もの。本[ほん]は、旅行先[りょこうさき]の 本屋[ほんや]で 店員[てんいん]さんに すすめられた もの。やりかけの ものは、ただの 失敗[しっぱい]では なく、その 時[とき]の 自分[じぶん]の 記録[きろく]でも あったのだ。\n今[いま]、私[わたし]は 一[ひと]つずつ、やりかけの ものを 終[お]わらせて いる。全部[ぜんぶ] 終[お]わらせる 必要[ひつよう]は ないと 思[おも]う。ただ、「続[つづ]きを やりたい」と 思[おも]える ものが、まだ 自分[じぶん]の 中[なか]に 残[のこ]って いる ことが、少[すこ]し うれしい。","ko":"내 책상 서랍에는 \"하다 만\" 것이 잔뜩 들어 있다. 중간까지 읽은 책, 절반만 뜬 목도리, 처음 세 페이지에서 멈춘 일기장. 새로운 것을 시작하는 건 좋아하지만 끝까지 계속된 적이 없다.\n예전에는 그런 내가 싫었다. 뭘 해도 어중간하고 끈기가 없는 사람이라고 생각했다. 그런데 어떤 책을 읽고 생각이 조금 바뀌었다.\n그 책에 따르면 인간의 뇌는 끝난 일보다 하다 만 일을 잘 기억한다고 한다. 도중에 멈춘 일은 뇌 속에서 \"아직 끝나지 않았다\"는 표시가 붙은 채 남는다는 것이다. 그래서 드라마가 좋은 장면에서 \"다음 회에 계속\"으로 끝나면 다음 회가 궁금해서 견딜 수 없는 것이다.\n이 이야기를 읽고 나는 서랍 속 하다 만 것들을 다시 한번 살펴보았다. 그러자 신기하게도 모두 시작했을 때의 마음을 분명하게 떠올릴 수 있었다. 목도리는 할머니께 뜨는 법을 배운 겨울에 시작한 것. 책은 여행지의 서점에서 점원이 추천해 준 것. 하다 만 것들은 그저 실패가 아니라 그때의 나의 기록이기도 했던 것이다.\n지금 나는 하나씩 하다 만 것들을 끝내고 있다. 전부 끝낼 필요는 없다고 생각한다. 다만 \"이어서 하고 싶다\"고 생각할 수 있는 것이 아직 내 안에 남아 있다는 것이 조금 기쁘다.","gloss":[["引[ひ]き出[だ]し","서랍"],["やりかけ","하다 만 것"],["編[あ]む","뜨다(뜨개질)"],["日記帳[にっきちょう]","일기장"],["ためしが ない","~한 적이 없다"],["中途半端[ちゅうとはんぱ]","어중간함"],["根気[こんき]","끈기"],["脳[のう]","뇌"],["しるし","표시"],["見直[みなお]す","다시 보다"],["教[おそ]わる","배우다"],["記録[きろく]","기록"]],"qs":[{"c":["g:164"],"q":"以前[いぜん]の 筆者[ひっしゃ]は 自分[じぶん]の ことを どう 思[おも]って いましたか。","o":["何[なん]でも 最後[さいご]まで やる 人[ひと]だ。","記憶力[きおくりょく]が いい 人[ひと]だ。","何[なん]でも 途中[とちゅう]で やめる、根気[こんき]の ない 人[ひと]だ。","新[あたら]しい ことが 嫌[きら]いな 人[ひと]だ。"],"ex":"「何[なに]をしても中途半端[ちゅうとはんぱ]で、根気[こんき]がない人[ひと]間​だと思[おも]っていた」. 〜かけ(Day 165).","a":2},{"c":["g:164"],"q":"本[ほん]に よると、人間[にんげん]の 脳[のう]は どんな 特徴[とくちょう]が ありますか。","o":["終[お]わって いない ことを よく 覚[おぼ]えて いる。","新[あたら]しい ことを すぐ 忘[わす]れる。","終[お]わった ことを よく 覚[おぼ]えて いる。","ドラマを 見[み]ると 疲[つか]れる。"],"ex":"「終[お]わったことより、やりかけのことをよく覚[おぼ]えている」.","a":0},{"c":["g:164"],"q":"「やりかけの ものは…その 時[とき]の 自分[じぶん]の 記録[きろく]でも あった」とは どういう 意味[いみ]ですか。","o":["やりかけの 物[もの]は 全部[ぜんぶ] 捨[す]てるべきだ。","やりかけの 物[もの]は 失敗[しっぱい]の 記録[きろく]だ。","やりかけの 物[もの]を 見[み]ると、始[はじ]めた 時[とき]の 気持[きも]ちや 出来事[できごと]を 思[おも]い出[だ]せる。","やりかけの 物[もの]を 日記[にっき]に 書[か]いて いた。"],"ex":"목도리·책 각각에 시작했을 때의 추억이 담겨 있었다는 것.","a":2},{"c":["g:164"],"q":"今[いま]の 筆者[ひっしゃ]の 気持[きも]ちに 合[あ]う ものは どれですか。","o":["やりかけの 自分[じぶん]が まだ 嫌[きら]いだ。","続[つづ]けたいと 思[おも]える ものが ある ことが うれしい。","新[あたら]しい ことは もう 始[はじ]めたくない。","全部[ぜんぶ] 終[お]わらせなければ ならないと 思[おも]って いる。"],"ex":"「『続[つづ]きをやりたい』と思[おも]えるものが、まだ自分[じぶん]の中[なか]に残[のこ]っていることが、少[すこ]しうれしい」. 전부 끝낼 필요는 없다고 했어요.","a":1}]}]},
{"id":"b168","after":168,"lv":"N3","k":"短文","title":"先輩[せんぱい]への お願[ねが]い","text":"佐々木先輩[ささきせんぱい]\n来週[らいしゅう]の 発表[はっぴょう]の 練習[れんしゅう]を 見[み]て いただけないでしょうか。一人[ひとり]で 何度[なんど]も やり直[なお]して みたのですが、どこが 分[わ]かりにくいのか、自分[じぶん]では よく 分[わ]かりません。\n二十分[にじゅっぷん]ほどで 終[お]わります。木曜日[もくようび]か 金曜日[きんようび]の 昼休[ひるやす]みは いかがでしょうか。\n新井[あらい]","ko":"사사키 선배님\n다음 주 발표 연습을 봐 주실 수 없을까요? 혼자 여러 번 다시 해 봤지만 어디가 이해하기 어려운지 스스로는 잘 모르겠습니다.\n20분 정도면 끝납니다. 목요일이나 금요일 점심시간은 어떠세요?\n아라이","gloss":[["やり直[なお]す","다시 하다"],["いかが","어떠세요"]],"qs":[{"c":["g:168"],"q":"新井[あらい]さんが 先輩[せんぱい]に 頼[たの]んで いる ことは 何[なん]ですか。","o":["発表[はっぴょう]の 練習[れんしゅう]を 見[み]て、意見[いけん]を 言[い]って もらう。","発表[はっぴょう]を 代[か]わりに して もらう。","昼[ひる]ご飯[はん]を 一緒[いっしょ]に 食[た]べる。","発表[はっぴょう]の 資料[しりょう]を 作[つく]って もらう。"],"ex":"연습을 봐 주고 어디가 이해하기 어려운지 알려 달라는 부탁. 〜直す(Day 167).","a":0}],"more":[{"k":"中文","title":"話[はな]し合[あ]う ことの 大切[たいせつ]さ","text":"去年[きょねん]、私[わたし]たち 夫婦[ふうふ]は 家事[かじ]の ことで よく けんかを して いた。私[わたし]は「自分[じぶん]ばかり 家事[かじ]を して いる」と 思[おも]って いたし、夫[おっと]も「自分[じぶん]も ちゃんと 手伝[てつだ]って いる」と 思[おも]って いたのだ。\nある 夜[よる]、二人[ふたり]で 一週間[いっしゅうかん] 自分[じぶん]が した 家事[かじ]を 全部[ぜんぶ] 紙[かみ]に 書[か]き出[だ]して みる ことに した。書[か]き出[だ]して みると、お互[たが]いに 相手[あいて]が して いる 家事[かじ]に ほとんど 気[き]が ついて いなかった ことが 分[わ]かった。夫[おっと]は 毎朝[まいあさ] ゴミを 出[だ]し、お風呂[ふろ]を 洗[あら]って いた。私[わたし]は それを 当[あ]たり前[まえ]だと 思[おも]って いた。夫[おっと]も、私[わたし]が 毎日[まいにち] 献立[こんだて]を 考[かんが]えて いる 苦労[くろう]を 知[し]らなかった。\nそれから、私[わたし]たちは 月[つき]に 一度[いちど]、家事[かじ]に ついて 話[はな]し合[あ]う 時間[じかん]を 作[つく]った。不満[ふまん]を ためずに 伝[つた]え合[あ]う ように なってから、けんかは ずいぶん 減[へ]った。相手[あいて]が して いる ことは、言葉[ことば]に しないと 意外[いがい]と 見[み]えない ものなのだ。","ko":"작년에 우리 부부는 집안일 문제로 자주 싸웠다. 나는 \"나만 집안일을 하고 있다\"고 생각했고, 남편도 \"나도 제대로 돕고 있다\"고 생각했던 것이다.\n어느 날 밤 둘이서 일주일 동안 자신이 한 집안일을 전부 종이에 적어 보기로 했다. 적어 보니 서로 상대가 하는 집안일을 거의 알아채지 못하고 있었다는 것을 알았다. 남편은 매일 아침 쓰레기를 내놓고 욕조를 씻고 있었다. 나는 그걸 당연하다고 생각하고 있었다. 남편도 내가 매일 식단을 생각하는 수고를 몰랐다.\n그 뒤로 우리는 한 달에 한 번 집안일에 대해 의논하는 시간을 만들었다. 불만을 쌓아 두지 않고 서로 전하게 되고 나서 싸움은 꽤 줄었다. 상대가 하고 있는 일은 말로 하지 않으면 의외로 보이지 않는 법이다.","gloss":[["夫婦[ふうふ]","부부"],["家事[かじ]","집안일"],["書[か]き出[だ]す","적어 내다"],["お互[たが]いに","서로"],["当[あ]たり前[まえ]","당연함"],["献立[こんだて]","식단"],["不 {"id":"b171","after":171,"lv":"N3","k":"短文","title":"製品[せいひん]の 説明[せつめい]","text":"このスーツケースは、従来[じゅうらい]の 製品[せいひん]より 二[に]割[わり] 軽[かる]く なりました。持[も]ち手[て]が 握[にぎ]りやすい 形[かたち]に 変[か]わり、重[おも]い 荷物[にもつ]を 入[い]れても 手[て]が 痛[いた]く なりにくく なって います。\nただし、強[つよ]い 力[ちから]が 加[くわ]わると 割[わ]れる おそれが ありますので、飛行機[ひこうき]に 預[あず]ける 際[さい]は、専用[せんよう]の カバーを ご利用[りよう]ください。","ko":"이 여행 가방은 기존 제품보다 20% 가벼워졌습니다. 손잡이가 잡기 쉬운 모양으로 바뀌어 무거운 짐을 넣어도 손이 잘 아프지 않게 되어 있습니다.\n다만 강한 힘이 가해지면 깨질 우려가 있으니 비행기에 맡길 때는 전용 커버를 이용해 주십시오.","gloss":[["従来[じゅうらい]","기존"],["持[も]ち手[て]","손잡이"],["握[にぎ]る","잡다"],["割[わ]れる","깨지다"],["おそれ","우려"],["専用[せんよう]","전용"],["カバー","커버"]],"qs":[{"c":["g:171"],"q":"この スーツケースに ついて 正[ただ]しい ものは どれですか。","o":["持[も]ち手[て]が 握[にぎ]りづらく なった。","強[つよ]い 力[ちから]が 加[くわ]わっても 割[わ]れない。","前[まえ]の 製品[せいひん]より 重[おも]く なった。","飛行機[ひこうき]に 預[あず]ける 時[とき]は カバーを 使[つか]った ほうが いい。"],"ex":"「飛行機[ひこうき]に預[あず]ける際[さい]は、専​用[よう]のカバーをご利用[りよう]ください」. 〜づらい(Day 171)↔〜やすい.","a":3}],"more":[{"k":"中文","title":"言[い]いづらい ことを 言[い]う","text":"仕事[しごと]で いちばん 言[い]いづらいのは、相手[あいて]の ミスを 伝[つた]える ことだ。特[とく]に、相手[あいて]が 年上[としうえ]だったり、一生懸命[いっしょうけんめい] やって くれて いたり すると、なかなか 言[い]い出[だ]せない。私[わたし]も 以前[いぜん]は、ミスに 気[き]が ついても 黙[だま]って 自分[じぶん]で 直[なお]して しまう ことが 多[おお]かった。\nしかし、ある 時[とき]、先輩[せんぱい]に 注意[ちゅうい]された。「黙[だま]って 直[なお]すのは 親切[しんせつ]じゃ ないよ。相手[あいて]は 同[おな]じ ミスを また 繰[く]り返[かえ]す。それに、あなたの 仕事[しごと]も 増[ふ]える 一方[いっぽう]でしょう」。\nそれから 私[わたし]は、言[い]い方[ほう]を 工夫[くふう]する ように した。まず、相手[あいて]が して くれた ことに お礼[れい]を 言[い]う。次[つぎ]に、「ここ、もしかすると 数字[すうじ]が 違[ちが]うかもしれません。一緒[いっしょ]に 確認[かくにん]して いただけますか」と、相手[あいて]を 責[せ]めない 形[かたち]で 伝[つた]える。こう すると、相手[あいて]も 素直[すなお]に 聞[き]いて くれる ことが 多[おお]い。言[い]いづらい ことほど、伝[つた]え方[ほう]が 大切[たいせつ]なのだと 思[おも]う。","ko":"일하면서 가장 말하기 어려운 것은 상대의 실수를 전하는 것이다. 특히 상대가 연상이거나 열심히 해 주었거나 하면 좀처럼 말을 꺼낼 수 없다. 나도 예전에는 실수를 알아채도 말없이 스스로 고쳐 버리는 일이 많았다.\n하지만 어느 날 선배에게 주의를 받았다. \"말없이 고치는 건 친절이 아니야. 상대는 같은 실수를 또 되풀이해. 게다가 네 일도 늘기만 하잖아.\"\n그 뒤로 나는 말하는 방식을 궁리하게 되었다. 먼저 상대가 해 준 일에 감사 인사를 한다. 다음으로 \"여기, 어쩌면 숫자가 다를지도 모르겠어요. 같이 확인해 주실 수 있을까요?\"처럼 상대를 탓하지 않는 형태로 전한다. 이렇게 하면 상대도 순순히 들어 주는 경우가 많다. 말하기 어려운 것일수록 전하는 방식이 중요하다고 생각한다.","gloss":[["〜づらい","~하기 어 은 말로 중요한 것이 쓰여 있다\"는 대답이었다. 어른용 책은 정보가 많아서 읽는 데 체력이 필요하다. 그에 비해 아동용 책은 짧은 문장 속에 다정함이나 용기 같은 소중한 것이 곧게 쓰여 있다.\n나도 지난번 어릴 때 좋아하던 그림책을 오랜만에 다시 읽었다. 작은 쥐가 친구를 위해 겨울 내내 나무 열매를 모으는 이야기다. 어릴 때는 그저 \"귀여운 이야기\"라고 생각했다. 하지만 지금 읽으니 쥐가 자기 먹을 것을 줄이면서까지 친구를 돕고 있다는 것을 깨닫고 가슴이 벅찼다.\n같은 책이라도 읽는 사람의 나이나 경험에 따라 보이는 것이 바뀐다. 아동용 책은 아이만 읽을 수 있는 책이 아니다. 오히려 여러 경험을 해 온 어른이기에 알아챌 수 있는 것도 있는 것이다.\n\"~용\"이라는 말은 읽는 사람을 정하기 위한 것이 아니라 누구를 위해 쓰였는지를 나타낼 뿐인지도 모른다.","gloss":[["〜向[む]け","~용, ~대상"],["番組[ばんぐみ]","프로그램"],["書店[しょてん]","서점"],["姿[すがた]","모습"],["珍[めずら]しい","드물다"],["出版社[しゅっぱんしゃ]","출판사"],["最[もっと]も","가장"],["体力[たいりょく]","체력"],["勇気[ゆうき]","용기"],["まっすぐ","곧게"],["ねずみ","쥐"],["木[き]の 実[じつ]","나무 열매"],["胸[むね]が いっぱい","가슴이 벅참"],["むしろ","오히려"]],"qs":[{"c":["g:171"],"q":"調査[ちょうさ]で、大人[おとな]が 子[こ]ども向[む]けの 本[ほん]を 読[よ]む 理由[りゆう]で いちばん 多[おお]かったのは 何[なん]ですか。","o":["子[こ]どもに 読[よ]んで あげる ためだから","疲[つか]れて いても 安心[あんしん]して 読[よ]めるから","情報[じょうほう]が 多[おお]いから","値段[ねだん]が 安[やす]いから"],"ex":"「最[もっと]も多[おお]かったのは『疲[つか]れている時[とき]に安心[あんしん]して読[よ]める』だった」.","a":1},{"c":["g:171"],"q":"筆者[ひっしゃ]が 絵本[えほん]を 読[よ]み返[かえ]して 気[き]が ついた ことは 何[なん]ですか。","o":["ねずみが 自分[じぶん]を 犠牲[ぎせい]に して 友達[ともだち]を 助[たす]けて いた こと","冬[ふゆ]は 食[た]べ物[もの]が 少[すく]ない こと","絵本[えほん]の 絵[え]が きれいな こと","ねずみが かわいい こと"],"ex":"자기 먹을 것을 줄이면서까지 친구를 돕는다는 것. 어릴 때는 \"귀여운 이야기\"로만 봤어요.","a":0},{"c":["g:171"],"q":"「大人[おとな]だからこそ、気[き]が つける ことも ある」とは どういう 意味[いみ]ですか。","o":["子[こ]どもは 本[ほん]の 意味[いみ]が 分[わ]からない。","大人[おとな]は 子[こ]ども向[む]けの 本[ほん]を 読[よ]むべきでは ない。","大人[おとな]は 子[こ]どもより 本[ほん]を よく 読[よ]む。","経験[けいけん]が ある 大人[おとな]だから 分[わ]かる こと が ある。"],"ex":"〜からこそ(Day 196 미리보기). 여러 경험을 했기에 보이는 것이 있다.","a":3},{"c":["g:171"],"q":"筆者[ひっしゃ]は「〜向[む]け」と いう 言葉[ことば]を どう 考[かんが]えて いますか。","o":["使[つか]うべきでは ない 言葉[ことば]だ。","本[ほん]の 値段[ねだん]を 決[き]める ための 言葉[ことば]だ。","子[こ]どもしか 読[よ]めない ことを 表[あらわ]して いる。","だれが 読[よ]んでも いいが、だれの ために 書[か]かれたかを 表[あらわ]して いる。"],"ex":"마지막 문장 「読[よ]む人[ひと]を決[き]めるためではなく、だれのために書[か]かれたかを表​すだけ」. 〜向け(Day 173 미리보기).","a":3}]}]},
{"id":"b175","after":175,"lv":"N3","k":"短文","title":"修理[しゅうり]の 連絡[れんらく]","text":"山田[やまだ] 様[さま]\nお預[あず]かりして いる 自転車[じてんしゃ]の 修理[しゅうり]が 終[お]わりました。タイヤが 傷[きず]だらけで、空気[くうき]が 抜[ぬ]けやすく なって いたため、前[まえ]と 後[うし]ろの タイヤを 新[あたら]しい ものに 交換[こうかん]しました。\n修理代[しゅうりだい]は 部品代[ぶひんだい]を 含[ふく]めて 六[ろく]千[せん]八[はっ]百[ぴゃく]円[えん]です。\n営業時間内[えいぎょうじかんない]（十時[じゅうじ]〜十[じゅう]九[く]時[じ]、水曜定休[すいようていきゅう]）に お受[う]け取[と]りに お越[こ]しください。\nサイクルショップ ひかり","ko":"야마다 님\n맡기신 자전거 수리가 끝났습니다. 타이어가 상처투성이라 바람이 빠지기 쉬운 상태였기 때문에 앞뒤 타이어를 새것으로 교체했습니다.\n수리비는 부품비를 포함해서 6800엔입니다.\n영업시간 내(10~19시, 수요일 정기 휴무)에 찾으러 와 주십시오.\n사이클숍 히카리","gloss":[["修理[しゅうり]","수리"],["タイヤ","타이어"],["〜だらけ","~투성이"],["抜[ぬ]ける","빠지다"],["交換[こうかん]","교환"],["部品[ぶひん]","부품"],["含[ふく]める","포함하다"],["定休[ていきゅう]","정기 휴무"],["お越[こ]し","오심"]],"qs":[{"c":["g:175"],"q":"山田[やまだ]さんが 次[つぎ]に する ことは 何[なん]ですか。","o":["修理[しゅうり]するか どうか 店[みせ]に 連絡[れんらく]する。","水曜日[すいようび]に 自転車[じてんしゃ]を 取[と]りに 行[い]く。","水曜日[すいようび] 以外[いがい]の 営業時間[えいぎょうじかん]に 自転車[じてんしゃ]を 取[と]りに 行[い]く。","新[あたら]しい タイヤを 買[か]いに 行[い]く。"],"ex":"수리가 끝났으니 찾으러 가면 돼요. 수요일은 정기 휴무. 〜だらけ(Day 175).","a":2}],"more":[{"k":"中文","title":"失敗[しっぱい]だらけの 一年[いちねん]目[め]","text":"社会人[しゃかいじん] 一年[いちねん]目[め]の 私[わたし]は、失敗[しっぱい]だらけだった。書類[しょるい]の 数字[すうじ]を 間違[まちが]え、会議[かいぎ]の 時間[じかん]を 忘[わす]れ、お客様[きゃくさま]の 名前[なまえ]を 呼[よ]び間違[まちが]えた こともある。毎晩[まいばん]、帰[かえ]りの 電車[でんしゃ]の 中[なか]で「この 仕事[しごと]は 向[む]いて いないのでは ないか」と 考[かんが]えて いた。\nそんな 私[わたし]に、ある 日[にち] 課長[かちょう]が 古[ふる]い ノートを 見[み]せて くれた。課長[かちょう]が 新人[しんじん]の ころに 書[か]いて いた「失敗[しっぱい]ノート」だった。そこには、自分[じぶん]が した 失敗[しっぱい]と、その 原因[げんいん]、次[つぎ]に どう するかが、びっしり 書[か]かれて いた。最初[さいしょ]の 方[かた]の ページは 失敗[しっぱい]だらけだったが、後[うし]ろの 方[ほう]に なると、だんだん 書[か]く ことが 少[すく]なく なって いた。\n「失敗[しっぱい]するのは 恥[は]ずかしい ことじゃ ない。同[おな]じ 失敗[しっぱい]を 繰[く]り返[かえ]さない ことが 大切[たいせつ]なんだ」と 課長[かちょう]は 言[い]った。その 日[ひ]から、私[わたし]も 失敗[しっぱい]ノートを つけ始[はじ]めた。三[さん]年[ねん]目[め]の 今[いま]、ノートの ページは、まだ 時々[ときどき] 増[ふ]えて いる。","ko":"사회인 1년 차의 나는 실수투성이였다. 서류 숫자를 틀리고, 회의 시간을 잊고, 손님 이름을 잘못 부른 적도 있다. 매일 밤 퇴근길 전철 안에서 \"이 일은 나랑 안 맞는 게 아닐까\" 하고 생각했다.\n그런 나에게 어느 날 과장님이 오래된 노트를 보여 주었다. 과장님이 신입 때 쓰던 \"실패 노트\"였다. 거기에는 자신이 한 실수와 그 원인, 다음에 어떻게 할지가 빽빽하게 쓰여 있었다. 앞쪽 페이지는 실수투성이였지만 뒤쪽으로 갈수록 쓸 내용이 점점 줄어 있었다.\n\"실수하는 건 부끄러운 일이 아니야. 같은 실수를 되풀이하지 않는 게 중요한 거야\"라고 과장님은 말했다. 그날부터 나도 실패 노트를 쓰기 시작했다. 3년 차인 지금 노트 페이지는 아직 가끔 늘고 있다.","gloss":[["呼[よ]び間違[まちが]える","잘못 부르다"],["向[む]く","적성에 맞다"],["新人[しんじん]","신입"],["びっしり","빽빽이"],["だんだん","점점"],["つける","(노트를) 쓰다"]],"qs":[{"c":["g:175"],"q":"課長[かちょう]の ノートの 後[うし]ろの 方[かた]の ページは どう なって いましたか。","o":["楽[たの]しかった ことが 書[か]いて あった。","失敗[しっぱい]が 増[ふ]えて いた。","書[か]かれて いる 失敗[しっぱい]が 少[すく]なく なって いた。","何[なに]も 書[か]かれて いなかった。"],"ex":"「後[うし]ろの方[ほう]になると、だんだん書[か]くことが少[すく]なくなっていた」 → 실수가 줄었다.","a":2},{"c":["g:175"],"q":"「ノートの ページは、まだ 時々[ときどき] 増[ふ]えて いる」から 分[わ]かる ことは 何[なん]ですか。","o":["今[いま]も 失敗[しっぱい]は あるが、記録[きろく]を 続[つづ]けて いる。","もう 失敗[しっぱい]は しなく なった。","課長[かちょう]の ノートを 借[か]りて いる。","ノートを 書[か]くのを やめた。"],"ex":"가끔 실수가 생기지만 노트를 계속 쓰고 있다는 뜻이에요.","a":0}]},{"k":"情報検索","title":"カルチャーセンター","text":"【さくらカルチャーセンター　春[はる]の 新講座[しんこうざ]】\n講座名[こうざめい]　　　　　　　　　曜日[ようび]・時間[じかん]　　　　　　回数[かいすう]　　受講料[じゅこうりょう]　　　　その他[ほか]\n① はじめての 書道[しょどう]　　　 月[げつ]　十時[じゅうじ]〜十一時[じゅういちじ]半[はん]　　全[ぜん]八[はっ]回[かい]　一[いち]万[まん]二[に]千[せん]円[えん]　　道具代[どうぐだい] 三千円[さんぜんえん]（初回[しょかい]）\n② スマホ写真[しゃしん] 入門[にゅうもん]　　　 水[すい]　十[じゅう]九[く]時[じ]〜二[に]十[じゅう]時半[じはん]　全[ぜん]六[ろく]回[かい]　九[きゅう]千[せん]円[えん]　　　　スマホを 持参[じさん]\n③ 英会話[えいかいわ]（初級[しょきゅう]）　　　　 木[もく]　十[じゅう]九[く]時[じ]〜二[に]十[じゅう]時[じ]　　全[ぜん]十[じゅう]回[かい]　一[いち]万[まん]五[ご]千[せん]円[えん]　　教材費[きょうざいひ] 二[に]千[せん]円[えん]\n④ ヨガで リラックス　　　土[ど]　九時[くじ]〜十時[じゅうじ]　　　　全[ぜん]八[はっ]回[かい]　一[いち]万[まん]円[えん]　　　　ヨガマット 貸[か]し出[だ]し あり（一回[いっかい] 百円[ひゃくえん]）\n⑤ 親子[おやこ]で 料理[りょうり]　　　　　 日[にち]　十時[じゅうじ]〜十[じゅう]二[に]時[じ]　　　全[ぜん]四[よん]回[かい]　親子[おやこ] 一[いち]万[まん]二[に]千[せん]円[えん]　材料費[ざいりょうひ] 込[こ]み\n◆ 会員[かいいん]（入会金[にゅうかいきん] 二[に]千[せん]円[えん]・年会費[ねんかいひ] 不要[ふよう]）に なると、受講料[じゅこうりょう]が 一[いち]割[わり] 引[ひ]きに なります。\n◆ 体験受講[たいけんじゅこう]：①②④は 一回[いっかい] 千円[せんえん]で 体験[たいけん]できます（体験後[たいけんご] その 日[ひ]に 申[もう]し込[こ]むと、入会金[にゅうかいきん]が 無料[むりょう]）。\n◆ 申[もう]し込[こ]みは 受付[うけつけ]窓口[まどぐち]か 電話[でんわ]で。定員[ていいん]に なり次第[しだい] 締[し]め切[き]ります。","ko":"[사쿠라 컬처센터 봄 신규 강좌]\n① 처음 하는 서예: 월 10~11시 반, 전 8회, 12000엔, 도구비 3000엔(첫 회) / ② 스마트폰 사진 입문: 수 19~20시 반, 전 6회, 9000엔, 스마트폰 지참 / ③ 영어회화(초급): 목 19~20시, 전 10회, 15000엔, 교재비 2000엔 / ④ 요가로 릴랙스: 토 9~10시, 전 8회, 10000엔, 요가 매트 대여 있음(1회 100엔) / ⑤ 부모와 아이 요리: 일 10~12시, 전 4회, 부모·자녀 12000엔, 재료비 포함\n◆ 회원(입회금 2000엔·연회비 없음)이 되면 수강료가 10% 할인됩니다.\n◆ 체험 수강: ①②④는 1회 1000엔으로 체험할 수 있습니다(체험 후 그날 신청하면 입회금 무료).\n◆ 신청은 접수 창구나 전화로. 정원이 차는 대로 마감합니다.","gloss":[["カルチャーセンター","컬처센터"],["書道[しょどう]","서예"],["持参[じさん]","지참"],["教材費[きょうざいひ]","교재비"],["リラックス","릴랙스"],["ヨガマット","요가 매트"],["込[こ]み","포함"],["年会費[ねんかいひ]","연회비"],["不要[ふよう]","불필요"],["体験受講[たいけんじゅこう]","체험 수강"],["〜次第[しだい]","~하는 대로"]],"qs":[{"c":["g:175"],"q":"会社員[かいしゃいん]の 林[はやし]さんは、④ の 体験[たいけん]を して、その 日[ひ]に 会員[かいいん]に なって 申[もう]し込[こ]みます。ヨガマットは 毎回[まいかい] 借[か]ります。体験[たいけん]の 日[ひ]を 除[のぞ]いて、申[もう]し込[こ]む 時[とき]に 払[はら]う お金[かね]と マット代[だい]の 合計[ごうけい]は いくらですか。","o":["一[いち]万[まん]一[いち]千[せん]八[はっ]百[ぴゃく]円[えん]","九[きゅう]千[せん]八[はっ]百[ぴゃく]円[えん]","一[いち]万[まん]八[はっ]百[ぴゃく]円[えん]","九[きゅう]千[せん]円[えん]"],"ex":"회원이면 수강료 10% 할인 10000→9000엔, 체험 당일 신청이라 입회금 무료. 매트 100엔×8회=800엔 → 9800엔.","a":1},{"c":["g:175"],"q":"仕事[しごと]が 平日[へいじつ] 十八時[じゅうはちじ]に 終[お]わる 人[ひと]が 申[もう]し込[こ]める 講座[こうざ]は どれですか。","o":["① と ②","② と ③","④ と ⑤","③ だけ"],"ex":"평일 저녁: ②(수 19시)와 ③(목 19시). ①은 월요일 오전.","a":1}]}]},
{"id":"b178","after":178,"lv":"N3","k":"短文","title":"旅先[たびさき]からの はがき","text":"お元気[げんき]ですか。私[わたし]は 今[いま]、沖縄[おきなわ]に 来[き]て います。海[うみ]が 青[あお]くて、本当[ほんとう]に きれいです。\n毎日[まいにち] 暑[あつ]くて たまりませんが、夕方[ゆうがた]の 海辺[うみべ]を 散歩[さんぽ]するのが 楽[たの]しみです。昨日[きのう]は 地元[じもと]の 人[ひと]に 教[おし]えて もらった 食堂[しょくどう]で、ゴーヤチャンプルーを 食[た]べました。\n来週[らいしゅう] 帰[かえ]ったら、お土産[みやげ]を 持[も]って 遊[あそ]びに 行[い]きますね。\nゆき","ko":"잘 지내세요? 저는 지금 오키나와에 와 있어요. 바다가 파래서 정말 예뻐요.\n매일 더워서 견딜 수 없지만, 저녁 바닷가를 산책하는 게 즐거움이에요. 어제는 현지 사람이 알려 준 식당에서 고야 참프루를 먹었어요.\n다음 주에 돌아가면 선물을 들고 놀러 갈게요.\n유키","gloss":[["旅先[たびさき]","여행지"],["沖縄[おきなわ]","오키나와"],["〜て たまらない","~해서 견딜 수 없다"],["海辺[うみべ]","바닷가"],["地元[じもと]","현지"],["ゴーヤチャンプルー","고야 참프루(오키나와 요리)"]],"qs":[{"c":["g:178"],"q":"ゆきさんに ついて 正[ただ]しい ものは どれですか。","o":["暑[あつ]いのは つらいが、旅行[りょこう]を 楽[たの]しんで いる。","もう 家[いえ]に 帰[かえ]った。","暑[あつ]いので 毎日[まいにち] ホテルに いる。","食堂[しょくどう]を 自分[じぶん]で 探[さが]した。"],"ex":"〜てたまらない(Day 178)는 \"~해서 견딜 수 없다\". 덥지만 산책을 즐기고 있어요. 식당은 현지인이 알려 줬어요.","a":0}],"more":[{"k":"中文","title":"会[あ]いたくて たまらない","text":"大学[だいがく]に 入[はい]って 一人[ひとり]暮[く]らしを 始[はじ]めた 春[はる]、私[わたし]は 家族[かぞく]に 会[あ]いたくて たまらなかった。毎晩[まいばん] 母[はは]に 電話[でんわ]を かけ、週末[しゅうまつ]の たびに 実家[じっか]に 帰[かえ]ろうか 迷[まよ]って いた。友達[ともだち]も まだ いなくて、部屋[へや]に 帰[かえ]っても だれも いない ことが、こんなに さびしいとは 思[おも]わなかった。\nある 日[ひ]、母[はは]に「毎週[まいしゅう] 帰[かえ]って きても いいけど、一度[いちど] 一[いっ]か月[げつ][げつ] 頑張[がんば]って みたら」と 言[い]われた。最初[さいしょ]は 冷[つめ]たいと 思[おも]った。しかし、仕方[しかた]なく 週末[しゅうまつ]を 大学[だいがく]の 近[ちか]くで 過[す]ごす ように なると、少[すこ]しずつ 変[か]わって いった。サークルの 見学[けんがく]に 行[い]き、同[おな]じ 学部[がくぶ]の 人[ひと]と 食事[しょくじ]を し、町[まち]の 古本屋[ふるほんや]を 見[み]つけた。\n一[いっ]か月[げつ][げつ] たって 実家[じっか]に 帰[かえ]った 時[とき]、私[わたし]は 母[はは]に 大学[だいがく]の 話[はなし]を たくさん した。母[はは]は うれしそうに 聞[き]いて いた。後[あと]で 知[し]ったのだが、母[はは]も 私[わたし]に 会[あ]いたくて たまらなかったそうだ。それでも、私[わたし]の ために 我慢[がまん]して くれて いたのだ。","ko":"대학에 들어가 혼자 살기 시작한 봄, 나는 가족이 보고 싶어서 견딜 수 없었다. 매일 밤 엄마에게 전화를 걸고 주말마다 본가에 돌아갈까 망설였다. 친구도 아직 없어서 방에 돌아가도 아무도 없다는 것이 이렇게 쓸쓸할 줄은 몰랐다.\n어느 날 엄마가 \"매주 돌아와도 되지만 한 번 한 달만 버텨 보면 어때?\"라고 말했다. 처음에는 차갑다고 생각했다. 하지만 어쩔 수 없이 주말을 대학 근처에서 보내게 되자 조금씩 바뀌어 갔다. 동아리 견학을 가고, 같은 학부 사람과 식사를 하고, 동네 헌책방을 발견했다.\n한 달이 지나 본가에 갔을 때 나는 엄마에게 대학 이야기를 많이 했다. 엄마는 기쁜 듯이 들었다. 나중에 안 것이지만 엄마도 내가 보고 싶어서 견딜 수 없었다고 한다. 그래도 나를 위해 참아 주고 있었던 것이다.","gloss":[["実家[じっか]","본가"],["〜たびに","~할 때마다"],["迷[まよ]う","망설이다"],["サークル","동아리"],["古本屋[ふるほんや]","헌책방"],["我慢[がまん]","참음"]],"qs":[{"c":["g:178"],"q":"母[はは]が「一[いっ]か月[げつ][げつ] 頑張[がんば]って みたら」と 言[い]ったのは、本当[ほんとう]は なぜですか。","o":["子[こ]どもに 会[あ]いたくなかったから","母[はは]が 忙[いそが]しかったから","子[こ]どもが 大学[だいがく]の 生活[せいかつ]に 慣[な]れる ように","電話代[でんわだい]が 高[たか]かったから"],"ex":"엄마도 보고 싶었지만 「私[わたし]のために我慢[がまん]してくれていた」 → 대학 생활에 적응하도록.","a":2},{"c":["g:178"],"q":"週末[しゅうまつ]を 大学[だいがく]の 近[ちか]くで 過[す]ごす ように なって、「私[わたし]」は どう 変[か]わりましたか。","o":["大学[だいがく]での 生活[せいかつ]を 楽[たの]しめる ように なった。","前[まえ]より さびしく なった。","実家[じっか]に 帰[かえ]りたく なくなった。","毎晩[まいばん] 母[はは]に 電話[でんわ]する ように なった。"],"ex":"동아리·친구·헌책방 → 대학 생활 이야기를 엄마에게 많이 할 정도로 즐기게 됐어요.","a":0}]},{"k":"長文","title":"気[き]に なって 仕方[しかた]が ない","text":"人[ひと]は 一度[いちど] 気[き]に なった ことが あると、なかなか 頭[あたま]から 離[はな]れない ものだ。私[わたし]の 場合[ばあい]、それは「人[ひと]の 評価[ひょうか]」だった。\n会議[かいぎ]で 発言[はつげん]した 後[あと]、「あの 言[い]い方[ほう]は よくなかったかもしれない」と 一日[いちにち]中[じゅう] 考[かんが]えて しまう。メールを 送[おく]った 後[あと]、返事[へんじ]が 遅[おそ]いと、「何[なに]か 失礼[しつれい]な ことを 書[か]いたのでは ないか」と 気[き]に なって 仕方[しかた]が ない。こう して 夜[よる] 眠[ねむ]れなく なる ことも 多[おお]かった。\nある 時[とき]、友人[ゆうじん]に その 悩[なや]みを 話[はな]すと、意外[いがい]な 質問[しつもん]を された。「じゃあ、あなたは 昨日[きのう]の 会議[かいぎ]で、だれが 何[なに]を 言[い]ったか 覚[おぼ]えて いる？」。考[かんが]えて みると、ほとんど 覚[おぼ]えて いなかった。自分[じぶん]の 発言[はつげん]は 何度[なんど]も 思[おも]い返[かえ]すのに、ほかの 人[ひと]の 発言[はつげん]は すぐ 忘[わす]れて いたのだ。\n友人[ゆうじん]は 笑[わら]って 言[い]った。「みんな 同[おな]じだよ。人[ひと]は 自分[じぶん]の ことで 精一杯[せいいっぱい]で、他人[たにん]の ことは そんなに 見[み]て いない。あなたが 気[き]に して いる ことの ほとんどは、相手[あいて]は もう 忘[わす]れて いるよ」。\nその 言葉[ことば]を 聞[き]いて、肩[かた]の 力[ちから]が 抜[ぬ]けた 気[き]が した。もちろん、相手[あいて]への 気[き]づかいは 大切[たいせつ]だ。しかし、自分[じぶん]の 頭[あたま]の 中[なか]で 作[つく]った 心配[しんぱい]に 振[ふ]り回[まわ]されて、疲[つか]れて しまうのは もったいない。今[いま]でも 気[き]に なる ことは あるが、そんな 時[とき]は「相手[あいて]は もう 忘[わす]れて いるかも」と 自分[じぶん]に 言[い]う ように して いる。それだけで、ずいぶん 楽[らく]に なった。","ko":"사람은 한번 신경 쓰이는 일이 있으면 좀처럼 머리에서 떠나지 않는 법이다. 내 경우 그것은 \"남의 평가\"였다.\n회의에서 발언한 뒤 \"그 말투는 좋지 않았을지도 몰라\"라고 하루 종일 생각해 버린다. 메일을 보낸 뒤 답장이 늦으면 \"뭔가 실례되는 걸 쓴 게 아닐까\" 하고 신경 쓰여서 견딜 수 없다. 이렇게 해서 밤에 잠들지 못하게 되는 일도 많았다.\n어느 날 친구에게 그 고민을 이야기하자 뜻밖의 질문을 받았다. \"그럼 너는 어제 회의에서 누가 무슨 말을 했는지 기억해?\" 생각해 보니 거의 기억하지 못했다. 내 발언은 몇 번이나 되새기면서 다른 사람의 발언은 금방 잊고 있었던 것이다.\n친구는 웃으며 말했다. \"다들 똑같아. 사람은 자기 일로 벅차서 남의 일은 그렇게 보고 있지 않아. 네가 신경 쓰는 것의 대부분은 상대는 이미 잊었을 거야.\"\n그 말을 듣고 어깨의 힘이 빠지는 기분이 들었다. 물론 상대에 대한 배려는 중요하다. 하지만 내 머릿속에서 만든 걱정에 휘둘려 지쳐 버리는 것은 아깝다. 지금도 신경 쓰이는 일은 있지만 그럴 때는 \"상대는 이미 잊었을지도\"라고 스스로에게 말하도록 하고 있다. 그것만으로 꽤 편해졌다.","gloss":[["評価[ひょうか]","평가"],["発言[はつげん]","발언"],["〜て 仕方[しかた]が ない","~해서 견딜 수 없다"],["思[おも]い返[かえ]す","되새기다"],["精一杯[せいいっぱい]","벅참, 최선"],["他人[たにん]","남"],["肩[かた]の 力[ちから]が 抜[ぬ]ける","어깨의 힘이 빠지다"],["振[ふ]り回[まわ]される","휘둘리다"]],"qs":[{"c":["g:178"],"q":"筆者[ひっしゃ]は 以前[いぜん]、どんな ことに 悩[なや]んで いましたか。","o":["メールの 書[か]き方[ほう]が 分[わ]からない こと","会議[かいぎ]で 発言[はつげん]できない こと","友人[ゆうじん]が 少[すく]ない こと","自分[じぶん]が 人[ひと]から どう 思[おも]われて いるか"],"ex":"「それは『人[ひと]の評価[ひょうか]』だった」. 〜て仕方[しかた]がない(Day 179).","a":3},{"c":["g:178"],"q":"友人[ゆうじん]の 質問[しつもん]に 答[こた]えようと して、筆者[ひっしゃ]は 何[なに]に 気[き]が つきましたか。","o":["会議[かいぎ]の 内容[ないよう]を よく 覚[おぼ]えて いる こと","自分[じぶん]の 発言[はつげん]を 忘[わす]れて いた こと","友人[ゆうじん]が 会議[かいぎ]に 出[で]て いた こと","ほかの 人[ひと]の 発言[はつげん]は あまり 覚[おぼ]えて いない こと"],"ex":"남의 발언은 거의 기억하지 못했다 → 남들도 나를 그렇게 신경 쓰지 않는다.","a":3},{"c":["g:178"],"q":"「肩[かた]の 力[ちから]が 抜[ぬ]けた」とは、ここでは どういう 意味[いみ]ですか。","o":["体[からだ]が 疲[つか]れて しまった。","肩[かた]が 痛[いた]く なった。","気持[きも]ちが 楽[らく]に なった。","やる気[き]が なくなった。"],"ex":"긴장이 풀려 마음이 편해졌다는 관용 표현.","a":2},{"c":["g:178"],"q":"筆者[ひっしゃ]が 今[いま] 心[こころ]がけて いる ことは 何[なん]ですか。","o":["気[き]に なる 時[とき]は、相手[あいて]は 忘[わす]れて いるかもしれないと 考[かんが]える。","メールは すぐ 返事[へんじ]を する。","会議[かいぎ]では 発言[はつげん]しない。","相手[あいて]への 気[き]づかいを やめる。"],"ex":"「『相手[あいて]はもう忘[わす]れているかも』と自分[じぶん]に言[い]うようにしている」. 배려를 그만두라는 게 아니에요.","a":0}]}]},
{"id":"b182","after":182,"lv":"N3","k":"短文","title":"エアコン 修理[しゅうり]の お知[し]らせ","text":"三階[さんがい] 会議室[かいぎしつ]を ご利用[りよう]の 皆様[みなさま]へ\n三階[さんがい] 会議室[かいぎしつ]の エアコンが 故障[こしょう]して いる ため、今週[こんしゅう] 金曜日[きんようび]まで 使用[しよう]できません。\n大切[たいせつ]な 会議[かいぎ]の 予約[よやく]まで 入[はい]って いた 方[ほう]には、大変[たいへん] ご迷惑[めいわく]を おかけします。代[か]わりに 五階[ごかい]の 会議室[かいぎしつ]を ご用意[ようい]しました。予約[よやく]は 自動的[じどうてき]に 五階[ごかい]に 変更[へんこう]されて います。\n総務部[そうむぶ]","ko":"3층 회의실을 이용하시는 여러분께\n3층 회의실 에어컨이 고장 나서 이번 주 금요일까지 사용할 수 없습니다.\n중요한 회의 예약까지 들어 있던 분께는 대단히 폐를 끼쳐 드립니다. 대신 5층 회의실을 준비했습니다. 예약은 자동으로 5층으로 변경되어 있습니다.\n총무부","gloss":[["使用[しよう]","사용"],["自動的[じどうてき]に","자동으로"]],"qs":[{"c":["g:182"],"q":"三階[さんがい]の 会議室[かいぎしつ]を 予約[よやく]して いた 人[ひと]は どう すれば いいですか。","o":["会議[かいぎ]を 来週[らいしゅう]に する。","何[なに]も しないで、五階[ごかい]の 会議室[かいぎしつ]を 使[つか]う。","予約[よやく]を もう 一度[いちど] する。","総務部[そうむぶ]に 電話[でんわ]する。"],"ex":"「予約[よやく]は自​動​的​に五階[ごかい]に変更[へんこう]されています」 → 따로 할 일이 없어요. 〜まで(Day 182)는 \"~까지도\".","a":1}],"more":[{"k":"中文","title":"子[こ]どもにまで 笑[わら]われる","text":"三[さん]十[じゅう]歳[さい]を すぎて、私[わたし]は 自転車[じてんしゃ]に 乗[の]る 練習[れんしゅう]を 始[はじ]めた。子[こ]どもの ころ、一度[いちど] 転[ころ]んで けがを してから、怖[こわ]くて 乗[の]れなく なって いたのだ。\n近所[きんじょ]の 公園[こうえん]で 練習[れんしゅう]して いると、小学生[しょうがくせい]たちが 集[あつ]まって きた。「大人[おとな]なのに 乗[の]れないの」と 笑[わら]われ、正直[しょうじき] 恥[は]ずかしかった。子[こ]どもにまで 笑[わら]われるなんて、と 何度[なんど]も やめようと 思[おも]った。\nところが、三日[みっか]目[め]、その 中[なか]の 一人[ひとり]の 男[おとこ]の子[こ]が「ペダルを こぐ 前[まえ]に、前[まえ]を 見[み]るんだよ。下[した]を 見[み]ると 倒[たお]れるよ」と 教[おし]えて くれた。言[い]われた とおりに 前[まえ]を 見[み]ると、不思議[ふしぎ]な ことに 少[すこ]しずつ 進[すす]める ように なった。一週間[いっしゅうかん]後[ご]、私[わたし]は 公園[こうえん]を 一周[いっしゅう]する ことが できた。子[こ]どもたちは 拍手[はくしゅ]を して くれた。\n笑[わら]われるのは 恥[は]ずかしい。でも、恥[は]ずかしさを 越[こ]えた 先[さき]には、思[おも]いがけない 先生[せんせい]が いる ことも ある。","ko":"서른 살이 넘어 나는 자전거 타는 연습을 시작했다. 어릴 때 한 번 넘어져 다치고 나서 무서워서 못 타게 되었던 것이다.\n동네 공원에서 연습하고 있으니 초등학생들이 모여들었다. \"어른인데 못 타요?\" 하고 웃음을 사서 솔직히 부끄러웠다. 아이들한테까지 웃음을 사다니, 하고 몇 번이나 그만두려고 했다.\n그런데 사흘째 그중 한 남자아이가 \"페달을 밟기 전에 앞을 보는 거예요. 아래를 보면 넘어져요\"라고 알려 주었다. 들은 대로 앞을 보자 신기하게도 조금씩 나아갈 수 있게 되었다. 일주일 후 나는 공원을 한 바퀴 돌 수 있었다. 아이들은 박수를 쳐 주었다.\n웃음을 사는 것은 부끄럽다. 하지만 부끄러움을 넘어선 곳에는 뜻밖의 선생님이 있을 수도 있다.","gloss":[["転[ころ]ぶ","넘어지다"],["〜 {"id":"b185","after":185,"lv":"N3","k":"短文","title":"先生[せんせい]の コメント","text":"リンさんの 作文[さくぶん]、読[よ]みました。日本[にほん]の お祭[まつ]りの 様子[ようす]が、まるで 写真[しゃしん]を 見[み]て いるみたいに 伝[つた]わって きました。\nただ、最後[さいご]の 段落[だんらく]が 少[すこ]し 短[みじか]いので、お祭[まつ]りに 参加[さんか]して、リンさんが 何[なに]を 感[かん]じたのかを もう 少[すこ]し 書[か]くと、もっと よく なると 思[おも]います。\n木村[きむら]","ko":"린 씨의 작문 읽었어요. 일본 축제의 모습이 마치 사진을 보는 것처럼 전해져 왔어요.\n다만 마지막 단락이 조금 짧으니, 축제에 참가해서 린 씨가 무엇을 느꼈는지를 조금 더 쓰면 더 좋아질 거라고 생각해요.\n기무라","gloss":[["コメント","코멘트"],["作文[さくぶん]","작문"],["まるで","마치"],["〜みたいに","~처럼"],["段落[だんらく]","단락"]],"qs":[{"c":["g:185"],"q":"先生[せんせい]は リンさんに 何[なに]を アドバイスして いますか。","o":["お祭[まつ]りの 写真[しゃしん]を 入[い]れる。","全体[ぜんたい]を 短[みじか]く する。","最後[さいご]に、自分[じぶん]の 気持[きも]ちを もっと 書[か]く。","お祭[まつ]りの 様子[ようす]を もっと 詳[くわ]しく 書[か]く。"],"ex":"마지막 단락에 \"무엇을 느꼈는지\"를 더 쓰라는 조언. 〜みたいに(Day 185)는 비유.","a":2}],"more":[{"k":"中文","title":"夢[ゆめ]みたいな 話[はなし]","text":"十[じゅう]年[ねん]前[まえ]、「いつか 宇宙旅行[うちゅうりょこう]に 行[い]きたい」と 言[い]ったら、友達[ともだち]に「夢[ゆめ]みたいな 話[はなし]だね」と 笑[わら]われた。当時[とうじ]、宇宙[うちゅう]は 特別[とくべつ]な 訓練[くんれん]を 受[う]けた 人[ひと]だけが 行[い]ける 場所[ばしょ]だった。\nところが 最近[さいきん]、民間[みんかん]の 会社[かいしゃ]が 宇宙旅行[うちゅうりょこう]の サービスを 始[はじ]めた。値段[ねだん]は まだ とても 高[たか]く、一回[いっかい] 数[かぞ]千[せん]万[まん]円[えん]も かかる。それでも、申[もう]し込[こ]む 人[ひと]は 少[すく]なく ないと いう。技術[ぎじゅつ]が 進[すす]めば、値段[ねだん]は 少[すこ]しずつ 下[さ]がって いくだろう。\n考[かんが]えて みれば、飛行機[ひこうき]も 昔[むかし]は 一部[いちぶ]の 人[ひと]しか 乗[の]れない ものだった。それが 今[いま]では、だれでも 気軽[きがる]に 海外[かいがい]へ 行[い]ける。今[いま]は 夢[ゆめ]みたいな 話[はなし]も、何[なん]十年[じゅうねん]か 後[あと]には 当[あ]たり前[まえ]に なって いるのかもしれない。私[わたし]は 今[いま]も、宇宙旅行[うちゅうりょこう]の ために 少[すこ]しずつ 貯金[ちょきん]を 続[つづ]けて いる。","ko":"10년 전 \"언젠가 우주여행을 가고 싶다\"고 했더니 친구가 \"꿈같은 이야기네\"라며 웃었다. 당시 우주는 특별한 훈련을 받은 사람만 갈 수 있는 곳이었다.\n그런데 최근 민간 회사가 우주여행 서비스를 시작했다. 가격은 아직 매우 비싸서 한 번에 수천만 엔이나 든다. 그래도 신청하는 사람이 적지 않다고 한다. 기술이 발전하면 가격은 조금씩 내려갈 것이다.\n생각해 보면 비행기도 옛날에는 일부 사람만 탈 수 있는 것이었다. 그것이 지금은 누구나 부담 없이 해외에 갈 수 있다. 지금은 꿈같은 이야기도 몇십 년 후에는 당연한 일이 되어 있을지도 모른다. 나는 지금도 우주여행을 위해 조금씩 저금을 계속하고 있다.","gloss":[["宇宙旅行[うちゅうりょこう]","우주여행"],["訓練[くんれん]","훈련"],["民間[みんかん]","민간"],["サービス","서비스"],["数[かぞ]千[せん]万[まん]","수천만"],["技術[ぎじゅつ]","기술"],["気軽[きがる]に","부담 없이"],["貯金[ちょきん]","저금"]],"qs":[{"c":["g:185"],"q":"筆者[ひっしゃ]は 宇宙旅行[うちゅうりょこう]の 値段[ねだん]に ついて どう 考[かんが]えて いますか。","o":["技術[ぎじゅつ]が 進[すす]めば 安[やす]く なって いく。","すぐに だれでも 行[い]ける 値段[ねだん]に なる。","ずっと 高[たか]い ままだ。","高[たか]すぎるので 申[もう]し込[こ]む 人[ひと]は いない。"],"ex":"「技術[ぎじゅつ]が進[すす]めば、値段[ねだん]は少[すこ]しずつ下[さ]がっていくだろう」. 신청자는 적지 않다고 했어요.","a":0},{"c":["g:185"],"q":"筆者[ひっしゃ]が 飛行機[ひこうき]の 例[れい]を 出[だ]したのは なぜですか。","o":["海外旅行[かいがいりょこう]に 行[い]きたいから","今[いま]は 特別[とくべつ]な ことも、将来[しょうらい]は 普通[ふつう]に なる ことを 言[い]う ため","宇宙旅行[うちゅうりょこう]より 飛行機[ひこうき]が 好[す]きだから","飛行機[ひこうき]の 値段[ねだん]が 高[たか]い ことを 言[い]う ため"],"ex":"비행기도 예전엔 일부만 탔지만 지금은 누구나 → 우주여행도 당연해질지 모른다.","a":1}]},{"k":"長文","title":"「〜みたい」と 「〜らしい」","text":"日本語[にほんご]を 教[おし]えて いると、留学生[りゅうがくせい]から「『〜みたい』と『〜らしい』は どう 違[ちが]うのですか」と よく 聞[き]かれる。どちらも、はっきり しない ことを 言[い]う 時[とき]に 使[つか]うので、確[たし]かに 分[わ]かりにくい。\n私[わたし]は いつも、次[つぎ]のように 説明[せつめい]して いる。「〜みたい」は、自分[じぶん]が 見[み]たり 聞[き]いたり した ことを 根拠[こんきょ]に して 言[い]う 時[とき]に 使[つか]う ことが 多[おお]い。たとえば、空[そら]が 暗[くら]く なって きたのを 見[み]て「雨[あめ]が 降[ふ]るみたいだ」と 言[い]う。一方[いっぽう]、「〜らしい」は、人[ひと]から 聞[き]いた ことや、読[よ]んだ ことを 伝[つた]える 時[とき]に よく 使[つか]う。天気予報[てんきよほう]を 見[み]て「明日[あした]は 雨[あめ]が 降[ふ]るらしい」と 言[い]う 感[かん]じだ。\nところが、この 説明[せつめい]を すると、ある 学生[がくせい]から 鋭[するど]い 質問[しつもん]が 来[き]た。「では、『あの 人[ひと]は 先生[せんせい]らしい』は 何[なん]ですか。先生[せんせい]だと 聞[き]いたのですか、それとも 先生[せんせい]みたいに 見[み]えるのですか」。\n実[じつ]は、「らしい」には もう 一[ひと]つ 使[つか]い方[ほう]が ある。「先生[せんせい]らしい 先生[せんせい]」と 言[い]えば、「先生[せんせい]として 理想的[りそうてき]な」と いう 意味[いみ]に なる。「春[はる]らしい 天気[てんき]」「男[おとこ]らしい 人[ひと]」なども 同[おな]じだ。同[おな]じ「らしい」でも、文[ぶん]の 中[なか]での 使[つか]い方[ほう]に よって 意味[いみ]が 変[か]わるのだ。\n留学生[りゅうがくせい]の 質問[しつもん]は、いつも 私[わたし]に 日本語[にほんご]を 見直[みなお]す きっかけを くれる。当[あ]たり前[まえ]に 使[つか]って いる 言葉[ことば]ほど、説明[せつめい]するのは 難[むずか]しい。教[おし]える ことは、教[おそ]わる ことでも あるのだと 思[おも]う。","ko":"일본어를 가르치다 보면 유학생에게서 \"'〜みたい'와 '〜らしい'는 어떻게 다른가요?\"라는 질문을 자주 받는다. 둘 다 분명하지 않은 것을 말할 때 쓰기 때문에 확실히 알기 어렵다.\n나는 늘 다음과 같이 설명한다. \"〜みたい\"는 자신이 보거나 들은 것을 근거로 말할 때 쓰는 경우가 많다. 예를 들어 하늘이 어두워지는 것을 보고 \"비가 올 것 같다\"고 말한다. 한편 \"〜らしい\"는 남에게 들은 것이나 읽은 것을 전할 때 자주 쓴다. 일기예보를 보고 \"내일은 비가 온대\"라고 말하는 느낌이다.\n그런데 이 설명을 하자 한 학생에게서 날카로운 질문이 왔다. \"그럼 'あの人は先生らしい'는 뭔가요? 선생님이라고 들은 건가요, 아니면 선생님처럼 보이는 건가요?\"\n사실 \"らしい\"에는 또 하나의 용법이 있다. \"先生らしい先生\"라고 하면 \"선생님으로서 이상적인\"이라는 뜻이 된다. \"봄다운 날씨\" \"남자다운 사람\" 등도 같다. 같은 \"らしい\"라도 문장 속 쓰임에 따라 의미가 바뀌는 것이다.\n유학생의 질문은 늘 나에게 일본어를 다시 보는 계기를 준다. 당연하게 쓰는 말일수록 설명하기 어렵다. 가르치는 것은 배우는 것이기도 하다고 생각한다.","gloss":[["根拠[こんきょ]","근거"],["鋭[するど]い","날카롭다"],["それとも","아니면"],["理想的[りそうてき]","이상적"],["見直[みなお]す","다시 보다"],["きっかけ","계기"],["〜ほど","~일수록"],["教[おそ]わる","배우다"]],"qs":[{"c":["g:185"],"q":"筆者[ひっしゃ]の 説明[せつめい]では、「〜みたい」は どんな 時[とき]に 使[つか]う ことが 多[おお]いですか。","o":["自分[じぶん]が 見[み]たり 聞[き]いたり した ことから 考[かんが]える 時[とき]","天気予報[てんきよほう]を 伝[つた]える 時[とき]","理想的[りそうてき]な ものを 言[い]う 時[とき]","人[ひと]から 聞[き]いた ことを 伝[つた]える 時[とき]"],"ex":"「自分[じぶん]が見[み]たり聞[き]いたりしたことを根拠[こんきょ]にして言[い]う時[とき]」. 남에게 들은 것은 らしい.","a":0},{"c":["g:185"],"q":"「明日[あした]は 雨[あめ]が 降[ふ]るらしい」は、どんな 場面[ばめん]で 使[つか]われますか。","o":["雨[あめ]が 降[ふ]って ほしい 時[とき]","雨[あめ]の 日[ひ]が 好[す]きな 時[とき]","空[そら]が 暗[くら]く なったのを 見[み]た 時[とき]","天気予報[てんきよほう]で 聞[き]いた ことを 伝[つた]える 時[とき]"],"ex":"「天気予報[てんきよほう]を見[み]て『明日[あした]は雨[あめ]が降[ふ]るらしい』」. 전문(伝[つた]聞​)의 らしい.","a":3},{"c":["g:185"],"q":"「先生[せんせい]らしい 先生[せんせい]」の「らしい」と 同[おな]じ 使[つか]い方[ほう]は どれですか。","o":["雨[あめ]が 降[ふ]るらしい。","田中[たなか]さんは 明日[あした] 休[やす]むらしい。","今日[きょう]は 春[はる]らしい 暖[あたた]かい 日[ひ]だ。","あの 店[みせ]は 有名[ゆうめい]らしい。"],"ex":"\"~다운(이상적인 성질)\" 용법. 春[はる]らしい = 봄다운. 나머지는 전문(들은 것) 용법.","a":2},{"c":["g:185"],"q":"筆者[ひっしゃ]は、留学生[りゅうがくせい]の 質問[しつもん]に ついて どう 思[おも]って いますか。","o":["留学生[りゅうがくせい]の 日本語[にほんご]は 難[むずか]しすぎる。","質問[しつもん]は 少[すく]ない ほうが いい。","日本語[にほんご]を 改[あらた]めて 考[かんが]える きっかけに なる。","答[こた]えるのが 大変[たいへん]なので、困[こま]る。"],"ex":"「留学生[りゅうがくせい]の質問[しつもん]は、いつも私[わたし]に日本語[にほんご]を見直[みなお]すきっかけをくれる」.","a":2}]}]},
{"id":"b189","after":189,"lv":"N3","k":"短文","title":"観光[かんこう]案内[あんない]","text":"みどり町[ちょう]と いえば、何[なに]と いっても 秋[あき]の 紅葉[もみじ]です。特[とく]に 十一月[じゅういちがつ]の 中旬[ちゅうじゅん]から 下旬[げじゅん]にかけては、川沿[かわぞ]いの 道[みち]が 赤[あか]や 黄色[きいろ]に 染[そ]まり、多[おお]くの 人[ひと]が 訪[おとず]れます。\n週末[しゅうまつ]は 道[みち]が 込[こ]むので、駅[えき]から 出[で]て いる 無料[むりょう]の シャトルバスの ご利用[りよう]を おすすめします。\nみどり町[ちょう] 観光協会[かんこうきょうかい]","ko":"미도리초라고 하면 뭐니 뭐니 해도 가을 단풍입니다. 특히 11월 중순부터 하순에 걸쳐서는 강변 길이 빨강과 노랑으로 물들어 많은 사람이 찾아옵니다.\n주말에는 길이 붐비니 역에서 출발하는 무료 셔틀버스 이용을 추천합니다.\n미도리초 관광협회","gloss":[["〜と いえば","~라고 하면"],["何[なに]と いっても","뭐니 뭐니 해도"],["紅葉[もみじ]","단풍"],["中旬[ちゅうじゅん]","중순"],["下旬[げじゅん]","하순"],["染[そ]まる","물들다"],["訪[おとず]れる","방문하다"],["シャトルバス","셔틀버스"],["観光協会[かんこうきょうかい]","관광협회"]],"qs":[{"c":["g:189"],"q":"この 案内[あんない]が すすめて いる ことは 何[なん]ですか。","o":["車[くるま]で 川沿[かわぞ]いの 道[みち]を 走[はし]る こと","十一月[じゅういちがつ]の 初[はじ]めに 行[い]く こと","平日[へいじつ]に 行[い]く こと","週末[しゅうまつ]は 駅[えき]から バスで 行[い]く こと"],"ex":"「週末[しゅうまつ]は道[みち]が込[こ]むので…シャトルバスのご利用[りよう]をおすすめします」. 〜といえば(Day 189).","a":3}],"more":[{"k":"中文","title":"京都[きょうと]と いえば","text":"「京都[きょうと]と いえば？」と 聞[き]かれたら、多[おお]くの 人[ひと]は お寺[てら]や 神社[じんじゃ]、着物[きもの]、抹茶[まっちゃ]などを 思[おも]い浮[う]かべるだろう。私[わたし]も そうだった。ところが、京都[きょうと]に 住[す]む 友人[ゆうじん]に 案内[あんない]して もらって、イメージが 大[おお]きく 変[か]わった。\n友人[ゆうじん]が 最初[さいしょ]に 連[つ]れて 行[い]って くれたのは、有名[ゆうめい]な お寺[てら]では なく、住宅地[じゅうたくち]の 中[なか]に ある 小[ちい]さな パン屋[や]だった。友人[ゆうじん]に よると、京都[きょうと]は 実[じつ]は パンを 食[た]べる 量[りょう]が 日本[にほん]で 一[いち]、二[に]を 争[あらそ]うほど 多[おお]い 町[まち]なのだそうだ。新[あたら]しい ものが 好[す]きな 人[ひと]が 多[おお]く、古[ふる]い 町並[まちな]みの 中[なか]に、おしゃれな カフェや パン屋[や]が たくさん あると いう。\n古[ふる]い 伝統[でんとう]を 大切[たいせつ]に しながら、新[あたら]しい ものも どんどん 取[と]り入[い]れる。それが 本当[ほんとう]の 京都[きょうと]らしさなのかもしれない。観光地[かんこうち]を 回[まわ]るだけでは 見[み]えない 町[まち]の 顔[かお]を、私[わたし]は 初[はじ]めて 知[し]った。","ko":"\"교토라고 하면?\" 하고 물으면 많은 사람이 절이나 신사, 기모노, 말차 등을 떠올릴 것이다. 나도 그랬다. 그런데 교토에 사는 친구의 안내를 받고 이미지가 크게 바뀌었다.\n친구가 처음 데려가 준 곳은 유명한 절이 아니라 주택가 안에 있는 작은 빵집이었다. 친구에 따르면 교토는 사실 빵을 먹는 양이 일본에서 1, 2위를 다툴 만큼 많은 도시라고 한다. 새로운 것을 좋아하는 사람이 많아서 옛 거리 풍경 속에 세련된 카페나 빵집이 많이 있다고 한다.\n오래된 전통을 소중히 하면서 새로운 것도 거침없이 받아들인다. 그것이 진짜 교토다움일지도 모른다. 관광지를 도는 것만으로는 보이지 않는 도시의 얼굴을 나는 처음
