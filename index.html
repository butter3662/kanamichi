{"id":"b63","after":63,"lv":"N4","k":"短文","title":"荷物[にもつ]の 不在票[ふざいひょう]","text":"キム様[さま]\n本日[ほんじつ] 午後[ごご] 二時[にじ]に お荷物[にもつ]を お届[とど]けに 来[き]ましたが、お留守[るす]でしたので、持[も]ち帰[かえ]りました。\n再配達[さいはいたつ]を ご希望[きぼう]の 場合[ばあい]は、下[した]の 番号[ばんごう]に お電話[でんわ]ください。午前[ごぜん] 八時[はちじ]から 午後[ごご] 九時[くじ]まで 受[う]け付[つ]けて います。\nお荷物[にもつ]は 七日[なのか]間[あいだ] お預[あず]かりします。それを すぎると、送[おく]った 方[ほう]に お返[かえ]しします。\nさくら運輸[うんゆ]","ko":"김 님\n오늘 오후 2시에 짐을 배달하러 왔지만 부재중이셔서 다시 가져갔습니다.\n재배달을 원하시는 경우에는 아래 번호로 전화 주십시오. 오전 8시부터 오후 9시까지 접수하고 있습니다.\n짐은 7일간 보관합니다. 그 기간이 지나면 보낸 분께 돌려 드립니다.\n사쿠라 운수","gloss":[["不在票[ふざいひょう]","부재 안내표"],["本日[ほんじつ]","오늘"],["届[とど]ける","배달하다"],["留守[るす]","부재중"],["持[も]ち帰[かえ]る","도로 가져가다"],["再配達[さいはいたつ]","재배달"],["希望[きぼう]","희망"],["受[う]け付[つ]ける","접수하다"],["預[あず]かる","맡아 두다"],["運輸[うんゆ]","운수"]],"qs":[{"c":["g:63"],"q":"キムさんが 荷物[にもつ]を 受[う]け取[と]りたい 場合[ばあい]、どう しなければ なりませんか。","o":["七日[なのか]以内[いない]に 電話[でんわ]して、もう 一度[いちど] 届[とど]けて もらう。","午後[ごご] 二時[にじ]に 家[いえ]に いる。","送[おく]った 人[ひと]に 電話[でんわ]する。","さくら運輸[うんゆ]の 店[みせ]へ 取[と]りに 行[い]く。"],"ex":"재배달을 원하면 전화해야 하고, 7일이 지나면 보낸 사람에게 돌아가요. 〜のに/〜ので 같은 이유 표현(Day 63~64)에 주의.","a":0}],"more":[{"k":"中文","title":"せっかく 作[つく]ったのに","text":"先週[せんしゅう]の 土曜日[どようび]は 妻[つま]の 誕生日[たんじょうび]でした。私[わたし]は 料理[りょうり]が 得意[とくい]では ありませんが、妻[つま]を 驚[おどろ]かせたくて、初[はじ]めて ケーキを 作[つく]る ことに しました。\nインターネットで 作[つく]り方[ほう]を 調[しら]べて、前[まえ]の 日[ひ]に 材料[ざいりょう]を 全部[ぜんぶ] 買[か]って おきました。当日[とうじつ]は 妻[つま]が 友達[ともだち]と 出[で]かけて いる 間[あいだ]に、四時間[よじかん]も かけて 作[つく]りました。卵[たまご]を 泡立[あわだ]てるのに 時間[じかん]が かかって、腕[うで]が とても 疲[つか]れました。\nやっと できた ケーキは、写真[しゃしん]で 見[み]た ケーキより ずっと 低[ひく]くて、形[かたち]も よく ありませんでした。せっかく 一生懸命[いっしょうけんめい] 作[つく]ったのに、と 私[わたし]は がっかりしました。\nところが、帰[かえ]って きた 妻[つま]は ケーキを 見[み]て、とても 喜[よろこ]んで くれました。「形[かたち]なんて どうでも いいよ。あなたが 私[わたし]の ために 作[つく]って くれたのが うれしい」と 言[い]って、写真[しゃしん]を 何枚[なんまい]も 撮[と]って いました。味[あじ]は 少[すこ]し 甘[あま]すぎましたが、二人[ふたり]で 全部[ぜんぶ] 食[た]べました。\n来年[らいねん]は もっと 上手[じょうず]に 作[つく]れるように、時々[ときどき] 練習[れんしゅう]しようと 思[おも]って います。","ko":"지난주 토요일은 아내의 생일이었습니다. 저는 요리를 잘하지 못하지만 아내를 놀라게 하고 싶어서 처음으로 케이크를 만들기로 했습니다.\n인터넷으로 만드는 법을 찾아보고 전날 재료를 전부 사 두었습니다. 당일에는 아내가 친구와 외출해 있는 동안 4시간이나 들여서 만들었습니다. 달걀 거품을 내는 데 시간이 걸려서 팔이 몹시 아팠습니다.\n겨우 완성된 케이크는 사진에서 본 케이크보다 훨씬 낮았고 모양도 좋지 않았습니다. 모처럼 열심히 만들었는데, 하고 저는 실망했습니다.\n그런데 돌아온 아내는 케이크를 보고 아주 기뻐해 주었습니다. \"모양 같은 건 아무래도 좋아. 당신이 나를 위해 만들어 준 게 기뻐.\"라고 하면서 사진을 몇 장이나 찍었습니다. 맛은 조금 너무 달았지만 둘이서 다 먹었습니다.\n내년에는 더 잘 만들 수 있도록 가끔 연습하려고 합니다.","gloss":[["得意[とくい]","잘함"],["驚[おどろ]かせる","놀라게 하다"],["作[つく]り方[かた]","만드는 법"],["調[しら]べる","찾아보다"],["当日[とうじつ]","당일"],["泡立[あわだ]てる","거품을 내다"],["腕[うで]","팔"],["やっと","겨우"],["形[かたち]","모양"],["せっかく","모처럼"],["一生懸命[いっしょうけんめい]","열심히"],["がっかりする","실망하다"],["ところが","그런데"],["〜なんて","~같은 것"],["うれしい","기쁘다"]],"qs":[{"c":["g:45"],"q":"この 人[ひと]は なぜ ケーキを 作[つく]りましたか。","o":["料理[りょうり]が 得意[とくい]だから","妻[つま]に 頼[たの]まれたから","ケーキを 買[か]う 店[みせ]が なかったから","妻[つま]を びっくりさせたかったから"],"ex":"「妻[つま]を驚​かせたくて」. 驚​かせる → びっくりさせる로 바꿔 말했어요. 요리는 오히려 잘하지 못해요(得意[とくい]ではありません).","a":3},{"c":["g:63"],"q":"「せっかく 一生懸命[いっしょうけんめい] 作[つく]ったのに」と ありますが、この 人[ひと]は どんな 気持[きも]ちでしたか。","o":["時間[じかん]が かかって、疲[つか]れたので 早[はや]く 休[やす]みたかった。","頑張[がんば]ったのに 思[おも]ったように できなくて、残念[ざんねん]だった。","妻[つま]が 喜[よろこ]んで くれて、うれしかった。","材料[ざいりょう]が 高[たか]くて、もったいないと 思[おも]った。"],"ex":"〜のに(Day 63)는 기대와 다른 결과에 대한 아쉬움. 모양이 사진보다 낮고 나빠서 실망(がっかり)했어요.","a":1},{"c":["g:63"],"q":"妻[つま]は ケーキに ついて どう 言[い]いましたか。","o":["来年[らいねん]は 店[みせ]で 買[か]って ほしい。","形[かたち]が 悪[わる]いので、写真[しゃしん]を 撮[と]りたくない。","自分[じぶん]の ために 作[つく]って くれた ことが うれしい。","甘[あま]すぎて 食[た]べられない。"],"ex":"「あなたが私[わたし]のために作[つく]ってくれたのがうれしい」. 너무 달았던 건 사실이지만 둘이서 다 먹었어요.","a":2}]},{"k":"情報検索","title":"料理[りょうり]教室[きょうしつ]の 案内[あんない]","text":"【さくら料理[りょうり]スタジオ　十[じゅう]二[に]月[がつ]の 特別[とくべつ]クラス】\nクラス名[めい][めい]　　　　　日時[にちじ]　　　　　　　　　　　　料金[りょうきん]　　定員[ていいん]\nＡ 初[はじ]めての ケーキ　十[じゅう]二[に]月[がつ] 七日[なのか]（土[ど]）十時[じゅうじ]〜十[じゅう]三[さん]時[じ]　　四[よん]千[せん]円[えん]　十人[じゅうにん]\nＢ クリスマスの 料理[りょうり]　十[じゅう]二[に]月[がつ] 十四日[じゅうよっか]（土[ど]）十[じゅう]五[ご]時[じ]〜十八時[じゅうはちじ]　五[ご]千[せん]円[えん]　八[はち]人[にん]\nＣ お正月[しょうがつ]の 料理[りょうり]　　十[じゅう]二[に]月[がつ] 二十一日[にじゅういちにち]（土[ど]）十時[じゅうじ]〜十四時[じゅうよじ]　六[ろく]千[せん]円[えん]　八[はち]人[にん]\nＤ 親子[おやこ]で パン作[つく]り　十[じゅう]二[に]月[がつ] 二十二日[にじゅうににち]（日[にち]）十時[じゅうじ]〜十[じゅう]二[に]時[じ]　親子[おやこ] 一組[ひとくみ] 四[よん]千[せん]五[ご]百[ひゃく]円[えん]　六[ろく]組[くみ]\n◆ 申[もう]し込 {"id":"b66","after":66,"lv":"N4","k":"短文","title":"医者[いしゃ]からの 注意[ちゅうい]","text":"薬[くすり]の 飲[の]み方[かた]\n・この 薬[くすり]は 一日[いちにち] 三回[さんかい]、ご飯[はん]を 食[た]べた 後[あと]に 飲[の]んで ください。\n・眠[ねむ]く なる ことが ありますので、飲[の]んだ 後[あと]は 車[くるま]を 運転[うんてん]しないで ください。\n・お酒[さけ]と 一緒[いっしょ]に 飲[の]むのは よく ありません。\n・熱[ねつ]が 下[さ]がっても、五日[いつか]分[ぶん] 全部[ぜんぶ] 飲[の]んで ください。","ko":"약 먹는 법\n· 이 약은 하루 세 번, 밥을 먹은 후에 드세요.\n· 졸릴 수 있으니 먹은 후에는 차를 운전하지 마세요.\n· 술과 함께 먹는 것은 좋지 않습니다.\n· 열이 내려도 5일분을 전부 드세요.","gloss":[["飲[の]み方[かた]","먹는 법"],["眠[ねむ]い","졸리다"],["運転[うんてん]","운전"],["下[さ]がる","내려가다"],["〜分[ぶん]","~분(양)"]],"qs":[{"c":["g:39"],"q":"この 薬[くすり]に ついて 正[ただ]しい ものは どれですか。","o":["お酒[さけ]と 一緒[いっしょ]に 飲[の]んでも いい。","熱[ねつ]が 下[さ]がったら、やめても いい。","ご飯[はん]の 前[まえ]に 飲[の]む。","熱[ねつ]が なくなっても、薬[くすり]を 飲[の]み続[つづ]ける。"],"ex":"「熱[ねつ]が下[さ]がっても、五日[いつか]分[わ]全部[ぜんぶ]飲[の]んでください」. 〜ても(Day 39)는 \"~해도\". 식후에 먹고, 술과 함께는 안 돼요.","a":3}],"more":[{"k":"中文","title":"働[はたら]きすぎ","text":"日本[にほん]では、昔[むかし]から「働[はたら]きすぎ」が 問題[もんだい]に なって きました。夜[よる] 遅[おそ]くまで 会社[かいしゃ]に 残[のこ]って 仕事[しごと]を する 人[ひと]や、休[やす]みの 日[ひ]にも メールを 確認[かくにん]する 人[ひと]が 多[おお]いと 言[い]われて います。\n最近[さいきん]は、こうした 働[はたら]き方[ほう]を 変[か]えようと する 会社[かいしゃ]が 増[ふ]えて います。たとえば、ある 会社[かいしゃ]では 夜[よる] 七時[しちじ]に なると、事務所[じむしょ]の 電気[でんき]が 自動[じどう]で 消[き]えるように なりました。また、一週間[いっしゅうかん]に 一日[いちにち] 「残業[ざんぎょう]を しない 日[ひ]」を 決[き]めて いる 会社[かいしゃ]も あります。\nしかし、問題[もんだい]も あります。会社[かいしゃ]に いる 時間[じかん]が 短[みじか]く なっても、仕事[しごと]の 量[りょう]が 変[か]わらなければ、家[いえ]に 仕事[しごと]を 持[も]って 帰[かえ]る 人[ひと]が 出[で]て きます。これでは、本当[ほんとう]に 働[はたら]く 時間[じかん]が 減[へ]ったとは 言[い]えません。\n大切[たいせつ]なのは、時間[じかん]を 短[みじか]く する ことだけでは なく、むだな 会議[かいぎ]や 書類[しょるい]を 減[へ]らして、仕事[しごと]の 量[りょう]そのものを 少[すく]なく する ことでしょう。そう すれば、社員[しゃいん]も 早[はや]く 帰[かえ]りやすく なるはずです。","ko":"일본에서는 예전부터 \"과로\"가 문제가 되어 왔습니다. 밤늦게까지 회사에 남아 일하는 사람이나 쉬는 날에도 메일을 확인하는 사람이 많다고 합니다.\n최근에는 이런 근무 방식을 바꾸려는 회사가 늘고 있습니다. 예를 들어 어떤 회사에서는 밤 7시가 되면 사무실 전등이 자동으로 꺼지게 되었습니다. 또 일주일에 하루 \"야근하지 않는 날\"을 정한 회사도 있습니다.\n하지만 문제도 있습니다. 회사에 있는 시간이 짧아져도 일의 양이 바뀌지 않으면 집에 일을 가져가는 사람이 생깁니다. 이래서는 정말로 일하는 시간이 줄었다고 할 수 없습니다.\n중요한 것은 시간을 줄이는 것만이 아니라 쓸데없는 회의나 서류를 줄여서 일의 양 자체를 적게 하는 것이겠지요. 그렇게 하면 사원도 일찍 퇴근하기 쉬워질 것입니다.","gloss":[["残[のこ]る","남다"],["確認[かくにん]","확인"],["こうした","이러한"],["働[はたら]き方[かた]","일하는 방식"],["自動[じどう]","자동"],["残業[ざんぎょう]","야근"],["しかし","그러나"],["量[りょう]","양"],["むだ","쓸데없음"],["書類[しょるい]","서류"],["そのもの","그 자체"]],"qs":[{"c":["g:66"],"q":"夜[よる] 七時[しちじ]に 電気[でんき]が 消[き]えるように したのは、何[なん]の ためですか。","o":["休[やす]みの 日[ひ]に メールを 見[み]ないように","会議[かいぎ]の 時間[じかん]を 決[き]めるため","電気代[でんきだい]を 安[やす]く するため","社員[しゃいん]が 遅[おそ]くまで 会社[かいしゃ]に 残[のこ]らないように"],"ex":"과로를 줄이려는(働[はたら]き方[ほう]を変[か]えようとする) 예로 나왔어요. 〜ようになる(Day 55).","a":3},{"c":["g:66"],"q":"筆者[ひっしゃ]は どんな 問題[もんだい]が あると 言[い]って いますか。","o":["残業[ざんぎょう]を しない 日[ひ]が ない こと","仕事[しごと]を 家[いえ]で する 人[ひと]が 出[で]て くる こと","会社[かいしゃ]の 電気[でんき]が 消[き]えない こと","社員[しゃいん]が 会議[かいぎ]に 出[で]ない こと"],"ex":"「家[いえ]に仕事[しごと]を持[も]って帰[かえ]る人[ひと]が出[で]てきます」. 회사에 있는 시간만 줄면 집에서 일하게 된다는 문제예요.","a":1},{"c":["g:66"],"q":"筆者[ひっしゃ]の 意見[いけん]に 合[あ]う ものは どれですか。","o":["仕事[しごと]の 量[りょう]を 減[へ]らす ことが 必要[ひつよう]だ。","会議[かいぎ]は 夜[よる]に した ほうが いい。","会社[かいしゃ]に いる 時間[じかん]を もっと 短[みじか]く するべきだ。","残業[ざんぎょう]を する 人[ひと]は 働[はたら]きすぎだ。"],"ex":"마지막 단락 「仕事[しごと]の量[りょう]そのものを少[すく]なくすることでしょう」가 필자의 결론이에요. 〜すぎる(Day 66).","a":0}]},{"k":"情報検索","title":"市民病院[しみんびょういん]の 案内[あんない]","text":"【みどり市民病院[しみんびょういん]　外来[がいらい]の ご案内[あんない]】\n受付[うけつけ]時間[じかん]：月[げつ]〜金[きん]　午前[ごぜん] 八時[はちじ]半[はん]〜十一時[じゅういちじ]半[はん] / 午後[ごご] 一時[いちじ]〜四時[よじ]\n　　　　　土[ど]　　　午前[ごぜん] 八時[はちじ]半[はん]〜十一時[じゅういちじ]半[はん]（午後[ごご]は 休[やす]み）\n　　　　　日[にち]・祝日[しゅくじつ]は 休[やす]み（急[きゅう]な 病気[びょうき]の 方[ほう]は 救急外来[きゅうきゅうがいらい]へ）\n診療科[しんりょうか]と 曜日[ようび]\n　内科[ないか]　　　　毎日[まいにち]（月[げつ]〜土[ど]）\n　外科[げか]　　　　月[げつ]・水[すい]・金[きん]\n　小児科[しょうにか]　　　月[げつ]〜金[きん]（土曜日[どようび]は 第一[だいいち]・第三[だいさん]のみ）\n　皮膚科[ひふか]　　　火[か]・木[もく]\n◆ 初[はじ]めての 方[ほう]は 保険証[ほけんしょう]を 持[も]って、一階[いっかい]の 総合受付[そうごううけつけ]へ 来[き]て ください。\n◆ 予約[よやく]が ある 方[ほう]は、予約[よやく]時間[じかん]の 十五分[じゅうごふん]前[まえ]までに 二階[にかい]の 受付[うけつけ]へ。\n◆ 紹介状[しょうかいじょう]が ない 方[ほう]は、初[はじ]めての 時[とき]に 二[に]千[せん]円[えん] かかります。","ko":"[미도리 시민병원 외래 안내]\n접수 시간: 월~금 오전 8시 반~11시 반 / 오후 1시~4시, 토 오전 8시 반~11시 반(오후 휴진), 일·공휴일 휴진(급한 환자는 응급 외래로)\n진료과와 요일: 내과 매일(월~토) / 외과 월·수·금 / 소아과 월~금(토요일은 첫째·셋째만) / 피부과 화·목\n◆ 처음인 분은 보험증을 가지고 1층 종합 접수처로 오세요. {"id":"b70","after":70,"lv":"N4","k":"短文","title":"先生[せんせい]への メール","text":"山田[やまだ]先生[せんせい]\n来週[らいしゅう]の 発表[はっぴょう]の ことで ご相談[そうだん]が あります。\n発表[はっぴょう]の 準備[じゅんび]を して いる 間[あいだ]に、もう 少[すこ]し 調[しら]べたい ことが 出[で]て きました。発表[はっぴょう]の 日[ひ]を 一週間[いっしゅうかん] 遅[おそ]く して いただく ことは できますでしょうか。\nもし 難[むずか]しければ、予定[よてい]どおり 発表[はっぴょう]します。お返事[へんじ]を お待[ま]ちして います。\nリー","ko":"야마다 선생님\n다음 주 발표에 관해 상담드릴 것이 있습니다.\n발표 준비를 하는 동안 조금 더 조사하고 싶은 것이 생겼습니다. 발표일을 일주일 늦춰 주실 수 있을까요?\n만약 어려우시면 예정대로 발표하겠습니다. 답장을 기다리겠습니다.\n리","gloss":[["発表[はっぴょう]","발표"],["相談[そうだん]","상담"],["〜て いただく","~해 받다(겸양)"],["予定[よてい]どおり","예정대로"],["返事[へんじ]","답장"]],"qs":[{"c":["g:70"],"q":"リーさんが いちばん 伝[つた]えたい ことは 何[なん]ですか。","o":["発表[はっぴょう]を やめたい。","先生[せんせい]に 調[しら]べて ほしい ことが ある。","発表[はっぴょう]を 一週間[いっしゅうかん] 後[ご]に したい。","発表[はっぴょう]の 準備[じゅんび]が 終[お]わった。"],"ex":"「発表[はっぴょう]の日[ひ]を一週間[いっしゅうかん]遅[おそ]くしていただくことはできますでしょうか」가 핵심 부탁이에요. 〜間[あいだ]に(Day 70)는 \"~하는 동안에\".","a":2}],"more":[{"k":"中文","title":"若[わか]い うちに","text":"祖父[そふ]は よく「若[わか]い うちに いろいろな ことを やって おきなさい」と 言[い]って いました。子[こ]どもの ころ、私[わたし]には その 意味[いみ]が よく 分[わ]かりませんでした。\n祖父[そふ]は 二[に]十代[だい]の 時[とき]、仕事[しごと]を 辞[や]めて、一年[いちねん]間[かん] 外国[がいこく]を 旅行[りょこう]したそうです。お金[かね]が なくて、レストランで 皿[さら]を 洗[あら]ったり、農家[のうか]で 果物[くだもの]を とる 仕事[しごと]を したり しながら、十[じゅう]か国[こく] 以上[いじょう]を 回[まわ]ったと 聞[き]きました。その 間[あいだ]に 覚[おぼ]えた 英語[えいご]を 使[つか]って、帰国後[きこくご]は 貿易[ぼうえき]の 会社[かいしゃ]で 長[なが]く 働[はたら]きました。\n私[わたし]は 今[いま] 大学[だいがく]三[さん]年[ねん]生[せい]です。来年[らいねん]から 就職活動[しゅうしょくかつどう]が 始[はじ]まります。周[まわ]りの 友達[ともだち]は みんな アルバイトや 勉強[べんきょう]で 忙[いそが]しそうに して います。私[わたし]も 早[はや]く 就職[しゅうしょく]の 準備[じゅんび]を しなければ ならないと 思[おも]う 一方[いっぽう]で、祖父[そふ]のように 世界[せかい]を 見[み]て みたい 気持[きも]ちも あります。\n先月[せんげつ]、思[おも]い切[き]って 両親[りょうしん]に 相談[そうだん]して みました。父[ちち]は 反対[はんたい]しましたが、母[はは]は「おじいちゃんも 喜[よろこ]ぶと 思[おも]うよ」と 言[い]って くれました。もう 少[すこ]し 考[かんが]えて、夏休[なつやす]みの 間[あいだ]に 短[みじか]い 旅行[りょこう]から 始[はじ]めて みる つもりです。","ko":"할아버지는 자주 \"젊을 때 여러 가지를 해 두거라\"라고 말씀하셨습니다. 어릴 때 저는 그 의미를 잘 몰랐습니다.\n할아버지는 20대 때 일을 그만두고 1년 동안 외국을 여행하셨다고 합니다. 돈이 없어서 레스토랑에서 접시를 닦기도 하고 농가에서 과일을 따는 일을 하기도 하면서 10개국 이상을 돌았다고 들었습니다. 그동안 익힌 영어를 써서 귀국 후에는 무역 회사에서 오래 일하셨습니다.\n저는 지금 대학교 3학년입니다. 내년부터 취업 활동이 시작됩니다. 주변 친구들은 모두 아르바이트나 공부로 바빠 보입니다. 저도 빨리 취업 준비를 해야 한다고 생각하는 한편 할아버지처럼 세계를 보고 싶은 마음도 있습니다.\n지난달 큰마음 먹고 부모님께 상담해 보았습니다. 아버지는 반대했지만 어머니는 \"할아버지도 기뻐하실 거야\"라고 말해 주었습니다. 조금 더 생각해서 여름방학 동안 짧은 여행부터 시작해 볼 생각입니다.","gloss":[["〜うちに","~할 때에, ~동안에"],["〜なさい","~하거라"],["辞[や]める","그만두다"],["農家[のうか]","농가"],["〜か国[こく]","~개국"],["回[まわ]る","돌다"],["帰国[きこく]","귀국"],["貿易[ぼうえき]","무역"],["就職活動[しゅうしょくかつどう]","취업 활동"],["周[まわ]り","주변"],["一方[いっぽう]で","한편"],["思[おも]い切[き]って","큰마음 먹고"],["反対[はんたい]","반대"]],"qs":[{"c":["g:70"],"q":"祖父[そふ]は 外国[がいこく]で どのように 旅行[りょこう]を 続[つづ]けましたか。","o":["英語[えいご]の 先生[せんせい]を しながら 旅行[りょこう]した。","会社[かいしゃ]の お金[かね]で 旅行[りょこう]した。","働[はたら]いて お金[かね]を 作[つく]りながら 旅行[りょこう]した。","十[じゅう]か国[こく]で 一年[いちねん]ずつ 住[す]んだ。"],"ex":"돈이 없어서 접시 닦기·과일 따기 일을 하면서(〜ながら, Day 71) 10개국 이상을 돌았어요.","a":2},{"c":["g:70"],"q":"「私[わたし]」は 今[いま]、どんな 気持[きも]ちですか。","o":["就職[しゅうしょく]の 準備[じゅんび]は まだ しなくて いい。","祖父[そふ]の 話[はなし]は 意味[いみ]が ないと 思[おも]う。","就職[しゅうしょく]の 準備[じゅんび]も 大切[たいせつ]だが、旅行[りょこう]も して みたい。","友達[ともだち]と 一緒[いっしょ]に 外国[がいこく]へ 行[い]きたい。"],"ex":"「就職[しゅうしょく]の準備[じゅんび]をしなければならないと思[おも]う一方[いっぽう]で、祖父[そふ]のように世界[せかい]を見[み]てみたい気持[きも]ちもあります」. 두 마음 사이에서 고민 중.","a":2},{"c":["g:70"],"q":"「私[わたし]」は これから どう する つもりですか。","o":["夏休[なつやす]みに まず 短[みじか]い 旅行[りょこう]を して みる。","父[ちち]が 賛成[さんせい]するまで 待[ま]つ。","大学[だいがく]を 辞[や]めて 一年[いちねん]間[かん] 旅行[りょこう]する。","すぐ 就職活動[しゅうしょくかつどう]を 始[はじ]める。"],"ex":"마지막 문장 「夏休[なつやす]みの間[あいだ]に短[みじか]い旅行[りょこう]から始[はじ]めてみるつもりです」. 〜間[あいだ]に(Day 70).","a":0}]},{"k":"情報検索","title":"図書館[としょかん]の 利用[りよう]案内[あんない]","text":"【さくら市立図書館[しりつとしょかん]　利用[りよう]の きまり】\n◆ 開館時間[かいかんじかん]\n　火[か]〜金[きん]　九時[くじ]〜二[に]十[じゅう]時[じ] / 土[ど]・日[にち]・祝日[しゅくじつ]　九時[くじ]〜十[じゅう]七[しち]時[じ]\n　月曜日[げつようび] 休館[きゅうかん]（月曜日[げつようび]が 祝日[しゅくじつ]の 場合[ばあい]は、次[つぎ]の 平日[へいじつ]が 休館[きゅうかん]）\n◆ 借[か]りられる 数[かず]と 期間[きかん]\n　本[ほん]・雑誌[ざっし]　一人[ひとり] 十[じゅう]冊[さつ]まで　二週間[にしゅうかん]\n　ＣＤ・ＤＶＤ　一人[ひとり] 三[さん]点[てん]まで　一週間[いっしゅうかん]\n　※ 新[あたら]しい 雑誌[ざっし]（その 月[つき]の もの）は 借[か]りられません。\n◆ 返[かえ]す とき\n　カウンターに 返[かえ]して ください。閉館[へいかん]の 間[あいだ]は、入口[いりぐち]の 横[よこ]の 返却[へんきゃく]ポストに 入[い]れて ください。ただし、ＣＤ・ＤＶＤは 壊[こわ]れやすいので、ポストに 入[い]れないで ください。\n◆ 期間[きかん]の 延長[えんちょう]\n　予約[よやく]が 入[はい]って いなければ、一回[いっかい]だけ 二週間[にしゅうかん] 延長[えんちょう]できます。ホームページか カウンターで 手続[てつづ]きして ください。","ko":"[사쿠라 시립도서관 이용 규칙]\n◆ 개관 시간: 화~금 9~20시 / 토·일·공휴일 9~17시, 월요일 휴관(월요일이 공휴일이면 다음 평일 휴관)\n◆ 대출 수와 기간: 책·잡지 1인 10권까지 2주 / CD·DVD 1인 3점까지 1주 ※ 최신 잡지(그달 것)는 빌릴 수 없습니다.\n◆ 반납: 카운터에 반납해 주세요. 휴관 중에는 입구 옆 반납함에 넣어 주세요. 단, CD·DVD는 망가지기 쉬우니 반납함에 넣지 마세요.\n◆ 기간 연장: 예약이 없으면 한 번만 2주 연장할 수 있습니다. 홈페이지나 카운터에서 절차를 밟아 주세요.","gloss":[["市立[しりつ]","시립"],["きまり","규칙"],["開館[かいかん]","개관"],["休館[きゅうかん]","휴관"],["期間[きかん]","기간"],["〜点[てん]","~점(개수)"],["カウンター","카운터"],["閉館[へいかん]","휴관(폐관)"],["返却[へんきゃく]ポスト","반납함"],["ただし","단"],["延長[えんちょう]","연장"],["手続[てつづ]き","절차"]],"qs":[{"c":["g:70"],"q":"月曜日[げつようび]の 夜[よる]、借[か]りた ＤＶＤを 返[かえ]したいです。どう しますか。","o":["返却[へんきゃく]ポストに 入[い]れる。","次[つぎ]の 日[ひ]に カウンターに 返[かえ]す。","ホームページで 手続[てつづ]きする。","月曜日[げつようび]の 夜[よる] カウンターに 返[かえ]す。"],"ex":"월요일은 휴관. DVD는 반납함에 넣지 말라고 했으니 다음 날 카운터로.","a":1},{"c":["g:70"],"q":"借[か]りた 本[ほん]を もっと 長[なが]く 読[よ]みたい とき、延長[えんちょう]できないのは どんな 場合[ばあい]ですか。","o":["十[じゅう]冊[さつ] 借[か]りて いる 場合[ばあい]","土曜日[どようび]に 借[か]りた 場合[ばあい]","借[か]りてから 一週間[いっしゅうかん] たった 場合[ばあい]","ほかの 人[ひと]が その 本[ほん]を 予約[よやく]して いる 場合[ばあい]"],"ex":"「予約[よやく]が入[はい]っていなければ、一回[いっかい]だけ…延長[えんちょう]できます」 → 다른 사람이 예약했으면 연장 불가.","a":3}]}]},
{"id":"b73","after":73,"lv":"N4","k":"短文","title":"友達[ともだち]からの 伝言[でんごん]","text":"ハンさん\nさっき 田中[たなか]さんから 電話[でんわ]が あったよ。明日[あした]の 映画[えいが]の 約束[やくそく]、田中[たなか]さん、急[きゅう]に 仕事[しごと]が 入[はい]って 行[い]けなく なったって。\n来週[らいしゅう]の 土曜日[どようび]なら 大丈夫[だいじょうぶ]だって 言[い]って いたから、ハンさんから 連絡[れんらく]して あげて。\nユミ","ko":"한 씨\n아까 다나카 씨한테 전화가 왔었어. 내일 영화 약속, 다나카 씨가 갑자기 일이 생겨서 못 가게 됐대.\n다음 주 토요일이라면 괜찮다고 했으니까 한 씨가 연락해 줘.\n유미","gloss":[["伝言[でんごん]","전언, 메시지"],["さっき","아까"],["急[きゅう]に","갑자기"],["〜って","~래(전문)"]],"qs":[{"c":["g:73"],"q":"ハンさんは この 後[あと] 何[なに]を しますか。","o":["田中[たなか]さんに 連絡[れんらく]する。","ユミさんに 電話[でんわ]する。","明日[あした] 一人[ひとり]で 映画[えいが]に 行[い]く。","来週[らいしゅう]の 土曜日[どようび]に 仕事[しごと]を する。"],"ex":"「ハンさんから連絡[れんらく]してあげて」. 〜って(Day 73)는 남의 말을 전할 때 쓰는 구어체예요.","a":0}],"more":[{"k":"中文","title":"「いただきます」と いう 言葉[ことば]","text":"日本[にほん]では、食事[しょくじ]の 前[まえ]に「いただきます」、食[た]べ終[お]わった 後[あと]に「ごちそうさま」と 言[い]います。外国人[がいこくじん]の 友達[ともだち]から「これは だれに 言[い]って いるの」と 聞[き]かれた ことが あります。\n「いただきます」の「いただく」は「もらう」の 謙譲語[けんじょうご]です。食事[しょくじ]を 作[つく]って くれた 人[ひと]や、野菜[やさい]や 魚[さかな]を 育[そだ]てたり とったり した 人[ひと]への 感謝[かんしゃ]の 気持[きも]ちが 入[はい]って いると 言[い]われて います。また、肉[にく]や 魚[さかな]、野菜[やさい]の 命[いのち]を いただく、という 意味[いみ]も あるそうです。\n最近[さいきん]、ある 学校[がっこう]で「給食[きゅうしょく]の 時[とき]に『いただきます』と 言[い]わせるのは おかしい。お金[かね]を 払[はら]って いるのだから」と いう 意見[いけん]が 出[で]た という ニュースを 見[み]ました。たしかに、お金[かね]を 払[はら]って いるのは 本当[ほんとう]です。でも、お金[かね]を 払[はら]えば 感謝[かんしゃ]しなくても いい、という わけでは ないと 私[わたし]は 思[おも]います。\n言葉[ことば]は 短[みじか]くても、その 中[なか]に たくさんの 人[ひと]への 気持[きも]ちが 入[はい]って いる。「いただきます」は、そういう 言葉[ことば]なのでは ないでしょうか。","ko":"일본에서는 식사 전에 \"잘 먹겠습니다(いただきます)\", 다 먹은 후에 \"잘 먹었습니다(ごちそうさま)\"라고 말합니다. 외국인 친구에게 \"이건 누구한테 하는 말이야?\"라는 질문을 받은 적이 있습니다.\n\"いただきます\"의 \"いただく\"는 \"もらう(받다)\"의 겸양어입니다. 식사를 만들어 준 사람이나 채소나 생선을 기르거나 잡은 사람에 대한 감사의 마음이 들어 있다고 합니다. 또 고기나 생선, 채소의 생명을 받는다는 의미도 있다고 합니다.\n최근 어느 학교에서 \"급식 때 'いただきます'라고 말하게 하는 것은 이상하다. 돈을 내고 있으니까.\"라는 의견이 나왔다는 뉴스를 보았습니다. 확실히 돈을 내고 있는 것은 사실입니다. 하지만 돈을 내면 감사하지 않아도 된다는 것은 아니라고 저는 생각합니다.\n말은 짧아도 그 안에 많은 사람에 대한 마음이 들어 있다. \"いただきます\"는 그런 말이 아닐까요.","gloss":[["謙譲語[けんじょうご]","겸양어"],["感謝[かんしゃ]","감사"],["命[いのち]","생명"],["給食[きゅうしょく]","급식"],["おかしい","이상하다"],["意見[いけん]","의견"],["たしかに","확실히"],["〜わけでは ない","~인 것은 아니다"]],"qs":[{"c":["g:73"],"q":"「いただきます」には どんな 気持[きも]ちが 入[はい]って いると 書[か]いて ありますか。","o":["食事[しょくじ]に かかわった 人[ひと]や 食[た]べ物[もの]への ありがとうの 気持[きも]ち","お金[かね]を 払[はら]った 人[ひと]への 気持[きも]ち","料理[りょうり]が おいしいと いう 気持[きも]ち","早[はや]く 食[た]べたいと いう 気持[きも]ち"],"ex":"만든 사람·기른 사람에 대한 감사(感謝[かんしゃ]) + 식재료의 생명을 받는다는 의미. 感謝[かんしゃ] = ありがとうの気持[きも]ち.","a":0},{"c":["g:73"],"q":"ニュースで 紹介[しょうかい]された 意見[いけん]は どんな ものですか。","o":["もっと 大[おお]きい 声[こえ]で 言[い]うべきだ。","お金[かね]を 払[はら]って いるから、言[い]わなくても いい。","給食[きゅうしょく]は おいしくないから、言[い]いたくない。","外国人[がいこくじん]も 言[い]うべきだ。"],"ex":"「お金[かね]を払[はら]っているのだから」 언급하지 않아도 된다는 의견. 〜という(Day 73).","a":1},{"c":["g:73"],"q":"筆者[ひっしゃ]は その 意見[いけん]に ついて どう 考[かんが]えて いますか。","o":["意見[いけん]を 言[い]った 人[ひと]は 正[ただ]しい。","お金[かね]を 払[はら]って いるなら、言[い]う 必要[ひつよう]は ない。","お金[かね]を 払[はら]って いても、感謝[かんしゃ]の 気持[きも]ちは 大切[たいせつ]だ。","学校[がっこう]で 言[い]わせるのは よく ない。"],"ex":"「お金[かね]を払[はら]えば感謝[かんしゃ]しなくてもいい、というわけではない」 → 돈을 내도 감사는 중요하다. 〜わけではない(Day 95 미리보기)는 부분 부정.","a":2}]},{"k":"情報検索","title":"引[ひ]っ越[こ]しの 手続[てつづ]き","text":"【みどり市[し]に 引[ひ]っ越[こ]して きた 方[かた]へ　必要[ひつよう]な 手続[てつづ]き】\n手続[てつづ]き　　　　　　　　いつまで　　　　　　　　場所[ばしょ]　　　　　　　　持[も]って 行[い]く 物[もの]\n① 転入届[てんにゅうとどけ]　　　　　　　引[ひ]っ越[こ]してから 十四日[じゅうよっか]以内[いない]　市役所[しやくしょ] 一階[いっかい] 市民課[しみんか]　前[まえ]の 市[し]の 転出証明書[てんしゅつしょうめいしょ]・本人確認[ほんにんかくにん]書類[しょるい]\n② 国民健康保険[こくみんけんこうほけん]　　　　①と 同[おな]じ 日[ひ]に　　　　　　市役所[しやくしょ] 一階[いっかい] 保険課[ほけんか]　本人確認[ほんにんかくにん]書類[しょるい]\n③ 子[こ]どもの 学校[がっこう]　　　　①の 後[あと]、なるべく 早[はや]く　市役所[しやくしょ] 三階[さんがい] 教育課[きょういくか]　①で もらう 書類[しょるい]\n④ ゴミの 出[だ]し方[かた]の 説明[せつめい]　いつでも　　　　　　　　市役所[しやくしょ] 二階[にかい] 環境課[かんきょうか] / ホームページ　なし\n◆ 市役所[しやくしょ]の 時間[じかん]：平日[へいじつ] 八時[はちじ]半[はん]〜十[じゅう]七[しち]時[じ]十五分[じゅうごふん]（毎月[まいつき] 第二[だいに] 土曜日[どようび]は 九時[くじ]〜十[じゅう]二[に]時[じ]に ①②だけ できます）\n◆ 会社[かいしゃ]の 健康保険[けんこうほけん]に 入[はい]って いる 方[ほう]は、② は 要[い]りません。","ko":"[미도리시로 이사 오신 분께 필요한 절차]\n① 전입 신고: 이사 후 14일 이내, 시청 1층 시민과, 전 거주 시의 전출 증명서·본인 확인 서류\n② 국민건강보험: ①과 같은 날, 시청 1층 보험과, 본인 확인 서류\n③ 아이의 학교: ① 후 되도록 빨리, 시청 3층 교육과, ①에서 받는 서류\n④ 쓰레기 버리는 법 설명: 언제든지, 시청 2층 환경과/홈페이지, 없음\n◆ 시청 시간: 평일 8시 반~17시 15분(매달 둘 {"id":"b77","after":77,"lv":"N4","k":"短文","title":"工事[こうじ]現場[げんば]の 看板[かんばん]","text":"危[あぶ]ない！　入[はい]るな\nこの 先[さき]は 工事中[こうじちゅう]です。関係者[かんけいしゃ] 以外[いがい]は 入[はい]らないで ください。\n歩[ある]いて いる 方[ほう]は、右[みぎ]の 道[みち]を 通[とお]って ください。\n工事[こうじ]期間[きかん]：十[じゅう]月[がつ] 一日[ついたち]〜十一月[じゅういちがつ] 三十日[さんじゅうにち]（土[ど]・日[ひ]は 休[やす]み）\nみどり建設[けんせつ]","ko":"위험! 들어오지 마시오\n이 앞은 공사 중입니다. 관계자 외에는 들어오지 마세요.\n걸어가시는 분은 오른쪽 길로 지나가 주세요.\n공사 기간: 10월 1일~11월 30일(토·일 휴무)\n미도리 건설","gloss":[["工事[こうじ]現場[げんば]","공사 현장"],["看板[かんばん]","간판"],["〜な","~하지 마(금지)"],["関係者[かんけいしゃ]","관계자"],["以外[いがい]","이외"],["建設[けんせつ]","건설"]],"qs":[{"c":["g:77"],"q":"この 看板[かんばん]は 何[なに]を 伝[つた]えて いますか。","o":["土曜日[どようび]と 日曜日[にちようび]は 工事[こうじ]を して いる。","十一月[じゅういちがつ]まで この 道[みち]は 通[とお]れる。","工事[こうじ]を して いる 所[ところ]に 入[はい]らないで、別[べつ]の 道[みち]を 通[とお]って ほしい。","関係者[かんけいしゃ]は 右[みぎ]の 道[みち]を 通[とお]る。"],"ex":"「入[はい]るな」 명령형 금지(Day 77). 걷는 사람은 오른쪽 길로. 토·일은 공사 쉬어요.","a":2}],"more":[{"k":"中文","title":"父[ちち]の 口[くち]ぐせ","text":"私[わたし]の 父[ちち]の 口[くち]ぐせは「人[ひと]に 迷惑[めいわく]を かけるな」です。子[こ]どもの ころから 何度[なんど] 言[い]われたか 分[わ]かりません。\n電車[でんしゃ]の 中[なか]で 大[おお]きい 声[こえ]で 話[はな]すな、道[みち]に ゴミを 捨[す]てるな、約束[やくそく]の 時間[じかん]に 遅[おく]れるな。父[ちち]は 厳[きび]しかったので、私[わたし]は 父[ちち]が 少[すこ]し 苦手[にがて]でした。\nところが、大学生[だいがくせい]に なって 一人[ひとり]で 暮[く]らし始[はじ]めた 時[とき]、困[こま]った ことが ありました。熱[ねつ]を 出[だ]して 三日[みっか]間[あいだ] 起[お]きられなく なったのです。だれかに 助[たす]けて もらいたかったのですが、「迷惑[めいわく]を かけては いけない」と 思[おも]って、友達[ともだち]にも 連絡[れんらく]できませんでした。\n四日[よっか]目[め]に やっと 父[ちち]に 電話[でんわ]を すると、父[ちち]は すぐ 車[くるま]で 来[き]て くれました。そして、こう 言[い]いました。「迷惑[めいわく]を かけるなとは 言[い]ったが、困[こま]った ときに 助[たす]けを 求[もと]めるなとは 言[い]って いない。そういう 時[とき]は 早[はや]く 言[い]いなさい」。\nその 時[とき] 初[はじ]めて、父[ちち]の 言葉[ことば]の 本当[ほんとう]の 意味[いみ]が 分[わ]かった 気[き]が しました。人[ひと]に 迷惑[めいわく]を かけない ことと、一人[ひとり]で 何[なん]でも がまんする ことは 違[ちが]うのです。","ko":"우리 아버지의 입버릇은 \"남에게 폐를 끼치지 마라\"입니다. 어릴 때부터 몇 번이나 들었는지 모릅니다.\n전철 안에서 큰 소리로 말하지 마라, 길에 쓰레기를 버리지 마라, 약속 시간에 늦지 마라. 아버지가 엄해서 저는 아버지를 조금 어려워했습니다.\n그런데 대학생이 되어 혼자 살기 시작했을 때 곤란한 일이 있었습니다. 열이 나서 사흘 동안 일어나지 못하게 된 것입니다. 누군가에게 도움을 받고 싶었지만 \"폐를 끼치면 안 된다\"고 생각해서 친구에게도 연락하지 못했습니다.\n나흘째에 겨우 아버지께 전화하자 아버지는 바로 차로 와 주셨습니다. 그리고 이렇게 말했습니다. \"폐를 끼 {"id":"b84","after":84,"lv":"N4","k":"短文","title":"会議[かいぎ]の 準備[じゅんび]","text":"山田[やまだ]さん\n明日[あした]の 会議[かいぎ]の 準備[じゅんび]は もう できて いますか。会議室[かいぎしつ]の 椅子[いす]は 並[なら]べて あります。資料[しりょう]も 十[じゅう]五[ご]部[ぶ] 印刷[いんさつ]して、机[つくえ]の 上[うえ]に 置[お]いて あります。\nまだ プロジェクターが 用意[ようい]して ないので、明日[あした]の 朝[あさ]、使[つか]えるか どうか 確認[かくにん]して おいて ください。\n中村[なかむら]","ko":"야마다 씨\n내일 회의 준비는 다 됐나요? 회의실 의자는 늘어놓아져 있습니다. 자료도 15부 인쇄해서 책상 위에 놓아두었습니다.\n아직 프로젝터가 준비되어 있지 않으니 내일 아침에 쓸 수 있는지 확인해 두세요.\n나카무라","gloss":[["〜部[ぶ]","~부"],["印刷[いんさつ]","인쇄"],["プロジェクター","프로젝터"],["確認[かくにん]","확인"]],"qs":[{"c":["g:84"],"q":"山田[やまだ]さんが 明日[あした] しなければ ならない ことは 何[なん]ですか。","o":["椅子[いす]を 並[なら]べる。","プロジェクターが 使[つか]えるか 調[しら]べる。","資料[しりょう]を 印刷[いんさつ]する。","会議室[かいぎしつ]を 予約[よやく]する。"],"ex":"의자·자료는 〜てある(Day 59·84)로 이미 되어 있는 상태. 남은 일은 프로젝터 확인이에요.","a":1}],"more":[{"k":"中文","title":"自動[じどう]ドアと 手[て]で 開[あ]ける ドア","text":"日本[にほん]に 来[き]た ばかりの ころ、私[わたし]は タクシーの ドアに 驚[おどろ]きました。乗[の]る 時[とき]も 降[お]りる 時[とき]も、運転手[うんてんしゅ]さんが ボタンで 開[あ]けたり 閉[し]めたり して くれるのです。自分[じぶん]で 開[あ]けようと して、運転手[うんてんしゅ]さんに「お客[きゃく]さん、開[あ]きますから 触[さわ]らないで ください」と 言[い]われた ことも あります。\n一方[いっぽう]で、日本[にほん]の 古[ふる]い 建物[たてもの]には、まだ 手[て]で 開[あ]ける ドアが 多[おお]く 残[のこ]って います。私[わたし]が 住[す]んで いる アパートの ドアも 重[おも]い 鉄[てつ]の ドアで、毎日[まいにち] 鍵[かぎ]を 開[あ]けて、力[ちから]を 入[い]れて 開[あ]けなければ なりません。\nある 日[ひ]、近所[きんじょ]の おばあさんが 買[か]い物袋[ものふくろ]を たくさん 持[も]って、アパートの ドアの 前[まえ]で 困[こま]って いました。私[わたし]は 走[はし]って 行[い]って、ドアを 開[あ]けて あげました。おばあさんは「ありがとう。自動[じどう]ドアなら いいのにね」と 笑[わら]いました。それから、会[あ]うと あいさつを する ように なり、時々[ときどき] 野菜[やさい]を 分[わ]けて くれます。\n自動[じどう]ドアは 便利[べんり]です。でも、手[て]で 開[あ]ける ドアだったから 生[う]まれた 出会[であ]いも ある。今[いま]では 重[おも]い ドアも、少[すこ]しだけ 好[す]きに なりました。","ko":"일본에 막 왔을 무렵 저는 택시 문에 놀랐습니다. 탈 때도 내릴 때도 운전기사님이 버튼으로 열고 닫아 주는 것입니다. 제가 열려고 하다가 기사님께 \"손님, 열리니까 만지지 마세요\"라는 말을 들은 적도 있습니다.\n한편 일본의 오래된 건물에는 아직 손으로 여는 문이 많이 남아 있습니다. 제가 사는 아파트 문도 무거운 철문이라 매일 열쇠를 열고 힘을 줘서 열어야 합니다.\n어느 날 이웃 할머니가 장바구니를 많이 들고 아파트 문 앞에서 곤란해하고 있었습니다. 저는 달려가서 문을 열어 드렸습니다. 할머니는 \"고마워. 자동문이면 좋을 텐데.\"라며 웃었습니다. 그 뒤로 만나면 인사를 하게 되었고, 가끔 채소를 나눠 주십니다.\n자동문은 편리합니다. 하지만 손으로 여는 문이었기에 생긴 만남도 있다. 지금은 무거운 문도 조금은 좋아졌습니다.","gloss":[["〜た ばかり {"id":"b87","after":87,"lv":"N4","k":"短文","title":"ゼミの 連絡[れんらく]","text":"ゼミの みなさん\n来週[らいしゅう]から 卒業論文[そつぎょうろんぶん]の 発表[はっぴょう]を 始[はじ]めます。一人[ひとり] 十五分[じゅうごふん] 話[はな]して、その 後[あと] 十分[じゅっぷん] 質問[しつもん]を 受[う]けて ください。\n発表[はっぴょう]の 順番[じゅんばん]は 掲示板[けいじばん]に はって あります。資料[しりょう]は 発表[はっぴょう]の 前[まえ]の 日[ひ]までに、全員分[ぜんいんぶん]を コピーして おいて ください。\n林[はやし]","ko":"세미나 여러분\n다음 주부터 졸업 논문 발표를 시작합니다. 한 사람당 15분 발표하고 그 후 10분 질문을 받아 주세요.\n발표 순서는 게시판에 붙어 있습니다. 자료는 발표 전날까지 전원분을 복사해 두세요.\n하야시","gloss":[["ゼミ","세미나"],["卒業論文[そつぎょうろんぶん]","졸업 논문"],["発表[はっぴょう]","발표"],["受[う]ける","받다"],["順番[じゅんばん]","순서"],["掲示板[けいじばん]","게시판"],["全員分[ぜんいんぶん]","전원분"]],"qs":[{"c":["g:87"],"q":"発表[はっぴょう]する 学生[がくせい]が 前[まえ]の 日[ひ]までに しなければ ならない ことは 何[なん]ですか。","o":["みんなの 分[ぶん]の 資料[しりょう]を コピーする。","質問[しつもん]を 考[かんが]えて おく。","掲示板[けいじばん]に 資料[しりょう]を はる。","発表[はっぴょう]の 順番[じゅんばん]を 決[き]める。"],"ex":"「資料[しりょう]は…前[まえ]の日[ひ]までに、全員[ぜんいん]分​をコピーしておいてください」. 순서는 이미 게시판에 붙어 있어요(はってあります).","a":0}],"more":[{"k":"中文","title":"日記[にっき]を 続[つづ]ける","text":"私[わたし]は 中学生[ちゅうがくせい]の 時[とき]から 二[に]十[じゅう]年[ねん]間[かん]、毎日[まいにち] 日記[にっき]を 書[か]き続[つづ]けて います。と 言[い]っても、長[なが]い 文章[ぶんしょう]を 書[か]いて いる わけでは ありません。小[ちい]さい 手帳[てちょう]に、その 日[ひ]に あった ことを 三[さん]行[い]だけ 書[か]くのです。\n日記[にっき]を 書[か]き始[はじ]めたのは、中学[ちゅうがく]の 先生[せんせい]の すすめでした。「長[なが]く 書[か]こうと すると 続[つづ]かない。一日[いちにち] 三[さん]行[ぎょう]で いいから、毎日[まいにち] 書[か]いて ごらん」と 言[い]われたのです。最初[さいしょ]は 面倒[めんどう]で、何度[なんど]も やめたく なりました。しかし、三[さん]行[い]なら 五分[ごふん]で 終[お]わります。寝[ね]る 前[まえ]に 歯[は]を 磨[みが]くのと 同[おな]じように、気[き]が つくと 習慣[しゅうかん]に なって いました。\n続[つづ]けて よかったと 思[おも]う ことは 二[ふた]つ あります。一[ひと]つは、自分[じぶん]の 気持[きも]ちを 落[お]ち着[つ]かせる 時間[じかん]が できた ことです。嫌[いや]な ことが あった 日[ひ]でも、三[さん]行[ぎょう]に まとめると、問題[もんだい]が 小[ちい]さく 見[み]えて くるのです。もう 一[ひと]つは、昔[むかし]の 日記[にっき]を 読[よ]み返[かえ]す 楽[たの]しみです。十[じゅう]年[ねん]前[まえ]の 同[おな]じ 日[ひ]に 何[なに]を 考[かんが]えて いたか 読[よ]むと、笑[わら]って しまう ことも あれば、昔[むかし]の 自分[じぶん]に 励[はげ]まされる ことも あります。\n何[なに]かを 長[なが]く 続[つづ]けたい なら、まず 「少[すく]なく、簡単[かんたん]に」 始[はじ]める ことが 大切[たいせつ]なのだと 思[おも]います。","ko":"저는 중학생 때부터 20년간 매일 일기를 계속 쓰고 있습니다. 그렇다고 해도 긴 글을 쓰는 것은 아닙니다. 작은 수첩에 그날 있었던 일을 세 줄만 쓰는 것입니다.\n일기를 쓰기 시작한 것은 중학교 선생님의 권유였습니다. \"길게 쓰려고 하면 오래 못 간다. 하루 세 줄이라도 좋으니 매일 써 보렴.\"이라는 말을 들었습니다. 처음에는 귀찮아서 몇 번이나 그만두고 싶어졌습니다. 하지만 세 줄이라면 5분이면 끝납니다. 자기 전에 이를 닦는 것처럼, 정신을 차려 보니 습관이 되어 있었습니다.\n계속해서 좋았다고 생각하는 점은 두 가지입니다. 하나는 내 마음을 가라앉히는 시간이 생긴 것입니다. 싫은 일이 있었던 날이라도 세 줄로 정리하면 문제가 작게 보이게 됩니다. 또 하나는 옛날 일기를 다시 읽는 즐거움입니다. 10년 전 같은 날에 무엇을 생각했는지 읽으면 웃음이 날 때도 있고, 옛날의 나에게 격려받을 때도 있습니다.\n무언가를 오래 계속하고 싶다면 우선 \"적게, 간단하게\" 시작하는 것이 중요하다고 생각합니다.","gloss":[["〜続[つづ]ける","계속 ~하다"],["と 言[い]っても","그렇다고 해도"],["手帳[てちょう]","수첩"],["〜行[ぎょう]","~줄"],["すすめ","권유"],["〜て ごらん","~해 보렴"],["面倒[めんどう]","귀찮음"],["気[き]が つく","정신 차리다, 깨닫다"],["習慣[しゅうかん]","습관"],["まとめる","정리하다"],["読[よ]み返[かえ]す","다시 읽다"],["励[はげ]ます","격려하다"]],"qs":[{"c":["g:87"],"q":"この 人[ひと]の 日記[にっき]は どんな 日記[にっき]ですか。","o":["毎日[まいにち] 短[みじか]く 書[か]く 日記[にっき]","パソコンで 書[か]く 日記[にっき]","一週間[いっしゅうかん]に 一度[いちど] 長[なが]く 書[か]く 日記[にっき]","先生[せんせい]に 見[み]せる 日記[にっき]"],"ex":"「小[ちい]さい手帳[てちょう]に、その日[ひ]にあったことを三​行[い]だけ書[か]く」. 〜続ける(Day 87).","a":0},{"c":["g:87"],"q":"日記[にっき]を 書[か]く ことで、嫌[いや]な ことが あった 日[ひ]は どう なりますか。","o":["次[つぎ]の 日[ひ]に 問題[もんだい]が なくなる。","問題[もんだい]が それほど 大[おお]きく ないと 思[おも]える。","嫌[いや]な ことを 忘[わす]れる ことが できる。","昔[むかし]の 日記[にっき]を 読[よ]みたく なる。"],"ex":"「三​行​にまとめると、問題[もんだい]が小[ちい]さく見[み]えてくるのです」 → 문제가 그다지 크지 않다고 느껴진다.","a":1},{"c":["g:87"],"q":"筆者[ひっしゃ]が いちばん 言[い]いたい ことは 何[なん]ですか。","o":["歯[は]を 磨[みが]く 習慣[しゅうかん]は 大切[たいせつ]だ。","中学[ちゅうがく]の 先生[せんせい]の 言[い]う ことは 正[ただ]しい。","続[つづ]けたい ことは、まず 簡単[かんたん]な 形[かたち]で 始[はじ]めると いい。","日記[にっき]は 毎日[まいにち] 長[なが]く 書[か]くべきだ。"],"ex":"마지막 문장 「まず『少[すく]なく、簡単[かんたん]に』始[はじ]めることが大切[たいせつ]なのだと思[おも]います」.","a":2}]},{"k":"情報検索","title":"アパートの 情報[じょうほう]","text":"【さくら駅[えき] 周辺[しゅうへん]の 賃貸[ちんたい]アパート】\n物件[ぶっけん]　　　駅[えき]から　　　広[ひろ]さ　　　家賃[やちん]（一[いっ]か月[げつ][げつ]）　管理費[かんりひ]　条件[じょうけん]\nＡ　　　　歩[ある]いて 五分[ごふん]　　一ルーム　　六[ろく]万[まん]二[に]千[せん]円[えん]　　　三千円[さんぜんえん]　　ペット 不可[ふか]\nＢ　　　　歩[ある]いて 十[じゅう]二[に]分[ふん]　一ＬＤＫ　　六[ろく]万[まん]八[はっ]千[せん]円[えん]　　　なし　　　ペット 可[か]（小型犬[こがたけん]・猫[ねこ]）\nＣ　　　　バス 十分[じゅっぷん]　　　二[に]ＬＤＫ　　七[なな]万[まん]円[えん]　　　　　五[ご]千[せん]円[えん]　　ペット 不可[ふか]・駐車場[ちゅうしゃじょう] あり\nＤ　　　　歩[ある]いて 八分[はっぷん]　　一ＬＤＫ　　七[なな]万[まん]五[ご]千[せん]円[えん]　　　二[に]千[せん]円[えん]　　ペット 可[か]・楽器[がっき] 可[か]\ {"id":"b91","after":91,"lv":"N3","k":"短文","title":"社内[しゃない]の お知[し]らせ","text":"社員[しゃいん]各位[かくい]\n来月[らいげつ]から、会議室[かいぎしつ]の 予約[よやく]方法[ほうほう]が 変[か]わります。これまでは 総務部[そうむぶ]に 電話[でんわ]で 予約[よやく]して いましたが、来月[らいげつ] 一日[ついたち]からは 社内[しゃない]の ホームページで 予約[よやく]する ことに なります。\nすでに 電話[でんわ]で 予約[よやく]して ある 会議[かいぎ]に ついては、もう 一度[いちど] 予約[よやく]し直[なお]す 必要[ひつよう]は ありません。ホームページの 使[つか]い方[ほう]が 分[わ]からない 方[ほう]は、総務部[そうむぶ]の 佐藤[さとう]まで お問[と]い合[あ]わせください。\n総務部[そうむぶ]","ko":"사원 여러분께\n다음 달부터 회의실 예약 방법이 바뀝니다. 지금까지는 총무부에 전화로 예약했지만, 다음 달 1일부터는 사내 홈페이지에서 예약하게 됩니다.\n이미 전화로 예약해 둔 회의에 대해서는 다시 예약할 필요가 없습니다. 홈페이지 사용법을 모르는 분은 총무부 사토에게 문의해 주십시오.\n총무부","gloss":[["社内[しゃない]","사내"],["各位[かくい]","여러분"],["方法[ほうほう]","방법"],["すでに","이미"],["〜直[なお]す","다시 ~하다"],["問[と]い合[あ]わせる","문의하다"]],"qs":[{"c":["g:91"],"q":"この お知[し]らせで いちばん 伝[つた]えたい ことは 何[なん]ですか。","o":["会議室[かいぎしつ]の 予約[よやく]は 来月[らいげつ]から できなく なる。","すでに 予約[よやく]した 会議[かいぎ]も 予約[よやく]し直[なお]さなければ ならない。","来月[らいげつ]から 会議室[かいぎしつ]は ホームページで 予約[よやく]する。","総務部[そうむぶ]の 電話番号[でんわばんごう]が 変[か]わる。"],"ex":"핵심은 예약 방법 변경(전화 → 홈페이지). 이미 예약한 회의는 다시 할 필요 없어요. 〜ことになる(Day 54).","a":2}],"more":[{"k":"中文","title":"やめようと した 日[ひ]","text":"大学[だいがく]に 入[はい]って すぐ、私[わたし]は ギターを 習[なら]い始[はじ]めた。高校[こうこう]の 時[とき]から ずっと やりたかった ことだ。ところが、始[はじ]めて みると、指[ゆび]が 痛[いた]くて、簡単[かんたん]な 曲[きょく]も なかなか ひけない。三[さん]か月[げつ][げつ] たった ころには、練習[れんしゅう]するのが すっかり 嫌[いや]に なって いた。\nある 夜[よる]、とうとう ギターを 押[お]し入[い]れに しまおうと した。その 時[とき]、隣[となり]の 部屋[へや]に 住[す]んで いる 先輩[せんぱい]が、私[わたし]の 練習[れんしゅう]の 音[おと]を 毎日[まいにち] 聞[き]いて いたと 言[い]った。「最初[さいしょ]の ころより ずっと うまく なったよ。毎日[まいにち] 聞[き]いて いる ぼくが 言[い]うんだから 間違[まちが]いない」。\n自分[じぶん]では 少[すこ]しも 上手[じょうず]に なって いないと 思[おも]って いたが、外[そと]から 聞[き]いて いる 人[ひと]には 違[ちが]いが 分[わ]かるらしい。私[わたし]は ギターを しまうのを やめた。\n今[いま]でも 上手[じょうず]とは 言[い]えないが、あの 夜[よる] やめなくて 本当[ほんとう]に よかったと 思[おも]う。","ko":"대학에 들어가자마자 나는 기타를 배우기 시작했다. 고등학교 때부터 줄곧 하고 싶었던 일이다. 그런데 막상 시작해 보니 손가락이 아프고 간단한 곡도 좀처럼 칠 수 없다. 석 달이 지났을 무렵에는 연습하는 것이 완전히 싫어져 있었다.\n어느 날 밤, 결국 기타를 벽장에 넣어 버리려고 했다. 그때 옆방에 사는 선배가 내 연습 소리를 매일 듣고 있었다고 말했다. \"처음보다 훨씬 잘하게 됐어. 매일 듣고 있는 내가 하는 말이니까 틀림없어.\"\n나 스스로는 조금도 늘지 않았다고 생각했지만, 밖에서 듣는 사람에게는 차이를 알 수 있는 모양이다. 나는 기타를 넣어 두는 것을 그만두었다.\n지금도 잘한다고는 할 수 없지만, 그날 밤 그만두지 않아서 정말 다행이라고 생각한다.","gloss":[["指[ゆび]","손가락"],["なかなか","좀처럼"],["すっかり","완전히"],["とうとう","결국"],["押[お]し入[い]れ","벽장"],["しまう","넣어 두다"],["間違[まちが]いない","틀림없다"],["違[ちが]い","차이"]],"qs":[{"c":["g:91"],"q":"「私[わたし]」が ギターを しまおうと したのは なぜですか。","o":["練習[れんしゅう]しても うまく ならないと 感[かん]じて いたから","高校[こうこう]の 勉強[べんきょう]が 忙[いそが]しく なったから","先輩[せんぱい]に うるさいと 言[い]われたから","指[ゆび]を けがしたから"],"ex":"간단한 곡도 못 치고 연습이 싫어져 있었어요. 〜ようとする(Day 91)는 \"~하려고 하다\".","a":0},{"c":["g:91"],"q":"先輩[せんぱい]の 言葉[ことば]を 聞[き]いて、「私[わたし]」は 何[なに]に 気[き]が つきましたか。","o":["練習[れんしゅう]の 音[おと]が 迷惑[めいわく]だった こと","先輩[せんぱい]も ギターを ひいて いた こと","自分[じぶん]では 分[わ]からなくても、上達[じょうたつ]して いた こと","もっと いい ギターが 必要[ひつよう]な こと"],"ex":"「外[そと]から聞[き]いている人[ひと]には違[ちが]いが分[わ]かるらしい」 → 스스로는 몰라도 실력이 늘었다(上達[じょうたつ]).","a":2}]},{"k":"長文","title":"ことにして いる","text":"私[わたし]には、ここ 十年[じゅうねん] ほど 続[つづ]けて いる 習慣[しゅうかん]が ある。月[つき]に 一度[いちど]、知[し]らない 町[まち]を 歩[ある]く ことに して いるのだ。\nきっかけは、仕事[しごと]で 体[からだ]を こわした ことだった。毎日[まいにち] 会社[かいしゃ]と 家[いえ]を 往復[おうふく]するだけの 生活[せいかつ]で、気[き]が つくと 何[なに]か月[げつ]も 同[おな]じ 道[みち]しか 歩[ある]いて いなかった。医者[いしゃ]に「少[すこ]し 歩[ある]く ように」と 言[い]われて、休[やす]みの 日[ひ]に 適当[てきとう]な 駅[えき]で 電車[でんしゃ]を 降[お]りて みたのが 始[はじ]まりだ。\n初[はじ]めて 降[お]りた 駅[えき]の 周[まわ]りは、どこにでも ある 普通[ふつう]の 住宅地[じゅうたくち]だった。ところが、歩[ある]いて みると、意外[いがい]な 物[もの]が たくさん 見[み]つかる。古[ふる]い 豆腐屋[とうふや]、小[ちい]さな 神社[じんじゃ]、壁[かべ]に 描[えが]かれた 子[こ]どもたちの 絵[え]。いつも 電車[でんしゃ]の 窓[まど]から 見[み]て いた 町[まち]に、こんなに たくさんの 生活[せいかつ]が あったのかと 驚[おどろ]いた。\nそれから、月[つき]に 一度[いちど]の 「知[し]らない 町[まち]」が 楽[たの]しみに なった。地図[ちず]は なるべく 見[み]ない ことに して いる。迷[まよ]っても、それも 楽[たの]しみの 一[ひと]つだ。道[みち]を 聞[き]いた お店[みせ]の 人[ひと]と 話[はなし]が はずんで、気[き]が つくと 一時間[いちじかん] たって いた ことも ある。\n十年[じゅうねん] たって、体[からだ]は すっかり 元気[げんき]に なった。しかし、私[わたし]が この 習慣[しゅうかん]で 得[え]た いちばん 大[おお]きい ものは、健康[けんこう]では ないと 思[おも]う。それは、「いつもの 毎日[まいにち]の すぐ 隣[となり]にも、知[し]らない 世界[せかい]が ある」と いう 感覚[かんかく]だ。この 感覚[かんかく]の おかげで、忙[いそが]しい 毎日[まいにち]も 前[まえ]より 少[すこ]し 楽[たの]しく 感[かん]じられるように なった。","ko":"나에게는 최근 10년 정도 계속하고 있는 습관이 있다. 한 달에 한 번, 모르는 동네를 걷기로 하고 있는 것이다.\n계기는 일 때문에 몸이 상한 것이었다. 매일 회사와 집을 오가기만 하는 생활이라, 정신을 차려 보니 몇 달이나 같은 길만 걷고 있었다. 의사에게 \"좀 걷도록 하세요\"라는 말을 듣고, 쉬는 날에 적당한 역에서 전철을 내려 본 것이 시작이다.\n처음 내린 역 주변은 어디에나 있는 평범한 주택가였다. 그런데 걸어 보니 뜻밖의 것이 많이 발견된다. 오래된 두부 가게, 작은 신사, 벽에 그려진 아이들의 그림. 늘 전철 창문으로 보던 동네에 이렇게 많은 생활이 있었나 싶어 놀랐다.\n그 뒤로 한 달에 한 번의 \"모르는 동네\"가 즐거움이 되었다. 지도는 되도록 보지 않기로 하고 있다. 길을 잃어도 그것도 즐거움 중 하나다. 길을 물은 가게 사람과 이야기꽃이 피어 정신을 차려 보니 한 시간이 지나 있던 적도 있다.\n10년이 지나 몸은 완전히 건강해졌다. 그러나 내가 이 습관으로 얻은 가장 큰 것은 건강이 아니라고 생각한다. 그것은 \"평소 일상의 바로 옆에도 모르는 세계가 있다\"는 감각이다. 이 감각 덕분에 바쁜 매일도 전보다 조금 즐겁게 느낄 수 있게 되었다.","gloss":[["〜ことに して いる","~하기로 하고 있다(습관)"],["きっかけ","계기"],["こわす","(몸을) 상하게 하다"],["往復[おうふく]","왕복"],["適当[てきとう]な","적당한"],["住宅地[じゅうたくち]","주택가"],["意外[いがい]な","뜻밖의"],["豆腐屋[とうふや]","두부 가게"],["描[か]く","그리다"],["迷[まよ]う","길을 잃다"],["話[はなし]が はずむ","이야기꽃이 피다"],["得[う]る","얻다"],["健康[けんこう]","건강"],["感覚[かんかく]","감각"]],"qs":[{"c":["g:91"],"q":"筆者[ひっしゃ]が 知[し]らない 町[まち]を 歩[ある]き始[はじ]めたのは なぜですか。","o":["会社[かいしゃ]が 遠[とお]く へ 移[うつ]ったから","電車[でんしゃ]の 窓[まど]から 見[み]た 町[まち]が きれいだったから","新[あたら]しい 家[いえ]を 探[さが]して いたから","医者[いしゃ]に 歩[ある]く ことを すすめられたから"],"ex":"몸이 상해서 의사에게 \"걷도록\" 들은 것이 계기예요. 〜ように(Day 78)는 지시 전달.","a":3},{"c":["g:91"],"q":"初[はじ]めて 降[お]りた 駅[えき]の 町[まち]で、筆者[ひっしゃ]は 何[なに]に 驚[おどろ]きましたか。","o":["子[こ]どもたちが 絵[え]を 描[か]いて いた こと","町[まち]に 店[みせ]が 一[ひと]つも なかった こと","普通[ふつう]の 町[まち]にも いろいろな 人[ひと]の 暮[く]らしが あった こと","道[みち]に 迷[まよ]って 帰[かえ]れなく なった こと"],"ex":"「こんなにたくさんの生活[せいかつ]があったのかと驚[おどろ]いた」 → 평범한 동네에도 다양한 삶이 있었다.","a":2},{"c":["g:91"],"q":"「それも 楽[たの]しみの 一[ひと]つだ」の「それ」は 何[なに]を 指[さ]して いますか。","o":["地図[ちず]を 見[み]る こと","道[みち]に 迷[まよ]う こと","お店[みせ]の 人[ひと]と 話[はな]す こと","知[し]らない 駅[えき]で 降[お]りる こと"],"ex":"바로 앞 「迷[まよ]っても」 → 길을 잃는 것. 지시어는 바로 앞 문장에서 찾아요.","a":1},{"c":["g:91"],"q":"筆者[ひっしゃ]が この 習慣[しゅうかん]で 得[え]た いちばん 大切[たいせつ]な ものは 何[なん]ですか。","o":["たくさんの 友達[ともだち]が できた こと","地図[ちず]を 読[よ]む 力[ちから]","体[からだ]が 元気[げんき]に なった こと","毎日[まいにち]の 生活[せいかつ]の 近[ちか]くにも 知[し]らない ことが ある という 気持[きも]ち"],"ex":"「いちばん大[おお]きいものは、健康[けんこう]ではない…『いつもの毎日[まいにち]のすぐ隣[となり]にも、知[し]らない世界[せかい]がある』という感覚[かんかく]だ」. 건강은 일부러 부정하는 오답이에요.","a":3}]}]},
{"id":"b94","after":94,"lv":"N3","k":"短文","title":"店[みせ]の 張[は]り紙[がみ]","text":"お客様[きゃくさま]へ\nいつも ご利用[りよう] ありがとうございます。\n当店[とうてん]では、来月[らいげつ] 十日[とおか]から レジ袋[ぶくろ]を 無料[むりょう]で お渡[わた]しする ことを やめます。袋[ふくろ]が 必要[ひつよう]な 方[ほう]は、一[いち]枚[まい] 五[ご]円[えん]で お買[か]い求[もと]めください。\nなお、エコバッグを お持[も]ちの 方[ほう]には、お買[か]い物[もの]の 金額[きんがく]に 関係[かんけい]なく、ポイントを 二[に]倍[ばい]に いたします。\nスーパー ひかり","ko":"손님께\n늘 이용해 주셔서 감사합니다.\n저희 가게에서는 다음 달 10일부터 비닐봉지를 무료로 드리는 것을 중단합니다. 봉지가 필요한 분은 한 장 5엔에 구입해 주십시오.\n또한 에코백을 가져오신 분께는 구매 금액과 관계없이 포인트를 두 배로 해 드립니다.\n슈퍼 히카리","gloss":[["当店[とうてん]","저희 가게"],["レジ袋[ぶくろ]","비닐봉지"],["お渡[わた]しする","드리다"],["お買[か]い求[もと]め","구입"],["なお","또한"],["エコバッグ","에코백"],["金額[きんがく]","금액"],["ポイント","포인트"],["二[に]倍[ばい]","두 배"]],"qs":[{"c":["g:94"],"q":"来月[らいげつ] 十日[とおか]から、この 店[みせ]で 変[か]わる ことは 何[なん]ですか。","o":["ポイントが もらえなく なる。","エコバッグを 売[う]り始[はじ]める。","袋[ふくろ]が まったく もらえなく なる。","袋[ふくろ]を もらうのに お金[かね]が かかる。"],"ex":"무료 제공을 중단하고 5엔에 판다 → 봉지에 돈이 든다. 봉지 자체가 없어지는 건 아니에요.","a":3}],"more":[{"k":"中文","title":"早起[はやお]きの わけ","text":"友人[ゆうじん]の 山本[やまもと]さんは、毎朝[まいあさ] 四時[よじ]半[はん]に 起[お]きる。会社[かいしゃ]が 始[はじ]まるのは 九時[くじ]だから、そんなに 早[はや]く 起[お]きる 必要[ひつよう]は ない。最初[さいしょ]に それを 聞[き]いた 時[とき]、私[わたし]は 何[なに]か 特別[とくべつ]な 理由[りゆう]が あるのだと 思[おも]った。\n聞[き]いて みると、理由[りゆう]は とても 簡単[かんたん]だった。山本[やまもと]さんには 子[こ]どもが 三人[さんにん] いる。家族[かぞく]が 起[お]きると、朝[あさ]ご飯[はん]や 学校[がっこう]の 準備[じゅんび]で 家[いえ]の 中[なか]は 大[おお]さわぎに なる。夜[よる]は 夜[よる]で、子[こ]どもを 寝[ね]かせた 後[あと]は、疲[つか]れて 何[なに]も できない。だから、自分[じぶん]だけの 時間[じかん]が ほしければ、みんなが 寝[ね]て いる 朝[あさ]しか ないと いう わけだ。\nその 一時間半[いちじかんはん]で、山本[やまもと]さんは 本[ほん]を 読[よ]んだり、資格[しかく]の 勉強[べんきょう]を したり して いる。去年[きょねん]は その 時間[じかん]を 使[つか]って、難[むずか]しい 試験[しけん]に 合格[ごうかく]したそうだ。\n時間[じかん]が ないと よく 言[い]うが、本当[ほんとう]は 時間[じかん]を 作[つく]る 工夫[くふう]を して いないだけなのかもしれない。山本[やまもと]さんの 話[はなし]を 聞[き]いて、そう 思[おも]った。","ko":"친구 야마모토 씨는 매일 아침 4시 반에 일어난다. 회사가 시작하는 것은 9시니까 그렇게 일찍 일어날 필요는 없다. 처음 그 말을 들었을 때 나는 뭔가 특별한 이유가 있는 거라고 생각했다.\n물어보니 이유는 아주 간단했다. 야마모토 씨에게는 아이가 셋 있다. 가족이 일어나면 아침밥과 학교 준비로 집 안은 난리가 난다. 밤은 밤대로 아이를 재운 뒤에는 지쳐서 아무것도 할 수 없다. 그래서 자기만의 시간을 갖고 싶다면 모두가 자고 있는 아침밖에 없다는 것이다.\n그 한 시간 반 동안 야마모토 씨는 책을 읽거나 자격증 공부를 하고 있다. 작년에는 그 시간을 이용해 어려운 시험에 합격했다고 한다.\n시간이 없다고 자주 말하지만, 사실은 시간을 만드는 궁리를 하지 않을 뿐인지도 모른다. 야마모토 씨의 이야기를 듣고 그렇게 생각했다.","gloss":[["友人[ゆうじん]","친구"],["大[おお]さわぎ","큰 소동"],["〜は 〜で","~는 ~대로"],["寝[ね]かせる","재우다"],["〜わけだ","~인 것이다"],["資格[しかく]","자격"],["合格[ごうかく]","합격"],["工夫[くふう]","궁리, 고안"]],"qs":[{"c":["g:94"],"q":"山本[やまもと]さんが 朝[あさ] 早[はや]く 起[お]きる 理由[りゆう]は 何[なん]ですか。","o":["一人[ひとり]で 使[つか]える 時間[じかん]が 朝[あさ]しか ないから","会社[かいしゃ]が 遠[とお]くて 時間[じかん]が かかるから","夜[よる] 早[はや]く 寝[ね]る 習慣[しゅうかん]が あるから","子[こ]どもの 朝[あさ]ご飯[はん]を 作[つく]るから"],"ex":"「自分[じぶん]だけの時間[じかん]がほしければ、みんなが寝[ね]ている朝[あさ]しかないというわけだ」. 〜わけだ(Day 94)는 앞 내용에서 나오는 당연한 결론.","a":0},{"c":["g:94"],"q":"筆者[ひっしゃ]は 山本[やまもと]さんの 話[はなし]を 聞[き]いて、どう 思[おも]いましたか。","o":["子[こ]どもが いると 何[なに]も できない。","難[むずか]しい 試験[しけん]は 朝[あさ] 勉強[べんきょう]すると いい。","早起[はやお]きは 体[からだ]に よくない。","時間[じかん]は 工夫[くふう]すれば 作[つく]れるのかもしれない。"],"ex":"마지막 단락 「本当[ほんとう]は時間[じかん]を作[つく]る工​夫[おっと]をしていないだけなのかもしれない」.","a":3}]},{"k":"情報検索","title":"市民講座[しみんこうざ]の 案内[あんない]","text":"【みどり市[し] 秋[あき]の 市民講座[しみんこうざ]】（会場[かいじょう]：市民[しみん]センター）\n講座名[こうざめい]　　　　　　　　　曜日[ようび]・時間[じかん]　　　　　　　　期間[きかん]（回数[かいすう]）　　　受講料[じゅこうりょう]　　定員[ていいん]\n① 初[はじ]めての パソコン　　　火[か]　十時[じゅうじ]〜十[じゅう]二[に]時[じ]　　　　十[じゅう]月[がつ]〜十一月[じゅういちがつ]（八[はっ]回[かい]）　四[よん]千[せん]円[えん]　　二[に]十[じゅう]人[にん]\n② 健康[けんこう]ヨガ　　　　　　　水[すい]　十[じゅう]九[く]時[じ]〜二[に]十[じゅう]時半[じはん]　　十[じゅう]月[がつ]〜十[じゅう]二[に]月[がつ]（十[じゅう]二[に]回[かい]）六[ろく]千[せん]円[えん]　　三[さん]十[じゅう]人[にん]\n③ 韓国語[かんこくご] 入門[にゅうもん]　　　　　木[もく]　十[じゅう]九[く]時[じ]〜二[に]十[じゅう]時半[じはん]　　十[じゅう]月[がつ]〜十[じゅう]二[に]月[がつ]（十[じゅう]二[に]回[かい]）五[ご]千[せん]円[えん]　　二十五人[にじゅうごにん]\n④ 写真[しゃしん]の 撮[と]り方[かた]　　　　　土[ど]　十四時[じゅうよじ]〜十[じゅう]六[ろく]時[じ]　　　十[じゅう]月[がつ]〜十一月[じゅういちがつ]（六[ろく]回[かい]）　三千円[さんぜんえん]　　十五人[じゅうごにん]\n⑤ 親子[おやこ] 料理[りょうり]教室[きょうしつ]　　　　　日[にち]　十時[じゅうじ]〜十[じゅう]二[に]時[じ]　　　　十一月[じゅういちがつ]のみ（四[よん]回[かい]）　　親子[おやこ] 一組[ひとくみ] 四[よん]千[せん]円[えん]　十[じゅう]組[くみ]\n◆ 申[もう]し込[こ]み：九[く]月[がつ] 一日[ついたち]〜二十日[はつか]。往復[おうふく]はがき、または 市[し]の ホームページで。一人[ひとり] 一[ひと]つの 講座[こうざ]まで。\n◆ 定員[ていいん]より 多[おお]い 場合[ばあい]は 抽選[ちゅうせん]。結果[けっか]は 九[く]月[がつ] 末[まつ]までに お知[し]らせします。\n◆ 市内[しない]に 住[す]んで いるか、市内[しない]で 働[はたら]いて いる 方[ほう]が 対象[たいしょう]です（⑤は 市内[しない]の 小学生[しょうがくせい]と {"id":"b98","after":98,"lv":"N3","k":"短文","title":"取引先[とりひきさき]への メール","text":"株式会社[かぶしきかいしゃ] さくら物産[ぶっさん]\n営業部[えいぎょうぶ] 田中様[たなかさま]\nいつも お世話[せわ]に なって おります。みどり商事[しょうじ]の 木村[きむら]です。\n先日[せんじつ] ご注文[ちゅうもん]いただいた 商品[しょうひん]ですが、工場[こうじょう]の 機械[きかい]の 故障[こしょう]の ため、お届[とど]けが 三日[みっか]ほど 遅[おく]れる 見込[みこ]みです。ご迷惑[めいわく]を おかけして、誠[まこと]に 申[もう]し訳[わけ]ございません。\n確実[かくじつ]な 日程[にってい]が 決[き]まりしだい、改[あらた]めて ご連絡[れんらく]いたします。","ko":"주식회사 사쿠라 물산 영업부 다나카 님\n늘 신세 지고 있습니다. 미도리 상사의 기무라입니다.\n지난번에 주문해 주신 상품 말씀인데요, 공장 기계 고장으로 인해 배송이 3일 정도 늦어질 전망입니다. 폐를 끼쳐 대단히 죄송합니다.\n확실한 일정이 정해지는 대로 다시 연락드리겠습니다.","gloss":[["取引先[とりひきさき]","거래처"],["株式会社[かぶしきかいしゃ]","주식회사"],["物産[ぶっさん]","물산"],["営業部[えいぎょうぶ]","영업부"],["商事[しょうじ]","상사"],["先日[せんじつ]","지난번"],["故障[こしょう]","고장"],["見込[みこ]み","전망"],["誠[まこと]に","대단히"],["確実[かくじつ]","확실"],["日程[にってい]","일정"],["〜しだい","~하는 대로"],["改[あらた]めて","다시"]],"qs":[{"c":["g:98"],"q":"木村[きむら]さんが この メールで 伝[つた]えて いる ことは 何[なん]ですか。","o":["商品[しょうひん]の 注文[ちゅうもん]を 取[と]り消[け]す こと","商品[しょうひん]が 予定[よてい]より 遅[おそ]く 届[とど]く こと","機械[きかい]が 直[なお]った こと","商品[しょうひん]の 日程[にってい]が もう 決[き]まった こと"],"ex":"고장 때문에 배송이 3일 정도 늦어질 전망(見込[みこ]み). 확실한 일정은 아직이에요. 〜しだい(Day 116 미리보기).","a":1}],"more":[{"k":"中文","title":"忘[わす]れっぽい 父[ちち]","text":"最近[さいきん]、父[ちち]が 忘[わす]れっぽく なった。眼鏡[めがね]を どこに 置[お]いたか 分[わ]からなく なったり、同[おな]じ 話[はなし]を 何度[なんど]も したり する。先日[せんじつ]は、電話[でんわ]で 話[はな]して いる 時[とき]に「今日[きょう]は 何曜日[なんようび]だっけ」と 聞[き]かれて、少[すこ]し 心配[しんぱい]に なった。\nそこで、母[はは]と 相談[そうだん]して、父[ちち]を 病院[びょういん]へ 連[つ]れて 行[い]く ことに した。検査[けんさ]の 結果[けっか]、特[とく]に 病気[びょうき]では なく、年[とし]を とると だれにでも ある ことだと 医者[いしゃ]に 言[い]われた。ただ、家[いえ]に こもりがちな 生活[せいかつ]は よく ないので、なるべく 外[そと]に 出[で]て 人[ひと]と 話[はな]す ように と すすめられた。\n父[ちち]は 会社[かいしゃ]を 辞[や]めてから、一日[いちにち]中[じゅう] テレビを 見[み]て いる ことが 多[おお]かった。今[いま]は 週[しゅう]に 二[に]回[かい]、近所[きんじょ]の 公民館[こうみんかん]で 将棋[しょうぎ]を して いる。帰[かえ]って くると、その 日[ひ]の 試合[しあい]の 話[はなし]を 楽[たの]しそうに して くれる。勝[か]った 日[ひ]の 話[はなし]は、やっぱり 何度[なんど]も 聞[き]かされるのだが。","ko":"최근 아버지가 깜빡깜빡하게 되었다. 안경을 어디에 뒀는지 모르게 되거나 같은 이야기를 몇 번이나 하거나 한다. 지난번에는 전화로 이야기할 때 \"오늘이 무슨 요일이더라?\"라는 질문을 받아 조금 걱정이 되었다.\n그래서 어머니와 상의해서 아버지를 병원에 모시고 가기로 했다. 검사 결과 특별히 병은 아니고 나이가 들면 누구에게나 있는 일이라고 의사가 말했다. 다만 집에 틀어박히기 쉬운 생활은 좋지 않으니 되도록 밖에 나가서 사람들과 이야기하도록 권유받았다.\n아버지는 회사를 그만둔 뒤 하루 종일 텔레비전을 보는 일이 많았다. 지금은 일주일에 두 번 동네 공민관에서 장기를 두고 있다. 돌아오면 그날 시합 이야기를 즐겁게 해 준다. 이긴 날 이야기는 역시 몇 번이고 듣게 되지만.","gloss":[["〜っぽい","~하는 경향이 있다"],["〜っけ","~였더라"],["検査[けんさ]","검사"],["こもる","틀어박히다"],["〜がち","~하기 쉬움"],["公民館[こうみんかん]","공민관(주민센터)"],["将棋[しょうぎ]","장기"],["やっぱり","역시"]],"qs":[{"c":["g:98"],"q":"医者[いしゃ]は 父[ちち]に ついて 何[なに]と 言[い]いましたか。","o":["テレビを 見[み]るのを やめるべきだ。","年[とし]を とれば よく ある ことで、外[そと]に 出[で]る ほうが いい。","家[いえ]で ゆっくり 休[やす]む ほうが いい。","病気[びょうき]なので、すぐ 薬[くすり]を 飲[の]む 必要[ひつよう]が ある。"],"ex":"병은 아니고 나이 들면 흔한 일. 집에 틀어박히기 쉬운(こもりがち, Day 98) 생활은 좋지 않으니 밖에 나가라고 했어요.","a":1},{"c":["g:98"],"q":"「勝[か]った 日[ひ]の 話[はなし]は、やっぱり 何度[なんど]も 聞[き]かされる」から 分[わ]かる ことは 何[なん]ですか。","o":["父[ちち]の 病気[びょうき]が 悪[わる]く なった。","父[ちち]は 将棋[しょうぎ]で 一度[いちど]も 勝[か]った ことが ない。","筆者[ひっしゃ]は 父[ちち]の 話[はなし]を 聞[き]くのが 嫌[いや]だ。","父[ちち]の 忘[わす]れっぽさは 少[すこ]し 残[のこ]って いる が、楽[たの]しく 過[す]ごして いる。"],"ex":"같은 이야기를 여러 번 하는 버릇은 남아 있지만(やっぱり), 즐겁게 지내는 모습을 유머 있게 표현했어요.","a":3}]},{"k":"長文","title":"「〜がち」な 私[わたし]たち","text":"雨[あめ]の 日[ひ]は 家[いえ]に こもりがちだ、休[やす]みの 日[ひ]は 夜[よ]ふかしを しがちだ。私[わたし]たちは、自分[じぶん]の よく ない 習慣[しゅうかん]を「〜がち」と いう 言葉[ことば]で 表[あらわ]す ことが 多[おお]い。\nしかし、「〜がち」と 言[い]った 時点[じてん]で、私[わたし]たちは どこかで それを 仕方[しかた]の ない ことだと 考[かんが]えて いるのでは ないだろうか。「つい」「なんとなく」そう なって しまう、自分[じぶん]の せいでは ない、という 気持[きも]ちが この 言葉[ことば]には 含[ふく]まれて いる ように 思[おも]う。\nある 心理学者[しんりがくしゃ]は、習慣[しゅうかん]を 変[か]えたい なら、まず「〜がち」を やめて、「〜して いる」と 言[い]い換[か]えて みる ことを すすめて いる。「夜[よ]ふかしを しがちだ」では なく、「私[わたし]は 毎晩[まいばん] 一時[いちじ]まで スマホを 見[み]て いる」と 言[い]うのだ。こう 言[い]うと、問題[もんだい]が はっきり 見[み]えて くる。何時[なんじ]に、何[なに]を して いるのか が 分[わ]かれば、どこを 変[か]えれば いいかも 分[わ]かる。\n私[わたし]も 試[ため]して みた。「運動不足[うんどうぶそく]に なりがちだ」を「私[わたし]は 一日[いちにち]に 二[に]千[せん]歩[ほ]しか 歩[ある]いて いない」と 書[か]き直[なお]した。数字[すうじ]に して みると、思[おも]って いたより ずっと 少[すく]ない ことに 驚[おどろ]いた。それから、駅[えき]の エスカレーターを 使[つか]わない ことに した。たった それだけだが、今[いま]は 一日[いちにち] 五[ご]千[せん]歩[ほ]を 超[こ]える 日[ひ]が 増[ふ]えた。\n言葉[ことば]は、私[わたし]たちの 考[かんが]え方[ほう]を 作[つく]る。「〜がち」と いう やさしい 言葉[ことば]に 逃[に]げず、自分[じぶん]の 行動[こうどう]を そのまま 見[み]つめる こと。それが、習慣[しゅうかん]を 変[か]える 第一[だいいち]歩[ほ]なのかもしれない。","ko":"비 오는 날은 집에 틀어박히기 쉽다, 쉬는 날은 밤샘하기 쉽다. 우리는 자신의 좋지 않은 습관을 \"〜がち(~하기 쉽다)\"라는 말로 나타내는 경우가 많다.\n그러나 \"〜がち\"라고 말한 시점에서 우리는 어딘가에서 그것을 어쩔 수 없는 일이라고 생각하고 있는 것은 아닐까. \"그만\" \"왠지 모르게\" 그렇게 되어 버린다, 내 탓이 아니다, 라는 마음이 이 말에는 담겨 있는 것 같다.\n어느 심리학자는 습관을 바꾸고 싶다면 먼저 \"〜がち\"를 그만두고 \"〜하고 있다\"로 바꿔 말해 볼 것을 권한다. \"밤샘하기 쉽다\"가 아니라 \"나는 매일 밤 1시까지 스마트폰을 보고 있다\"고 말하는 것이다. 이렇게 말하면 문제가 분명하게 보인다. 몇 시에 무엇을 하고 있는지 알면 어디를 바꾸면 되는지도 알 수 있다.\n나도 시험해 보았다. \"운동 부족이 되기 쉽다\"를 \"나는 하루에 2000보밖에 걷지 않는다\"로 고쳐 썼다. 숫자로 해 보니 생각보다 훨씬 적어서 놀랐다. 그 뒤로 역의 에스컬레이터를 쓰지 않기로 했다. 고작 그것뿐이지만 지금은 하루 5000보를 넘는 날이 늘었다.\n말은 우리의 사고방식을 만든다. \"〜がち\"라는 부드러운 말로 도망치지 않고 자신의 행동을 있는 그대로 바라보는 것. 그것이 습관을 바꾸는 첫걸음일지도 모른다.","gloss":[["夜[よ]ふかし","밤샘"],["表[あらわ]す","나타내다"],["時点[じてん]","시점"],["仕方[しかた]の ない","어쩔 수 없는"],["つい","그만"],["なんとなく","왠지 모르게"],["〜せい","~탓"],["含[ふく]む","포함하다"],["心理学者[しんりがくしゃ]","심리학자"],["言[い]い換[か]える","바꿔 말하다"],["試[ため]す","시험하다"],["運動不足[うんどうぶそく]","운동 부족"],["〜歩[あゆみ]","~걸음"],["超[こ]える","넘다"],["逃[に]げる","도망치다"],["行動[こうどう]","행동"],["見[み]つめる","바라보다"],["第一[だいいち]歩[ほ]","첫걸음"]],"qs":[{"c":["g:98"],"q":"筆者[ひっしゃ]に よると、「〜がち」と いう 言葉[ことば]には どんな 気持[きも]ちが 含[ふく]まれて いますか。","o":["自分[じぶん]の 責任[せきにん]では ない と 思[おも]いたい 気持[きも]ち","習慣[しゅうかん]を すぐ 変[か]えたい 気持[きも]ち","自分[じぶん]を 強[つよ]く 責[せ]める 気持[きも]ち","人[ひと]に 注意[ちゅうい]したい 気持[きも]ち"],"ex":"「自分[じぶん]のせいではない、という気持[きも]ちがこの言葉[ことば]には含​まれている」. せいではない = 責任[せきにん]ではない.","a":0},{"c":["g:98"],"q":"心理学者[しんりがくしゃ]は 何[なに]を すすめて いますか。","o":["毎晩[まいばん] 早[はや]く 寝[ね]る こと","「〜がち」を たくさん 使[つか]う こと","自分[じぶん]の して いる ことを 具体的[ぐたいてき]に 言[い]う こと","スマホを 使[つか]わない こと"],"ex":"\"〜がち\" 대신 \"몇 시까지 무엇을 하고 있다\"처럼 구체적으로 말하라고 해요.","a":2},{"c":["g:98"],"q":"筆者[ひっしゃ]が 試[ため]した 結果[けっか]、どう なりましたか。","o":["数字[すうじ]を 書[か]くのが 習慣[しゅうかん]に なった。","歩[ある]く 量[りょう]が 前[まえ]より 増[ふ]えた。","エスカレーターが 好[す]きに なった。","二[に]千[せん]歩[ほ]しか 歩[ある]けなく なった。"],"ex":"에스컬레이터를 쓰지 않기로 하고 5000보를 넘는 날이 늘었어요.","a":1},{"c":["g:98"],"q":"この 文章[ぶんしょう]で 筆者[ひっしゃ]が いちばん 言[い]いたい ことは 何[なん]ですか。","o":["心理学者[しんりがくしゃ]の 言[い]う ことは いつも 正[ただ]しい。","習慣[しゅうかん]を 変[か]えるには、自分[じぶん]の 行動[こうどう]を ありのまま 見[み]る ことが 大切[たいせつ]だ。","運動不足[うんどうぶそく]の 人[ひと]は 毎日[まいにち] 五[ご]千[せん]歩[ほ] 歩[ある]くべきだ。","「〜がち」は 正[ただ]しくない 日本語[にほんご]だ。"],"ex":"마지막 단락 「自分[じぶん]の行動[こうどう]をそのまま見[み]つめること。それが、習慣[しゅうかん]を変[か]える第一[だいいち]​歩[ほ]」가 주장이에요.","a":1}]}]},
{"id":"b101","after":101,"lv":"N3","k":"短文","title":"説明書[せつめいしょ]","text":"【加湿器[かしつき]の お手入[てい]れ】\nタンクの 水[みず]は 毎日[まいにち] 取[と]り替[か]えて ください。古[ふる]い 水[みず]を そのまま 使[つか]うと、においや 故障[こしょう]の 原因[げんいん]に なります。\n週[しゅう]に 一度[いちど]は、説明書[せつめいしょ]の とおりに、タンクを 外[はず]して 洗[あら]って ください。洗[あら]う 時[とき]は、洗剤[せんざい]を 使[つか]わず、水[みず]だけで 洗[あら]います。\n※ 電源[でんげん]を 入[い]れたまま タンクを 外[はず]さないで ください。","ko":"[가습기 손질]\n탱크의 물은 매일 갈아 주세요. 오래된 물을 그대로 쓰면 냄새나 고장의 원인이 됩니다.\n일주일에 한 번은 설명서대로 탱크를 분리해서 씻어 주세요. 씻을 때는 세제를 쓰지 말고 물로만 씻습니다.\n※ 전원을 켠 채로 탱크를 분리하지 마세요.","gloss":[["加湿器[かしつき]","가습기"],["手入[てい]れ","손질"],["タンク","탱크"],["取[と]り替[か]える","갈다"],["原因[げんいん]","원인"],["外[はず]す","분리하다"],["洗剤[せんざい]","세제"],["電源[でんげん]","전원"],["〜まま","~한 채로"]],"qs":[{"c":["g:101"],"q":"この 説明[せつめい]に 合[あ]う ものは どれですか。","o":["タンクを 外[はず]す 前[まえ]に、電源[でんげん]を 切[き]る。","タンクの 水[みず]は 週[しゅう]に 一度[いちど] 取[と]り替[か]える。","タンクは 洗剤[せんざい]で 洗[あら]う。","古[ふる]い 水[みず]を 使[つか]っても 問題[もんだい]ない。"],"ex":"「電源[でんげん]を入[い]れたままタンクを外​さないで」 → 분리 전에 전원을 끈다. 〜とおりに(Day 101)는 \"~대로\".","a":0}],"more":[{"k":"中文","title":"予報[よほう]どおりに ならない","text":"天気予報[てんきよほう]は、昔[むかし]に 比[くら]べて ずいぶん 正確[せいかく]に なったと 言[い]われる。それでも、「予報[よほう]どおりに 雨[あめ]が 降[ふ]らなかった」「晴[は]れの はずが 夕立[ゆうだち]に あった」と いう 経験[けいけん]は、だれにでも あるだろう。\n実[じつ]は、天気予報[てんきよほう]の「降水確率[こうすいかくりつ] 三[さん]十[じゅう]パーセント」は、「三[さん]十[じゅう]パーセントの 地域[ちいき]で 雨[あめ]が 降[ふ]る」と いう 意味[いみ]では ない。「同[おな]じ ような 天気[てんき]の 日[ひ]が 百[ひゃく]回[かい] あったら、そのうち 三[さん]十[じゅう]回[かい]くらいは 一ミリ 以上[いじょう]の 雨[あめ]が 降[ふ]る」と いう 意味[いみ]だ。つまり、三[さん]十[じゅう]パーセントの 日[ひ]に 雨[あめ]が 降[ふ]っても、予報[よほう]が 外[はず]れた わけでは ないのである。\nこう 考[かんが]えると、大切[たいせつ]なのは 数字[すうじ]を どう 使[つか]うかだ。私[わたし]は 五[ご]十[じゅう]パーセント 以上[いじょう]なら 傘[かさ]を 持[も]ち、三[さん]十[じゅう]パーセントなら 折[お]りたたみ傘[かさ]を かばんに 入[い]れる ことに して いる。予報[よほう]を 「当[あ]たる・外[はず]れる」で 見[み]るのでは なく、自分[じぶん]の 行動[こうどう]を 決[き]める ための 材料[ざいりょう]として 使[つか]えば、もう 少[すこ]し 予報[よほう]と 上手[じょうず]に 付[つ]き合[あ]えるのでは ないだろうか。","ko":"일기예보는 옛날에 비해 꽤 정확해졌다고들 한다. 그래도 \"예보대로 비가 오지 않았다\", \"맑을 거였는데 소나기를 만났다\"는 경험은 누구에게나 있을 것이다.\n사실 일기예보의 \"강수 확률 30%\"는 \"30%의 지역에 비가 온다\"는 뜻이 아니다. \"비슷한 날씨의 날이 100번 있으면 그중 30번 정도는 1mm 이상의 비가 온다\"는 뜻이다. 즉, 30%인 날에 비가 와도 예보가 빗나간 것은 아닌 것이다.\n이렇게 생각하면 중요한 것은 숫자를 어떻게 쓰느냐이다. 나는 50% 이상이면 우산을 들고, 30%면 접이식 우산을 가방에 넣기로 하고 있다. 예보를 \"맞았다·틀렸다\"로 보는 게 아니라 자신의 행동을 정하기 위한 재료로 쓴다면 조금 더 예보와 잘 지낼 수 있지 않을까.","gloss":[["正確[せいかく]","정확"],["夕立[ゆうだち]","소나기"],["降水確率[こうすいかくりつ]","강수 확률"],["地域[ちいき]","지역"],["ミリ","밀리미터"],["つまり","즉"],["外[はず]れる","빗나가다"],["折[お]りたたみ傘[かさ]","접이식 우산"],["当[あ]たる","맞다"],["付[つ]き合[あ]う","어울리다, 사귀다"]],"qs":[{"c":["g:101"],"q":"「降水確率[こうすいかくりつ] 三[さん]十[じゅう]パーセント」の 正[ただ]しい 意味[いみ]は どれですか。","o":["同[おな]じ ような 日[ひ]の 十[じゅう]回[かい]に 三回[さんかい]くらい 雨[あめ]が 降[ふ]る","一日[いちにち]の 三[さん]十[じゅう]パーセントの 時間[じかん] 雨[あめ]が 降[ふ]る","雨[あめ]が 三[さん]十[じゅう]ミリ 降[ふ]る","その 地域[ちいき]の 三[さん]十[じゅう]パーセントで 雨[あめ]が 降[ふ]る"],"ex":"100번 중 30번 정도 = 10번에 3번. 〜とおり(Day 101), 〜わけではない(Day 95).","a":0},{"c":["g:101"],"q":"筆者[ひっしゃ]は 天気予報[てんきよほう]を どう 使[つか]えば いいと 言[い]って いますか。","o":["五[ご]十[じゅう]パーセント 以下[いか]なら 気[き]に しない。","当[あ]たったか どうかを 毎日[まいにち] 調[しら]べる。","自分[じぶん]が どう するかを 決[き]める ために 使[つか]う。","三[さん]十[じゅう]パーセントなら 出[で]かけない。"],"ex":"「自分[じぶん]の行動[こうどう]を決[き]めるための材料[ざいりょう]として使[つか]えば」.","a":2}]},{"k":"情報検索","title":"ホテルの プラン","text":"【温泉[おんせん]旅館[りょかん] さくら亭[てい]　ご宿泊[しゅくはく]プラン】（お一人[ひとり]様[さま] 一泊[いっぱく]の 料金[りょうきん]・税込[ぜいこ]み）\nプラン名[めい]　　　　　　　食事[しょくじ]　　　　　　　　　　平日[へいじつ]　　　　　土曜[どよう]・祝日[しゅくじつ]の 前日[ぜんじつ]\nＡ 素泊[すど]まり　　　　　　なし　　　　　　　　　　八[はっ]千[せん]円[えん]　　　　一[いち]万[まん]円[えん]\nＢ 朝食付[ちょうしょくつ]き　　　　　　朝食[ちょうしょく]　　　　　　　　　　一[いち]万[まん]円[えん]　　　　一[いち]万[まん]二[に]千[せん]円[えん]\nＣ スタンダード　　　　夕食[ゆうしょく]・朝食[ちょうしょく]　　　　　　　一[いち]万[まん]五[ご]千[せん]円[えん]　　一[いち]万[まん]八[はっ]千[せん]円[えん]\nＤ 特別会席[とくべつかいせき]　　　　　　特別夕食[とくべつゆうしょく]・朝食[ちょうしょく]　　　　　二[に]万[まん]円[えん]　　　　二[に]万[まん]四[よん]千[せん]円[えん]\n◆ 小学生[しょうがくせい]は 大人[おとな]の 七[なな]割[わり]、小学生[しょうがくせい]より 小[ちい]さい 子[こ]どもは 食事[しょくじ]なしなら 無料[むりょう]です。\n◆ 夕食[ゆうしょく]は 十八時[じゅうはちじ]か 十[じゅう]九[く]時半[じはん]から（予約[よやく]の 時[とき]に お選[えら]びください）。\n◆ チェックイン 十[じゅう]五[ご]時[じ]〜、チェックアウト 十時[じゅうじ]まで（Ｄプランは 十一時[じゅういちじ]まで）。\n◆ 三泊[さんぱく] 以上[いじょう] 続[つづ]けて 泊[と]まる 方[ほう]は、全部[ぜんぶ]の 料金[りょうきん]から 一[いち]割[わり] 引[ひ]きます。\n◆ キャンセル料[りょう]：三日[みっか]前[まえ]から 三[さん]割[わり]、前日[ぜんじつ] 五[ご]割[わり]、当日[とうじつ] 全額[ぜんがく]。","ko":"[온천 료칸 사쿠라테이 숙박 플랜] (1인 1박 요금·세금 포함)\nA 숙박만 식사 없음, 평일 8000엔·토요일·공휴일 전날 {"id":"b105","after":105,"lv":"N3","k":"短文","title":"学生[がくせい]へ","text":"留学生[りゅうがくせい]の みなさんへ\nアルバイトを する 時[とき]は、必[かなら]ず 事前[じぜん]に 学生課[がくせいか]に 届[とど]けを 出[だ]して ください。留学生[りゅうがくせい]に とって、アルバイトの 時間[じかん]には きまりが あります。授業[じゅぎょう]が ある 期間[きかん]は 一週間[いっしゅうかん]に 二[に]十[じゅう]八[はち]時間[じかん] 以内[いない]です。\nきまりを 守[まも]らないと、ビザの 更新[こうしん]が できなく なる ことが あります。分[わ]からない ことが あれば、学生課[がくせいか]に 相談[そうだん]して ください。","ko":"유학생 여러분께\n아르바이트를 할 때는 반드시 사전에 학생과에 신고서를 내 주세요. 유학생에게는 아르바이트 시간에 규칙이 있습니다. 수업이 있는 기간에는 일주일에 28시간 이내입니다.\n규칙을 지키지 않으면 비자 갱신을 못 하게 되는 경우가 있습니다. 모르는 것이 있으면 학생과에 상담하세요.","gloss":[["事前[じぜん]に","사전에"],["学生課[がくせいか]","학생과"],["届[とど]け","신고(서)"],["〜に とって","~에게 있어"],["ビザ","비자"],["更新[こうしん]","갱신"]],"qs":[{"c":["g:105"],"q":"留学生[りゅうがくせい]が アルバイトを 始[はじ]める 前[まえ]に しなければ ならない ことは 何[なん]ですか。","o":["ビザを 更新[こうしん]する。","授業[じゅぎょう]を 休[やす]む 届[とど]けを 出[だ]す。","学生課[がくせいか]に 届[とど]けを 出[だ]す。","一週間[いっしゅうかん]の 時間[じかん]を 先生[せんせい]に 伝[つた]える。"],"ex":"「必[かなら]ず事[ごと]前[まえ]に学生[がくせい]課​に届[とど]けを出[だ]してください」. 〜にとって(Day 105)는 \"~에게 있어서\".","a":2}],"more":[{"k":"中文","title":"私[わたし]に とっての「ふるさと」","text":"「あなたに とって ふるさとは どこですか」と 聞[き]かれると、私[わたし]は いつも 答[こた]えに 困[こま]る。父[ちち]の 仕事[しごと]の 関係[かんけい]で、子[こ]どもの ころから 五回[ごかい]も 引[ひ]っ越[こ]しを したからだ。生[う]まれたのは 北海道[ほっかいどう]、小学校[しょうがっこう]は 大阪[おおさか]と 福岡[ふくおか]、中学[ちゅうがく]と 高校[こうこう]は 東京[とうきょう]だった。\n小[ちい]さい ころは、それが いやだった。やっと 友達[ともだち]が できた ころに、また 別[べつ]の 町[まち]へ 行[い]かなければ ならない。「ふるさと」の 話[はなし]を して いる 友達[ともだち]が うらやましかった。\nしかし、大人[おとな]に なった 今[いま]は 考[かんが]え方[ほう]が 変[か]わった。私[わたし]には ふるさとが ない のでは なく、ふるさとが いくつも あるのだ。どの 町[まち]に も 懐[なつ]かしい 店[みせ]や、今[いま]でも 連絡[れんらく]を くれる 友達[ともだち]が いる。旅行[りょこう]で 大阪[おおさか]へ 行[い]けば、小学校[しょうがっこう]の 帰[かえ]りに 寄[よ]った たこ焼[や]き屋[や]が まだ あって、うれしく なる。\nふるさとは 一[ひと]つで なければ ならない わけでは ない。そう 思[おも]える ように なってから、引[ひ]っ越[こ]しの 多[おお]かった 子[こ]ども時代[じだい]も、悪[わる]く なかったと 思[おも]える ように なった。","ko":"\"당신에게 고향은 어디입니까?\"라는 질문을 받으면 나는 늘 대답이 곤란하다. 아버지 일 때문에 어릴 때부터 다섯 번이나 이사를 했기 때문이다. 태어난 곳은 홋카이도, 초등학교는 오사카와 후쿠오카, 중학교와 고등학교는 도쿄였다.\n어릴 때는 그게 싫었다. 겨우 친구가 생길 무렵 또 다른 동네로 가야 한다. \"고향\" 이야기를 하는 친구들이 부러웠다.\n하지만 어른이 된 지금은 생각이 바뀌었다. 나에게는 고향이 없는 게 아니라 고향이 여러 개 있는 것이다. 어느 동네에도 그리운 가게나 지금도 연락을 주는 친구가 있다. 여행으로 오사카에 가면 초등학교 하굣길에 들렀던 다코야키 가게가 아직 있어서 기뻐진다.\n고향이 하나여야 하는 것은 아니다. 그렇게 생각할 수 있게 되고 나서, 이사가 많았던 어린 시절도 나쁘지 않았다고 생각할 수 있게 되었다.","gloss":[["ふるさと","고향"],["関係[かんけい]","관계"],["大阪[おおさか]","오사카"],["福岡[ふくおか]","후쿠오카"],["うらやましい","부럽다"],["懐[なつ]かしい","그립다"],["寄[よ]る","들르다"],["たこ焼[や]き屋[や]","다코야키 가게"],["子[こ]ども時代[じだい]","어린 시절"]],"qs":[{"c":["g:105"],"q":"子[こ]どもの ころ、筆者[ひっしゃ]は 引[ひ]っ越[こ]しを どう 思[おも]って いましたか。","o":["父[ちち]の 仕事[しごと]だから、仕方[しかた]が ないと 思[おも]った。","新[あたら]しい 町[まち]に 行[い]けるので、楽[たの]しかった。","ふるさとが 増[ふ]えるので、うれしかった。","友達[ともだち]と 別[わか]れなければ ならないので、いやだった。"],"ex":"겨우 친구가 생기면 또 이사 → 싫었다. 고향이 여럿이라는 건 어른이 된 지금의 생각이에요.","a":3},{"c":["g:105"],"q":"今[いま]の 筆者[ひっしゃ]の 考[かんが]えに 合[あ]う ものは どれですか。","o":["自分[じぶん]には ふるさとが ない。","引[ひ]っ越[こ]しは 子[こ]どもに よく ない。","住[す]んだ 町[まち]は どれも 自分[じぶん]の ふるさとだ。","ふるさとは 生[う]まれた 町[まち]だけだ。"],"ex":"「ふるさとがないのではなく、ふるさとがいくつもあるのだ」. 〜わけではない(Day 95).","a":2}]},{"k":"長文","title":"外国人[がいこくじん]に とって 難[むずか]しい 日本語[にほんご]","text":"日本語[にほんご]を 学[まな]ぶ 外国人[がいこくじん]に とって、何[なに]が いちばん 難[むずか]しいのだろうか。漢字[かんじ]、敬語[けいご]、助詞[じょし]など、いろいろ 考[かんが]えられるが、ある 日本語[にほんご]学校[がっこう]で 留学生[りゅうがくせい]に 聞[き]いた ところ、意外[いがい]な 答[こた]えが 多[おお]かった。それは「はっきり 言[い]わない 日本語[にほんご]」だ。\nたとえば、友達[ともだち]を 食事[しょくじ]に 誘[さそ]って「その 日[ひ]は ちょっと……」と 言[い]われた とする。日本人[にほんじん]なら、これが 断[ことわ]りだと すぐ 分[わ]かる。しかし、ある 留学生[りゅうがくせい]は「ちょっと 何[なん]ですか。ちょっと 忙[いそが]しいけど 行[い]けるのか、行[い]けないのか 分[わ]からなかった」と 話[はな]して いた。また、会社[かいしゃ]で「検討[けんとう]します」と 言[い]われて、本当[ほんとう]に 考[かんが]えて くれると 思[おも]って 待[ま]って いたら、それは 断[ことわ]りだった、という 話[はなし]も よく 聞[き]く。\n日本人[にほんじん]が はっきり 言[い]わないのは、相手[あいて]に 対[たい]する 気[き]づかいからだと 言[い]われる。直接[ちょくせつ]「行[い]けません」と 言[い]うと、相手[あいて]が 傷[きず]つくかもしれない。だから、言葉[ことば]を 途中[とちゅう]で 止[と]めて、相手[あいて]に 気持[きも]ちを 察[さっ]して もらうのだ。\nしかし、この 気[き]づかいは、同[おな]じ 文化[ぶんか]の 中[なか]でしか うまく いかない。外国人[がいこくじん]に 対[たい]しては、かえって 相手[あいて]を 困[こま]らせて しまう ことも ある。最近[さいきん]は、職場[しょくば]で 外国人[がいこくじん]と 一緒[いっしょ]に 働[はたら]く 日本人[にほんじん]も 増[ふ]えて いる。相手[あいて]を 思[おも]いやる 気持[きも]ちは 大切[たいせつ]に しながらも、「理由[りゆう]を 添[そ]えて、はっきり 伝[つた]える」 練習[れんしゅう]も、私[わたし]たち 日本人[にほんじん]に 必要[ひつよう]なのかもしれない。","ko":"일본어를 배우는 외국인에게 무엇이 가장 어려울까. 한자, 경어, 조사 등 여러 가지를 생각할 수 있지만, 어느 일본어 학교에서 유학생에게 물어보았더니 뜻밖의 대답이 많았다. 그것은 \"분명하게 말하지 않는 일본어\"다.\n예를 들어 친구를 식사에 초대했는데 \"그날은 좀……\"이라는 말을 들었다고 하자. 일본인이라면 이것이 거절이라는 것을 바로 안다. 하지만 어느 유학생은 \"좀 뭐요? 좀 바쁘지만 갈 수 있다는 건지, 못 간다는 건지 몰랐어요\"라고 말했다. 또 회사에서 \"검토하겠습니다\"라는 말을 듣고 정말 생각해 주는 줄 알고 기다렸더니 그것은 거절이었다는 이야기도 자주 듣는다.\n일본인이 분명하게 말하지 않는 것은 상대에 대한 배려 때문이라고 한다. 직접 \"못 갑니다\"라고 하면 상대가 상처받을지도 모른다. 그래서 말을 중간에 멈추고 상대가 마음을 헤아려 주게 하는 것이다.\n그러나 이 배려는 같은 문화 안에서만 잘 통한다. 외국인에게는 오히려 상대를 곤란하게 만들어 버리는 경우도 있다. 최근에는 직장에서 외국인과 함께 일하는 일본인도 늘고 있다. 상대를 생각하는 마음은 소중히 하면서도 \"이유를 덧붙여 분명하게 전하는\" 연습도 우리 일본인에게 필요할지도 모른다.","gloss":[["学[まな]ぶ","배우다"],["助詞[じょし]","조사"],["〜た ところ","~했더니"],["意外[いがい]","뜻밖"],["誘[さそ]う","권하다, 초대하다"],["断[ことわ]り","거절"],["検討[けんとう]","검토"],["〜に 対[たい]する","~에 대한"],["気[き]づかい","배려"],["直接[ちょくせつ]","직접"],["傷[きず]つく","상처받다"],["察[さっ]する","헤아리다"],["文化[ぶんか]","문화"],["かえって","오히려"],["職場[しょくば]","직장"],["思[おも]いやる","생각해 주다"],["添[そ]える","덧붙이다"]],"qs":[{"c":["g:105"],"q":"留学生[りゅうがくせい]に とって 難[むずか]しい 日本語[にほんご]とは、どんな ものですか。","o":["最後[さいご]まで はっきり 言[い]わない 言[い]い方[かた]","敬語[けいご]の 使[つか]い方[かた]","漢字[かんじ]が 多[おお]い 文章[ぶんしょう]","助詞[じょし]の 使[つか]い方[かた]"],"ex":"「意外[いがい]な答[こた]え…それは『はっきり言[い]わない日本語[にほんご]』だ」. 한자·경어·조사는 예상되는 답으로 나온 것이에요.","a":0},{"c":["g:105"],"q":"「検討[けんとう]します」に ついて、文章[ぶんしょう]の 内容[ないよう]と 合[あ]う ものは どれですか。","o":["いつも 本当[ほんとう]に 考[かんが]えて くれる という 意味[いみ]だ。","会社[かいしゃ]では 使[つか]っては いけない。","断[ことわ]る 意味[いみ]で 使[つか]われる ことが ある。","留学生[りゅうがくせい]は すぐ 意味[いみ]が 分[わ]かる。"],"ex":"\"검토하겠습니다\"를 믿고 기다렸더니 거절이었다는 이야기. 즉 거절 뜻으로 쓰이기도 한다.","a":2},{"c":["g:104"],"q":"日本人[にほんじん]が はっきり 言[い]わない 理由[りゆう]は 何[なん]だと 書[か]いて ありますか。","o":["相手[あいて]の 気持[きも]ちを 考[かんが]えるから","外国人[がいこくじん]と 話[はな]すのが 苦手[にがて]だから","本当[ほんとう]の 気持[きも]ちが 分[わ]からないから","理由[りゆう]を 説明[せつめい]するのが 面倒[めんどう]だから"],"ex":"「相手[あいて]に対[たい]する気[き]づかいからだ」. 〜に対[たい]して(Day 104).","a":0},{"c":["g:105"],"q":"筆者[ひっしゃ]が 言[い]いたい ことは 何[なん]ですか。","o":["日本人[にほんじん]は 外国人[がいこくじん]に 気[き]づかいを する 必要[ひつよう]は ない。","はっきり 言[い]わない 日本語[にほんご]は 使[つか]うべきでは ない。","外国人[がいこくじん]は 日本[にほん]の 文化[ぶんか]を もっと 学[まな]ぶべきだ。","相手[あいて]を 思[おも]いやりつつ、理由[りゆう]を 言[い]って はっきり 伝[つた]える ことも 必要[ひつよう]だ。"],"ex":"마지막 문장: 배려는 소중히 하면서도 이유를 덧붙여 분명히 전하는 연습도 필요. 배려를 버리라는 게 아니에요.","a":3}]}]},
{"id":"b108","after":108,"lv":"N3","k":"短文","title":"イベントの 連絡[れんらく]","text":"ボランティアの みなさんへ\n今週[こんしゅう] 土曜日[どようび]の 海岸[かいがん]の 清掃活動[せいそうかつどう]は、台風[たいふう]が 近[ちか]づいて いる ため 中止[ちゅうし]します。\n代[か]わりの 日[ひ]は 来週[らいしゅう] 土曜日[どようび]を 予定[よてい]して いますが、天気[てんき]に よっては 変[か]わる ことも あります。決[き]まり次第[しだい]、メールで お知[し]らせします。\nなお、すでに 配[くば]った 軍手[ぐんて]と ゴミ袋[ぶくろ]は、その 日[ひ]まで 持[も]って いて ください。","ko":"자원봉사자 여러분께\n이번 주 토요일 해안 청소 활동은 태풍이 다가오고 있어서 취소합니다.\n대체일은 다음 주 토요일로 예정하고 있지만, 날씨에 따라서는 바뀔 수도 있습니다. 정해지는 대로 메일로 알려 드리겠습니다.\n또한 이미 나눠 드린 목장갑과 쓰레기봉투는 그날까지 가지고 계세요.","gloss":[["ボランティア","자원봉사자"],["海岸[かいがん]","해안"],["清掃活動[せいそうかつどう]","청소 활동"],["近[ちか]づく","다가오다"],["中止[ちゅうし]","중지"],["代[か]わり","대신"],["〜に よっては","~에 따라서는"],["配[くば]る","나눠 주다"],["軍手[ぐんて]","목장갑"]],"qs":[{"c":["g:102"],"q":"この 連絡[れんらく]から 分[わ]かる ことは 何[なん]ですか。","o":["清掃活動[せいそうかつどう]は 来週[らいしゅう] 土曜日[どようび]に 必[かなら]ず 行[おこな]う。","軍手[ぐんて]と ゴミ袋[ぶくろ]を 返[かえ]さなければ ならない。","台風[たいふう]でも 活動[かつどう]を 行[おこな]う。","次[つぎ]の 活動[かつどう]の 日[ひ]は まだ はっきり 決[き]まって いない。"],"ex":"다음 주 토요일은 \"예정\"이고 날씨에 따라 바뀔 수 있음. 〜によって(Day 102).","a":3}],"more":[{"k":"中文","title":"駅前[えきまえ]を はじめ","text":"私[わたし]の 住[す]む 町[まち]では、ここ 数年[すうねん]で 外国人[がいこくじん]観光客[かんこうきゃく]が 急[きゅう]に 増[ふ]えた。駅前[えきまえ]を はじめ、商店街[しょうてんがい]や 古[ふる]い 寺[てら]の 周[まわ]りにも、大[おお]きな スーツケースを 引[ひ]いた 人[ひと]たちを よく 見[み]かける。\n観光客[かんこうきゃく]が 増[ふ]えて、町[まち]の 店[みせ]は 喜[よろこ]んで いる。閉[し]めようと 考[かんが]えて いた 和菓子屋[わかしや]が、外国人[がいこくじん]に 人気[にんき]が 出[で]て、若[わか]い 店員[てんいん]を 雇[やと]う までに なった という 話[はなし]も ある。\n一方[いっぽう]で、困[こま]って いる 住民[じゅうみん]も いる。朝[あさ] 早[はや]くから 家[いえ]の 前[まえ]で 大[おお]きな 声[こえ]で 話[はな]されたり、ゴミを 置[お]いて いかれたり する ことが あるからだ。私[わたし]の 祖母[そぼ]も「家[いえ]の 庭[にわ]を 勝手[かって]に 写真[しゃしん]に 撮[と]られた」と 怒[おこ]って いた。\n観光客[かんこうきゃく]を 増[ふ]やす ことだけを 考[かんが]えるのでは なく、住[す]んで いる 人[ひと]と 来[く]る 人[ひと]の 両方[りょうほう]が 気持[きも]ちよく 過[す]ごせる 町[まち]に する ための ルール作[つく]りが、これからは 必要[ひつよう]だろう。","ko":"내가 사는 동네에서는 최근 몇 년 사이 외국인 관광객이 갑자기 늘었다. 역 앞을 비롯해 상점가나 오래된 절 주변에서도 큰 여행 가방을 끄는 사람들을 자주 본다.\n관광객이 늘어서 동네 가게들은 기뻐하고 있다. 문을 닫으려고 생각하던 화과자 가게가 외국인에게 인기를 얻어 젊은 점원을 고용할 정도가 되었다는 이야기도 있다.\n한편 곤란해하는 주민도 있다. 아침 일찍부터 집 앞에서 큰 소리로 떠들거나 쓰레기를 두고 가는 일이 있기 때문이다. 우리 할머니도 \"집 마당을 멋대로 사진 찍혔다\"며 화를 냈다.\n관광객을 늘리는 것만 생각하는 게 아니라 사는 사람과 오는 사람 모두가 기분 좋게 지낼 수 있는 동네로 만들기 위한 규칙 만들기가 앞으로는 필요할 것이다.","gloss":[["数年[すうねん]","몇 년"],["観光客[かんこうきゃく]","관광객"],["〜を はじめ","~을 비롯해"],["商店街[しょうてんがい]","상점가"],["見[み]かける","보다, 눈에 띄다"],["和菓子屋[わかしや]","화과자 가게"],["雇[やと]う","고용하다"],["住民[じゅうみん]","주민"],["勝手[かって]に","멋대로"],["両方[りょうほう]","양쪽"],["ルール作[つく]り","규칙 만들기"]],"qs":[{"c":["g:108"],"q":"観光客[かんこうきゃく]が 増[ふ]えて よかった ことの 例[れい]として、何[なに]が 書[か]いて ありますか。","o":["町[まち]の ゴミが 少[すく]なく なった。","店[みせ]を やめずに 続[つづ]ける ことが できた 和菓子屋[わかしや]が ある。","祖母[そぼ]が 外国人[がいこくじん]と 友達[ともだち]に なった。","新[あたら]しい 寺[てら]が できた。"],"ex":"닫으려던 화과자 가게가 인기를 얻어 점원까지 고용했어요.","a":1},{"c":["g:108"],"q":"筆者[ひっしゃ]の 考[かんが]えに 合[あ]う ものは どれですか。","o":["住民[じゅうみん]が 我慢[がまん]するべきだ。","観光客[かんこうきゃく]を もっと 増[ふ]やすべきだ。","住民[じゅうみん]と 観光客[かんこうきゃく]が 一緒[いっしょ]に 気持[きも]ちよく 過[す]ごせる ルールが 必要[ひつよう]だ。","観光客[かんこうきゃく]は 町[まち]に 来[こ]ない ほうが いい。"],"ex":"마지막 단락. 관광객 늘리기만이 아니라 양쪽 모두를 위한 규칙 만들기가 필요하다.","a":2}]},{"k":"情報検索","title":"美術館[びじゅつかん]の 案内[あんない]","text":"【みどり市立美術館[しりつびじゅつかん]　特別展[とくべつてん]「光[ひかり]と 色[いろ]の 画家[がか]たち」】\n会期[かいき]：四月[しがつ] 五日[いつか]（土[ど]）〜 六月[ろくがつ] 十五日[じゅうごにち]（日[にち]）\n開館時間[かいかんじかん]：九時[くじ]半[はん]〜十[じゅう]七[しち]時[じ]（入館[にゅうかん]は 十[じゅう]六[ろく]時半[じはん]まで）　※ 金[きん]・土曜日[どようび]は 二[に]十[じゅう]時[じ]まで（入館[にゅうかん]は 十[じゅう]九[く]時半[じはん]まで）\n休館日[きゅうかんにち]：毎週[まいしゅう] 月曜日[げつようび]（ただし 五月[ごがつ] 五日[いつか]は 開館[かいかん]、五月[ごがつ] 七日[なのか]（水[すい]）は 休館[きゅうかん]）\n観覧料[かんらんりょう]（特別展[とくべつてん]）\n　一般[いっぱん]　　　　　　　　千[せん]四[よん]百[ひゃく]円[えん]（二[に]十[じゅう]人[にん] 以上[いじょう]の 団体[だんたい]は 千[せん]二[に]百[ひゃく]円[えん]）\n　高校生[こうこうせい]・大学生[だいがくせい]　　　八[はっ]百[ぴゃく]円[えん]（学生証[がくせいしょう]が 必要[ひつよう]）\n　中学生[ちゅうがくせい] 以下[いか]　　　　 無料[むりょう]\n　六[ろく]十[じゅう]五[ご]歳[さい] 以上[いじょう]　　　 七[なな]百[ひゃく]円[えん]\n◆ 特別展[とくべつてん]の チケットで、常設展[じょうせつてん]も ご覧[らん]に なれます。\n◆ 毎月[まいつき] 第三[だいさん] 日曜日[にちようび]は「家族[かぞく]の 日[ひ]」：中学生[ちゅうがくせい] 以下[いか]の 子[こ]どもと 一緒[いっしょ]に 来[き]た 大人[おとな]は 半額[はんがく]。\n◆ 会場内[かいじょうない]での 写真[しゃしん]撮影[さつえい]は できません（一部[いちぶ]の 作品[さくひん]を 除[のぞ]く）。","ko":"[미도리 시립미술관 특별전 \"빛과 색의 화가들\"]\n회기: 4월 5일(토)~6월 15일(일)\n개관 시간: 9시 반~17시(입관은 16시 반까지) ※ 금·토요일은 20시까지(입관은 19시 반까지)\n휴관일: 매주 월요일(단 5월 5일은 개관, 5월 7일(수)은 휴관)\n관람료( {"id":"b112","after":112,"lv":"N3","k":"短文","title":"工事[こうじ]の お知[し]らせ","text":"マンションに お住[す]まいの 皆様[みなさま]へ\n来週[らいしゅう] 月曜日[げつようび]から 金曜日[きんようび]にかけて、外壁[がいへき]の 工事[こうじ]を 行[おこな]います。工事中[こうじちゅう]は 大[おお]きな 音[おと]が することが あります。また、ベランダに 洗濯物[せんたくもの]を 干[ほ]す ことが できません。\n工事[こうじ]の 時間[じかん]は 毎日[まいにち] 九時[くじ]から 十[じゅう]七[しち]時[じ]までです。ご不便[ふべん]を おかけしますが、ご協力[きょうりょく]を お願[ねが]いいたします。\n管理会社[かんりかいしゃ]","ko":"맨션에 거주하시는 여러분께\n다음 주 월요일부터 금요일에 걸쳐 외벽 공사를 합니다. 공사 중에는 큰 소리가 날 수 있습니다. 또 베란다에 빨래를 널 수 없습니다.\n공사 시간은 매일 9시부터 17시까지입니다. 불편을 끼쳐 드리지만 협조를 부탁드립니다.\n관리 회사","gloss":[["マンション","맨션, 아파트"],["お住[す]まい","거주"],["〜にかけて","~에 걸쳐"],["外壁[がいへき]","외벽"],["洗濯物[せんたくもの]","빨래"],["干[ほ]す","널다"],["協力[きょうりょく]","협력"],["管理会社[かんりかいしゃ]","관리 회사"]],"qs":[{"c":["g:112"],"q":"住民[じゅうみん]が 来週[らいしゅう] 気[き]を つけなければ ならない ことは 何[なん]ですか。","o":["工事[こうじ]の 音[おと]が しない ように する。","平日[へいじつ]は ベランダに 洗濯物[せんたくもの]を 干[ほ]さない。","土曜日[どようび]と 日曜日[にちようび]に 工事[こうじ]が ある。","十[じゅう]七[しち]時[じ] 以降[いこう]は 外[そと]に 出[で]ない。"],"ex":"월~금 공사 중 베란다에 빨래를 널 수 없어요. 〜から〜にかけて(Day 112).","a":1}],"more":[{"k":"中文","title":"春[はる]から 夏[なつ]にかけて","text":"日本[にほん]では、春[はる]から 夏[なつ]にかけて「五月[ごがつ]病[びょう]」と いう 言葉[ことば]を よく 聞[き]く。四月[しがつ]に 新[あたら]しい 学校[がっこう]や 会社[かいしゃ]に 入[はい]った 人[ひと]が、五月[ごがつ]の 連休[れんきゅう]が 終[お]わる ころから、なんとなく 元気[げんき]が 出[で]なく なる 状態[じょうたい]の ことだ。\n四月[しがつ]は、新[あたら]しい 環境[かんきょう]に 慣[な]れようと 一生懸命[いっしょうけんめい]に なる。知[し]らない 人[ひと]と 話[はな]したり、新[あたら]しい 仕事[しごと]を 覚[おぼ]えたり、毎日[まいにち] 緊張[きんちょう]の 連続[れんぞく]だ。そして 連休[れんきゅう]で 一度[いちど] 気[き]が ゆるむと、それまでの 疲[つか]れが 一気[いっき]に 出[で]て くるのだと 言[い]われる。\n私[わたし]も 社会人[しゃかいじん] 一年[いちねん]目[め]の 五月[ごがつ]、朝[あさ] 起[お]きるのが つらくて 仕方[しかた]が なかった。病院[びょういん]へ 行[い]くほどでは ないと 思[おも]い、だれにも 言[い]わなかったが、ある 日[にち] 先輩[せんぱい]が「最近[さいきん]、元気[げんき]ないね」と 声[こえ]を かけて くれた。昼[ひる]ご飯[はん]を 食[た]べながら 話[はなし]を 聞[き]いて もらっただけで、少[すこ]し 気持[きも]ちが 軽[かる]く なった。\n「五月[ごがつ]病[びょう]」は 病気[びょうき]の 名前[なまえ]では ない。しかし、だれにでも 起[お]こる ことだと 知[し]って いれば、自分[じぶん]を 責[せ]めすぎずに 済[す]む。周[まわ]りの 人[ひと]に 声[こえ]を かける ことも 大切[たいせつ]だと 思[おも]う。","ko":"일본에서는 봄부터 여름에 걸쳐 \"5월병\"이라는 말을 자주 듣는다. 4월에 새 학교나 회사에 들어간 사람이 5월 연휴가 끝날 무렵부터 왠지 기운이 나지 않게 되는 상태를 말한다.\n4월은 새 환경에 익숙해지려고 열심이 된다. 모르는 사람과 이야기하거나 새 일을 익히거나, 매일 긴장의 연속이다. 그리고 연휴에 한 번 마음이 풀리면 그때까지의 피로가 한꺼번에 나온다고 한다.\n나도 사회인 1년 차 5월, 아침에 일어나는 것이 괴로워서 견딜 수가 없었다. 병원에 갈 정도는 아니라고 생각해서 아무에게도 말하지 않았는데, 어느 날 선배가 \"요즘 기운이 없네\"라고 말을 걸어 주었다. 점심을 먹으면서 이야기를 들어 준 것만으로 조금 마음이 가벼워졌다.\n\"5월병\"은 병명이 아니다. 하지만 누구에게나 일어나는 일이라는 것을 알고 있으면 자신을 지나치게 탓하지 않아도 된다. 주위 사람에게 말을 거는 것도 중요하다고 생각한다.","gloss":[["五月[ごがつ]病[びょう]","5월병"],["状態[じょうたい]","상태"],["環境[かんきょう]","환경"],["緊張[きんちょう]","긴장"],["連続[れんぞく]","연속"],["気[き]が ゆるむ","마음이 풀리다"],["一気[いっき]に","한꺼번에"],["社会人[しゃかいじん]","사회인"],["つらい","괴롭다"],["声[こえ]を かける","말을 걸다"],["責[せ]める","탓하다"],["〜ずに 済[す]む","~하지 않아도 된다"]],"qs":[{"c":["g:112"],"q":"「五月[ごがつ]病[びょう]」に なるのは どうしてだと 書[か]いて ありますか。","o":["五月[ごがつ]は 天気[てんき]が 悪[わる]いから","連休[れんきゅう]に 遊[あそ]びすぎるから","四月[しがつ]に 病気[びょうき]に なるから","四月[しがつ]の 緊張[きんちょう]の 疲[つか]れが、連休[れんきゅう]の 後[あと]に 出[で]るから"],"ex":"4월의 긴장 → 연휴에 마음이 풀림 → 피로가 한꺼번에(一気[いっき]に) 나온다.","a":3},{"c":["g:112"],"q":"筆者[ひっしゃ]は 五月[ごがつ]病[びょう]に ついて どう 考[かんが]えて いますか。","o":["新入社員[しんにゅうしゃいん]は 先輩[せんぱい]に 頼[たよ]っては いけない。","連休[れんきゅう]を なくせば 起[お]こらない。","だれにでも ある ことだと 知[し]って おく ことが 大切[たいせつ]だ。","病気[びょうき]なので すぐ 病院[びょういん]へ 行[い]くべきだ。"],"ex":"「だれにでも起[お]こることだと知[し]っていれば、自分[じぶん]を責[せ]めすぎずに済[す]む」. 〜ずに済[す]む(Day 194 미리보기).","a":2}]},{"k":"長文","title":"通勤時間[つうきんじかん]の 使[つか]い方[かた]","text":"日本[にほん]の 会社員[かいしゃいん]の 通勤時間[つうきんじかん]は、片道[かたみち] 平均[へいきん] 四十分[よんじゅっぷん]ほどだと 言[い]われる。往復[おうふく]すると 一日[いちにち] 一時間半[いちじかんはん] 近[ちか]く。一年[いちねん]に すると、三[さん]百[びゃく]時間[じかん]を 超[こ]える 計算[けいさん]だ。この 時間[じかん]を どう 過[す]ごすかで、人生[じんせい]は 少[すこ]し 変[か]わるかもしれない。\n私[わたし]の 同僚[どうりょう]の 中村[なかむら]さんは、電車[でんしゃ]の 中[なか]で 英語[えいご]の 音声[おんせい]を 聞[き]いて いる。最初[さいしょ]は 一日[いちにち] 十分[じゅっぷん]だけと 決[き]めて 始[はじ]めたそうだ。それが 三[さん]年[ねん] 続[つづ]いた 今[いま]では、海外[かいがい]の 取引先[とりひきさき]とも 電話[でんわ]で 話[はな]せる ように なった。\n一方[いっぽう]、別[べつ]の 同僚[どうりょう]の 小林[こばやし]さんは「通勤時間[つうきんじかん]は 何[なに]も しない 時間[じかん]」と 決[き]めて いる。窓[まど]の 外[そと]を ながめたり、目[め]を 閉[と]じて 休[やす]んだり する。「会社[かいしゃ]でも 家[いえ]でも 何[なに]か しなければ ならない。何[なに]も しなくて いい 時間[じかん]は、通勤[つうきん]の 時間[じかん]だけなんです」と 小林[こばやし]さんは 言[い]う。\n二人[ふたり]の 話[はなし]を 聞[き]いて、私[わたし]は どちらも 正[ただ]しいと 思[おも]った。大切[たいせつ]なのは、何[なに]を するかでは なく、その 時間[じかん]を 自分[じぶん]で 選[えら]んで いるか どうかでは ないだろうか。なんとなく スマホの 画面[がめん]を 見[み]て いるうちに、気[き]が つくと 駅[えき]に 着[つ]いて いる。そんな 毎日[まいにち]を 送[おく]って いた 私[わたし]は、その 時間[じかん]が「使[つか]われて いる」だけで、「使[つか]って いる」とは 言[い]えなかった。\n最近[さいきん]、私[わたし]は 行[い]きは 本[ほん]を 読[よ]み、帰[かえ]りは 音楽[おんがく]を 聞[き]いて 何[なに]も 考[かんが]えない ことに した。小[ちい]さな 変化[へんか]だが、会社[かいしゃ]に 着[つ]いた 時[とき]の 気分[きぶん]が 前[まえ]とは ずいぶん 違[ちが]う。","ko":"일본 회사원의 통근 시간은 편도 평균 40분 정도라고 한다. 왕복하면 하루 1시간 반 가까이. 1년으로 치면 300시간을 넘는 계산이다. 이 시간을 어떻게 보내느냐에 따라 인생은 조금 바뀔지도 모른다.\n내 동료 나카무라 씨는 전철 안에서 영어 음성을 듣고 있다. 처음에는 하루 10분만이라고 정하고 시작했다고 한다. 그것이 3년 계속된 지금은 해외 거래처와도 전화로 이야기할 수 있게 되었다.\n한편 다른 동료 고바야시 씨는 \"통근 시간은 아무것도 하지 않는 시간\"이라고 정해 두고 있다. 창밖을 바라보거나 눈을 감고 쉰다. \"회사에서도 집에서도 뭔가 해야 하잖아요. 아무것도 안 해도 되는 시간은 통근 시간뿐이에요.\"라고 고바야시 씨는 말한다.\n두 사람의 이야기를 듣고 나는 둘 다 옳다고 생각했다. 중요한 것은 무엇을 하느냐가 아니라 그 시간을 스스로 선택하고 있느냐가 아닐까. 왠지 모르게 스마트폰 화면을 보다 보면 정신을 차리니 역에 도착해 있다. 그런 매일을 보내던 나는 그 시간이 \"쓰이고 있을\" 뿐 \"쓰고 있다\"고는 할 수 없었다.\n최근 나는 출근길에는 책을 읽고, 퇴근길에는 음악을 들으며 아무것도 생각하지 않기로 했다. 작은 변화지만 회사에 도착했을 때의 기분이 전과는 꽤 다르다.","gloss":[["通勤[つうきん]","통근"],["片道[かたみち]","편도"],["平均[へいきん]","평균"],["人生[じんせい]","인생"],["同僚[どうりょう]","동료"],["音声[おんせい]","음성"],["海外[かいがい]","해외"],["ながめる","바라보다"],["画面[がめん]","화면"],["〜うちに","~하는 사이에"],["送[おく]る","보내다(생활)"],["変化[へんか]","변화"]],"qs":[{"c":["g:112"],"q":"中村[なかむら]さんの 例[れい]から 分[わ]かる ことは 何[なん]ですか。","o":["海外[かいがい]の 会社[かいしゃ]で 働[はたら]くには 英語[えいご]が 必要[ひつよう]だ。","英語[えいご]は 電車[でんしゃ]の 中[なか]で しか 勉強[べんきょう]できない。","通勤時間[つうきんじかん]は 長[なが]い ほうが いい。","短[みじか]い 時間[じかん]でも 続[つづ]ければ、力[ちから]が つく。"],"ex":"하루 10분부터 시작해서 3년 계속한 결과 해외 거래처와 통화할 수 있게 됐어요.","a":3},{"c":["g:112"],"q":"小林[こばやし]さんが 通勤時間[つうきんじかん]に 何[なに]も しないのは なぜですか。","o":["ほかに 休[やす]める 時間[じかん]が ないから","電車[でんしゃ]が 込[こ]んで いて 何[なに]も できないから","目[め]が 疲[つか]れて いるから","英語[えいご]の 勉強[べんきょう]が 嫌[きら]いだから"],"ex":"「何[なに]もしなくていい時間[じかん]は、通​勤​の時間[じかん]だけなんです」.","a":0},{"c":["g:112"],"q":"「その 時間[じかん]が『使[つか]われて いる』だけ」とは、どういう 意味[いみ]ですか。","o":["スマホで 仕事[しごと]の メールを 読[よ]んで いる。","自分[じぶん]で 決[き]めずに、なんとなく 時間[じかん]が 過[す]ぎて いる。","会社[かいしゃ]の 仕事[しごと]を 電車[でんしゃ]の 中[なか]で して いる。","ほかの 人[ひと]に 時間[じかん]を とられて いる。"],"ex":"스스로 선택하지 않고 왠지 모르게 스마트 {"id":"b115","after":115,"lv":"N3","k":"短文","title":"先生[せんせい]からの 連絡[れんらく]","text":"三[さん]年[ねん]二[に]組[くみ]の みなさん\n明日[あした]の 校外学習[こうがいがくしゅう]は、予定[よてい]どおり 行[おこな]います。学校[がっこう]に 着[つ]いたとたんに バスに 乗[の]るので、八時[はちじ]十分[じゅっぷん]までに 校庭[こうてい]に 集[あつ]まって ください。\n雨[あめ]が 降[ふ]った 場合[ばあい]は、博物館[はくぶつかん]の 見学[けんがく]だけに なりますが、お弁当[べんとう]は 必要[ひつよう]です。\n帰[かえ]りは 十[じゅう]五[ご]時[じ]ごろ 学校[がっこう]に 着[つ]く 予定[よてい]です。\n担任[たんにん] 林[はやし]","ko":"3학년 2반 여러분\n내일 현장 학습은 예정대로 갑니다. 학교에 도착하자마자 버스를 타니까 8시 10분까지 운동장에 모여 주세요.\n비가 오면 박물관 견학만 하게 되지만 도시락은 필요합니다.\n돌아오는 건 15시쯤 학교에 도착할 예정입니다.\n담임 하야시","gloss":[["校外学習[こうがいがくしゅう]","현장 학습"],["〜たとたんに","~하자마자"],["校庭[こうてい]","운동장"],["見学[けんがく]","견학"],["担任[たんにん]","담임"]],"qs":[{"c":["g:115"],"q":"雨[あめ]の 日[ひ]に 学生[がくせい]が しなければ ならない ことは 何[なん]ですか。","o":["十[じゅう]五[ご]時[じ]に 学校[がっこう]に 来[く]る。","学校[がっこう]で 待[ま]つ。","お弁当[べんとう]を 持[も]って 行[い]く。","博物館[はくぶつかん]に 一人[ひとり]で 行[い]く。"],"ex":"비가 와도 「お弁当[べんとう]は必要[ひつよう]です」. 〜たとたん(に)(Day 115)는 \"~하자마자\".","a":2}],"more":[{"k":"中文","title":"ドアを 開[あ]けた とたん","text":"先週[せんしゅう]の 金曜日[きんようび]、仕事[しごと]から 帰[かえ]って 玄関[げんかん]の ドアを 開[あ]けたとたん、足元[あしもと]に 何[なに]か 柔[やわ]らかい ものが 当[あ]たった。驚[おどろ]いて 見[み]ると、小[ちい]さな 子猫[こねこ]だった。いつの間[あいだ]にか 家[いえ]の 中[なか]に 入[はい]り込[こ]んで いたらしい。\n朝[あさ]、出[で]かける 時[とき]に 窓[まど]を 少[すこ]し 開[あ]けたままに して いた ことを 思[おも]い出[だ]した。子猫[こねこ]は そこから 入[はい]って、一日[いちにち]中[じゅう] 私[わたし]の 部屋[へや]で 過[す]ごして いたのだろう。ソファの 上[うえ]には、子猫[こねこ]の 毛[け]が たくさん 落[お]ちて いた。\n私[わたし]の アパートは ペット禁止[きんし]だ。すぐに 外[そと]に 出[だ]そうと 思[おも]ったが、子猫[こねこ]は 私[わたし]の 足[あし]に 体[からだ]を すりつけて、離[はな]れようと しない。外[そと]は 雨[あめ]も 降[ふ]り始[はじ]めて いた。結局[けっきょく]、その 夜[よる]だけ 部屋[へや]に 置[お]いて、次[つぎ]の 日[ひ]に 近所[きんじょ]の 動物病院[どうぶつびょういん]へ 連[つ]れて 行[い]く ことに した。\n病院[びょういん]の 先生[せんせい]の 話[はなし]では、首輪[くびわ]は ないが、人[ひと]に 慣[な]れて いるので、だれかに 飼[か]われて いた 可能性[かのうせい]が あると いう。今[いま]、病院[びょういん]の 入口[いりぐち]に 子猫[こねこ]の 写真[しゃしん]を はって、飼[か]い主[ぬし]を 探[さが]して もらって いる。見[み]つかるまで、少[すこ]し さびしい 気持[きも]ちで 待[ま]って いる。","ko":"지난주 금요일, 일을 마치고 돌아와 현관문을 열자마자 발밑에 뭔가 부드러운 것이 닿았다. 놀라서 보니 작은 새끼 고양이였다. 어느새 집 안에 들어와 있었던 모양이다.\n아침에 나갈 때 창문을 조금 열어 둔 채로 두었던 것이 생각났다. 고양이는 거기로 들어와 하루 종일 내 방에서 지냈던 것이리라. 소파 위에는 고양이 털이 잔뜩 떨어져 있었다.\n우리 아파트는 반려동물 금지다. 바 {"id":"b119","after":119,"lv":"N3","k":"短文","title":"お礼[れい]の メール","text":"田中[たなか]先生[せんせい]\n先日[せんじつ]は 推薦状[すいせんじょう]を 書[か]いて いただき、ありがとうございました。先生[せんせい]の おかげで、希望[きぼう]して いた 会社[かいしゃ]から 内定[ないてい]を いただく ことが できました。\n四月[しがつ]からは 新[あたら]しい 環境[かんきょう]で 働[はたら]く ことに なりますが、大学[だいがく]で 学[まな]んだ ことを 生[い]かして 頑張[がんば]ります。\n近[ちか]いうちに、改[あらた]めて ご報告[ほうこく]に 伺[うかが]いたいと 思[おも]います。\nハン・ジウ","ko":"다나카 선생님\n지난번에는 추천서를 써 주셔서 감사했습니다. 선생님 덕분에 희망하던 회사에서 내정을 받을 수 있었습니다.\n4월부터는 새로운 환경에서 일하게 되지만 대학에서 배운 것을 살려서 열심히 하겠습니다.\n가까운 시일 내에 다시 보고드리러 찾아뵙고 싶습니다.\n한지우","gloss":[["推薦状[すいせんじょう]","추천서"],["〜おかげで","~덕분에"],["内定[ないてい]","(취업) 내정"],["生[い]かす","살리다"],["近[ちか]いうちに","가까운 시일 내에"],["報告[ほうこく]","보고"],["伺[うかが]う","찾아뵙다"]],"qs":[{"c":["g:119"],"q":"ハンさんが この メールを 書[か]いた いちばんの 目的[もくてき]は 何[なん]ですか。","o":["会社[かいしゃ]に 入[はい]る ことが 決[き]まった お礼[れい]を 伝[つた]える。","推薦状[すいせんじょう]を 書[か]いて ほしいと 頼[たの]む。","先生[せんせい]に 会[あ]う 日[ひ]を 決[き]める。","新[あたら]しい 会社[かいしゃ]の 様子[ようす]を 報告[ほうこく]する。"],"ex":"추천서 덕분에 내정을 받은 것에 대한 감사. 〜おかげで(Day 119)는 좋은 결과의 원인.","a":0}],"more":[{"k":"中文","title":"雨[あめ]の おかげ","text":"去年[きょねん]の 夏[なつ]、友達[ともだち]と 三人[さんにん]で 山[やま]に 登[のぼ]る 計画[けいかく]を 立[た]てた。半年[はんとし]も 前[まえ]から 準備[じゅんび]を して、山小屋[やまごや]の 予約[よやく]も 取[と]って いた。ところが、出発[しゅっぱつ]の 前日[ぜんじつ]に なって、台風[たいふう]が 近[ちか]づいて きた。結局[けっきょく]、山登[やまのぼ]りは 中止[ちゅうし]に なった。\nみんな がっかりして いたが、せっかく 休[やす]みを 取[と]ったのだからと、山[やま]の 近[ちか]くの 小[ちい]さな 温泉町[おんせんちょう]に 泊[と]まる ことに した。雨[あめ]で 外[そと]には 出[で]られなかったので、旅館[りょかん]で 一日[いちにち]中[じゅう] 話[はなし]を した。\n学生[がくせい]の ころは 毎日[まいにち] 会[あ]って いた 三人[さんにん]だが、社会人[しゃかいじん]に なってからは なかなか ゆっくり 話[はな]す 機会[きかい]が なかった。仕事[しごと]の 悩[なや]みや 将来[しょうらい]の こと、昔[むかし]の 失敗[しっぱい]の 話[はなし]。気[き]が つくと 夜中[よなか]の 二時[にじ]に なって いた。\n山[やま]には 登[のぼ]れなかったが、あの 雨[あめ]の おかげで、私[わたし]たちは 久[ひさ]しぶりに 学生時代[がくせいじだい]に 戻[もど]れた 気[き]が する。今年[ことし]の 夏[なつ]も、山登[やまのぼ]りではなく、あの 温泉町[おんせんちょう]に また 行[い]く ことに なって いる。","ko":"작년 여름 친구와 셋이서 산에 오를 계획을 세웠다. 반년이나 전부터 준비를 해서 산장 예약도 잡아 두었다. 그런데 출발 전날이 되어 태풍이 다가왔다. 결국 등산은 취소되었다.\n모두 실망했지만 모처럼 휴가를 냈으니까 하고 산 근처의 작은 온천 마을에 묵기로 했다. 비 때문에 밖에 나갈 수 없어서 료칸에서 하루 종일 이야기를 했다.\n학생 때는 매일 만나던 세 사람이지만 사회인이 되고 나서는 좀처럼 느긋하게 이야기할 기회가 없었다. 일의 고민이나 장래 일, 옛날 실수 이야기. 정신을 차려 보니 새벽 2시가 되어 있었다.\n산에는 오르지 못했지만 그 비 덕분에 우리는 오랜만에 학생 시절로 돌아간 기분이 든다. 올여름도 등산이 아니라 그 온천 마을에 다시 가기로 되어 있다.","gloss":[["計画[けいかく]を 立[た]てる","계획을 세우다"],["山小屋[やまごや]","산장"],["結局[けっきょく]","결국"],["がっかり","실망"],["せっかく","모처럼"],["温泉町[おんせんちょう]","온천 마을"],["機会[きかい]","기회"],["悩[なや]み","고민"],["夜中[よなか]","한밤중"],["学生時代[がくせいじだい]","학생 시절"]],"qs":[{"c":["g:119"],"q":"三人[さんにん]が 温泉町[おんせんちょう]に 泊[と]まる ことに したのは なぜですか。","o":["雨[あめ]の 日[ひ]でも 山[やま]に 登[のぼ]りたかったから","山小屋[やまごや]が 閉[し]まって いたから","休[やす]みを むだに したくなかったから","温泉[おんせん]が 好[す]きだったから"],"ex":"「せっかく休[やす]みを取[と]ったのだからと」 → 모처럼 낸 휴가를 헛되게 하고 싶지 않아서.","a":2},{"c":["g:119"],"q":"「あの 雨[あめ]の おかげで」と ありますが、雨[あめ]は 三人[さんにん]に 何[なに]を くれましたか。","o":["山[やま]に 登[のぼ]る 新[あたら]しい 計画[けいかく]","ゆっくり 話[はな]す ことが できる 時間[じかん]","仕事[しごと]の 休[やす]み","温泉[おんせん]旅館[りょかん]の 割引[わりびき]"],"ex":"밖에 못 나가서 하루 종일 이야기하며 학생 시절로 돌아간 기분. 〜おかげで(Day 119).","a":1}]},{"k":"長文","title":"失敗[しっぱい]の せいに しない","text":"何[なに]か うまく いかない ことが あると、私[わたし]たちは その 原因[げんいん]を 探[さが]そうと する。「電車[でんしゃ]が 遅[おく]れた せいで 会議[かいぎ]に 間[ま]に合[あ]わなかった」「上司[じょうし]の 説明[せつめい]が 分[わ]かりにくかった せいで ミスを した」。たしかに、そう いう ことも あるだろう。\nしかし、原因[げんいん]を 自分[じぶん]の 外[そと]にばかり 探[さが]して いると、同[おな]じ 失敗[しっぱい]を 何度[なんど]も 繰[く]り返[かえ]す ことに なる。電車[でんしゃ]は これからも 遅[おく]れるし、上司[じょうし]の 説明[せつめい]が 急[きゅう]に うまく なる わけでも ない。変[か]えられない ものの せいに して いる 限[かぎ]り、次[つぎ]も 同[おな]じ 結果[けっか]に なるのだ。\n私[わたし]が 以前[いぜん] 勤[つと]めて いた 会社[かいしゃ]に、ミスが とても 少[すく]ない 先輩[せんぱい]が いた。その 先輩[せんぱい]は、何[なに]か 問題[もんだい]が 起[お]きると、まず「自分[じぶん]に できた ことは 何[なん]だったか」を 考[かんが]えて いた。電車[でんしゃ]が 遅[おく]れたなら、一本[いっぽん] 早[はや]い 電車[でんしゃ]に 乗[の]れば よかった。説明[せつめい]が 分[わ]かりにくかったなら、その 場[ば]で 質問[しつもん]すれば よかった。こう 考[かんが]えると、次[つぎ]に どう すれば いいかが はっきり する。\nもちろん、何[なん]でも 自分[じぶん]の せいだと 考[かんが]えて、自分[じぶん]を 責[せ]めすぎるのは よく ない。先輩[せんぱい]も「自分[じぶん]を 責[せ]めるのと、自分[じぶん]に できる ことを 探[さが]すのは 違[ちが]う」と よく 言[い]って いた。大切[たいせつ]なのは、だれが 悪[わる]いかでは なく、次[つぎ]に 何[なに]が できるかを 考[かんが]える ことなのだ。\n失敗[しっぱい]を 何[なに]かの せいに したく なった 時[とき]、少[すこ]しだけ 立[た]ち止[ど]まって、自分[じぶん]に できた ことを 一[ひと]つ 探[さが]して みる。それだけで、失敗[しっぱい]は 「嫌[いや]な 思[おも]い出[で]」から 「次[つぎ]への 材料[ざいりょう]」に 変[か]わるのでは ないだろうか。","ko":"뭔가 잘 안 되는 일이 있으면 우리는 그 원인을 찾으려고 한다. \"전철이 늦은 탓에 회의 시간에 못 맞췄다\" \"상사의 설명이 알기 어려웠던 탓에 실수를 했다\". 확실히 그런 일도 있을 것이다.\n하지만 원인을 자신의 바깥에서만 찾고 있으면 같은 실패를 몇 번이나 되풀이하게 된다. 전철은 앞으로도 늦을 것이고, 상사의 설명이 갑자기 좋아지는 것도 아니다. 바꿀 수 없는 것의 탓으로 하는 한, 다음에도 같은 결과가 되는 것이다.\n내가 예전에 다니던 회사에 실수가 아주 적은 선배가 있었다. 그 선배는 뭔가 문제가 생기면 먼저 \"내가 할 수 있었던 것은 무엇이었나\"를 생각했다. 전철이 늦었다면 한 대 빠른 전철을 타면 됐다. 설명이 알기 어려웠다면 그 자리에서 질문하면 됐다. 이렇게 생각하면 다음에 어떻게 하면 되는지가 분명해진다.\n물론 뭐든지 내 탓이라고 생각하며 자신을 지나치게 탓하는 것은 좋지 않다. 선배도 \"자신을 탓하는 것과 자신이 할 수 있는 일을 찾는 것은 다르다\"고 자주 말했다. 중요한 것은 누가 나쁜가가 아니라 다음에 무엇을 할 수 있는가를 생각하는 것이다.\n실패를 무언가의 탓으로 돌리고 싶어졌을 때 잠깐 멈춰 서서 내가 할 수 있었던 일을 하나 찾아본다. 그것만으로 실패는 \"싫은 추억\"에서 \"다음을 위한 재료\"로 바뀌지 않을까.","gloss":[["〜せいで","~탓에"],["上司[じょうし]","상사"],["ミス","실수"],["繰[く]り返[かえ]す","되풀이하다"],["〜限[かぎ]り","~하는 한"],["以前[いぜん]","예전"],["勤[つと]める","근무하다"],["その 場[ば]で","그 자리에서"],["責[せ]める","탓하다"],["立[た]ち止[ど]まる","멈춰 서다"],["思[おも]い出[で]","추억"]],"qs":[{"c":["g:119"],"q":"原因[げんいん]を 自分[じぶん]の 外[そと]にばかり 探[さが]すと、どう なると 筆者[ひっしゃ]は 言[い]って いますか。","o":["同[おな]じ 失敗[しっぱい]を また して しまう。","上司[じょうし]の 説明[せつめい]が 分[わ]かりやすく なる。","電車[でんしゃ]が 遅[おく]れなく なる。","自分[じぶん]を 責[せ]めすぎる ように なる。"],"ex":"「同[おな]じ失敗[しっぱい]を何度[なんど]も繰[く]り返[かえ]すことになる」. 〜せいで(Day 120)는 나쁜 결과의 원인.","a":0},{"c":["g:119"],"q":"先輩[せんぱい]は 問題[もんだい]が 起[お]きた 時[とき]、まず 何[なに]を 考[かんが]えて いましたか。","o":["上司[じょうし]に どう 報告[ほうこく]するか","どう 謝[あやま]れば いいか","自分[じぶん]に できる ことが なかったか","だれが 悪[わる]かったか"],"ex":"「まず『自分[じぶん]にできたことは何[なん]だったか』を考[かんが]えていた」.","a":2},{"c":["g:119"],"q":"「自分[じぶん]を 責[せ]めるのと、自分[じぶん]に できる ことを 探[さが]すのは 違[ちが]う」とは どういう 意味[いみ]ですか。","o":["自分[じぶん]を 責[せ]めた ほうが、早[はや]く 成長[せいちょう]できる。","自分[じぶん]が 悪[わる]いと 思[おも]う ことと、次[つぎ]の 方法[ほうほう]を 考[かんが]える ことは 別[べつ]だ。","できる ことを 探[さが]すのは 難[むずか]しい。","失敗[しっぱい]した 時[とき]は、何[なに]も 考[かんが]えない ほうが いい。"],"ex":"자책과 개선책 찾기는 다르다 → 다음 방법을 생각하는 것이 핵심.","a":1},{"c":["g:119"],"q":"筆者[ひっしゃ]の 考[かんが]えに 合[あ]う ものは どれですか。","o":["失敗[しっぱい]した 時[とき]は、次[つぎ]に 自分[じぶん]が できる ことを 考[かんが]えると いい。","ミスの 少[すく]ない 人[ひと]は 質問[しつもん]を しない。","失敗[しっぱい]の 原因[げんいん]は いつも 自分[じぶん]に ある。","電車[でんしゃ]が 遅[おく]れる ことが 多[おお]いので、早[はや]く 家[いえ]を 出[で]るべきだ。"],"ex":"「大切[たいせつ]なのは、だれが悪[わる]いかではな
