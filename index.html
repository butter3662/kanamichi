.\n◆ 전망대 입구행은 비나 바람이 강한 날은 운휴할 수 있습니다.","gloss":[["周遊[しゅうゆう]","순환"],["乗車券[じょうしゃけん]","승차권"],["運行[うんこう]","운행"],["〜おき","~간격"],["主[おも]な","주요"],["バス停[てい]","버스 정류장"],["特典[とくてん]","혜택"],["城[しろ]","성"],["歴史[れきし]","역사"],["入館料[にゅうかんりょう]","입관료"],["市場[しじょう]","시장"],["ソフトドリンク","음료"],["展望台[てんぼうだい]","전망대"],["日付[ひづけ]","날짜"],["運休[うんきゅう]","운휴"]],"qs":[{"c":["g:189"],"q":"大人[おとな]の 李[り]さんは、バスに 四[よん]回[かい] 乗[の]って、城[しろ]と 博物館[はくぶつかん]に 入[はい]ります。一日[いちにち] 乗車券[じょうしゃけん]を 使[つか]うと、バス代[だい]と 入場料[にゅうじょうりょう]の 合計[ごうけい]は いくらですか。","o":["千[せん]五[ご]百[ひゃく]八[はち]十[じゅう]円[えん]","千[せん]八[はっ]百[ぴゃく]円[えん]","千[せん]三[さん]百[びゃく]円[えん]","二[に]千[せん]三[さん]十[じゅう]円[えん]"],"ex":"승차권 700엔 + 성 400엔(500−100) + 박물관 480엔(600의 20% 할인) = 1580엔. 매번 내면 230×4=920엔이라 승차권이 더 싸요.","a":0},{"c":["g:189"],"q":"この バスに ついて 正[ただ]しい ものは どれですか。","o":["展望台[てんぼうだい]へ 行[い]く バスは 天気[てんき]が 悪[わる]いと 走[はし]らない ことが ある。","一[いち]月[がつ]は 十八時[じゅうはちじ]まで 運行[うんこう]して いる。","乗車券[じょうしゃけん]は 次[つぎ]の 日[ひ]も 使[つか]える。","乗車券[じょうしゃけん]は 観光[かんこう]案内所[あんないじょ]でしか 買[か]えない。"],"ex":"전망대행은 비·강풍 시 운휴 가능. 승차권은 구입 당일만, 12~2월은 17시까지, 버스 안에서도 구입 가능.","a":0}]}]},
{"id":"b192","after":192,"lv":"N3","k":"短文","title":"同僚[どうりょう]との 会話[かいわ]","text":"「昨日[きのう]の 発表[はっぴょう]、緊張[きんちょう]して うまく 話[はな]せなかったんだ。」\n「そんな ことないよ。分[わ]かりやすかったよ。でも、もっと 自信[じしん]を 持[も]って 話[はな]せば よかったのに。準備[じゅんび]は いちばん して いたんだから。」\n「ありがとう。次[つぎ]は そう する。」","ko":"\"어제 발표, 긴장해서 말을 잘 못 했어.\"\n\"그렇지 않아. 알기 쉬웠어. 그래도 좀 더 자신감을 갖고 말했으면 좋았을 텐데. 준비는 제일 많이 했잖아.\"\n\"고마워. 다음엔 그렇게 할게.\"","gloss":[["自信[じしん]","자신감"],["〜ば よかったのに","~했으면 좋았을 텐데"]],"qs":[{"c":["g:192"],"q":"同僚[どうりょう]は 発表[はっぴょう]に ついて どう 思[おも]って いますか。","o":["準備[じゅんび]が 足[た]りなかった。","内容[ないよう]は よかったが、もっと 堂々[どうどう]と 話[はな]せば よかった。","分[わ]かりにくかった。","緊張[きんちょう]するのは 仕方[しかた]が ない。"],"ex":"「分[わ]かりやすかった」 + 「もっと自信[じしん]を持[も]って話[はな]せばよかったのに」(Day 192 〜ばいいのに 계열의 아쉬움).","a":1}],"more":[{"k":"中文","title":"言[い]えば よかったのに","text":"高校[こうこう]の 卒業式[そつぎょうしき]の 日[ひ]、私[わたし]は ずっと お世話[せわ]に なった 担任[たんにん]の 先生[せんせい]に、お礼[れい]を 言[い]おうと 思[おも]って いた。しかし、友達[ともだち]と 写真[しゃしん]を 撮[と]ったり 話[はな]したり して いるうちに、先生[せんせい]は 職員室[しょくいんしつ]に 戻[もど]って しまった。「また 今度[こんど] 言[い]えば いい」と 思[おも]って、そのまま 学校[がっこう]を 出[で]た。\nその 「今度[こんど]」は なかなか 来[こ]なかった。大学[だいがく]に 入[はい]り、忙[いそが]しく して いるうちに 三[さん]年[ねん]が たった。そして 去年[きょねん]、先生[せんせい]が 別[べつ]の 町[まち]の 学校[がっこう]に 移[うつ]られた ことを 知[し]った。\n先日[せんじつ]、母[はは]に その 話[はなし]を すると、「手紙[てがみ]を 書[か]けば いいのに」と 言[い]われた。言[い]われて みれば、その とおりだ。会[あ]えないなら、言葉[ことば]を 届[とど]ける 方法[ほうほう]は ほかにも ある。私[わたし]は その 夜[よる]、三[さん]年[ねん]ぶりの「ありがとう」を、便[びん]せん 二[に]枚[まい]に 書[か]いた。","ko":"고등학교 졸업식 날, 나는 줄곧 신세를 진 담임 선생님께 감사 인사를 하려고 했다. 하지만 친구들과 사진을 찍거나 이야기하는 사이에 선생님은 교무실로 돌아가 버렸다. \"다음에 말하면 되지\"라고 생각하고 그대로 학교를 나왔다.\n그 \"다음\"은 좀처럼 오지 않았다. 대학에 들어가 바쁘게 지내는 사이 3년이 지났다. 그리고 작년에 선생님이 다른 도시의 학교로 옮기셨다는 것을 알았다.\n지난번 엄마에게 그 이야기를 하자 \"편지를 쓰면 되잖아\"라는 말을 들었다. 듣고 보니 그 말대로다. 만날 수 없다면 말을 전하는 방법은 그 밖에도 있다. 나는 그날 밤 3년 만의 \"감사합니다\"를 편지지 두 장에 썼다.","gloss":[["卒業式[そつぎょうしき]","졸업식"],["担任[たんにん]","담임"],["職員室[しょくいんしつ]","교무실"],["移[うつ]る","옮기다"],["〜ば いいのに","~하면 될 텐데"],["〜ぶり","~만"],["便[びん]せん","편지지"]],"qs":[{"c":["g:192"],"q":"卒業式[そつぎょうしき]の 日[ひ]、筆者[ひっしゃ]が 先生[せんせい]に お礼[れい]を 言[い]えなかったのは なぜですか。","o":["先生[せんせい]が 学校[がっこう]を 移[うつ]って いたから","恥[は]ずかしかったから","先生[せんせい]が 卒業式[そつぎょうしき]に 来[こ]なかったから","友達[ともだち]と 過[す]ごして いる 間[あいだ]に、先生[せんせい]が いなく なったから"],"ex":"사진을 찍고 이야기하는 사이(〜うちに) 선생님이 교무실로 돌아가 버렸어요.","a":3},{"c":["g:192"],"q":"母[はは]の 言葉[ことば]を 聞[き]いて、筆者[ひっしゃ]は どう しましたか。","o":["先生[せんせい]に 会[あ]いに 行[い]った。","先生[せんせい]に 手紙[てがみ]を 書[か]いた。","また 今度[こんど] 言[い]う ことに した。","先生[せんせい]に 電話[でんわ]を かけた。"],"ex":"「三​年[ねん]ぶりの『ありがとう』を、便[びん]せん二[に]枚[まい]に書[か]いた」.","a":1}]},{"k":"長文","title":"「たら」「れば」の 後悔[こうかい]","text":"「あの 時[とき] ああ すれば よかった」「もっと 勉強[べんきょう]して いたら、違[ちが]う 人生[じんせい]だったかもしれない」。人[ひと]は よく、過去[かこ]の ことを 振[ふ]り返[かえ]って 後悔[こうかい]する。特[とく]に、何[なに]かが うまく いかない 時[とき]ほど、「たら」「れば」が 頭[あたま]に 浮[う]かんで くる。\n心理学[しんりがく]の 研究[けんきゅう]に よると、人[ひと]が 長[なが]く 後悔[こうかい]するのは、「した こと」より「しなかった こと」だと いう。失敗[しっぱい]した ことは、時間[じかん]が たつと「いい 経験[けいけん]だった」と 考[かんが]えられる ように なる。しかし、挑戦[ちょうせん]しなかった ことは、「もし やって いたら」と いう 想像[そうぞう]が どんどん 大[おお]きく なって、なかなか 忘[わす]れられないのだそうだ。\n私[わたし]にも そう いう 経験[けいけん]が ある。大学生[だいがくせい]の 時[とき]、海外[かいがい]の 大学[だいがく]に 一年[いちねん] 留学[りゅうがく]する チャンスが あった。しかし、日本語[にほんご]の 授業[じゅぎょう]や アルバイトを 休[やす]むのが 不安[ふあん]で、申[もう]し込[こ]まなかった。十年[じゅうねん] たった 今[いま]でも、時々[ときどき]「あの 時[とき] 行[い]って いたら」と 思[おも]う。一方[いっぽう]、同[おな]じ 年[とし]に 挑戦[ちょうせん]して 落[お]ちた コンテストの ことは、今[いま]では 笑[わら]い話[ばなし]に なって いる。\nだからと 言[い]って、何[なん]でも 挑戦[ちょうせん]すれば いいと いう わけでは ない。準備[じゅんび]も なく 無理[むり]を すれば、別[べつ]の 後悔[こうかい]が 生[う]まれるだけだ。大切[たいせつ]なのは、迷[まよ]った 時[とき]に「十[じゅう]年[ねん]後[ご]の 自分[じぶん]は、どちらを 後悔[こうかい]するだろうか」と 一度[いちど] 考[かんが]えて みる ことでは ないだろうか。\n「たら」「れば」は、過去[かこ]を 責[せ]める ための 言葉[ことば]では なく、未来[みらい]の 自分[じぶん]の ために 使[つか]えば いいのに、と 今[いま]の 私[わたし]は 思[おも]う。","ko":"\"그때 그렇게 했으면 좋았을 텐데\" \"더 공부했더라면 다른 인생이었을지도 몰라\". 사람은 자주 과거를 돌아보며 후회한다. 특히 뭔가가 잘 안 될 때일수록 \"~했더라면\"이 머리에 떠오른다.\n심리학 연구에 따르면 사람이 오래 후회하는 것은 \"한 일\"보다 \"하지 않은 일\"이라고 한다. 실패한 일은 시간이 지나면 \"좋은 경험이었다\"고 생각할 수 있게 된다. 하지만 도전하지 않은 일은 \"만약 했더라면\"이라는 상상이 점점 커져서 좀처럼 잊을 수 없다고 한다.\n나에게도 그런 경험이 있다. 대학생 때 해외 대학에 1년 유학할 기회가 있었다. 하지만 일본어 수업이나 아르바이트를 쉬는 것이 불안해서 신청하지 않았다. 10년이 지난 지금도 가끔 \"그때 갔더라면\" 하고 생각한다. 한편 같은 해에 도전했다가 떨어진 콘테스트는 지금은 웃음거리 이야기가 되어 있다.\n그렇다고 해서 무엇이든 도전하면 된다는 것은 아니다. 준비도 없이 무리하면 다른 후회가 생길 뿐이다. 중요한 것은 망설일 때 \"10년 후의 나는 어느 쪽을 후회할까\"라고 한 번 생각해 보는 것 {"id":"b196","after":196,"lv":"N3","k":"短文","title":"会社[かいしゃ]の 理念[りねん]","text":"当社[とうしゃ]は 創業[そうぎょう] 以来[いらい]、「小[ちい]さな 会社[かいしゃ]だからこそ、一人[ひとり]ひとりの お客様[きゃくさま]を 大切[たいせつ]に する」ことを 目標[もくひょう]に して きました。\n大[おお]きな 会社[かいしゃ]のように 多[おお]くの 商品[しょうひん]を 扱[あつか]う ことは できません。しかし、お客様[きゃくさま]の 声[こえ]を 直接[ちょくせつ] 聞[き]き、すぐに 商品[しょうひん]に 生[い]かせるのは、私[わたし]たちの 強[つよ]みです。\nこれからも、この 姿勢[しせい]を 変[か]えずに 歩[あゆ]んで まいります。","ko":"저희 회사는 창업 이래 \"작은 회사이기 때문에야말로 한 분 한 분의 고객을 소중히 한다\"는 것을 목표로 해 왔습니다.\n큰 회사처럼 많은 상품을 다룰 수는 없습니다. 하지만 고객의 목소리를 직접 듣고 바로 상품에 살릴 수 있는 것은 저희의 강점입니다.\n앞으로도 이 자세를 바꾸지 않고 나아가겠습니다.","gloss":[["理念[りねん]","이념"],["当社[とうしゃ]","당사"],["創業[そうぎょう]","창업"],["以来[いらい]","이래"],["〜からこそ","~이기에야말로"],["扱[あつか]う","다루다"],["強[つよ]み","강점"],["姿勢[しせい]","자세"],["歩[あゆ]む","나아가다"],["まいる","가다(겸양)"]],"qs":[{"c":["g:196"],"q":"この 会社[かいしゃ]が 自分[じぶん]たちの 強[つよ]みだと 言[い]って いるのは 何[なん]ですか。","o":["客[きゃく]の 意見[いけん]を すぐ 商品[しょうひん]に 反映[はんえい]できる こと","値段[ねだん]が 安[やす]い こと","会社[かいしゃ]が 大[おお]きい こと","たくさんの 商品[しょうひん]を 扱[あつか]える こと"],"ex":"「お客様[きゃくさま]の声[こえ]を直[なお]接​聞[き]き、すぐに商品[しょうひん]に生[い]かせるのは、私[わたし]たちの強[つよ]みです」. 〜からこそ(Day 196).","a":0}],"more":[{"k":"中文","title":"苦手[にがて]だからこそ","text":"私[わたし]は 人前[ひとまえ]で 話[はな]すのが ずっと 苦手[にがて]だった。授業[じゅぎょう]で 発表[はっぴょう]する 時[とき]は、声[こえ]が ふるえて、言[い]いたい ことの 半分[はんぶん]も 言[い]えなかった。\nそんな 私[わたし]が、今[いま]は 市[し]の 図書館[としょかん]で、子[こ]どもたちに 絵本[えほん]の 読[よ]み聞[き]かせを して いる。きっかけは、友人[ゆうじん]に 頼[たの]まれて 一度[いちど]だけ 代[か]わりに 行[い]った ことだった。最初[さいしょ]は 緊張[きんちょう]で 声[こえ]が 小[ちい]さく なったが、子[こ]どもたちは 身[み]を 乗[の]り出[だ]して 聞[き]いて くれた。\n続[つづ]けて いるうちに 気[き]が ついた ことが ある。話[はな]すのが 苦手[にがて]だからこそ、私[わたし]は 一冊[いっさつ]ずつ 何度[なんど]も 練習[れんしゅう]する。どこで 間[ま]を 取[と]れば 子[こ]どもたちが 楽[たの]しめるか、声[こえ]の 大[おお]きさは どう するか。上手[じょうず]な 人[ひと]なら しない ような 準備[じゅんび]が、かえって いい 読[よ]み聞[き]かせに つながって いるらしい。\n苦手[にがて]な ことは、必[かなら]ずしも 避[さ]けるべき ことでは ない。苦手[にがて]だと 分[わ]かって いるからこそ、丁寧[ていねい]に 向[む]き合[あ]える ことも あるのだ。","ko":"나는 남 앞에서 말하는 것이 줄곧 서툴렀다. 수업에서 발표할 때는 목소리가 떨려서 하고 싶은 말의 절반도 하지 못했다.\n그런 내가 지금은 시 도서관에서 아이들에게 그림책 읽어 주기를 하고 있다. 계기는 친구의 부탁으로 한 번만 대신 간 것이었다. 처음에는 긴장으로 목소리가 작아졌지만 아이들은 몸을 앞으로 내밀며 들어 주었다.\n계속하는 사이에 깨달은 것이 있다. 말하기가 서툴기 때문에야말로 나는 한 권씩 몇 번이 'use strict';

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KJ=/([㐀-鿿豈-﫿々〆]+)\[([^\]]+)\]/g;
const plain=s=>s.replace(KJ,'$1');
const kanaOf=s=>s.replace(KJ,'$2');
const hasKanji=s=>/[㐀-鿿豈-﫿々]/.test(s);
const toKata=s=>[...s].map(c=>{const n=c.charCodeAt(0);return n>=0x3041&&n<=0x3096?String.fromCharCode(n+0x60):c}).join('');
const toHira=s=>[...s].map(c=>{const n=c.charCodeAt(0);return n>=0x30A1&&n<=0x30F6?String.fromCharCode(n-0x60):c}).join('');
// 후리가나를 꺼도 읽는 법 자리(높이)는 비워 둔다(빈 rt) → 켜고 끌 때 화면이 위아래로 밀리지 않음
// (빈 rt를 쓰면 아이패드 Safari에서 뒤 글자가 위로 뜨는 문제가 있어서, 읽기를 그대로 넣고 투명하게 숨긴다)
function ruby(s){ return esc(s).replace(KJ,state.settings.furi?'<ruby>$1<rt>$2</rt></ruby>':'<ruby>$1<rt class="rx" aria-hidden="true">$2</rt></ruby>'); }
const dayKey=(d=new Date())=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${dd}`};
const addDays=(k,n)=>{const [y,m,d]=k.split('-').map(Number);const t=new Date(y,m-1,d+n);return dayKey(t)};

// ---- 가나 → 로마자 (헵번식, 장음 부호) ----
const RM={};
'あa いi うu えe おo かka きki くku けke こko さsa しshi すsu せse そso たta ちchi つtsu てte とto なna にni ぬnu ねne のno はha ひhi ふfu へhe ほho まma みmi むmu めme もmo やya ゆyu よyo らra りri るru れre ろro わwa をo んn がga ぎgi ぐgu げge ごgo ざza じji ずzu ぜze ぞzo だda ぢji づzu でde どdo ばba びbi ぶbu べbe ぼbo ぱpa ぴpi ぷpu ぺpe ぽpo ゔvu'.split(' ').forEach(p=>RM[p[0]]=p.slice(1));
const SMALLY={'ゃ':'a','ゅ':'u','ょ':'o'}, SMALLV={'ぁ':'a','ぃ':'i','ぅ':'u','ぇ':'e','ぉ':'o'};
const PUNC={'、':', ','。':'.','？':'?','！':'!','〜':'~','　':' '};
function toRomaji(kana){
  const s=[...toHira(kana)]; const syl=[];
  for(let i=0;i<s.length;i++){
    const c=s[i], n=s[i+1];
    if(c==='っ'){syl.push({gem:true});continue}
    if(c==='ー'){syl.push({long:true});continue}
    if(PUNC[c]!=null){syl.push({r:PUNC[c],p:true});continue}

    if(i>=urls.length){ audioEl.onended=null; audioIdle(); return; }
    audioEl.src=urls[i++]; audioEl.defaultPlaybackRate=audioEl.playbackRate=rate||1;
    try{audioEl.preservesPitch=true; audioEl.webkitPreservesPitch=true}catch(e){}
    audioEl.onended=()=>setTimeout(next,150);
    const pr=audioEl.play(); if(pr&&pr.catch) pr.catch(()=>{});
  };
  next();
}
function prefetchClips(texts,max){ if(!AUDIO) return; const seen=new Set(); for(const t of texts){ const u=clipUrl(t); if(u&&!seen.has(u)){ seen.add(u); loadBuf(u).catch(()=>{}); if(seen.size>=(max||60)) break; } } }
function synthSpeak(text,rate){

function sfx(kind,n){
  if(!state.settings.sfx) return;
  if(kind===true) kind='ok'; else if(kind===false) kind='bad';
  try{
    if(!ctx()) return; audioIdle(2500);
    const t0=actx.currentTime+0.01;
    // 공용 출력: 살짝 울림(짧은 딜레이)을 더해 맑게
    const out=actx.createGain(); out.gain.value=0.9;
    const dl=actx.createDelay(); dl.delayTime.value=0.11; const fb=actx.createGain(); fb.gain.value=0.22; const wet=actx.createGain(); wet.gain.value=0.18;
    out.connect(actx.destination); out.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(actx.destination);
    // 종소리 같은 음 하나: 기본음 + 배음, 빠른 어택·부드러운 감쇠
    const bell=(f,at,dur,vol)=>{
      [[1,1],[2,.32],[3,.1],[4.2,.04]].forEach(([m,g])=>{
        const o=actx.createOscillator(), v=actx.createGain();
        o.type='sine'; o.frequency.setValueAtTime(f*m,t0+at);
        v.gain.setValueAtTime(0.0001,t0+at); v.gain.exponentialRampToValueAtTime(vol*g,t0+at+0.006);
        v.gain.exponentialRampToValueAtTime(0.0001,t0+at+dur*(m>1?0.55:1));
        o.connect(v); v.connect(out); o.start(t0+at); o.stop(t0+at+dur+0.05);
      });
    };
    const soft=(f1,f2,at,dur,vol)=>{ // 낮고 둥근 소리 (오답)
      const o=actx.createOscillator(), v=actx.createGain(), lp=actx.createBiquadFilter();
      o.type='triangle'; o.frequency.setValueAtTime(f1,t0+at); o.frequency.exponentialRampToValueAtTime(f2,t0+at+dur*0.8);
      lp.type='lowpass'; lp.frequency.value=900;
      v.gain.setValueAtTime(0.0001,t0+at); v.gain.exponentialRampToValueAtTime(vol,t0+at+0.02); v.gain.exponentialRampToValueAtTime(0.0001,t0+at+dur);
      o.connect(lp); lp.connect(v); v.connect(out); o.start(t0+at); o.stop(t0+at+dur+0.05);
    };
    if(kind==='ok'){ bell(1046.5,0,0.5,0.22); bell(1568,0.085,0.75,0.2); }          // 도(C6) → 솔(G6)
    else if(kind==='pair'){ // 짝 하나 맞춤: 맑은 '뽁' + 짝을 맞출 때마다 한 음씩 올라가는 음
      const sc=[783.99,880,1046.5,1174.66,1318.51,1567.98], f=sc[Math.min(Math.max((n||1)-1,0),sc.length-1)];
      const o=actx.createOscillator(), v=actx.createGain(); o.type='sine';
      o.frequency.setValueAtTime(f*0.75,t0); o.frequency.exponentialRampToValueAtTime(f*1.5,t0+0.06);
      v.gain.setValueAtTime(0.0001,t0); v.gain.exponentialRampToValueAtTime(0.12,t0+0.008); v.gain.exponentialRampToValueAtTime(0.0001,t0+0.08);
      o.connect(v); v.connect(out); o.start(t0); o.stop(t0+0.1);
      [[1,.16],[2,.04]].forEach(([m,g])=>{ const p=actx.createOscillator(), w=actx.createGain(); p.type='sine'; p.frequency.value=f*m;
        w.gain.setValueAtTime(0.0001,t0+0.03); w.gain.exponentialRampToValueAtTime(g,t0+0.036); w.gain.exponentialRampToValueAtTime(0.0001,t0+0.03+(m>1?0.18:0.32));
        p.connect(w); w.connect(out); p.start(t0+0.03); p.stop(t0+0.4); });
    }
    else if(kind==='done'){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>bell(f,i*0.1,i===3?1.1:0.5,0.18)); bell(1318.5,0.42,1.2,0.12); } // 도미솔도 + 미
    else { soft(311,233,0,0.32,0.22); soft(247,185,0.13,0.36,0.18); }               // 오답: 낮게 내려가는 두 음
  }catch(e){}
}

function candsFor(it,maxIdx){
  const info=ITEM_UNIT[it.id]||{}; const track=info.track||'day';
  const pri=[],sec=[];
  for(const u of TRACKS[track]) for(const l of u.lessons){
    if(maxIdx!=null&&l.idx>maxIdx) continue;
    for(const x of [...l.items,...(l.clozes||[])]){ if(x.kind!==it.kind||x.id===it.id) continue; (u.id===info.u?pri:sec).push(x); }
  }
  const seen=new Set(); return [...shuffle(pri),...shuffle(sec)].filter(x=>!seen.has(x.id)&&seen.add(x.id));
}
function optItems(it,field,excl,cands,n=4){
  const out=[it], vals=new Set([it[field]]), ex=new Set([it[excl]]);
  for(const c of cands){ if(out.length>=n) break; const v=c[field]; if(v==null||vals.has(v)||ex.has(c[excl])) continue; vals.add(v); out.push(c); }
  return shuffle(out);
}
const OPT={
  rd:x=>({k:x.id,h:esc(x.rd),cls:'rd'}),
  jp:x=>({k:x.id,f:x.f,cls:'jp'}),
  jpPlain:x=>({k:x.id,h:esc(x.jp),cls:'jp'}),
  kana:x=>({k:x.id,h:esc(x.kana),cls:'jp'}),
  ko:x=>({k:x.id,h:esc(x.ko),cls:'ko'}),
};
const MK={
  c2r:(it,c)=>({t:'mc',it,q:'이 글자는 어떻게 읽을까요?',pr:{big:it.jp},opts:optItems(it,'rd','rd',c).map(OPT.rd),ans:it.id}),
  r2c:(it,c)=>({t:'mc',it,q:`“${it.rd}”에 해당하는 글자는?`,pr:{text:it.rd,mono:true},opts:optItems(it,'jp','rd',c).map(OPT.jp),ans:it.id,big:true}),
  klisten:(it,c)=>({t:'mc',it,q:'들리는 소리의 글자를 고르세요',pr:{listen:it.say},opts:optItems(it,'jp','rd',c).map(OPT.jp),ans:it.id,big:true,listen:true}),
  type:(it)=>({t:'type',it,q:'로마자로 입력하세요',pr:{big:it.jp},accept:[it.rd,...(it.alts||[])]}),
  j2k:(it,c)=>({t:'mc',it,q:it.kind==='word'?'이 단어의 뜻은?':'이 표현의 뜻은?',pr:{jp:it},opts:optItems(it,'ko','jp',c).map(OPT.ko),ans:it.id}),
  k2j:(it,c)=>({t:'mc',it,q:'알맞은 일본어를 고르세요',pr:{text:it.ko},opts:optItems(it,'jp','ko',c).map(OPT.jp),ans:it.id}),
  reading:(it,c)=>({t:'mc',it,q:'이 한자 단어의 읽는 법은?',pr:{big:it.jp,plain:true},opts:optItems(it,'kana','jp',c.filter(x=>x.kanji)).map(OPT.kana),ans:it.id}),
  listen:(it,c)=>({t:'mc',it,q:'들은 말을 고르세요',pr:{listen:it.say},opts:optItems(it,'jp','kana',c).map(OPT.jp),ans:it.id,listen:true}),
  buildJ:(it,c)=>({t:'build',it,q:'일본어로 만들어 보세요',pr:{text:it.ko},ans:it.toks,tiles:tilesFor(it.toks,c,'toks'),jpTiles:true}),
  buildK:(it,c)=>({t:'build',it,q:'한국어로 옮겨 보세요',pr:{jp:it},ans:it.koT,tiles:tilesFor(it.koT,c,'koT'),jpTiles:false}),
  listenB:(it,c)=>({t:'build',it,q:'들은 문장을 만들어 보세요',pr:{listen:it.say},ans:it.toks,tiles:tilesFor(it.toks,c,'toks'),jpTiles:true,listen:true}),
  cloze:(it,c)=>({t:'mc',it,q:it.q.includes('＿')?'빈칸에 알맞은 것은?':'알맞은 것을 고르세요',pr:{cloze:it},opts:shuffle(it.o).map(o=>({k:o,h:esc(o),f:furiAuto(o),cls:'jp'})),ans:it.a}),
};
function tilesFor(ans,cands,field){
  const set=new Set(ans), extra=[];
  for(const c of cands){ for(const t of shuffle(c[field]||[])){ if(extra.length>=3) break; if(!set.has(t)&&!extra.includes(t)) extra.push(t); } if(extra.length>=3) break; }
  return shuffle([...ans,...extra]);
}
function typesFor(it){
  const L=audioOK();
  switch(it.kind){
    case 'hira':case 'kata': return ['c2r','r2c','type',...(L?['klisten']:[])];
    case 'word': return ['j2k','k2j',...(it.kanji?['reading']:[]),...(L?['listen']:[])];
    case 'phr': return ['j2k','k2j',...(it.toks.length>=3?['buildJ']:[]),...(L?['listen']:[])];
    case 'sent': return ['buildJ',...(it.koT.length>=2?['buildK']:[]),...(L?['listenB']:[])];
    case 'cloze': return ['cloze'];
  }
  return [];
}
function matchEx(items,c){
  const kana=items[0].kind==='hira'||items[0].kind==='kata';
  const pool=[...items,...c.filter(x=>x.kind===items[0].kind)];
  const L=new Set(),R=new Set(),picked=[];
  for(const x of pool){ if(picked.length>=5) break; const r=kana?x.rd:x.ko; if(L.has(x.jp)||R.has(r)) continue; L.add(x.jp);R.add(r);picked.push(x); }
  if(picked.length<3) return null;
  return {t:'match',it:picked[0],q:'짝을 맞춰 보세요',left:shuffle(picked).map(x=>({k:x.id,f:x.f,say:x.say})),right:shuffle(picked).map(x=>({k:x.id,h:esc(kana?x.rd:x.ko)})),items:picked};
}
function genLesson(L){
  const C=it=>candsFor(it,L.idx); const ex=[]; const its=L.items; const A=audioOK();
  const push=e=>{if(e) ex.push(e)};
  if(L.kind==='kana'){
    (L.groups||chunks(its,5)).forEach(g=>{ ex.push({t:'intro',items:g}); shuffle(g).forEach(it=>push(MK.c2r(it,C(it)))) });
    push(matchEx(shuffle(its),C(its[0])));
    shuffle(its).slice(0,2).forEach(it=>push(MK.r2c(it,C(it))));
    if(A) shuffle(its).slice(0,2).forEach(it=>push(MK.klisten(it,C(it))));
    shuffle(its).slice(0,2).forEach(it=>push(MK.type(it)));
  } else if(L.kind==='word'){
    // 새 단어를 한 화면에 먼저 모두 보여 준 뒤 문제를 낸다
    ex.push({t:'intro',items:its});
    shuffle(its).forEach(it=>push(MK.j2k(it,C(it))));
    const rest=[];
    rest.push(matchEx(shuffle(its),C(its[0])));
    shuffle(its).slice(0,2).forEach(it=>rest.push(MK.k2j(it,C(it))));
    shuffle(its.filter(x=>x.kanji)).slice(0,2).forEach(it=>rest.push(MK.reading(it,C(it))));
    if(A) shuffle(its).slice(0,2).forEach(it=>rest.push(MK.listen(it,C(it))));
    shuffle(rest.filter(Boolean)).forEach(push);
  } else if(L.kind==='gram'){
    // 문법 설명 → 예문은 미리 보여 주지 않고 바로 해석(일본어 → 한국어)과 빈칸 문제를 번갈아 낸다
    ex.push({t:'intro',gram:L.gram});
    const ss=shuffle(its), cz=L.clozes.slice(), n=Math.max(ss.length,cz.length);
    for(let k=0;k<n;k++){ if(ss[k]) push(MK.buildK(ss[k],C(ss[k]))); if(cz[k]) push(MK.cloze(cz[k],[])); }
  } else if(L.kind==='phr'){
    // 표현을 한 화면에 모두 보여 준 뒤, 표현마다 한 문제씩 + 짝 맞추기 (같은 문제 반복을 줄임)
    ex.push({t:'intro',items:its});
    const ts=['j2k','k2j','buildJ',...(A?['listen']:[])];
    shuffle(its).forEach((it,k)=>{ let ty=ts[k%ts.length]; if(ty==='buildJ'&&it.toks.length<3) ty='j2k'; push(MK[ty](it,C(it))); });
    push(matchEx(shuffle(its),C(its[0])));
    const b=shuffle(its.filter(x=>x.koT.length>=2))[0]; if(b) push(MK.buildK(b,C(b)));
  } else {
    return genMixed(its,L.idx,12);
  }
  return ex;
}
function genMixed(items,maxIdx,n){
  const ex=[]; const pick=shuffle(items).slice(0,n);
  pick.forEach(it=>{const ts=typesFor(it); if(!ts.length) return; const t=ts[Math.floor(Math.random()*ts.length)]; ex.push(MK[t](it,candsFor(it,maxIdx)))});
  const mi=items.filter(x=>['word','hira','kata','phr'].includes(x.kind));
  if(mi.length>=3){ const grp=mi.filter(x=>x.kind===mi[0].kind); const m=matchEx(shuffle(grp),candsFor(grp[0],maxIdx)); if(m) ex.splice(Math.min(4,ex.length),0,m); }
  return ex;
}
function genPractice(){
  const items=learnedItems().filter(x=>x.kind!=='gram');
  const score=x=>{const s=state.stats[x.id]||[0,0]; return (isHard(x.id)?6:0)+((state.hard||{})[x.id]>0?4:0)+s[1]*2-s[0]*0.5+Math.random()};
  const chosen=items.sort((a,b)=>score(b)-score(a)).slice(0,10);
  return genMixed(chosen,null,10);
}

const TEST_N=30;

  if(r) return `<section class="card tcard done"><div class="tico">${I.check}</div><div class="tbody"><b>오늘의 테스트 완료</b><small>${r.score} / ${r.total} 정답 · +${r.score} XP · 내일 0시에 새 테스트</small></div></section>`;
  if(n<10) return `<section class="card tcard lock"><div class="tico">${I.lock}</div><div class="tbody"><b>오늘의 테스트</b><small>지금까지 배운 범위에서 매일 ${TEST_N}문제. 레슨을 몇 개 더 끝내면 열려요 (${n}/10)</small></div></section>`;
  return `<section class="card tcard"><div class="tico">${I.bolt}</div><div class="tbody"><b>오늘의 테스트</b><small>배운 범위 전체에서 ${TEST_N}문제 · 정답 1개당 1 XP</small></div><button class="btn sm" data-a="test">시작</button></section>`;

function genTest(){
  const items=testItems(); const score=x=>{const s=state.stats[x.id]||[0,0]; return s[1]*1.5-s[0]*0.3+Math.random()*2};
  // 약한 항목을 조금 더 자주, 범위 전체가 고르게: 점수 순으로 절반, 나머지는 무작위
  const sorted=items.slice().sort((a,b)=>score(b)-score(a));
  const half=sorted.slice(0,Math.ceil(TEST_N/2)); const rest=shuffle(sorted.slice(half.length)).slice(0,TEST_N-half.length);
  let pick=shuffle([...half,...rest]); while(pick.length<TEST_N&&items.length) pick.push(items[Math.floor(Math.random()*items.length)]);
  pick=pick.slice(0,TEST_N);
  const ex=[]; pick.forEach(it=>{ const ts=typesFor(it); if(!ts.length) return; const ty=ts[Math.floor(Math.random()*ts.length)]; ex.push(MK[ty](it,candsFor(it,null))); });
  return ex;
}
// ---- Day 건너뛰기 테스트: 지금 Day 범위에서 15문제, 12개 이상 맞히면 그 Day를 끝낸 것으로 ----
const JUMP_N=15, JUMP_PASS=12;
function genJump(u){
  const items=[...new Map(u.lessons.flatMap(l=>[...l.items,...(l.clozes||[])]).map(x=>[x.id,x])).values()].filter(x=>x.kind!=='gram');
  const maxIdx=u.lessons[u.lessons.length-1].idx;
  let pick=shuffle(items).slice(0,JUMP_N); while(pick.length<JUMP_N&&items.length) pick.push(items[Math.floor(Math.random()*items.length)]);
  const ex=[]; pick.forEach(it=>{ const ts=typesFor(it).filter(t=>t!=='match'); if(!ts.length) return; ex.push(MK[ts[Math.floor(Math.random()*ts.length)]](it,candsFor(it,maxIdx))); });
  return ex;
}
function jumpAsk(uid){ const u=TRACKS.day.find(x=>x.id===uid); if(!u) return; const nx=TRACKS.day[TRACKS.day.indexOf(u)+1];
  modal(`<div class="isheet"><h2>${esc(u.label)} 건너뛰기</h2><p><b>${esc(u.title)}</b> 범위에서 ${JUMP_N}문제를 풀어요. <b>${JUMP_PASS}문제 이상</b> 맞히면 ${esc(u.label)}를 끝낸 것으로 하고 ${nx?esc(nx.label):'다음'}로 넘어가요.</p><button class="btn wide" data-a="jump" data-v="${u.id}">시작</button><button class="btn ghost wide" data-a="mclose">취소</button></div>`); }
function startJump(uid){
  const u=TRACKS.day.find(x=>x.id===uid); if(!u) return; mclose();
  const q=genJump(u); if(q.length<5) return;
  LS={mode:'test',jump:u,L:null,queue:q,total:q.length,idx:0,wrongs:[],done:0,mistakes:0,correct:0,start:Date.now(),day:dayKey()};
  prefetchClips(q.flatMap(exSays)); nextEx(true);
}
function finishJump(){
  const u=LS.jump, t=dayKey(), need=Math.ceil(LS.total*JUMP_PASS/JUMP_N), pass=LS.correct>=need;
  let xp=0, streakUp=false;
  if(pass){
    u.lessons.forEach(l=>{ const r=state.lessons[l.id]||{done:0}; if(!r.done){ r.done=1; r.skip=true; } state.lessons[l.id]=r; });

  }
  const seen=new Set(); LS.wrongs=LS.wrongs.filter(x=>x&&!seen.has(x.id)&&seen.add(x.id));

function noteKey(it){ if(!it||!it.id) return null; if(it.kind==='sent'||it.kind==='cloze') return it.day?'g:'+it.day:null; if(['word','phr','hira','kata'].includes(it.kind)) return it.id; return null; }

function noteAdd(it){ const k=noteKey(it); if(!k) return; state.wrongNote[k]=Date.now(); }
function noteList(){ return Object.entries(state.wrongNote).filter(([k,v])=>v>0&&noteTarget(k)).sort((a,b)=>b[1]-a[1]).map(([k])=>k); }

function startLesson(id){
  const L=LESSONS[id]; refreshHearts();
  if(L){ state.pos=state.pos||{}; state.pos[L.track]={id:L.id,at:Date.now()}; save(); }
  mclose(); LS={mode:'lesson',L,queue:[],done:0,mistakes:0,correct:0,start:Date.now()};

  if(L&&L.track==='day'&&!(state.tut&&state.tut.furi)) LS.tut={step:0,from:!!state.settings.furi};
  const me=LS, go=()=>{ if(LS===me&&!me.cur) nextEx(true); };

}
function startPractice(){
  mclose(); const q=genPractice(); if(q.length<3) return;

const TILE_PART={'は':'わ','へ':'え','を':'お'}; // 조사 타일은 실제 발음으로 읽는다
function tileSay(t){ const k=kanaOf(t); return TILE_PART[k]||k; }
function exSays(c){ const o=[]; if(c.items) c.items.forEach(x=>o.push(x.say)); if(c.it&&c.it.say) o.push(c.it.say); if(c.pr&&c.pr.listen) o.push(c.pr.listen); return o; }
function exKey(c){ return c&&c.it&&c.it.id||null; }
function reviewEx(L,avoid){
  const cur=new Set(L.items.map(x=>x.id));
  const pool=learnedItems().filter(x=>x.kind==='word'&&!cur.has(x.id)&&x.id!==avoid); if(!pool.length) return null;
  const it=pool[Math.floor(Math.random()*pool.length)];
  const ts=typesFor(it).filter(t=>MK[t]); if(!ts.length) return null;
  const ex=MK[ts[Math.floor(Math.random()*ts.length)]](it,candsFor(it,L.idx)); if(!ex) return null; ex.rev=true; return ex;
}
// 일본어 글꼴(Zen Maru Gothic)은 Google Fonts가 글자 묶음별로 나눠서, 화면에 처음 나오는 글자의 묶음을 그때 받는다.
// 받기 전에는 기기 기본 글꼴로 보였다가 바뀌어서 글자가 '깨졌다가 돌아오는' 것처럼 보인다 → 앞으로 나올 글자를 미리 받아 둔다.
const FW=new Set();
function fontWarm(txt){
  try{ if(!document.fonts||!document.fonts.load) return Promise.resolve();
    let add=''; for(const ch of String(txt)){ if(ch.charCodeAt(0)<0x3000||(ch>='가'&&ch<='힣')||FW.has(ch)) continue; FW.add(ch); add+=ch; }
    if(!add) return Promise.resolve();
    return Promise.all(['500','700'].map(w=>document.fonts.load(`${w} 20px "Zen Maru Gothic"`,add).catch(()=>{})));
  }catch(e){ return Promise.resolve(); } }
function nextEx(first){
  if(LS&&LS.queue) fontWarm(JSON.stringify(LS.queue)+(LS.cur?JSON.stringify(LS.cur):''));
  if(LS&&LS.mode==='test') LS.idx=(LS.idx||0)+1;
  const prev=first?null:LS.cur;
  let nx=LS.queue.shift();
  // 같은 단어(항목)가 연달아 나오지 않게: 다음 것이 방금 것과 같으면 뒤쪽의 다른 문제와 바꾼다
  if(nx&&prev&&exKey(nx)&&exKey(nx)===exKey(prev)){ const j=LS.queue.findIndex(x=>exKey(x)!==exKey(prev)); if(j>=0){ const t=LS.queue[j]; LS.queue[j]=nx; nx=t; } }
  // 남은 문제가 전부 같은 단어뿐이면, 전에 배운 단어 복습 문제를 사이에 끼운다
  if(nx&&prev&&exKey(nx)&&exKey(nx)===exKey(prev)&&LS.mode==='lesson'&&LS.L){ const rv=reviewEx(LS.L,exKey(prev)); if(rv){ LS.queue.unshift(nx); nx=rv; } }
  // 단어 레슨: 문제를 하나 풀 때마다 20% 확률로, 전에 배운 단어 하나를 복습 문제로 끼워 넣는다 (연속 두 번은 없음)
  if(nx&&prev&&LS.mode==='lesson'&&LS.L&&LS.L.kind==='word'&&prev.t!=='intro'&&!prev.rev&&nx.t!=='intro'&&Math.random()<0.2){
    const rv=reviewEx(LS.L,exKey(prev)); if(rv){ LS.queue.unshift(nx); nx=rv; } }
  LS.cur=nx; LS.idk=false; LS.idkAsk=false; LS.sel=null; LS.input=''; LS.built=[]; LS.checked=false; LS.ok=false; LS.m={l:null,r:null,done:new Set(),bad:null};
  if(!LS.cur) return finish();
  if(LS.cur.listen&&!audioOK()){ return nextEx(); }
  LS.anim='enter'; ui.screen='lesson'; render(); scrollTop(0);
  const c=LS.cur;
  // 화면이 바뀌자마자 일본어를 읽어 준다: 듣기 문제는 항상, 새 단어·일본어 제시 문제는 '발음 자동 재생'이 켜져 있을 때
  if(c.pr&&c.pr.listen) speak(c.pr.listen);
  else if(state.settings.autoplay){
    if(c.t==='intro') {} // 소개 화면은 자동으로 읽지 않음 (눌러서 듣기)
    else if(c.pr&&c.pr.jp) speak(c.pr.jp.say);
  }
  if(c.t==='type') setTimeout(()=>{const i=document.getElementById('tin'); if(i) i.focus()},60);
}

// ===== 단어장: 왼쪽으로 밀어 중요 표현에 넣기/빼기 =====
(function(){
  let row=null,x0=0,y0=0,dx=0,mode=null,pid=null; const TH=72;
  const reset=el=>{ el.style.transition='transform .2s ease'; el.style.transform=''; el.classList.remove('sw-ready'); setTimeout(()=>{el.style.transition='';},220); };
  document.addEventListener('pointerdown',e=>{
    const li=e.target.closest&&e.target.closest('.wbook .sw-row'); if(!li||e.button>0) return;
    row=li; x0=e.clientX; y0=e.clientY; dx=0; mode=null; pid=e.pointerId;
  });
  document.addEventListener('pointermove',e=>{
    if(!row||e.pointerId!==pid) return; const mx=e.clientX-x0, my=e.clientY-y0;
    if(!mode){ if(Math.abs(mx)<8&&Math.abs(my)<8) return; mode=Math.abs(mx)>Math.abs(my)*1.2?'h':'v'; if(mode==='v'){row=null;return;} }
    dx=Math.min(0,Math.max(-140,mx)); row.style.transform=`translateX(${dx}px)`; row.classList.toggle('sw-ready',dx<=-TH);
  });
  const end=e=>{
    if(!row||e.pointerId!==pid) return; const li=row; row=null;
    if(mode!=='h'){ return; }
    const fire=dx<=-TH; reset(li); if(!fire) return;
    li.dataset.swiped='1'; setTimeout(()=>{delete li.dataset.swiped;},350);
    const k=li.dataset.k; const add=!(state.wrongNote[k]>0);
    state.wrongNote[k]=add?Date.now():-Date.now(); save();
    haptic();
    if(ui.wbKind==='note'){ render(); return; }
    li.classList.toggle('on',add);
    const c=document.getElementById('ncount'); if(c) c.textContent=noteList().length;
    swToast(add?'중요 표현에 넣었어요':'중요 표현에서 뺐어요');
  };
  document.addEventListener('pointerup',end); document.addEventListener('pointercancel',e=>{ if(row&&e.pointerId===pid){ reset(row); row=null; } });
  // 밀기 직후 생기는 click(발음 재생 등)은 무시
  document.addEventListener('click',e=>{ const li=e.target.closest&&e.target.closest('.sw-row'); if(li&&li.dataset.swiped){ e.stopPropagation(); e.preventDefault(); } },true);
})();
function swToast(t){ let el=document.getElementById('swtoast'); if(!el){ el=document.createElement('div'); el.id='swtoast'; document.body.appendChild(el); }
  el.textContent=t; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),1400); }

function mergeState(a,b){
  const [n,o]=(a.updatedAt||0)>=(b.updatedAt||0)?[a,b]:[b,a];
  if(n.resetAt&&(o.updatedAt||0)<=n.resetAt) return normalize(JSON.parse(JSON.stringify(n)));

  for(const id in o.lessons||{}){const x=o.lessons[id], y=r.lessons[id]; if(!y||(x.done||0)>(y.done||0)) r.lessons[id]=Object.assign({},x);}
  for(const k of ['dailyXP','dailyWords']) for(const d in o[k]||{}) r[k][d]=Math.max(r[k][d]||0,o[k][d]);
  r.xp=Math.max(r.xp||0,o.xp||0);
  r.wrongNote=r.wrongNote||{}; for(const k in o.wrongNote||{}){ const x=o.wrongNote[k], y=r.wrongNote[k]; if(y==null||Math.abs(x)>Math.abs(y)) r.wrongNote[k]=x; }
  r.hard=r.hard||{}; for(const k in o.hard||{}){ const p=o.hard[k], q=r.hard[k]; if(q==null||Math.abs(p)>Math.abs(q)) r.hard[k]=p; }
  r.bonus=r.bonus||{}; for(const k in o.bonus||{}){ const p=o.bonus[k], q=r.bonus[k]; if(!q){ r.bonus[k]=p; continue; } const late=(p.at||0)>(q.at||0)?p:q, pf=x=>x.pf||(x.total&&x.score===x.total); r.bonus[k]=Object.assign({},late,{score:p.v===q.v?Math.max(p.score||0,q.score||0):late.score,pf:pf(p)||pf(q)?1:0}); }
  r.pos=r.pos||{}; for(const k in o.pos||{}){ const p=o.pos[k], q=r.pos[k]; if(!q||(p.at||0)>(q.at||0)) r.pos[k]=p; }
  r.tut=Object.assign({},o.tut||{},r.tut||{});
  r.buys=Object.assign({},o.buys||{},r.buys||{}); r.frozen=Object.assign({},o.frozen||{},r.frozen||{}); // 산 기록·보호권 쓴 날은 합집합
  r.tests=r.tests||{}; for(const d in o.tests||{}){ if(!r.tests[d]||(o.tests[d].score||0)>(r.tests[d].score||0)) r.tests[d]=o.tests[d]; }
  for(const id in o.stats||{}){const s=r.stats[id]||[0,0], t=o.stats[id]; r.stats[id]=[Math.max(s[0],t[0]),Math.max(s[1],t[1])];}
  if((o.lastDay||'')>(r.lastDay||'')){r.lastDay=o.lastDay; r.streak=o.streak;} else if(o.lastDay===r.lastDay) r.streak=Math.max(r.streak||0,o.streak||0);
  r.updatedAt=Math.max(a.updatedAt||0,b.updatedAt||0);
  return normalize(r);
}
const tableMissing=err=>!!err&&(err.code==='42P01'||err.code==='PGRST205'||/does not exist|schema cache|Could not find the table/i.test(err.message||''));
async function pushRemote(){
  if(!ACC.user||!ACC.sb||ACC.status==='notable') return;
  if(ACC.busy){ACC.dirty=true;return}
  ACC.busy=true; ACC.status='saving'; updateSyncLabel();
  const uid=ACC.user.id;
  try{
    const {error}=await ACC.sb.from(SB_TABLE).upsert({user_id:uid,data:trimState(JSON.parse(JSON.stringify(state))),updated_at:new Date().toISOString()});
    ACC.status=error?(tableMissing(error)?'notable':'error'):'synced';
  }catch(e){ACC.status='error'}
  ACC.busy=false; updateSyncLabel();
  if(ACC.dirty&&ACC.user&&ACC.user.id===uid){ACC.dirty=false; pushRemote();}
}
async function pullRemote(first){
  if(!ACC.user||!ACC.sb) return;
  const uid=ACC.user.id; ACC.status='loading'; updateSyncLabel();
  let res; try{ res=await ACC.sb.from(SB_TABLE).select('data,updated_at').eq('user_id',uid).maybeSingle(); }catch(e){ res={error:e}; }
  if(!ACC.user||ACC.user.id!==uid) return;
  if(res.error){ ACC.status=tableMissing(res.error)?'notable':'error'; updateSyncLabel(); return; }
  const remote=res.data?normalize(res.data.data):null;
  if(first&&!remote) offerGuestImport();
  const merged=remote?mergeState(state,remote):state;
  const changedLocal=JSON.stringify(merged)!==JSON.stringify(state);
  state=merged; saveLocal();
  if(changedLocal&&typeof warmVoice==='function') warmVoice();
  if(!remote||JSON.stringify(trimState(JSON.parse(JSON.stringify(merged))))!==JSON.stringify(trimState(JSON.parse(JSON.stringify(remote))))) await pushRemote();
  else { ACC.status='synced'; updateSyncLabel(); }
  if(changedLocal&&(ui.screen==='home')){ render(); scrollToCur(); }
}
function offerGuestImport(){
  const g=loadLocal(lsKey('guest'));

  if(localStorage.getItem(MODEKEY+'.imported:'+ACC.user.id)) return;
  modal(`<div class="isheet"><h2>이 기기의 기록 가져오기</h2><p>로그인 없이 학습한 기록(${g.xp} XP, 완료한 레슨 ${Object.values(g.lessons).filter(x=>x.done).length}개)이 이 기기에 있어요. 이 계정으로 가져올까요?</p>

function boot(){
  try{ if(window.claude&&typeof window.claude.use==='function') claude.use('tts').then(t=>{ctts=t||null}).catch(()=>{}); }catch(e){}
  let guestMode=false; try{guestMode=localStorage.getItem(MODEKEY)==='guest'}catch(e){}
  if(!window.supabase||!window.supabase.createClient){ if(guestMode) enterApp(null); else showGate(); return; }
  try{ ACC.sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{storageKey:AUTHKEY,persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}); }
  catch(e){ ACC.sb=null; if(guestMode) enterApp(null); else showGate(); return; }
  let resolved=false;
  ACC.sb.auth.onAuthStateChange((ev,session)=>{
    setTimeout(()=>{ // 콜백 안에서 바로 supabase를 다시 부르면 잠금이 걸릴 수 있어 한 박자 미룬다
      if(ev==='PASSWORD_RECOVERY'){ if(session) enterApp(session.user); newPwDialog(); return; }
      if(session&&session.user){ resolved=true; enterApp(session.user); }
      else if(ev==='SIGNED_OUT'){ if(ACC.entered&&ACC.entered!=='guest') showGate('login'); }
      else if(ev==='INITIAL_SESSION'&&!resolved){ resolved=true; if(guestMode) enterApp(null); else showGate(); }
    },0);
  });
  setTimeout(()=>{ if(!resolved){ resolved=true; if(guestMode) enterApp(null); else showGate(); } },6000);
}
// 새 버전 확인: 홈 화면 앱이 예전 페이지를 붙잡고 있을 때 업데이트를 알려 준다
let NEWVER=null;
function checkUpdate(){
  if(!/^https?:/.test(location.protocol)) return;
  fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{
    const m=t.match(/APP_VERSION='([\d.]+)'/); if(m&&m[1]!==APP_VERSION){ NEWVER=m[1]; showUpdateBar(); tryAutoUpdate(); }
  }).catch(()=>{});
}
function showUpdateBar(){
  if(!NEWVER||document.getElementById('upd')) return;
  const d=document.createElement('div'); d.id='upd'; d.className='upd';
  d.innerHTML=`<span>새 버전 v${esc(NEWVER)}이 나왔어요</span><button data-a="doupdate">업데이트</button>`;
  document.body.appendChild(d);
}
ACC_H.doupdate=()=>doUpdate();
async function doUpdate(){
  if(ACC.user){ clearTimeout(saveTimer); try{ await Promise.race([pushRemote(),new Promise(r=>setTimeout(r,1500))]); }catch(e){} }
  location.replace(location.pathname+'?v='+NEWVER);
}
// 자동 업데이트: 새 버전이 나오면 학습 중이 아닐 때 바로, 학습 중이면 레슨이 끝나고 홈으로 돌아오는 순간 업데이트한다
function updBusy(){
  if(['lesson','result','bonus','gate','boot'].includes(ui.screen)) return true;
  const m=document.getElementById('modal'); if(m&&m.classList.contains('show')) return true;
  if(Object.values(DL).some(st=>st.busy&&!st.quiet)) return true; // 목소리 받는 중
  const a=document.activeElement; if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&a.value) return true;
  return false;
}
function tryAutoUpdate(){
  if(!NEWVER||updBusy()) return;
  // 같은 버전으로 계속 새로고침되는 일(서버 캐시가 늦게 바뀔 때)을 막기: 같은 버전은 10분에 한 번만
  try{ const o=JSON.parse(localStorage.getItem('kanamichi.autoupd')||'{}'); if(o.v===NEWVER&&Date.now()-o.at<10*60*1000) return;
    localStorage.setItem('kanamichi.autoupd',JSON.stringify({v:NEWVER,at:Date.now()})); }catch(e){}
  const d=document.getElementById('upd'); if(d) d.innerHTML=`<span>새 버전 v${esc(NEWVER)}으로 업데이트하는 중…</span>`;
  doUpdate();
}
setInterval(()=>{ if(document.visibilityState==='visible') checkUpdate(); },10*60*1000);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible') checkUpdate();
  if(!ACC.user) return;
  if(document.visibilityState==='hidden'){ clearTimeout(saveTimer); pushRemote(); }
  else if(ui.screen==='home') pullRemote(false);
});
