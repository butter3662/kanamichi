<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>かなみち — 일본어 한 걸음씩</title>
<meta name="description" content="하루 25단어로 시작하는 일본어 학습. 단어·문법·생활 표현, XP와 연속 학습일.">
<meta name="theme-color" content="#FAF6EE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="かなみち">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#FAF6EE;--card:#fff;--ink:#23262F;--sub:#6E717B;--line:#E7E0D2;--line2:#D8CFBD;--pri:#E4572E;--prid:#B23F1C;--ok:#3C9446;--okd:#2B6F33;--okbg:#E4F3E0;--bad:#D24B43;--badd:#A23630;--badbg:#FBE4E1;--blue:#3A5BA0;--blued:#283F73;--bluebg:#E7EEFA;--gold:#E3A019;--fire:#F07A1A;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5}
.jp{font-family:'Zen Maru Gothic','Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:disabled{cursor:default}
svg{width:1em;height:1em;display:block}
ruby rt{font-size:.5em;color:var(--sub);font-weight:500;letter-spacing:0}
#app{position:fixed;top:0;bottom:0;left:0;right:0;max-width:540px;margin:0 auto;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;display:flex;flex-direction:column}
#app>*{flex-shrink:0}
.top{position:sticky;top:0;z-index:10;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));border-bottom:2px solid var(--line)}
.logo{font-weight:700;font-size:20px;color:var(--pri);line-height:1.1}
.logo small{display:block;font-family:'Noto Sans KR',sans-serif;font-size:11px;color:var(--sub);font-weight:500}
.stats{display:flex;gap:4px}
.st{display:flex;align-items:center;gap:5px;background:none;border:0;padding:6px 8px;border-radius:10px;font-weight:800;font-size:15px}
.st svg{font-size:20px}
.st.fire{color:#B9B2A5}.st.fire.on{color:var(--fire)}
.st.xp{color:var(--gold)}.st.heart{color:var(--bad)}
.st:active{background:var(--line)}
.main{flex:1;padding:14px 16px 110px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:540px;display:flex;background:#fff;border-top:2px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px 0;border-radius:12px;color:#A39C8F;font-size:11px;font-weight:700}
.nav button svg,.nav .glyph{font-size:24px;height:24px;line-height:24px}
.nav .glyph{font-weight:700}
.nav button.on{color:var(--pri);background:#FDEEE8}
/* 오늘의 목표 */
.daily{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:18px}
.drow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlab{font-size:12px;color:var(--sub);font-weight:700}
.dval{font-size:16px}.dval b{font-size:22px}.dxp{color:var(--gold);font-weight:700;font-size:14px}
.bar{height:12px;background:#EFE9DC;border-radius:8px;overflow:hidden;margin-top:10px}
.bar div{height:100%;background:linear-gradient(90deg,#F2A541,var(--pri));border-radius:8px;transition:width .4s}
.dok{margin-top:8px;font-size:13px;color:var(--ok);font-weight:700}
/* 유닛 */
.unit{margin-bottom:14px}
.ubanner{background:var(--c);color:#fff;border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 4px 0 var(--cd)}
.ulab{font-size:12px;font-weight:800;letter-spacing:.06em;opacity:.85}
.ubanner h2{margin:2px 0 0;font-size:20px;line-height:1.25}
.ubanner p{margin:2px 0 0;font-size:13px;opacity:.9}
.ubtn{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);color:#fff;border-radius:12px;padding:6px 10px;font-size:11px;font-weight:700}
.ubtn svg{font-size:20px}
.path{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 0 18px}
.nwrap.hascur{margin-top:30px}
.nwrap{position:relative;display:flex;flex-direction:column;align-items:center;width:96px}
.node{width:70px;height:64px;border-radius:50%;border:0;background:var(--c);color:#fff;box-shadow:0 6px 0 var(--cd);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;transition:transform .08s}
.node svg{font-size:30px}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 var(--cd)}
.node.done{background:var(--gold);box-shadow:0 6px 0 #B07A0C}
.node.locked{background:#E3DDD0;color:#B2AA9A;box-shadow:0 6px 0 #CBC3B3}
.node.cur{position:relative}
.node.cur:before{content:'';position:absolute;inset:-9px;border-radius:50%;border:5px solid color-mix(in srgb,var(--c) 30%,transparent);animation:pulse 1.6s ease-in-out infinite;will-change:transform;pointer-events:none}
@keyframes pulse{50%{transform:scale(1.07)}}
.nlab{font-size:12px;color:var(--sub);font-weight:700;margin-top:10px;white-space:nowrap}
.bubble{position:absolute;top:-34px;background:#fff;color:var(--c);border:2px solid var(--line);font-weight:800;font-size:13px;padding:3px 12px;border-radius:10px;animation:bob 1.6s infinite;z-index:2}
.bubble:after{content:'';position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:#fff;border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-4px)}}
/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;padding:13px 18px;background:var(--pri);color:#fff;font-weight:800;font-size:16px;box-shadow:0 4px 0 var(--prid);letter-spacing:.02em}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--prid)}
.btn:disabled,.btn.dis{background:#E3DDD0;color:#A59D8E;box-shadow:0 4px 0 #CDC5B5}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:12px}
.btn.wide{width:100%}
.btn.col{background:var(--c);box-shadow:0 4px 0 var(--cd)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.danger{background:var(--bad);box-shadow:0 4px 0 var(--badd)}
.btn.ghost.danger{background:#fff;color:var(--bad)}
.btn.okb{background:var(--ok);box-shadow:0 4px 0 var(--okd)}
.btn.badb{background:var(--bad);box-shadow:0 4px 0 var(--badd)}
.link{background:none;border:0;color:var(--sub);font-weight:700;font-size:13px;padding:6px;margin-bottom:6px;text-decoration:underline}
.mini{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--bluebg);color:var(--blue);display:inline-flex;align-items:center;justify-content:center}
.mini svg{font-size:18px}
/* 카드 */
.card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:14px}
.card h2,.card h3{margin:0 0 8px}.card h3{font-size:16px}
.card p{margin:0 0 10px;color:#4A4D57}
.hint{font-size:13px;color:var(--sub);margin:8px 0}
.hint.c{text-align:center}
.seg{display:flex;background:#EFE9DC;border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font-weight:700;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--line)}
.seg.small{width:max-content;margin:0 auto 6px}.seg.small button{padding:6px 16px;font-size:14px}
.wl{list-style:none;margin:0;padding:0}
.wl li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #F1ECE2}
.wl li:last-child{border-bottom:0}
.wl .jp{font-size:18px;min-width:96px}
.wl .m{flex:1;font-size:14px}.wl .m small{display:block;color:var(--sub);font-size:12px}
.wl .cnt{color:var(--bad);font-weight:800;font-size:13px}
details{border-top:1px solid var(--line);padding:8px 0}
details summary{font-weight:700;cursor:pointer;padding:4px 0}
details summary small{color:var(--sub);font-weight:500}
/* 문자표 */
.ch{font-size:14px;color:var(--sub);margin:16px 0 8px}
.cgrid{display:grid;gap:6px}
.cc{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;box-shadow:0 2px 0 var(--line)}
.cc .jp{font-size:24px;line-height:1.2}
.cc small{font-size:11px;color:var(--sub)}
.cc.lr{background:#FFF3DA;border-color:#F0D48E}
.cc.empty{visibility:hidden}
/* 프로필 */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sc{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center}
.sc .ic{grid-row:span 2;font-size:26px}
.sc b{font-size:20px;line-height:1.1}.sc small{color:var(--sub);font-size:12px}
.ic.fire{color:var(--fire)}.ic.xp{color:var(--gold)}.ic.blue{color:var(--blue)}.ic.green{color:var(--ok)}
.week{display:flex;gap:8px;align-items:flex-end;height:130px}
.wcol{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.wv{font-size:11px;color:var(--sub);height:16px}
.wb{flex:1;width:100%;max-width:30px;background:#F2EDE3;border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.wb div{width:100%;background:#F2B15C;border-radius:8px}
.wb div.today{background:var(--pri)}
.wcol small{font-size:12px;color:var(--sub);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;font-weight:700}
.chip.on{border-color:var(--pri);color:var(--pri);background:#FDEEE8}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #F1ECE2}
.setrow small{display:block;color:var(--sub);font-size:12px;font-weight:400}
.sw{flex:none;width:52px;height:30px;border-radius:16px;border:0;background:#DDD6C8;position:relative;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.sw.on{background:var(--ok)}.sw.on i{left:25px}
.sync{font-size:12px;color:var(--sub);margin:12px 0}
.foot{font-size:12px;color:var(--sub);text-align:center}
/* 모달 */
#modal{position:fixed;inset:0;z-index:50;display:none}
#modal.show{display:block}
.ov{position:absolute;inset:0;background:rgba(30,28,24,.45);animation:fade .2s}
.sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:540px;max-height:86vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.sheet h2{margin:4px 0 6px;font-size:22px}
.sheet p{color:#4A4D57;margin:0 0 14px}
.sheet .btn+.btn{margin-top:10px}
.lsheet .ulab{color:var(--c)}
.big{font-size:26px!important;color:var(--ink)!important;letter-spacing:.08em}
.gsheet h3{font-size:15px;margin:16px 0 6px;color:var(--sub)}
.gl{margin:0 0 16px;padding-left:20px}.gl li{margin-bottom:8px;color:#3F424B}
.hearts{display:flex;gap:6px;justify-content:center;font-size:34px;color:var(--bad);margin:6px 0 12px}
.hearts .off{color:#E5DED1}
.sweek{display:flex;justify-content:space-between;margin:10px 0 14px}
.sweek div{display:flex;flex-direction:column;align-items:center;gap:4px}
.sweek span{width:36px;height:36px;border-radius:50%;background:#F1ECE2;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}
.sweek .on span{background:var(--fire)}
.sweek small{font-size:12px;color:var(--sub)}
/* 레슨 */
.lesson{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.lhead{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 16px 6px}
.iconbtn{background:none;border:0;color:#A9A193;font-size:26px;padding:4px}
.prog{flex:1;height:16px;background:#EBE4D6;border-radius:10px;overflow:hidden}
.prog div{height:100%;background:var(--ok);border-radius:10px;transition:width .35s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.lh{display:flex;align-items:center;gap:4px;color:var(--bad);font-weight:800}
.lh svg{font-size:22px}.lh.inf{font-size:22px}.lh.prac{font-size:13px;color:var(--blue);background:var(--bluebg);padding:3px 8px;border-radius:8px}
.lbody{flex:1;padding:12px 18px 18px}
.lfoot{position:sticky;bottom:0;padding:14px 18px calc(16px + env(safe-area-inset-bottom));border-top:2px solid var(--line);background:var(--bg)}
.lfoot.ok{background:var(--okbg);border-color:#BFE2B7}
.lfoot.bad{background:var(--badbg);border-color:#F1C3BE}
.q{font-size:21px;margin:6px 0 14px;line-height:1.35}
.tag{display:inline-block;background:#FDEEE8;color:var(--pri);font-weight:800;font-size:12px;padding:3px 10px;border-radius:8px;letter-spacing:.04em}
.pr{display:flex;flex-direction:column;align-items:center;margin:4px 0 18px}
.bigch{font-size:84px;line-height:1.15;font-weight:700}
.ptext{font-size:22px;font-weight:700;text-align:center;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 18px}
.ptext.mono{font-family:ui-monospace,Menlo,monospace;font-size:34px;letter-spacing:.04em}
.pjp{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 18px}
.pjp .jp{font-size:30px;line-height:1.7}
.prd{color:var(--sub);font-size:14px;margin-top:6px;text-align:center}
.bigspk{width:96px;height:96px;border-radius:24px;border:0;background:var(--blue);color:#fff;font-size:46px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 var(--blued)}
.bigspk svg{font-size:48px}
.bigspk:active{transform:translateY(3px);box-shadow:0 2px 0 var(--blued)}
.slow{margin-top:12px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:5px 14px;font-weight:700;font-size:13px;color:var(--blue)}
.cloze{font-size:26px;line-height:2;text-align:center;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 16px}
.blank{display:inline-block;min-width:64px;border-bottom:3px solid var(--blue);margin:0 4px;line-height:1.3;color:var(--blue);font-weight:700}
.cko{color:var(--sub);margin-top:8px;font-size:15px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:13px 14px;box-shadow:0 3px 0 var(--line);font-size:17px;min-height:56px}
.opt .num{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);color:#B1A999;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.opt .oh{flex:1}
.opt.jp .oh{font-size:22px;line-height:1.6}
.opt.bigopt .oh{font-size:32px;text-align:center}
.opt.rd .oh{font-family:ui-monospace,Menlo,monospace;font-size:20px;text-align:center}
.opt.sel{border-color:#86A6E0;background:var(--bluebg);box-shadow:0 3px 0 #86A6E0}
.opt.right{border-color:#8DCB85;background:var(--okbg);box-shadow:0 3px 0 #8DCB85}
.opt.wrong{border-color:#EBA19A;background:var(--badbg);box-shadow:0 3px 0 #EBA19A}
.tin{width:100%;font-size:26px;padding:14px 16px;border:2px solid var(--line2);border-radius:16px;background:#fff;text-align:center;font-family:ui-monospace,Menlo,monospace;outline:none}
.tin:focus{border-color:var(--blue)}
.ans{min-height:120px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);background:repeating-linear-gradient(transparent 0 58px,var(--line) 58px 60px);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;margin-bottom:18px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{background:#fff;border:2px solid var(--line2);border-radius:12px;padding:8px 13px;font-size:17px;box-shadow:0 3px 0 var(--line2);line-height:1.5}
.jp .tile,.tile.jp{font-size:20px}
.tile.ghost{background:#EDE7DB;color:transparent;box-shadow:none;border-color:#EDE7DB}
.tile.ghost ruby rt{color:transparent}
.match{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:12px}
.mt{display:flex;align-items:center;justify-content:center;text-align:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 8px;min-height:68px;box-shadow:0 3px 0 var(--line);font-size:15px;font-weight:600}
.mt.jp{font-size:21px;font-weight:500;line-height:1.6}
.mt.sel{border-color:#86A6E0;background:var(--bluebg)}
.mt.mbad{border-color:#EBA19A;background:var(--badbg);animation:shake .3s}
.mt.mdone{opacity:.35;border-color:#8DCB85;background:var(--okbg);box-shadow:none}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.mhint{text-align:center;color:var(--sub);font-size:14px;font-weight:700;padding:6px}
.fb .fbt{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:900;margin-bottom:4px}
.fb .fbt svg{font-size:24px}
.lfoot.ok .fbt{color:var(--okd)}.lfoot.bad .fbt{color:var(--badd)}
.fbd{font-size:15px;margin-bottom:12px;line-height:1.7}
.fbd .jp{font-size:19px}.fbd small{color:var(--sub)}
.lfoot.ok .fbd{color:#2E5E33}.lfoot.bad .fbd{color:#7E2C27}
/* 소개 카드 */
.icards{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.icard{position:relative;flex:1 1 120px;max-width:180px;background:#fff;border:2px solid var(--line);border-radius:20px;padding:16px 10px 14px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center}
.icard .bigch{font-size:68px}
.ird{font-family:ui-monospace,Menlo,monospace;font-size:22px;font-weight:700;color:var(--blue)}
.inote{font-size:12.5px;color:var(--sub);margin-top:6px;text-align:center;line-height:1.45}
.ispk{position:absolute;top:10px;right:10px;color:var(--blue);font-size:18px}
.wcards{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.wcard{position:relative;background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 16px 14px;box-shadow:0 4px 0 var(--line);text-align:center}
.wcard .mini{position:absolute;top:12px;right:12px}
.wjp{font-size:34px;line-height:1.8;font-weight:500}
.wko{font-size:18px;font-weight:700;margin-top:4px}
.sbox{position:relative;background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px 16px;margin-top:14px;text-align:center;box-shadow:0 4px 0 var(--line)}
.sbox .mini{position:absolute;top:12px;right:12px}

/* ===== 쫀득한 손맛 (iOS·듀오링고 느낌) =====
   누르면 살짝 눌렸다가, 놓으면 스프링처럼 통통 튀며 돌아온다. */
:root{--spring:cubic-bezier(.34,1.56,.64,1);--springs:cubic-bezier(.22,1.2,.36,1)}
*{-webkit-tap-highlight-color:transparent}
button,a,.opt,.mt,.tile,.node,.chip,.vopt,.wl li{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.btn,.opt,.mt,.tile,.chip,.vopt,.nav button,.node,.bigspk,.mini,.st,.iconbtn,.furi,.sw,.gocur,.seg button,.ndel{
  transition:transform .3s var(--spring),box-shadow .3s var(--spring),background-color .15s,border-color .15s,color .15s,opacity .2s}
.btn:active:not(:disabled),.opt:active,.mt:active,.tile:active,.chip:active,.vopt:active,.nav button:active,.node:active,.bigspk:active,.mini:active,.iconbtn:active,.furi:active,.gocur:active,.seg button:active{transition-duration:.05s,.05s,.1s,.1s,.1s,.1s}
.btn:active:not(:disabled){transform:translateY(4px) scale(.985);box-shadow:0 0 0 var(--prid)}
.btn.col:active{box-shadow:0 0 0 var(--cd)}.btn.okb:active{box-shadow:0 0 0 var(--okd)}.btn.badb:active,.btn.danger:active{box-shadow:0 0 0 var(--badd)}
.btn.ghost:active{box-shadow:0 0 0 var(--line)}
.opt:active:not(:disabled){transform:translateY(3px) scale(.985);box-shadow:0 0 0 var(--line)}
.mt:active:not(:disabled){transform:translateY(3px) scale(.97);box-shadow:0 0 0 var(--line)}
.tile:active{transform:translateY(3px) scale(.95);box-shadow:0 0 0 var(--line2)}
.node:active{transform:translateY(5px) scale(.96);box-shadow:0 1px 0 var(--cd)}
.chip:active,.vopt:active,.mini:active,.iconbtn:active,.furi:active,.seg button:active{transform:scale(.93)}
.nav button:active{transform:scale(.9)}
.nav button.on svg{animation:navpop .35s var(--spring)}
@keyframes navpop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
/* 고른 보기·방금 맞춘 짝이 '톡' 튄다 */
.opt.sel,.mt.sel{animation:selpop .28s var(--spring)}

.mt.mbad{animation:shake2 .32s ease}
.mt.jd{animation:pairdone .45s var(--spring)}

/* 새 문제는 옆에서 미끄러져 들어오고, 채점 판은 아래에서 통 튀어 오른다 */
.lbody.enter>*{animation:exin .26s cubic-bezier(.2,.8,.3,1) both}
@keyframes exin{from{transform:translateX(16px);opacity:0}}
.lfoot.pop{animation:footpop .3s var(--springs)}

.lfoot.pop .fbt svg{animation:navpop .4s var(--spring)}
.prog div{transition:width .45s var(--spring)}
/* 시트·대화상자도 스프링으로 */
.sheet{animation:up .32s var(--springs)}
@keyframes up{from{transform:translate(-50%,60%)}}
@media (min-width:768px){ .sheet{animation:pop2 .28s var(--spring)} @keyframes pop2{from{transform:translate(-50%,-50%) scale(.88);opacity:0}} }
.sw i{transition:left .3s var(--spring)}
.gocur{transition:opacity .2s,transform .3s var(--spring)}
.card,.vopt{transition:transform .3s var(--spring)}

/* 스크롤 성능: 화면 밖 Day는 그리지 않음, 움직이는 요소는 합성 레이어로 */
.unit{content-visibility:auto;contain-intrinsic-size:auto 900px}

/* iPad: 위 띠를 왼쪽 메뉴와 같은 흰색으로. iPadOS 26은 왼쪽 위(창 조절 버튼 자리)에 흰빛 흐림을 덧씌우는데,
   띠가 흰색이면 그 흐림이 보이지 않는다 */
@media (min-width:768px){
  .top{background:#fff}
  body:before{background:#fff}
}

/* 위 띠가 항상 맨 위에: iOS에서 스크롤 중 움직이는 요소(스위치·카드)가 띠 위로 뚫고 보이던 문제 */
.top{z-index:100;isolation:isolate;-webkit-transform:translateZ(0);transform:translateZ(0);will-change:transform}
.nav{z-index:90}
#modal{z-index:300}
.upd{z-index:310}
#swtoast{z-index:320}
body:before{z-index:150}

/* 위 띠는 화면에 고정(스크롤 영역 밖). 위로 당겨서 튕길 때 띠가 따라 내려와 왼쪽 메뉴를 덮던 문제 해결.
   내용은 띠 높이만큼 아래에서 시작하고, 튕김은 띠 아래에서만 일어난다. */
.top{position:fixed;top:0;left:0;right:0;margin:0 auto;max-width:540px;height:calc(62px + env(safe-area-inset-top));box-sizing:border-box;transform:none;will-change:auto}
.top+.main{margin-top:calc(62px + env(safe-area-inset-top))}
@media (min-width:768px){
  .top{max-width:none;height:calc(70px + env(safe-area-inset-top))}
  .top+.main{margin-top:calc(70px + env(safe-area-inset-top))}
}

{"id":"b7","after":7,"lv":"N5","k":"短文","title":"ユミさんの メモ","text":"リンさん\n私[わたし]は 今[いま] 図書館[としょかん]に います。五時[ごじ]に 家[いえ]へ 帰[かえ]ります。\n冷[つめ]たい ジュースは 台所[だいどころ]に あります。リンさんの かばんは 私[わたし]の 部屋[へや]に あります。\nユミ","ko":"린 씨\n저는 지금 도서관에 있어요. 5시에 집에 돌아가요.\n차가운 주스는 부엌에 있어요. 린 씨 가방은 제 방에 있어요.\n유미","gloss":[["冷[つめ]たい","차갑다"],["ジュース","주스"],["台所[だいどころ]","부엌"]],"qs":[{"c":["部屋","ある","g:7"],"q":"リンさんの かばんは どこに ありますか。","o":["台所[だいどころ]","ユミさんの 部屋[へや]","図書館[としょかん]","リンさんの 部屋[へや]"],"ex":"「リンさんのかばんは私[わたし]の部屋[へや]にあります」. 메모를 쓴 사람은 유미 씨니까 \"私[わたし]の部屋[へや]\"는 유미 씨의 방이에요. 물건은 あります, 사람은 います(Day 7).","a":1}],"more":[{"k":"中文","title":"キムさんの 毎日[まいにち]","text":"私[わたし]は キムです。韓国人[かんこくじん]です。今[いま]、東京[とうきょう]の 大学[だいがく]の 学生[がくせい]です。\n毎朝[まいあさ] 六時[ろくじ]半[はん]に 起[お]きます。七時[しちじ]に 朝[あさ]ご飯[はん]を 食[た]べます。八時[はちじ]に 家[いえ]を 出[で]ます。駅[えき]まで 歩[ある]きます。駅[えき]から 大学[だいがく]まで 電車[でんしゃ]で 行[い]きます。\n授業[じゅぎょう]は 九時[くじ]から 三時[さんじ]までです。昼[ひる]は 大学[だいがく]の 食堂[しょくどう]で 友達[ともだち]と 昼[ひる]ご飯[はん]を 食[た]べます。\n三時[さんじ]から 六時[ろくじ]まで 駅[えき]の 前[まえ]の 店[みせ]で 働[はたら]きます。仕事[しごと]は 少[すこ]し 大変[たいへん]です。でも、楽[たの]しいです。\n晩[ばん]は 家[いえ]で 日本語[にほんご]を 勉強[べんきょう]します。そして、十一時[じゅういちじ]に 寝[ね]ます。土曜日[どようび]と 日曜日[にちようび]は 大学[だいがく]へ 行[い]きません。","ko":"저는 김입니다. 한국인입니다. 지금 도쿄의 대학 학생입니다.\n매일 아침 6시 반에 일어납니다. 7시에 아침밥을 먹습니다. 8시에 집을 나섭니다. 역까지 걷습니다. 역에서 대학까지 전철로 갑니다.\n수업은 9시부터 3시까지입니다. 점심은 대학 식당에서 친구와 먹습니다.\n3시부터 6시까지 역 앞 가게에서 일합니다. 일은 조금 힘듭니다. 하지만 즐겁습니다.\n밤에는 집에서 일본어를 공부합니다. 그리고 11시에 잡니다. 토요일과 일요일은 대학에 가지 않습니다.","gloss":[["東京[とうきょう]","도쿄"],["食堂[しょくどう]","식당"],["前[まえ]","앞"],["少[すこ]し","조금"],["大変[たいへん]","힘듦"],["でも","하지만"],["そして","그리고"],["楽[たの]しい","즐겁다"],["正[ただ]しい","옳다, 맞다"]],"qs":[{"c":["働く","店","g:6"],"q":"キムさんは 午後[ごご] 四時[よじ]ごろ 何[なに]を して いますか。","o":["食堂[しょくどう]で ご飯[はん]を 食[た]べて います。","店[みせ]で 仕事[しごと]を して います。","家[いえ]で 寝[ね]て います。","大学[だいがく]で 勉強[べんきょう]を して います。"],"ex":"「三時[さんじ]から六時[ろくじ]まで駅[えき]の前[まえ]の店[みせ]で働[はたら]きます」. 4시는 3시~6시 사이니까 가게에서 일하는 중이에요. 働[はたら]く(일하다)를 仕事[しごと]をする로 바꿔 말했어요.","a":1},{"c":["電車","歩く","g:5"],"q":"キムさんに ついて 正[ただ]しい ものは どれですか。","o":["毎朝[まいあさ] 七時[しちじ]に 起[お]きます。","大学[だいがく]へは 電車[でんしゃ]と 歩[ある]きで 行[い]きます。","昼[ひる]ご飯[はん]は 家[いえ]で 食[た]べます。","日曜日[にちようび]も 大学[だいがく]へ 行[い]きます。"],"ex":"「駅[えき]まで歩[ある]きます。駅[えき]から大学[だいがく]まで電車[でんしゃ]で行[い]きます」 → 걷기와 전철을 함께 써요. 7시는 아침밥 시간, 점심은 대학 식당, 주말에는 대학에 가지 않아요.","a":1}]},{"k":"情報検索","title":"スポーツセンターの お知[し]らせ","text":"【みどり町[ちょう] スポーツセンター】\nプール　　　　月曜日[げつようび]〜金曜日[きんようび]　午前[ごぜん] 十時[じゅうじ]〜午後[ごご] 九時[くじ]\n　　　　　　　土曜日[どようび]・日曜日[にちようび]　午前[ごぜん] 九時[くじ]〜午後[ごご] 六時[ろくじ]\nテニスコート　毎日[まいにち]　午前[ごぜん] 八時[はちじ]〜午後[ごご] 五時[ごじ]\n※ 水曜日[すいようび]は プールが 休[やす]みです。\n※ 子[こ]どもは 午後[ごご] 五時[ごじ]までです。\n※ プールで 泳[およ]ぐ ときは 帽子[ぼうし]が 要[い]ります。","ko":"[미도리초 스포츠센터]\n수영장 월~금 오전 10시~오후 9시 / 토·일 오전 9시~오후 6시\n테니스장 매일 오전 8시~오후 5시\n※ 수요일은 수영장이 쉽니다.\n※ 어린이는 오후 5시까지입니다.\n※ 수영장에서 수영할 때는 모자가 필요합니다.","gloss":[["スポーツセンター","스포츠센터"],["お知[し]らせ","안내"],["プール","수영장"],["テニスコート","테니스장"],["帽子[ぼうし]","모자"],["要[い]る","필요하다"],["〜とき","~할 때"]],"qs":[{"c":["g:7"],"q":"会社員[かいしゃいん]の 林[はやし]さんは 仕事[しごと]の あと、夜[よる] 七時[しちじ]から プールで 泳[およ]ぎたいです。林[はやし]さんが 行[い]く ことが できるのは いつですか。","o":["火曜日[かようび]","土曜日[どようび]","水曜日[すいようび]","日曜日[にちようび]"],"ex":"밤 7시에 수영장이 열려 있는 건 평일(월~금, 오후 9시까지)뿐이에요. 그중 수요일은 쉬어요. 주말은 오후 6시에 닫아요. 그래서 화요일이에요.","a":0}]}]},
{"id":"b10","after":10,"lv":"N5","k":"短文","title":"先生[せんせい]からの お知[し]らせ","text":"みなさんへ\n明日[あした]は テストです。テストは 簡単[かんたん]です。九時[くじ]に 教室[きょうしつ]へ 来[き]て ください。\n鉛筆[えんぴつ]と 消[け]しゴムを 持[も]って 来[き]て ください。辞書[じしょ]は 要[い]りません。\n山田[やまだ]","ko":"여러분께\n내일은 시험입니다. 시험은 쉽습니다. 9시에 교실로 오세요.\n연필과 지우개를 가지고 오세요. 사전은 필요 없습니다.\n야마다","gloss":[["テスト","시험"],["教室[きょうしつ]","교실"],["〜て ください","~해 주세요"],["消[け]しゴム","지우개"],["持[も]って 来[く]る","가지고 오다"],["要[い]る","필요하다"]],"qs":[{"c":["鉛筆","辞書","g:8"],"q":"学生[がくせい]は 明日[あした] 何[なに]を 持[も]って 行[い]きますか。","o":["鉛筆[えんぴつ]と 消[け]しゴム","鉛筆[えんぴつ]と 辞書[じしょ]","辞書[じしょ]と 消[け]しゴム","鉛筆[えんぴつ]と 消[け]しゴムと 辞書[じしょ]"],"ex":"「鉛筆[えんぴつ]と消[け]しゴムを持[も]って来[き]てください。辞書[じしょ]は要[い]りません」. 사전은 필요 없다고 했으니 빼야 해요.","a":0}],"more":[{"k":"中文","title":"私[わたし]の 町[まち]","text":"私[わたし]の 町[まち]は 東京[とうきょう]の 近[ちか]くに あります。小[ちい]さい 町[まち]ですが、とても 静[しず]かで きれいです。\n駅[えき]の 前[まえ]に 大[おお]きい スーパーが あります。スーパーの 野菜[やさい]と 果物[くだもの]は 安[やす]くて おいしいです。私[わたし]は 毎週[まいしゅう] 土曜日[どようび]に そこで 買[か]い物[もの]を します。\n町[まち]に 古[ふる]い 図書館[としょかん]が あります。建物[たてもの]は 古[ふる]いですが、本[ほん]が 多[おお]いです。日曜日[にちようび]は 図書館[としょかん]で 本[ほん]を 読[よ]みます。\nでも、私[わたし]の 町[まち]には 映画館[えいがかん]が ありません。映画[えいが]を 見[み]る ときは、電車[でんしゃ]で 隣[となり]の 町[まち]へ 行[い]きます。電車[でんしゃ]で 二十分[にじゅっぷん]です。少[すこ]し 不便[ふべん]ですが、私[わたし]は この 町[まち]が 好[す]きです。","ko":"우리 동네는 도쿄 근처에 있습니다. 작은 동네지만 아주 조용하고 깨끗합니다.\n역 앞에 큰 슈퍼가 있습니다. 슈퍼의 채소와 과일은 싸고 맛있습니다. 저는 매주 토요일에 거기서 장을 봅니다.\n동네에 오래된 도서관이 있습니다. 건물은 낡았지만 책이 많습니다. 일요일에는 도서관에서 책을 읽습니다.\n하지만 우리 동네에는 영화관이 없습니다. 영화를 볼 때는 전철로 옆 동네에 갑니다. 전철로 20분입니다. 조금 불편하지만 저는 이 동네가 좋습니다.","gloss":[["近[ちか]く","근처"],["〜が","~지만"],["スーパー","슈퍼"],["安[やす]くて","싸고"],["毎週[まいしゅう]","매주"],["買[か]い物[もの]","장보기"],["建物[たてもの]","건물"],["でも","하지만"],["隣[となり]","옆"],["〜とき","~할 때"],["少[すこ]し","조금"]],"qs":[{"c":["買う","土曜日","g:6"],"q":"この 人[ひと]は 土曜日[どようび]に 何[なに]を しますか。","o":["図書館[としょかん]で 本[ほん]を 読[よ]みます。","電車[でんしゃ]で 東京[とうきょう]へ 行[い]きます。","隣[となり]の 町[まち]で 映画[えいが]を 見[み]ます。","スーパーで 野菜[やさい]や 果物[くだもの]を 買[か]います。"],"ex":"「毎週[まいしゅう]土曜日[どようび]にそこで買[か]い物[もの]をします」. そこ는 앞 문장의 슈퍼예요. 買[か]い物[もの]をする를 \"채소나 과일을 산다\"로 바꿔 말했어요. 도서관은 일요일이에요.","a":3},{"c":["g:9","g:10"],"q":"この 人[ひと]の 町[まち]に ついて 正[ただ]しい ものは どれですか。","o":["図書館[としょかん]は 新[あたら]しいです。","スーパーの 野菜[やさい]は 高[たか]いです。","映画館[えいがかん]は ありません。","大[おお]きい 町[まち]です。"],"ex":"「私[わたし]の町[まち]には映画館[えいがかん]がありません」. 작은 동네(小[ちい]さい町[まち]), 도서관은 오래됐고(古[ふる]い), 채소는 싸요(安[やす]い). い형용사 반대말을 이용한 오답이에요(Day 9).","a":2}]},{"k":"情報検索","title":"レストランの メニュー","text":"【レストラン さくら　昼[ひる]の メニュー】（午前[ごぜん] 十一時[じゅういちじ]〜午後[ごご] 二時[にじ]）\nカレー　　　　　　　八[はっ]百[ぴゃく]円[えん]\nラーメン　　　　　　七[なな]百[ひゃく]円[えん]\n魚[さかな]の 定食[ていしょく]　　　　　九[きゅう]百[ひゃく]五[ご]十[じゅう]円[えん]\n肉[にく]の 定食[ていしょく]　　　　　千百円[せんひゃくえん]\nサラダ　　　　　　　三[さん]百[びゃく]円[えん]\nコーヒー・紅茶[こうちゃ]　　　二百円[にひゃくえん]\n※ 定食[ていしょく]には ご飯[はん]と スープが あります。\n※ 午後[ごご] 一時[いちじ]から 二時[にじ]までは コーヒーが 百円[ひゃくえん]です。","ko":"[레스토랑 사쿠라 점심 메뉴] (오전 11시~오후 2시)\n카레 800엔 / 라멘 700엔 / 생선 정식 950엔 / 고기 정식 1100엔 / 샐러드 300엔 / 커피·홍차 200엔\n※ 정식에는 밥과 수프가 있습니다.\n※ 오후 1시부터 2시까지는 커피가 100엔입니다.","gloss":[["メニュー","메뉴"],["カレー","카레"],["定食[ていしょく]","정식"],["サラダ","샐러드"],["紅茶[こうちゃ]","홍차"],["スープ","수프"],["円[えん]","엔"]],"qs":[{"c":["g:9"],"q":"リーさんは 午後[ごご] 一時[いちじ]半[はん]に 店[みせ]へ 行[い]きます。ご飯[はん]が ある 料理[りょうり]と コーヒーを 頼[たの]みます。いちばん 安[やす]いのは いくらですか。","o":["千[せん]五[ご]十[じゅう]円[えん]","千[せん]百[ひゃく]五[ご]十[じゅう]円[えん]","九[きゅう]百[ひゃく]円[えん]","千[せん]二[に]百[ひゃく]円[えん]"],"ex":"밥이 있는 요리는 정식이에요(※). 싼 건 생선 정식 950엔. 1시 반은 커피가 100엔인 시간이라 950+100=1050엔이에요.","a":0}]}]},
{"id":"b14","after":14,"lv":"N5","k":"短文","title":"母[はは]からの メモ","text":"キムさんへ\n今日[きょう]は 雨[あめ]ですから、洗濯[せんたく]を しないで ください。\n冷蔵庫[れいぞうこ]に ケーキが あります。弟[おとうと]と 二人[ふたり]で 食[た]べて ください。\n私[わたし]は 七時[しちじ]ごろ 帰[かえ]ります。\n母[はは]","ko":"김에게\n오늘은 비가 오니까 빨래를 하지 마세요.\n냉장고에 케이크가 있어요. 남동생과 둘이서 먹어요.\n나는 7시쯤 돌아와요.\n엄마","gloss":[["〜から","~니까(이유)"],["洗濯[せんたく]","빨래"],["〜ないで ください","~하지 마세요"],["冷蔵庫[れいぞうこ]","냉장고"],["ケーキ","케이크"],["ごろ","쯤"]],"qs":[{"c":["g:13","g:14"],"q":"キムさんは 何[なに]を しなければ なりませんか。","o":["七時[しちじ]に 帰[かえ]る。","洗濯[せんたく]を する。","ケーキを 買[か]う。","弟[おとうと]と ケーキを 食[た]べる。"],"ex":"「弟[おとうと]と二人[ふたり]で食[た]べてください」. 빨래는 하지 말라고 했어요(〜ないでください). 7시에 돌아오는 건 엄마예요. 〜てください(Day 13)는 부탁·지시예요.","a":3}],"more":[{"k":"中文","title":"雨[あめ]の 日曜日[にちようび]","text":"今日[きょう]は 日曜日[にちようび]です。朝[あさ]から 雨[あめ]が 降[ふ]って います。\n本当[ほんとう]は 今日[きょう]、家族[かぞく]と 山[やま]へ 行[い]きたかったです。でも、雨[あめ]ですから、みんな 家[いえ]に います。\n父[ちち]は 部屋[へや]で 新聞[しんぶん]を 読[よ]んで います。母[はは]は 台所[だいどころ]で 料理[りょうり]を 作[つく]って います。私[わたし]は 母[はは]を 手伝[てつだ]って います。\n弟[おとうと]は 窓[まど]から 外[そと]を 見[み]て います。弟[おとうと]は 公園[こうえん]で サッカーを したいです。でも、今日[きょう]は できません。弟[おとうと]は 少[すこ]し 寂[さび]しい 顔[かお]を して います。\n晩[ばん]ご飯[はん]は 母[はは]の カレーです。弟[おとうと]は カレーが 大好[だいす]きですから、きっと 元気[げんき]に なります。来週[らいしゅう]の 日曜日[にちようび]は 晴[は]れて ほしいです。","ko":"오늘은 일요일입니다. 아침부터 비가 내리고 있습니다.\n사실 오늘 가족과 산에 가고 싶었습니다. 하지만 비가 와서 모두 집에 있습니다.\n아빠는 방에서 신문을 읽고 있습니다. 엄마는 부엌에서 요리를 하고 있습니다. 저는 엄마를 돕고 있습니다.\n남동생은 창문으로 밖을 보고 있습니다. 남동생은 공원에서 축구를 하고 싶어 합니다. 하지만 오늘은 할 수 없습니다. 남동생은 조금 쓸쓸한 얼굴을 하고 있습니다.\n저녁밥은 엄마의 카레입니다. 남동생은 카레를 아주 좋아하니까 분명 기운이 날 겁니다. 다음 주 일요일은 맑으면 좋겠습니다.","gloss":[["本当[ほんとう]は","사실은"],["〜たかった","~하고 싶었다"],["手伝[てつだ]う","돕다"],["外[そと]","밖"],["サッカー","축구"],["できません","할 수 없습니다"],["寂[さび]しい","쓸쓸하다"],["カレー","카레"],["きっと","분명"],["元気[げんき]に なる","기운이 나다"],["〜て ほしい","~했으면 좋겠다"]],"qs":[{"c":["g:14"],"q":"今[いま]、「私[わたし]」は 何[なに]を して いますか。","o":["公園[こうえん]で 遊[あそ]んで います。","新聞[しんぶん]を 読[よ]んで います。","料理[りょうり]の 手伝[てつだ]いを して います。","外[そと]を 見[み]て います。"],"ex":"「私[わたし]は母[はは]を手伝[てつだ]っています」. 엄마는 요리 중이니까 \"요리를 돕는다\"로 바꿔 말한 선지가 정답. 신문은 아빠, 밖을 보는 건 남동생이에요. 〜ています(Day 14).","a":2},{"c":["g:12"],"q":"どうして 弟[おとうと]は 寂[さび]しい 顔[かお]を して いますか。","o":["晩[ばん]ご飯[はん]が ないから","サッカーが できないから","山[やま]へ 行[い]ったから","カレーが 嫌[きら]いだから"],"ex":"공원에서 축구를 하고 싶은데 비 때문에 오늘은 할 수 없어요. 카레는 오히려 아주 좋아해요(大好[だいす]き).","a":1}]},{"k":"情報検索","title":"天気予報[てんきよほう]","text":"【今週[こんしゅう]の 天気[てんき]】\n月曜日[げつようび]　晴[は]れ　　　暖[あたた]かい　　（二十二度[にじゅうにど]）\n火曜日[かようび]　曇[くも]り　　　少[すこ]し 寒[さむ]い（十六度[じゅうろくど]）\n水曜日[すいようび]　雨[あめ]　　　　寒[さむ]い　　　（十二度[じゅうにど]）\n木曜日[もくようび]　雨[あめ]のち晴[は]れ　　　　　（十五度[じゅうごど]）\n金曜日[きんようび]　晴[は]れ　　　暖[あたた]かい　　（二十度[にじゅうど]）\n土曜日[どようび]　雪[ゆき]　　　　とても 寒[さむ]い（三度[さんど]）\n日曜日[にちようび]　曇[くも]り　　　寒[さむ]い　　　（八度[はちど]）\n※「雨[あめ]のち晴[は]れ」は、朝[あさ]は 雨[あめ]で、午後[ごご]から 晴[は]れです。","ko":"[이번 주 날씨]\n월 맑음 따뜻함(22도) / 화 흐림 조금 추움(16도) / 수 비 추움(12도) / 목 비 후 맑음(15도) / 금 맑음 따뜻함(20도) / 토 눈 아주 추움(3도) / 일 흐림 추움(8도)\n※ \"비 후 맑음\"은 아침에는 비가 오고 오후부터 맑다는 뜻입니다.","gloss":[["今週[こんしゅう]","이번 주"],["〜度[ど]","~도(온도)"],["のち","후, 다음"],["暖[あたた]かい","따뜻하다"],["少[すこ]し","조금"]],"qs":[{"c":["晴れ","g:4"],"q":"マリアさんは 晴[は]れて、暖[あたた]かい 日[ひ]に 公園[こうえん]へ 行[い]きたいです。でも、月曜日[げつようび]は 仕事[しごと]が あります。何曜日[なんようび]に 行[い]きますか。","o":["月曜日[げつようび]","木曜日[もくようび]","土曜日[どようび]","金曜日[きんようび]"],"ex":"맑고 따뜻한 날은 월요일과 금요일이에요. 월요일은 일이 있으니 금요일. 목요일은 아침에 비가 와요.","a":3}]}]},
{"id":"b17","after":17,"lv":"N5","k":"短文","title":"お店[みせ]の お知[し]らせ","text":"【パンの 店[みせ] ひまわり】\n明日[あした] 十五日[じゅうごにち]（土曜日[どようび]）は 店[みせ]が 休[やす]みです。\n十六日[じゅうろくにち]（日曜日[にちようび]）は 朝[あさ] 七時[しちじ]から 店[みせ]を 開[あ]けます。\n日曜日[にちようび]は パンを 三[みっ]つ 買[か]うと、牛乳[ぎゅうにゅう]を 一[ひと]つ あげます。","ko":"[빵 가게 해바라기]\n내일 15일(토)은 가게가 쉽니다.\n16일(일)은 아침 7시부터 가게를 엽니다.\n일요일에는 빵을 세 개 사면 우유를 하나 드립니다.","gloss":[["開[あ]ける","열다"],["〜と","~하면"],["あげる","주다"]],"qs":[{"c":["三つ","g:17"],"q":"牛乳[ぎゅうにゅう]を もらう ためには、どう しますか。","o":["十五日[じゅうごにち]の 朝[あさ] 七時[しちじ]に 店[みせ]へ 行[い]く。","パンを 一[ひと]つ 買[か]う。","日曜日[にちようび]に パンを 三[みっ]つ 買[か]う。","土曜日[どようび]に パンを 三[みっ]つ 買[か]う。"],"ex":"「日曜日[にちようび]はパンを三[みっ]つ買[か]うと、牛乳[ぎゅうにゅう]を一[ひと]つあげます」. 토요일(15일)은 가게가 쉬어요. 〜つ로 세는 법(Day 17).","a":2}],"more":[{"k":"中文","title":"初[はじ]めての 買[か]い物[もの]","text":"先週[せんしゅう]、私[わたし]は 日本[にほん]の デパートで 初[はじ]めて 一人[ひとり]で 買[か]い物[もの]を しました。\n母[はは]の 誕生日[たんじょうび]の プレゼントを 買[か]いたかったです。デパートの 三階[さんがい]に きれいな かばんの 店[みせ]が ありました。白[しろ]い かばんは 一[いち]万[まん]二[に]千[せん]円[えん]で、少[すこ]し 高[たか]かったです。黒[くろ]い かばんは 八[はっ]千[せん]円[えん]でした。\n私[わたし]は 店員[てんいん]さんに「母[はは]の プレゼントです。いくらぐらいの かばんが いいですか。」と 聞[き]きました。店員[てんいん]さんは とても 親切[しんせつ]でした。「この 茶色[ちゃいろ]の かばんは どうですか。六[ろく]千[せん]円[えん]です。小[ちい]さくて 軽[かる]いですよ。」と 言[い]いました。\n私[わたし]は 茶色[ちゃいろ]の かばんを 買[か]いました。母[はは]は とても 喜[よろこ]びました。","ko":"지난주 저는 일본 백화점에서 처음으로 혼자 쇼핑을 했습니다.\n엄마 생일 선물을 사고 싶었습니다. 백화점 3층에 예쁜 가방 가게가 있었습니다. 흰 가방은 12000엔이라 조금 비쌌습니다. 검은 가방은 8000엔이었습니다.\n저는 점원에게 \"엄마 선물이에요. 얼마 정도의 가방이 좋을까요?\" 하고 물었습니다. 점원은 아주 친절했습니다. \"이 갈색 가방은 어떠세요? 6000엔이에요. 작고 가벼워요.\" 하고 말했습니다.\n저는 갈색 가방을 샀습니다. 엄마는 아주 기뻐했습니다.","gloss":[["初[はじ]めて","처음으로"],["プレゼント","선물"],["〜階[かい]","~층"],["〜たかった","~하고 싶었다"],["茶色[ちゃいろ]","갈색"],["軽[かる]い","가볍다"],["喜[よろこ]ぶ","기뻐하다"],["店員[てんいん]","점원"],["〜ぐらい","~정도"]],"qs":[{"c":["円","いくら","g:17"],"q":"「私[わたし]」が 買[か]った かばんは いくらでしたか。","o":["一[いち]万[まん]二[に]千[せん]円[えん]","八[はっ]千[せん]円[えん]","六[ろく]千[せん]円[えん]","二[に]万[まん]円[えん]"],"ex":"「この茶色[ちゃいろ]のかばんは…六[ろく]千[せん]円[えん]です」→「私[わたし]は茶色[ちゃいろ]のかばんを買[か]いました」. 흰색 12000엔, 검은색 8000엔은 사지 않았어요.","a":2},{"c":["親切","g:10"],"q":"店員[てんいん]さんは どんな 人[ひと]でしたか。","o":["いい かばんを 教[おし]えて くれた 人[ひと]","「私[わたし]」の 母[はは]の 友達[ともだち]","高[たか]い かばんを 売[う]りたかった 人[ひと]","あまり 話[はな]さない 人[ひと]"],"ex":"점원은 친절하게(親切[しんせつ]) 작고 가벼운 6000엔 가방을 권해 줬어요. 비싼 걸 팔려고 한 게 아니에요.","a":0}]},{"k":"情報検索","title":"映画館[えいがかん]の 時間[じかん]","text":"【さくら 映画館[えいがかん]　今週[こんしゅう]の 映画[えいが]】\n「青[あお]い 海[うみ]」　　　　十時[じゅうじ]　　十[じゅう]三[さん]時[じ]　　十[じゅう]六[ろく]時[じ]\n「星[ほし]の 町[まち]」　　　　十一時[じゅういちじ]　十四時[じゅうよじ]半[はん]　十[じゅう]九[く]時[じ]\n「ねこの 一日[いちにち]」　　九時[くじ]半[はん]　十[じゅう]二[に]時[じ]　　十[じゅう]五[ご]時[じ]\n大人[おとな] 千[せん]八[はっ]百[ぴゃく]円[えん]　学生[がくせい] 千[せん]三[さん]百[びゃく]円[えん]　子[こ]ども 九[きゅう]百[ひゃく]円[えん]\n※ 毎週[まいしゅう] 水曜日[すいようび]は みんな 千[せん]二[に]百[ひゃく]円[えん]です。\n※「ねこの 一日[いちにち]」は 一時間半[いちじかんはん]、ほかの 映画[えいが]は 二時間[にじかん]です。","ko":"[사쿠라 영화관 이번 주 영화]\n「푸른 바다」 10시, 13시, 16시 / 「별의 마을」 11시, 14시 반, 19시 / 「고양이의 하루」 9시 반, 12시, 15시\n어른 1800엔, 학생 1300엔, 어린이 900엔\n※ 매주 수요일은 모두 1200엔입니다.\n※ 「고양이의 하루」는 1시간 반, 다른 영화는 2시간입니다.","gloss":[["映画館[えいがかん]","영화관"],["大人[おとな]","어른"],["毎週[まいしゅう]","매주"],["ほかの","다른"],["〜時間[じかん]","~시간"]],"qs":[{"c":["g:17"],"q":"大学生[だいがくせい]の ミンさんは 木曜日[もくようび]の 午後[ごご]に 映画[えいが]を 見[み]ます。五時[ごじ]までに 映画[えいが]が 終[お]わって ほしいです。どれを 見[み]ますか。いくらですか。","o":["「星[ほし]の 町[まち]」の 十四時[じゅうよじ]半[はん]、千[せん]二[に]百[ひゃく]円[えん]","「ねこの 一日[いちにち]」の 十[じゅう]五[ご]時[じ]、千[せん]三[さん]百[びゃく]円[えん]","「青[あお]い 海[うみ]」の 十[じゅう]六[ろく]時[じ]、千[せん]三[さん]百[びゃく]円[えん]","「ねこの 一日[いちにち]」の 十[じゅう]五[ご]時[じ]、千[せん]二[に]百[ひゃく]円[えん]"],"ex":"5시까지 끝나야 하니까: 「고양이의 하루」 15시 → 16시 반 종료(1시간 반). 「별의 마을」 14시 반은 16시 반 종료라 이것도 되지만 그 선지는 1200엔(수요일 가격)이라 틀려요. 목요일 학생 가격은 1300엔.","a":1}]}]},
{"id":"b21","after":21,"lv":"N5","k":"短文","title":"図書館[としょかん]の お知[し]らせ","text":"【町[まち]の 図書館[としょかん]】\n本[ほん]は 二週間[にしゅうかん] 借[か]りても いいです。\n図書館[としょかん]の 中[なか]で 食[た]べ物[もの]を 食[た]べては いけません。水[みず]は 飲[の]んでも いいです。\n本[ほん]を 返[かえ]す ときは、入口[いりぐち]の 左[ひだり]の 箱[はこ]に 入[い]れて ください。","ko":"[마을 도서관]\n책은 2주 동안 빌려도 됩니다.\n도서관 안에서 음식을 먹으면 안 됩니다. 물은 마셔도 됩니다.\n책을 돌려줄 때는 입구 왼쪽 상자에 넣어 주세요.","gloss":[["〜週間[しゅうかん]","~주 동안"]],"qs":[{"c":["g:18"],"q":"図書館[としょかん]の 中[なか]で しても いい ことは どれですか。","o":["水[みず]を 飲[の]む こと","入口[いりぐち]の 右[みぎ]の 箱[はこ]に 本[ほん]を 入[い]れる こと","本[ほん]を 一[いっ]か月[げつ][げつ] 借[か]りる こと","パンを 食[た]べる こと"],"ex":"「水[みず]は飲[の]んでもいいです」. 〜てもいい는 허가, 〜てはいけない는 금지(Day 18). 빌리는 건 2주까지, 반납 상자는 왼쪽이에요.","a":0}],"more":[{"k":"中文","title":"日本[にほん]の 友達[ともだち]の 家[いえ]","text":"先週[せんしゅう]の 土曜日[どようび]、私[わたし]は 日本人[にほんじん]の 友達[ともだち]の 家[いえ]へ 行[い]きました。友達[ともだち]の 家[いえ]は 駅[えき]から 少[すこ]し 遠[とお]かったです。駅[えき]から バスに 乗[の]って、十五分[じゅうごふん]ぐらい かかりました。\n友達[ともだち]の 家[いえ]は 古[ふる]くて 大[おお]きい 家[いえ]でした。家[いえ]の 前[まえ]に 庭[にわ]が あって、花[はな]が たくさん ありました。\n家[いえ]の 中[なか]に 入[はい]る 前[まえ]に、友達[ともだち]は「ここで 靴[くつ]を 脱[ぬ]いで ください。」と 言[い]いました。韓国[かんこく]も 同[おな]じですから、すぐ 分[わ]かりました。\n晩[ばん]ご飯[はん]に 友達[ともだち]の お母[かあ]さんが 天[てん]ぷらを 作[つく]りました。私[わたし]は 天[てん]ぷらを 食[た]べた ことが ありませんでした。初[はじ]めて 食[た]べましたが、とても おいしかったです。また 行[い]きたいです。","ko":"지난주 토요일 저는 일본인 친구의 집에 갔습니다. 친구 집은 역에서 조금 멀었습니다. 역에서 버스를 타고 15분 정도 걸렸습니다.\n친구 집은 오래되고 큰 집이었습니다. 집 앞에 정원이 있고 꽃이 많이 있었습니다.\n집 안에 들어가기 전에 친구가 \"여기서 신발을 벗어 주세요.\"라고 말했습니다. 한국도 똑같아서 바로 알았습니다.\n저녁으로 친구 어머니가 튀김을 만들었습니다. 저는 튀김을 먹어 본 적이 없었습니다. 처음 먹었는데 아주 맛있었습니다. 또 가고 싶습니다.","gloss":[["遠[とお]い","멀다"],["かかる","(시간이) 걸리다"],["庭[にわ]","정원"],["〜前[まえ]に","~하기 전에"],["脱[ぬ]ぐ","벗다"],["同[おな]じ","같음"],["天[てん]ぷら","튀김"],["初[はじ]めて","처음"],["また","또"]],"qs":[{"c":["バス","乗る","g:5"],"q":"友達[ともだち]の 家[いえ]まで どう 行[い]きましたか。","o":["家[いえ]から 自転車[じてんしゃ]で 行[い]きました。","友達[ともだち]の 車[くるま]で 行[い]きました。","駅[えき]から 歩[ある]いて 行[い]きました。","駅[えき]から バスで 行[い]きました。"],"ex":"「駅[えき]からバスに乗[の]って、十五分[じゅうごふん]ぐらいかかりました」. 乗[の]る(타다)는 〜に乗[の]る(Day 7).","a":3},{"c":["g:20"],"q":"「私[わたし]」は 天[てん]ぷらに ついて どう 言[い]って いますか。","o":["友達[ともだち]と 一緒[いっしょ]に 作[つく]った。","韓国[かんこく]で よく 食[た]べる。","その 日[ひ]に 初[はじ]めて 食[た]べた。","あまり おいしくなかった。"],"ex":"「天[てん]ぷらを食[た]べたことがありませんでした。初[はじ]めて食[た]べましたが、とてもおいしかったです」. 〜たことがある는 경험(Day 20).","a":2}]},{"k":"情報検索","title":"ゴミの 出[だ]し方[かた]","text":"【さくら アパートの ゴミの 日[ひ]】\n燃[も]える ゴミ（食[た]べ物[もの]、紙[かみ]など）　　　　月曜日[げつようび]と 木曜日[もくようび]\n燃[も]えない ゴミ（ガラス、なべなど）　　第二[だいに]・第四[だいよん] 水曜日[すいようび]\nプラスチック　　　　　　　　　　　　 金曜日[きんようび]\nびん・かん　　　　　　　　　　　　　 火曜日[かようび]\n※ ゴミは 朝[あさ] 八時[はちじ]までに 出[だ]して ください。\n※ 前[まえ]の 日[ひ]の 夜[よる]に 出[だ]さないで ください。","ko":"[사쿠라 아파트 쓰레기 버리는 날]\n타는 쓰레기(음식, 종이 등) 월·목 / 타지 않는 쓰레기(유리, 냄비 등) 둘째·넷째 수요일 / 플라스틱 금요일 / 병·캔 화요일\n※ 쓰레기는 아침 8시까지 내놓으세요.\n※ 전날 밤에 내놓지 마세요.","gloss":[["ゴミ","쓰레기"],["燃[も]える","타다"],["ガラス","유리"],["なべ","냄비"],["第二[だいに]","둘째"],["プラスチック","플라스틱"],["びん・かん","병·캔"],["出[だ]す","내놓다"],["〜までに","~까지(기한)"]],"qs":[{"c":["g:21"],"q":"今日[きょう]は 水曜日[すいようび]です。ジュースの かんを 捨[す]てたいです。いつ 出[だ]しますか。","o":["明日[あした]の 朝[あさ]","今日[きょう]の 夜[よる]","金曜日[きんようび]の 朝[あさ] 八時[はちじ]すぎ","来週[らいしゅう]の 火曜日[かようび]の 朝[あさ]"],"ex":"캔은 화요일. 오늘이 수요일이니 다음 화요일 아침 8시까지예요. 전날 밤에는 내놓지 말라고 했어요(〜ないでください, Day 21).","a":3}]}]},
{"id":"b24","after":24,"lv":"N5","k":"短文","title":"先輩[せんぱい]からの メール","text":"ミンさん\n来週[らいしゅう]の 金曜日[きんようび]、みんなで 食事[しょくじ]を しませんか。駅[えき]の 前[まえ]の レストランです。\n時間[じかん]は 夜[よる] 七時[しちじ]からです。行[い]く 人[ひと]は、水曜日[すいようび]までに 私[わたし]に メールを ください。\n田中[たなか]","ko":"민 씨\n다음 주 금요일에 다 같이 식사하지 않을래요? 역 앞 레스토랑입니다.\n시간은 밤 7시부터입니다. 갈 사람은 수요일까지 저에게 메일을 주세요.\n다나카","gloss":[["メール","메일"],["食事[しょくじ]","식사"],["〜までに","~까지(기한)"]],"qs":[{"c":["g:15"],"q":"食事[しょくじ]に 行[い]きたい 人[ひと]は、何[なに]を しますか。","o":["水曜日[すいようび]に レストランへ 行[い]く。","夜[よる] 七時[しちじ]に 田中[たなか]さんに 会[あ]う。","金曜日[きんようび]に レストランに 電話[でんわ]する。","水曜日[すいようび]までに 田中[たなか]さんに 連絡[れんらく]する。"],"ex":"「水曜日[すいようび]までに私[わたし]にメールをください」. メールをくださいを \"연락한다(連絡[れんらく]する)\"로 바꿔 말했어요. 〜ませんか(Day 15)는 권유.","a":3}],"more":[{"k":"中文","title":"休[やす]みの 日[ひ]","text":"私[わたし]は 会社員[かいしゃいん]です。平日[へいじつ]は 毎日[まいにち] 忙[いそが]しいですから、休[やす]みの 日[ひ]は ゆっくり したいです。\n先週[せんしゅう]の 日曜日[にちようび]は、朝[あさ] 十時[じゅうじ]に 起[お]きました。午前中[ごぜんちゅう]は 部屋[へや]を 掃除[そうじ]したり、洗濯[せんたく]したり しました。\n午後[ごご]は 近[ちか]くの 公園[こうえん]を 散歩[さんぽ]しました。公園[こうえん]には 子[こ]どもや 犬[いぬ]が たくさん いて、にぎやかでした。それから、喫茶店[きっさてん]で コーヒーを 飲[の]みながら 本[ほん]を 読[よ]みました。\n夜[よる]は 友達[ともだち]と 電話[でんわ]で 話[はな]しました。友達[ともだち]は「来月[らいげつ] 一緒[いっしょ]に 温泉[おんせん]に 行[い]きませんか。」と 言[い]いました。私[わたし]は 温泉[おんせん]が 大好[だいす]きですから、すぐ「行[い]きましょう。」と 答[こた]えました。今[いま]から とても 楽[たの]しみです。","ko":"저는 회사원입니다. 평일은 매일 바쁘니까 쉬는 날에는 느긋하게 지내고 싶습니다.\n지난주 일요일에는 아침 10시에 일어났습니다. 오전에는 방을 청소하기도 하고 빨래를 하기도 했습니다.\n오후에는 근처 공원을 산책했습니다. 공원에는 아이들과 개가 많아서 북적였습니다. 그다음 찻집에서 커피를 마시면서 책을 읽었습니다.\n밤에는 친구와 전화로 이야기했습니다. 친구가 \"다음 달에 같이 온천에 가지 않을래요?\"라고 했습니다. 저는 온천을 아주 좋아해서 바로 \"가요.\"라고 대답했습니다. 벌써 아주 기대됩니다.","gloss":[["平日[へいじつ]","평일"],["ゆっくり","느긋하게"],["午前中[ごぜんちゅう]","오전 중"],["散歩[さんぽ]","산책"],["喫茶店[きっさてん]","찻집"],["〜ながら","~하면서"],["温泉[おんせん]","온천"],["楽[たの]しみ","기대"]],"qs":[{"c":["掃除","洗濯","g:24"],"q":"この 人[ひと]は 日曜日[にちようび]の 朝[あさ] 何[なに]を しましたか。","o":["家[いえ]の 仕事[しごと]を しました。","会社[かいしゃ]へ 行[い]きました。","友達[ともだち]と 話[はな]しました。","公園[こうえん]を 散歩[さんぽ]しました。"],"ex":"「午前中[ごぜんちゅう]は部屋[へや]を掃除[そうじ]したり、洗濯[せんたく]したりしました」 → 청소·빨래 = 집안일(家[いえ]の仕事[しごと]). 〜たり〜たりする(Day 24). 산책은 오후, 통화는 밤이에요.","a":0},{"c":["g:15"],"q":"この 人[ひと]は 来月[らいげつ] 何[なに]を しますか。","o":["友達[ともだち]の 家[いえ]に 行[い]きます。","友達[ともだち]と 温泉[おんせん]に 行[い]きます。","一人[ひとり]で 温泉[おんせん]に 行[い]きます。","友達[ともだち]と 公園[こうえん]を 散歩[さんぽ]します。"],"ex":"친구가 \"다음 달 같이 온천에 가지 않을래요?\"라고 했고 \"가요(行[い]きましょう)\"라고 대답했어요.","a":1}]},{"k":"情報検索","title":"さくら祭[まつ]り","text":"【さくら祭[まつ]り】\n日[ひ]にち：四月[しがつ] 五日[いつか]（土[ど]）・六日[むいか]（日[にち]）\n時間[じかん]：午前[ごぜん] 十時[じゅうじ]〜午後[ごご] 八時[はちじ]\n場所[ばしょ]：さくら公園[こうえん]\n・ステージで 歌[うた]や 踊[おど]り（土曜日[どようび] 午後[ごご] 一時[いちじ]〜四時[よじ]）\n・お花見[はなみ]の 会[かい]（両日[りょうじつ] 午前[ごぜん] 十一時[じゅういちじ]〜午後[ごご] 三時[さんじ]）\n・花火[はなび]（日曜日[にちようび] 午後[ごご] 七時[しちじ]半[はん]〜八時[はちじ]）\n※ 雨[あめ]の 日[ひ]は ステージと 花火[はなび]が ありません。\n※ 公園[こうえん]に 車[くるま]を 止[と]める 所[ところ]は ありません。電車[でんしゃ]や バスで 来[き]て ください。","ko":"[사쿠라 축제]\n날짜: 4월 5일(토)·6일(일)\n시간: 오전 10시~오후 8시\n장소: 사쿠라 공원\n· 무대에서 노래와 춤(토요일 오후 1시~4시)\n· 꽃구경 모임(양일 오전 11시~오후 3시)\n· 불꽃놀이(일요일 오후 7시 반~8시)\n※ 비 오는 날은 무대와 불꽃놀이가 없습니다.\n※ 공원에 차를 세울 곳은 없습니다. 전철이나 버스로 오세요.","gloss":[["祭[まつ]り","축제"],["日[ひ]にち","날짜"],["場所[ばしょ]","장소"],["ステージ","무대"],["踊[おど]り","춤"],["お花見[はなみ]","꽃구경"],["会[かい]","모임"],["両日[りょうじつ]","이틀 모두"],["花火[はなび]","불꽃놀이"],["止[と]める","세우다"],["所[ところ]","곳"]],"qs":[{"c":["g:5"],"q":"リンさんは 花火[はなび]を 見[み]たいです。いつ、どう 行[い]きますか。","o":["六日[むいか]の 夜[よる]、車[くるま]で 行[い]く。","六日[むいか]の 夜[よる]、電車[でんしゃ]で 行[い]く。","五日[いつか]の 夜[よる]、車[くるま]で 行[い]く。","五日[いつか]の 午後[ごご]、バスで 行[い]く。"],"ex":"불꽃놀이는 일요일(6일) 저녁 7시 반. 차를 세울 곳이 없으니 전철이나 버스로 가야 해요.","a":1}]}]},
{"id":"b28","after":28,"lv":"N5","k":"短文","title":"クラスの お知[し]らせ","text":"みなさん\n来週[らいしゅう]の 月曜日[げつようび]から 授業[じゅぎょう]の 教室[きょうしつ]が 変[か]わります。二階[にかい]の 203教室[きょうしつ]から、三階[さんがい]の 305教室[きょうしつ]に なります。\n時間[じかん]は 変[か]わりません。教科書[きょうかしょ]を 忘[わす]れないで ください。","ko":"여러분\n다음 주 월요일부터 수업 교실이 바뀝니다. 2층 203호 교실에서 3층 305호 교실이 됩니다.\n시간은 바뀌지 않습니다. 교과서를 잊지 마세요.","gloss":[["変[か]わる","바뀌다"],["〜階[かい]","~층"],["教科書[きょうかしょ]","교과서"]],"qs":[{"c":["g:28"],"q":"来週[らいしゅう]の 月曜日[げつようび]から 何[なに]が 変[か]わりますか。","o":["授業[じゅぎょう]の 教科書[きょうかしょ]","授業[じゅぎょう]を する 部屋[へや]","授業[じゅぎょう]の 時間[じかん]","授業[じゅぎょう]の 先生[せんせい]"],"ex":"교실(教室[きょうしつ])이 바뀌어요 → \"수업하는 방\". 시간은 바뀌지 않아요. 〜になる는 변화(Day 28).","a":1}],"more":[{"k":"中文","title":"私[わたし]の 夢[ゆめ]","text":"私[わたし]は 小[ちい]さい とき、体[からだ]が 弱[よわ]くて、よく 病院[びょういん]へ 行[い]きました。病院[びょういん]の 先生[せんせい]は いつも 優[やさ]しくて、私[わたし]の 話[はなし]を ゆっくり 聞[き]いて くれました。それで、私[わたし]は「将来[しょうらい]、医者[いしゃ]に なりたい」と 思[おも]うように なりました。\nでも、医者[いしゃ]に なるのは 簡単[かんたん]では ありません。勉強[べんきょう]が とても 大変[たいへん]です。高校[こうこう]の とき、私[わたし]は 毎晩[まいばん] 遅[おそ]くまで 勉強[べんきょう]しました。\n今[いま]、私[わたし]は 大学[だいがく]の 医学部[いがくぶ]の 二[に]年[ねん]生[せい]です。授業[じゅぎょう]は 難[むずか]しいですが、毎日[まいにち] 楽[たの]しいです。体[からだ]も 強[つよ]く なりました。\n将来[しょうらい]は 小[ちい]さい 町[まち]の 病院[びょういん]で 働[はたら]きたいです。子[こ]どもや お年寄[としよ]りが 安心[あんしん]して 来[く]る ことが できる 病院[びょういん]を 作[つく]るのが 私[わたし]の 夢[ゆめ]です。","ko":"저는 어렸을 때 몸이 약해서 자주 병원에 갔습니다. 병원 선생님은 늘 다정하고 제 이야기를 천천히 들어 주셨습니다. 그래서 저는 \"장래에 의사가 되고 싶다\"고 생각하게 되었습니다.\n하지만 의사가 되는 것은 쉽지 않습니다. 공부가 아주 힘듭니다. 고등학생 때 저는 매일 밤 늦게까지 공부했습니다.\n지금 저는 대학 의학부 2학년입니다. 수업은 어렵지만 매일 즐겁습니다. 몸도 튼튼해졌습니다.\n장래에는 작은 마을의 병원에서 일하고 싶습니다. 아이와 노인이 안심하고 올 수 있는 병원을 만드는 것이 제 꿈입니다.","gloss":[["〜て くれる","~해 주다"],["それで","그래서"],["〜ように なる","~하게 되다"],["高校[こうこう]","고등학교"],["医学部[いがくぶ]","의학부"],["お年寄[としよ]り","노인"],["安心[あんしん]","안심"],["〜ことが できる","~할 수 있다"]],"qs":[{"c":["医者","優しい","g:28"],"q":"どうして この 人[ひと]は 医者[いしゃ]に なりたいと 思[おも]いましたか。","o":["大学[だいがく]の 授業[じゅぎょう]が 楽[たの]しかったから","体[からだ]が 強[つよ]かったから","勉強[べんきょう]が 好[す]きだったから","子[こ]どもの とき 会[あ]った 医者[いしゃ]が 優[やさ]しかったから"],"ex":"어릴 때 자주 간 병원의 선생님이 다정하고 이야기를 들어 줘서(それで) 의사가 되고 싶어졌어요. 몸은 오히려 약했어요.","a":3},{"c":["夢","将来","g:28"],"q":"この 人[ひと]の 夢[ゆめ]は 何[なん]ですか。","o":["大[おお]きい 町[まち]の 病院[びょういん]で 働[はたら]く こと","体[からだ]が 強[つよ]く なる こと","みんなが 安心[あんしん]して 行[い]ける 病院[びょういん]を 作[つく]る こと","大学[だいがく]の 先生[せんせい]に なる こと"],"ex":"마지막 문장 「…安心[あんしん]して来[く]ることができる病院[びょういん]を作[つく]るのが私[わたし]の夢[ゆめ]です」. 일하고 싶은 곳은 큰 마을이 아니라 작은 마을이에요.","a":2}]},{"k":"情報検索","title":"料理[りょうり]教室[きょうしつ]","text":"【みどり 料理[りょうり]教室[きょうしつ]　五月[ごがつ]の クラス】\nＡ　日本[にほん]の 家庭[かてい]料理[りょうり]　　毎週[まいしゅう] 火曜日[かようび]　午前[ごぜん] 十時[じゅうじ]〜十[じゅう]二[に]時[じ]　　三千円[さんぜんえん]\nＢ　パンと ケーキ　　　毎週[まいしゅう] 木曜日[もくようび]　午後[ごご] 六時[ろくじ]半[はん]〜八時[はちじ]半[はん]　四[よん]千[せん]円[えん]\nＣ　韓国[かんこく]料理[りょうり]　　　　　 毎週[まいしゅう] 土曜日[どようび]　午後[ごご] 二時[にじ]〜四時[よじ]　　　三[さん]千[ぜん]五[ご]百[ひゃく]円[えん]\nＤ　子[こ]どもの 料理[りょうり]　　　第一[だいいち]・第三[だいさん] 日曜日[にちようび]　午前[ごぜん] 十時[じゅうじ]〜十一時[じゅういちじ]半[はん]　二[に]千[せん]円[えん]\n※ 値段[ねだん]は 一回[いっかい]の 値段[ねだん]です。材料[ざいりょう]の お金[かね]も 入[はい]って います。\n※ 初[はじ]めての 方[ほう]は、千円[せんえん] 安[やす]く なります。","ko":"[미도리 요리교실 5월 강좌]\nA 일본 가정요리 매주 화 오전 10~12시 3000엔 / B 빵과 케이크 매주 목 오후 6시 반~8시 반 4000엔 / C 한국요리 매주 토 오후 2~4시 3500엔 / D 어린이 요리 첫째·셋째 일 오전 10~11시 반 2000엔\n※ 가격은 1회 가격입니다. 재료비도 포함되어 있습니다.\n※ 처음 오시는 분은 1000엔 싸집니다.","gloss":[["家庭[かてい]料理[りょうり]","가정요리"],["クラス","강좌"],["値段[ねだん]","가격"],["〜回[かい]","~회"],["材料[ざいりょう]","재료"],["方[かた]","분(사람)"]],"qs":[{"c":["値段","g:28"],"q":"会社員[かいしゃいん]の キムさんは 平日[へいじつ] 夜[よる]しか 時間[じかん]が ありません。初[はじ]めて 教室[きょうしつ]に 行[い]きます。いくら 払[はら]いますか。","o":["三千円[さんぜんえん]","四[よん]千[せん]円[えん]","二[に]千[せん]五[ご]百[ひゃく]円[えん]","二[に]千[せん]円[えん]"],"ex":"평일 밤 강좌는 B(목요일 6시 반)뿐이에요. 4000엔에서 처음 오는 사람은 1000엔 할인 → 3000엔.","a":0}]}]},
{"id":"b31","after":31,"lv":"N4","k":"短文","title":"寮[りょう]の 掲示[けいじ]","text":"寮[りょう]の みなさんへ\n来週[らいしゅう] 月曜日[げつようび]から 水曜日[すいようび]まで、二階[にかい]の シャワーが 使[つか]えません。工事[こうじ]を するからです。\nその 間[あいだ]は、一階[いっかい]か 三階[さんがい]の シャワーを 使[つか]って ください。一階[いっかい]の シャワーは 夜[よる] 十時[じゅうじ]まで、三階[さんがい]の シャワーは 十[じゅう]二[に]時[じ]まで 使[つか]えます。\n寮[りょう]の 事務所[じむしょ]","ko":"기숙사 여러분께\n다음 주 월요일부터 수요일까지 2층 샤워실을 사용할 수 없습니다. 공사를 하기 때문입니다.\n그동안은 1층이나 3층 샤워실을 사용해 주세요. 1층 샤워실은 밤 10시까지, 3층 샤워실은 12시까지 사용할 수 있습니다.\n기숙사 사무실","gloss":[["寮[りょう]","기숙사"],["工事[こうじ]","공사"],["事務所[じむしょ]","사무실"]],"qs":[{"c":["g:31"],"q":"二階[にかい]に 住[す]んで いる 人[ひと]が 来週[らいしゅう] 火曜日[かようび]の 夜[よる] 十一時[じゅういちじ]に シャワーを 浴[あ]びたい とき、どう しますか。","o":["水曜日[すいようび]まで 待[ま]つ。","一階[いっかい]の シャワーを 使[つか]う。","二階[にかい]の シャワーを 使[つか]う。","三階[さんがい]の シャワーを 使[つか]う。"],"ex":"화요일은 2층 샤워실 공사 기간이에요. 밤 11시에 쓸 수 있는 건 12시까지 열린 3층뿐이에요. 使[つか]えます는 가능형(Day 31).","a":3}],"more":[{"k":"中文","title":"日本語[にほんご]が 話[はな]せるように","text":"私[わたし]は 日本[にほん]に 来[き]て 半年[はんとし]に なります。来[き]た とき、日本語[にほんご]は ほとんど 話[はな]せませんでした。スーパーで 買[か]いたい 物[もの]が どこに あるか 聞[き]く ことも できませんでした。\nそれで、毎日[まいにち] 少[すこ]しずつ 練習[れんしゅう]する ことに しました。まず、朝[あさ] 起[お]きたら、その 日[ひ]に する ことを 日本語[にほんご]で ノートに 書[か]きます。それから、アルバイト先[さき]の コンビニで、お客[きゃく]さんが よく 使[つか]う 言葉[ことば]を 覚[おぼ]えるように しました。\n三[さん]か月[げつ][げつ]ぐらいで、簡単[かんたん]な 会話[かいわ]なら できるように なりました。今[いま]は 店長[てんちょう]に「レジの 仕事[しごと]を 一人[ひとり]で やって みませんか」と 言[い]われて います。\nでも、まだ 電話[でんわ]で 話[はな]すのは 苦手[にがて]です。相手[あいて]の 顔[かお]が 見[み]えないし、早[はや]く 話[はな]されると、分[わ]からない ことが 多[おお]いからです。次[つぎ]の 目標[もくひょう]は、電話[でんわ]で ゆっくり 落[お]ち着[つ]いて 話[はな]せるように なる ことです。","ko":"저는 일본에 온 지 반년이 됩니다. 왔을 때 일본어는 거의 말하지 못했습니다. 슈퍼에서 사고 싶은 물건이 어디 있는지 묻는 것도 못 했습니다.\n그래서 매일 조금씩 연습하기로 했습니다. 먼저 아침에 일어나면 그날 할 일을 일본어로 노트에 씁니다. 그리고 아르바이트하는 편의점에서 손님이 자주 쓰는 말을 외우도록 했습니다.\n석 달 정도 지나 간단한 대화라면 할 수 있게 되었습니다. 지금은 점장님에게 \"계산대 일을 혼자 해 보지 않을래요?\"라는 말을 듣고 있습니다.\n하지만 아직 전화로 말하는 것은 서툽니다. 상대 얼굴이 보이지 않고 빨리 말하면 모르는 것이 많기 때문입니다. 다음 목표는 전화로 천천히 침착하게 말할 수 있게 되는 것입니다.","gloss":[["半年[はんとし]","반년"],["ほとんど","거의"],["少[すこ]しずつ","조금씩"],["アルバイト先[さき]","아르바이트하는 곳"],["お客[きゃく]さん","손님"],["会話[かいわ]","대화"],["店長[てんちょう]","점장"],["レジ","계산대"],["苦手[にがて]","서투름"],["相手[あいて]","상대"],["目標[もくひょう]","목표"],["落[お]ち着[つ]く","침착하다"]],"qs":[{"c":["g:31"],"q":"日本[にほん]に 来[き]た とき、この 人[ひと]は どうでしたか。","o":["簡単[かんたん]な 会話[かいわ]は できた。","コンビニで 働[はたら]いて いた。","店[みせ]で 物[もの]の 場所[ばしょ]を 聞[き]く ことが できなかった。","電話[でんわ]なら 話[はな]す ことが できた。"],"ex":"「スーパーで買[か]いたい物[もの]がどこにあるか聞[き]くこともできませんでした」 → 가게에서 물건 위치를 묻지 못했다. 본문 표현을 바꿔 쓴 선지예요.","a":2},{"c":["予定","g:31"],"q":"この 人[ひと]が 日本語[にほんご]の ために 毎日[まいにち] して いる ことは 何[なん]ですか。","o":["一日[いちにち]の 予定[よてい]を 日本語[にほんご]で 書[か]く こと","店長[てんちょう]と 電話[でんわ]で 話[はな]す こと","レジの 仕事[しごと]を 一人[ひとり]で する こと","日本[にほん]の テレビを 見[み]る こと"],"ex":"「朝[あさ]起[お]きたら、その日[ひ]にすることを日本語[にほんご]でノートに書[か]きます」 → 그날 할 일 = 하루 예정(予定[よてい]). 레지 일은 아직 권유받은 단계예요.","a":0},{"c":["g:31"],"q":"この 人[ひと]は 電話[でんわ]に ついて どう 思[おも]って いますか。","o":["簡単[かんたん]だから、もう 練習[れんしゅう]しなくて いい。","相手[あいて]が 見[み]えないので、まだ 難[むずか]しい。","店長[てんちょう]と 話[はな]すのが 楽[たの]しい。","早[はや]く 話[はな]すのが 好[す]きだ。"],"ex":"「電話[でんわ]で話[はな]すのは苦手[にがて]です。相手[あいて]の顔[かお]が見[み]えないし…」. 苦手[にがて](서투르다)를 難[むずか]しい로 바꿔 말한 선지가 정답이에요.","a":1}]},{"k":"情報検索","title":"市民[しみん]プールの 案内[あんない]","text":"【みどり市[し] 市民[しみん]プール　利用[りよう]の 案内[あんない]】\n◆ 時間[じかん]\n　平日[へいじつ]　　　　午前[ごぜん] 九時[くじ]〜午後[ごご] 九時[くじ]\n　土[ど]・日[にち]・祝日[しゅくじつ]　午前[ごぜん] 九時[くじ]〜午後[ごご] 六時[ろくじ]\n　※ 毎月[まいつき] 第二[だいに] 月曜日[げつようび]は 休[やす]みです。\n◆ 料金[りょうきん]（二時間[にじかん]）\n　大人[おとな]（高校生[こうこうせい] 以上[いじょう]）　　四[よん]百[ひゃく]円[えん]\n　子[こ]ども（小学生[しょうがくせい]・中学生[ちゅうがくせい]）　百五十円[ひゃくごじゅうえん]\n　六[ろく]十[じゅう]五[ご]歳[さい] 以上[いじょう]の 方[かた]　　二百円[にひゃくえん]\n　※ 二時間[にじかん]を すぎると、一時間[いちじかん]ごとに 半分[はんぶん]の 料金[りょうきん]が かかります。\n◆ 注意[ちゅうい]\n　・小学生[しょうがくせい]は 大人[おとな]と 一緒[いっしょ]に 入[はい]って ください。\n　・プールの 中[なか]で 食[た]べたり 飲[の]んだり しては いけません。水[みず]は 休憩室[きゅうけいしつ]で 飲[の]めます。\n　・帽子[ぼうし]を かぶって ください。帽子[ぼうし]は 受付[うけつけ]で 百円[ひゃくえん]で 買[か]えます。","ko":"[미도리시 시민 수영장 이용 안내]\n◆ 시간: 평일 오전 9시~오후 9시 / 토·일·공휴일 오전 9시~오후 6시 ※ 매달 둘째 월요일 휴무\n◆ 요금(2시간): 어른(고등학생 이상) 400엔 / 어린이(초·중학생) 150엔 / 65세 이상 200엔 ※ 2시간이 지나면 1시간마다 요금의 절반이 듭니다.\n◆ 주의: 초등학생은 어른과 함께 들어오세요. 수영장 안에서 먹거나 마시면 안 됩니다. 물은 휴게실에서 마실 수 있습니다. 수영모를 쓰세요. 수영모는 접수처에서 100엔에 살 수 있습니다.","gloss":[["市民[しみん]","시민"],["利用[りよう]","이용"],["料金[りょうきん]","요금"],["以上[いじょう]","이상"],["中学生[ちゅうがくせい]","중학생"],["〜ごとに","~마다"],["かかる","(돈이) 들다"],["注意[ちゅうい]","주의"],["休憩室[きゅうけいしつ]","휴게실"],["受付[うけつけ]","접수처"],["祝日[しゅくじつ]","공휴일"]],"qs":[{"c":["g:31"],"q":"高校生[こうこうせい]の ユナさんは 土曜日[どようび]の 午後[ごご] 三時[さんじ]から 五時[ごじ]まで 泳[およ]ぎます。帽子[ぼうし]を 持[も]って いないので、受付[うけつけ]で 買[か]います。全部[ぜんぶ]で いくらですか。","o":["三[さん]百[びゃく]円[えん]","五[ご]百[ひゃく]五[ご]十[じゅう]円[えん]","四[よん]百[ひゃく]円[えん]","五[ご]百[ひゃく]円[えん]"],"ex":"고등학생은 어른 요금 400엔(2시간). 3시~5시는 딱 2시간이라 추가 요금 없음. 수영모 100엔 → 500엔.","a":3},{"c":["g:31"],"q":"この プールで できる ことは どれですか。","o":["プールの 中[なか]で ジュースを 飲[の]む こと","第二[だいに] 月曜日[げつようび]に 泳[およ]ぐ こと","休憩室[きゅうけいしつ]で 水[みず]を 飲[の]む こと","小学生[しょうがくせい]が 一人[ひとり]で 泳[およ]ぐ こと"],"ex":"「水[みず]は休憩[きゅうけい]室[しつ]で飲[の]めます」. 초등학생은 어른과 함께, 수영장 안 음식 금지, 둘째 월요일 휴무예요.","a":2}]}]},
{"id":"b35","after":35,"lv":"N4","k":"短文","title":"機械[きかい]の 使[つか]い方[かた]","text":"【コピー機[き]の 使[つか]い方[かた]】\n① 先[さき]に お金[かね]を 入[い]れて ください。一[いち]枚[まい] 十[じゅう]円[えん]です。\n② 紙[かみ]を ここに 置[お]いて、緑[みどり]の ボタンを 押[お]すと、コピーが 始[はじ]まります。\n③ 赤[あか]い ボタンを 押[お]すと、止[と]まります。\n※ お釣[つ]りは 下[した]の 口[くち]から 出[で]ます。紙[かみ]を 取[と]るのを 忘[わす]れないで ください。","ko":"[복사기 사용법]\n① 먼저 돈을 넣어 주세요. 한 장 10엔입니다.\n② 종이를 여기에 놓고 초록 버튼을 누르면 복사가 시작됩니다.\n③ 빨간 버튼을 누르면 멈춥니다.\n※ 거스름돈은 아래 구멍에서 나옵니다. 종이를 챙기는 것을 잊지 마세요.","gloss":[["機械[きかい]","기계"],["コピー機[き]","복사기"],["ボタン","버튼"],["口[くち]","(나오는) 구멍"]],"qs":[{"c":["g:35"],"q":"コピーを したい とき、最初[さいしょ]に 何[なに]を しますか。","o":["緑[みどり]の ボタンを 押[お]す。","お金[かね]を 入[い]れる。","紙[かみ]を 置[お]く。","赤[あか]い ボタンを 押[お]す。"],"ex":"「先[さき]にお金[かね]を入[い]れてください」. 先[さき]に(먼저)를 最初[さいしょ]に로 바꿨어요. 〜と는 \"~하면 (반드시) ~된다\"(Day 35).","a":1}],"more":[{"k":"中文","title":"春[はる]の 引[ひ]っ越[こ]し","text":"先月[せんげつ]、大学[だいがく]の 近[ちか]くの アパートに 引[ひ]っ越[こ]しました。前[まえ]の 部屋[へや]は 駅[えき]から 歩[ある]いて 三十分[さんじゅっぷん]も かかりましたが、今[いま]の 部屋[へや]は 大学[だいがく]まで 自転車[じてんしゃ]で 五分[ごふん]です。朝[あさ] ゆっくり 寝[ね]られるので、とても 助[たす]かって います。\nただ、引[ひ]っ越[こ]しは 思[おも]ったより 大変[たいへん]でした。荷物[にもつ]が 多[おお]くて、全部[ぜんぶ] 箱[はこ]に 入[い]れるのに 一週間[いっしゅうかん]も かかりました。友達[ともだち]が 二人[ふたり] 手伝[てつだ]いに 来[き]て くれましたが、重[おも]い 本棚[ほんだな]を 運[はこ]ぶ とき、一人[ひとり]が 足[あし]を けがして しまいました。私[わたし]は 本当[ほんとう]に 申[もう]し訳[わけ]ないと 思[おも]いました。\n新[あたら]しい 部屋[へや]は 前[まえ]の 部屋[へや]より 狭[せま]いですが、窓[まど]を 開[あ]けると 大[おお]きい 公園[こうえん]が 見[み]えます。春[はる]に なると、公園[こうえん]の 桜[さくら]が とても きれいだと 隣[となり]の 人[ひと]が 教[おし]えて くれました。\nけがを した 友達[ともだち]の 足[あし]が よく なったら、二人[ふたり]を 部屋[へや]に 呼[よ]んで、窓[まど]から 桜[さくら]を 見[み]ながら ごちそうを するつもりです。","ko":"지난달 대학 근처 아파트로 이사했습니다. 전에 살던 방은 역에서 걸어서 30분이나 걸렸지만 지금 방은 대학까지 자전거로 5분입니다. 아침에 느긋하게 잘 수 있어서 아주 도움이 됩니다.\n다만 이사는 생각보다 힘들었습니다. 짐이 많아서 전부 상자에 넣는 데 일주일이나 걸렸습니다. 친구 두 명이 도와주러 와 줬지만, 무거운 책장을 옮길 때 한 명이 발을 다치고 말았습니다. 저는 정말 미안하다고 생각했습니다.\n새 방은 전의 방보다 좁지만 창문을 열면 큰 공원이 보입니다. 봄이 되면 공원의 벚꽃이 아주 예쁘다고 옆집 사람이 알려 줬습니다.\n다친 친구의 발이 나으면 두 사람을 방에 불러서 창문으로 벚꽃을 보면서 대접할 생각입니다.","gloss":[["助[たす]かる","도움이 되다"],["ただ","다만"],["本棚[ほんだな]","책장"],["運[はこ]ぶ","옮기다"],["けが","부상"],["申[もう]し訳[わけ]ない","미안하다"],["桜[さくら]","벚꽃"],["ごちそうを する","대접하다"],["〜つもり","~할 생각"]],"qs":[{"c":["近い","g:19"],"q":"今[いま]の 部屋[へや]の いい ところは 何[なん]ですか。","o":["大学[だいがく]に 近[ちか]い こと","前[まえ]の 部屋[へや]より 広[ひろ]い こと","家賃[やちん]が 安[やす]い こと","駅[えき]に 近[ちか]い こと"],"ex":"「今[いま]の部屋[へや]は大学[だいがく]まで自転車[じてんしゃ]で五分[ごふん]です」. 방은 오히려 전보다 좁아요(狭[せま]い). 집세 이야기는 없어요.","a":0},{"c":["g:35"],"q":"「申[もう]し訳[わけ]ない」と 思[おも]ったのは どうしてですか。","o":["友達[ともだち]を 部屋[へや]に 呼[よ]ばなかったから","本棚[ほんだな]が 重[おも]かったから","引[ひ]っ越[こ]しに 一週間[いっしゅうかん] かかったから","手伝[てつだ]いに 来[き]た 友達[ともだち]が けがを したから"],"ex":"책장을 옮기다가 도와주러 온 친구가 발을 다쳤기 때문이에요. 〜てしまう는 유감(Day 57에서 자세히).","a":3},{"c":["g:33"],"q":"この 人[ひと]は これから 何[なに]を しようと 思[おも]って いますか。","o":["隣[となり]の 人[ひと]に ごちそうを する。","友達[ともだち]を 呼[よ]んで、桜[さくら]を 見[み]ながら 食事[しょくじ]を する。","公園[こうえん]で 友達[ともだち]と 花見[はなみ]を する。","もう 一度[いちど] 引[ひ]っ越[こ]しを する。"],"ex":"마지막 문장 「二人[ふたり]を部屋[へや]に呼[よ]んで、窓[まど]から桜[さくら]を見[み]ながらごちそうをするつもりです」. 공원에 가는 게 아니라 방 창문으로 봐요.","a":1}]},{"k":"情報検索","title":"自転車[じてんしゃ]の 置[お]き場[ば]","text":"【さくら駅[えき] 自転車置[じてんしゃお]き場[ば]】\n◆ 料金[りょうきん]\n　　　　　　　　　一日[いちにち]（六時[ろくじ]〜二[に]十[じゅう]四[よ]時[じ]）　一[いっ]か月[げつ][げつ]\n　自転車[じてんしゃ]　　　　　百五十円[ひゃくごじゅうえん]　　　　　　　　二[に]千[せん]円[えん]\n　バイク　　　　　三[さん]百[びゃく]円[えん]　　　　　　　　　四[よん]千[せん]円[えん]\n　※ 学生[がくせい]は 一[いっ]か月[げつ][げつ]の 料金[りょうきん]が 五[ご]百[ひゃく]円[えん] 安[やす]く なります（学生証[がくせいしょう]を 見[み]せて ください）。\n◆ 一[いっ]か月[げつ][げつ]の 申[もう]し込[こ]み\n　毎月[まいつき] 二十日[はつか]から 月末[げつまつ]までに、事務所[じむしょ]で 申[もう]し込[こ]んで ください。\n　事務所[じむしょ]の 時間[じかん]：月[げつ]〜土[ど]　午前[ごぜん] 八時[はちじ]〜午後[ごご] 五時[ごじ]（日曜日[にちようび]は 休[やす]み）\n◆ 注意[ちゅうい]\n　・二[に]十[じゅう]四[よ]時[じ]を すぎると、次[つぎ]の 日[ひ]の 料金[りょうきん]も かかります。\n　・一[いっ]か月[げつ][げつ] 使[つか]わない 自転車[じてんしゃ]は 片付[かたづ]けます。","ko":"[사쿠라역 자전거 보관소]\n◆ 요금: 자전거 하루(6~24시) 150엔·한 달 2000엔 / 오토바이 하루 300엔·한 달 4000엔 ※ 학생은 한 달 요금이 500엔 싸집니다(학생증 제시).\n◆ 한 달 신청: 매달 20일부터 말일까지 사무실에서 신청하세요. 사무실 시간: 월~토 오전 8시~오후 5시(일요일 휴무)\n◆ 주의: 24시가 지나면 다음 날 요금도 듭니다. 한 달 동안 쓰지 않는 자전거는 치웁니다.","gloss":[["置[お]き場[ば]","보관소"],["バイク","오토바이"],["学生証[がくせいしょう]","학생증"],["申[もう]し込[こ]む","신청하다"],["月末[げつまつ]","말일"],["事務所[じむしょ]","사무실"],["片付[かたづ]ける","치우다"]],"qs":[{"c":["g:35"],"q":"大学生[だいがくせい]の チャンさんは 来月[らいげつ]から 毎日[まいにち] 駅[えき]に 自転車[じてんしゃ]を 置[お]きたいです。今日[きょう]は 二十二日[にじゅうににち]、日曜日[にちようび]です。どう しますか。","o":["来月[らいげつ] 一日[ついたち]に 事務所[じむしょ]へ 行[い]く。","毎日[まいにち] 百五十円[ひゃくごじゅうえん] 払[はら]う。","明日[あした] 学生証[がくせいしょう]を 持[も]って 事務所[じむしょ]へ 行[い]く。","今日[きょう] 事務所[じむしょ]へ 行[い]って 申[もう]し込[こ]む。"],"ex":"신청 기간은 20일~말일, 사무실은 일요일 휴무. 그래서 내일(월요일) 학생증을 들고 가요. 학생은 1500엔으로 한 달 사용 가능.","a":2},{"c":["円"],"q":"チャンさんが 払[はら]う 一[いっ]か月[げつ][げつ]の 料金[りょうきん]は いくらですか。","o":["二[に]千[せん]円[えん]","千[せん]五[ご]百[ひゃく]円[えん]","三[さん]千[ぜん]五[ご]百[ひゃく]円[えん]","四[よん]千[せん]円[えん]"],"ex":"자전거 한 달 2000엔 − 학생 할인 500엔 = 1500엔.","a":1}]}]},
{"id":"b38","after":38,"lv":"N4","k":"短文","title":"先生[せんせい]からの メール","text":"ミンさん\nレポート、読[よ]みました。よく 書[か]けて いますね。\nただ、二[に]ページ目[め]の グラフの 数字[すうじ]が 本文[ほんぶん]と 違[ちが]います。グラフを 直[なお]して、金曜日[きんようび]までに もう 一度[いちど] 出[だ]して ください。\nもし 分[わ]からない ことが あったら、木曜日[もくようび]の 午後[ごご]なら 研究室[けんきゅうしつ]に います。\n山本[やまもと]","ko":"민 씨\n리포트 읽었어요. 잘 썼네요.\n다만 두 번째 페이지 그래프의 숫자가 본문과 다릅니다. 그래프를 고쳐서 금요일까지 한 번 더 내 주세요.\n혹시 모르는 것이 있으면 목요일 오후라면 연구실에 있습니다.\n야마모토","gloss":[["レポート","리포트"],["ページ","페이지"],["グラフ","그래프"],["本文[ほんぶん]","본문"],["直[なお]す","고치다"],["研究室[けんきゅうしつ]","연구실"]],"qs":[{"c":["g:38"],"q":"ミンさんは 何[なに]を しなければ なりませんか。","o":["グラフを 直[なお]して、また 出[だ]す。","本文[ほんぶん]の 数字[すうじ]を 直[なお]す。","レポートを 全部[ぜんぶ] 書[か]き直[なお]す。","木曜日[もくようび]に 研究室[けんきゅうしつ]へ 行[い]く。"],"ex":"그래프 숫자가 본문과 다르니 그래프를 고쳐 다시 제출해요. 연구실 방문은 \"모르는 게 있으면\"이라 필수가 아니에요. 〜なら(Day 38).","a":0}],"more":[{"k":"中文","title":"週末[しゅうまつ]の 過[す]ごし方[かた]","text":"日本人[にほんじん]の 会社員[かいしゃいん]に「週末[しゅうまつ]は 何[なに]を して いますか」と 聞[き]いて みました。いちばん 多[おお]かった 答[こた]えは「家[いえ]で ゆっくり 休[やす]む」でした。平日[へいじつ]は 仕事[しごと]が 忙[いそが]しくて、疲[つか]れて いる 人[ひと]が 多[おお]いのでしょう。\n二[に]番目[ばんめ]に 多[おお]かったのは「買[か]い物[もの]」、三番目[さんばんめ]は「家族[かぞく]や 友達[ともだち]と 出[で]かける」でした。若[わか]い 人[ひと]の 中[なか]には、週末[しゅうまつ]に 料理[りょうり]教室[きょうしつ]や 英会話[えいかいわ]の 教室[きょうしつ]に 通[かよ]って いる 人[ひと]も いました。\n三[さん]十代[だい]の 田中[たなか]さんは「土曜日[どようび]は 何[なに]も しないで 寝[ね]て いる ことが 多[おお]いです。でも、日曜日[にちようび]まで そう すると、月曜日[げつようび]に 体[からだ]が 重[おも]く なるんです。だから、日曜日[にちようび]の 朝[あさ]は 必[かなら]ず 公園[こうえん]を 走[はし]るように して います」と 話[はな]して くれました。\n休[やす]みの 日[ひ]の 過[す]ごし方[ほう]は 人[ひと]それぞれです。でも、ただ 休[やす]むだけで なく、少[すこ]し 体[からだ]を 動[うご]かす ことも 大切[たいせつ]なのかもしれません。","ko":"일본인 회사원에게 \"주말에는 무엇을 하고 있습니까?\" 하고 물어보았습니다. 가장 많았던 대답은 \"집에서 느긋하게 쉰다\"였습니다. 평일에는 일이 바빠서 지쳐 있는 사람이 많은 것이겠지요.\n두 번째로 많았던 것은 \"쇼핑\", 세 번째는 \"가족이나 친구와 외출한다\"였습니다. 젊은 사람 중에는 주말에 요리 교실이나 영어 회화 교실에 다니는 사람도 있었습니다.\n30대인 다나카 씨는 \"토요일은 아무것도 하지 않고 자는 경우가 많아요. 하지만 일요일까지 그러면 월요일에 몸이 무거워져요. 그래서 일요일 아침에는 꼭 공원을 달리려고 해요.\"라고 말해 주었습니다.\n쉬는 날을 보내는 방법은 사람마다 다릅니다. 하지만 그저 쉬기만 하는 게 아니라 조금 몸을 움직이는 것도 중요할지도 모릅니다.","gloss":[["過[す]ごし方[かた]","보내는 방법"],["〜代[だい]","~대(나이)"],["英会話[えいかいわ]","영어 회화"],["通[かよ]う","다니다"],["必[かなら]ず","반드시"],["それぞれ","각각"],["動[うご]かす","움직이다"],["〜かもしれない","~일지도 모른다"]],"qs":[{"c":["g:19"],"q":"いちばん 多[おお]かった 答[こた]えは どれですか。","o":["家[いえ]で 休[やす]む","教室[きょうしつ]に 通[かよ]う","買[か]い物[もの]を する","友達[ともだち]と 出[で]かける"],"ex":"「いちばん多[おお]かった答[こた]えは『家[いえ]でゆっくり休[やす]む』でした」. 쇼핑은 2위, 외출은 3위예요.","a":0},{"c":["g:35"],"q":"田中[たなか]さんは どうして 日曜日[にちようび]の 朝[あさ] 走[はし]りますか。","o":["友達[ともだち]と 約束[やくそく]して いるから","土曜日[どようび]に 走[はし]る 時間[じかん]が ないから","走[はし]るのが 大好[だいす]きだから","二日[ふつか] 続[つづ]けて 休[やす]むと、月曜日[げつようび]に 調子[ちょうし]が 悪[わる]く なるから"],"ex":"「日曜日[にちようび]までそうすると、月曜日[げつようび]に体[からだ]が重[おも]くなるんです」 → 이틀 내리 쉬면 월요일 컨디션(調[しら]子[こ])이 나빠진다. 〜と(Day 35).","a":3},{"c":["g:38"],"q":"筆者[ひっしゃ]の 考[かんが]えに 合[あ]う ものは どれですか。","o":["休[やす]みの 日[ひ]は 少[すこ]し 運動[うんどう]するのも いい。","週末[しゅうまつ]は 家[いえ]で 寝[ね]て いるのが いちばんだ。","若[わか]い 人[ひと]は もっと 教室[きょうしつ]に 通[かよ]うべきだ。","週末[しゅうまつ]は 買[か]い物[もの]を するのが いい。"],"ex":"마지막 문장 「少[すこ]し体[からだ]を動[うご]かすことも大切[たいせつ]なのかもしれません」. 体[からだ]を動[うご]かす = 運動[うんどう]する. 필자의 생각은 보통 마지막 단락에 나와요.","a":0}]},{"k":"情報検索","title":"ホテルの 朝食[ちょうしょく]","text":"【ホテル さくら　朝食[ちょうしょく]の ご案内[あんない]】\n場所[ばしょ]：一階[いっかい] レストラン「ひかり」\n時間[じかん]：午前[ごぜん] 六時[ろくじ]半[はん]〜十時[じゅうじ]（最後[さいご]の 注文[ちゅうもん]は 九時[くじ]半[はん]）\n◆ 和食[わしょく]セット（ご飯[はん]・みそ汁[しる]・焼[や]き魚[ざかな]・卵[たまご]）　　　千[せん]二[に]百[ひゃく]円[えん]\n◆ 洋食[ようしょく]セット（パン・サラダ・卵[たまご]・コーヒー）　　千円[せんえん]\n◆ バイキング（好[す]きな 料理[りょうり]を 自由[じゆう]に 取[と]れます）千[せん]八[はっ]百[ぴゃく]円[えん]\n　※ バイキングは 土[ど]・日[にち]・祝日[しゅくじつ]だけです。\n　※ 小学生[しょうがくせい]は 半分[はんぶん]の 料金[りょうきん]です。小学生[しょうがくせい]より 小[ちい]さい 子[こ]どもは 無料[むりょう]です。\n◆ お部屋[へや]で 食[た]べたい 方[ほう]は、前[まえ]の 日[ひ]の 夜[よる] 九時[くじ]までに フロントに 電話[でんわ]して ください（料金[りょうきん]に 三[さん]百[びゃく]円[えん] プラス）。","ko":"[호텔 사쿠라 조식 안내]\n장소: 1층 레스토랑 '히카리' / 시간: 오전 6시 반~10시(마지막 주문 9시 반)\n◆ 일식 세트(밥·된장국·생선구이·달걀) 1200엔 ◆ 양식 세트(빵·샐러드·달걀·커피) 1000엔 ◆ 뷔페(좋아하는 요리를 자유롭게) 1800엔 ※ 뷔페는 토·일·공휴일만. ※ 초등학생은 반값, 초등학생보다 어린 아이는 무료.\n◆ 방에서 드시고 싶은 분은 전날 밤 9시까지 프런트에 전화해 주세요(요금에 300엔 추가).","gloss":[["朝食[ちょうしょく]","아침 식사"],["ご案内[あんない]","안내"],["注文[ちゅうもん]","주문"],["和食[わしょく]","일식"],["洋食[ようしょく]","양식"],["セット","세트"],["みそ汁[しる]","된장국"],["バイキング","뷔페"],["自由[じゆう]に","자유롭게"],["無料[むりょう]","무료"],[" {"id":"b42","after":42,"lv":"N4","k":"短文","title":"会社[かいしゃ]の お知[し]らせ","text":"社員[しゃいん]の みなさんへ\n来週[らいしゅう] 水曜日[すいようび]の 午後[ごご] 二時[にじ]から、社長[しゃちょう]が 新[あたら]しい 計画[けいかく]に ついて お話[はな]しに なります。\n三階[さんがい]の 会議室[かいぎしつ]に お集[あつ]まり ください。\n出[で]られない 方[ほう]は、月曜日[げつようび]までに 総務[そうむ]の 鈴木[すずき]に お知[し]らせ ください。会議[かいぎ]の 資料[しりょう]は 後[あと]で メールで 送[おく]ります。","ko":"사원 여러분께\n다음 주 수요일 오후 2시부터 사장님께서 새 계획에 대해 말씀하십니다.\n3층 회의실에 모여 주십시오.\n참석하지 못하는 분은 월요일까지 총무팀 스즈키에게 알려 주십시오. 회의 자료는 나중에 메일로 보내 드립니다.","gloss":[["社員[しゃいん]","사원"],["お話[はな]しに なる","말씀하시다"],["会議室[かいぎしつ]","회의실"],["総務[そうむ]","총무"],["資料[しりょう]","자료"]],"qs":[{"c":["g:42"],"q":"会議[かいぎ]に 出[で]られない 人[ひと]は どう しますか。","o":["後[あと]で 会議室[かいぎしつ]へ 行[い]く。","資料[しりょう]を 鈴木[すずき]さんに 送[おく]る。","月曜日[げつようび]までに 鈴木[すずき]さんに 連絡[れんらく]する。","水曜日[すいようび]に 社長[しゃちょう]に メールを 送[おく]る。"],"ex":"「出​られない方[ほう]は、月曜日[げつようび]までに総[そう]務​の鈴木[すずき]にお知[し]らせください」. お〜ください는 정중한 부탁, お話[はな]しになる는 존경어(Day 42).","a":2}],"more":[{"k":"中文","title":"敬語[けいご]の 失敗[しっぱい]","text":"日本[にほん]の 会社[かいしゃ]で 働[はたら]き始[はじ]めて 二[に]か月[げつ][げつ]が たちました。仕事[しごと]にも 少[すこ]し 慣[な]れて きましたが、まだ 敬語[けいご]が 上手[じょうず]に 使[つか]えません。\n先週[せんしゅう]、部長[ぶちょう]が 私[わたし]の 机[つくえ]の 前[まえ]に 来[き]て「昨日[きのう]の 資料[しりょう]、もう 見[み]たかな」と 聞[き]きました。私[わたし]は 急[いそ]いで「はい、拝見[はいけん]しました」と 答[こた]える つもりでしたが、「はい、ご覧[らん]に なりました」と 言[い]って しまいました。「ご覧[らん]に なる」は 相手[あいて]の ことを 話[はな]す ときの 言葉[ことば]で、自分[じぶん]には 使[つか]いません。部長[ぶちょう]は 笑[わら]って「私[わたし]が 見[み]たんじゃ なくて、君[きみ]が 見[み]たんだよね」と 言[い]いました。私[わたし]は 顔[かお]が 赤[あか]く なりました。\nその 夜[よる]、先輩[せんぱい]に この 話[はなし]を すると、先輩[せんぱい]も 新人[しんじん]の とき、社長[しゃちょう]に「お元気[げんき]ですか」と 言[い]う つもりで「元気[げんき]ですか」と 言[い]って しまったそうです。「失敗[しっぱい]しながら 覚[おぼ]えるのが いちばんだよ」と 先輩[せんぱい]は 言[い]いました。\nそれから、私[わたし]は 敬語[けいご]の 本[ほん]を 買[か]って、毎朝[まいあさ] 電車[でんしゃ]の 中[なか]で 読[よ]んで います。","ko":"일본 회사에서 일하기 시작한 지 두 달이 지났습니다. 일에도 조금 익숙해졌지만 아직 경어를 잘 쓰지 못합니다.\n지난주 부장님이 제 책상 앞에 와서 \"어제 자료 벌써 봤나?\" 하고 물었습니다. 저는 서둘러 \"네, 보았습니다(겸양)\"라고 대답할 생각이었는데 \"네, 보셨습니다\"라고 말해 버렸습니다. \"ご覧になる\"는 상대에 대해 말할 때 쓰는 말이라 자신에게는 쓰지 않습니다. 부장님은 웃으며 \"내가 본 게 아니라 자네가 본 거지?\"라고 말했습니다. 저는 얼굴이 빨개졌습니다.\n그날 밤 선배에게 이 이야기를 하자 선배도 신입 때 사장님께 \"お元気ですか\"라고 할 생각으로 \"元気ですか\"라고 말해 버렸다고 {"id":"b45","after":45,"lv":"N4","k":"短文","title":"塾[じゅく]からの 連絡[れんらく]","text":"保護者[ほごしゃ]の みなさまへ\n来月[らいげつ]から、毎週[まいしゅう] 土曜日[どようび]に 漢字[かんじ]の テストを 行[おこな]います。\nテストの 前[まえ]に、お子[こ]さんに 三十分[さんじゅっぷん]ぐらい 漢字[かんじ]の 練習[れんしゅう]を させて ください。\nテストの 結果[けっか]は 毎月[まいつき] 最後[さいご]の 土曜日[どようび]に、お子[こ]さんに 持[も]って 帰[かえ]らせます。\nさくら塾[じゅく]","ko":"학부모님께\n다음 달부터 매주 토요일에 한자 시험을 봅니다.\n시험 전에 자녀분께 30분 정도 한자 연습을 시켜 주세요.\n시험 결과는 매달 마지막 토요일에 자녀분 편에 들려 보내겠습니다.\n사쿠라 학원","gloss":[["塾[じゅく]","학원"],["保護者[ほごしゃ]","보호자"],["行[おこな]う","실시하다"],["お子[こ]さん","자녀분"],["結果[けっか]","결과"]],"qs":[{"c":["g:45"],"q":"保護者[ほごしゃ]は 何[なに]を しなければ なりませんか。","o":["毎週[まいしゅう] 漢字[かんじ]の テストを 作[つく]る。","子[こ]どもと 一緒[いっしょ]に テストを 受[う]ける。","土曜日[どようび]に 塾[じゅく]へ テストの 結果[けっか]を 取[と]りに 行[い]く。","子[こ]どもに 家[いえ]で 漢字[かんじ]を 練習[れんしゅう]させる。"],"ex":"「お子[こ]さんに…練習[れんしゅう]をさせてください」 사역형 〜させる(Day 45). 결과는 아이가 가져와요(持[も]って帰[かえ]らせます).","a":3}],"more":[{"k":"中文","title":"子[こ]どもに させたい こと","text":"最近[さいきん]、子[こ]どもに 小[ちい]さい ときから いろいろな 習[なら]い事[ごと]を させる 親[おや]が 増[ふ]えて いるそうです。水泳[すいえい]、ピアノ、英語[えいご]など、一週間[いっしゅうかん]に 四[よっ]つも 五[いつ]つも 習[なら]い事[ごと]に 通[かよ]う 子[こ]どもも いるそうです。\n私[わたし]にも 小[ちい]学[まな]二[に]年[ねん]生[せい]の 娘[むすめ]が います。娘[むすめ]は 今[いま]、水泳[すいえい]と ピアノを 習[なら]って います。ピアノは 娘[むすめ]が「やりたい」と 言[い]ったので、始[はじ]めさせました。でも、水泳[すいえい]は 私[わたし]が 体[からだ]を 強[つよ]く したくて、娘[むすめ]に 聞[き]かないで 決[き]めて しまいました。\n娘[むすめ]は ピアノの 練習[れんしゅう]は 毎日[まいにち] 楽[たの]しそうに しますが、水泳[すいえい]の 日[ひ]に なると「お腹[なか]が 痛[いた]い」と 言[い]う ことが あります。先月[せんげつ]、娘[むすめ]の 気持[きも]ちを ゆっくり 聞[き]いて みました。娘[むすめ]は「水[みず]が 顔[かお]に かかるのが 怖[こわ]い」と 小[ちい]さい 声[こえ]で 言[い]いました。\n私[わたし]は 子[こ]どもの ためだと 思[おも]って いましたが、娘[むすめ]の 気持[きも]ちを 考[かんが]えて いなかったのです。今[いま]は、水泳[すいえい]を 少[すこ]し 休[やす]ませて、家族[かぞく]で 海[うみ]や プールに 遊[あそ]びに 行[い]く ことに しました。まず 水[みず]を 好[す]きに なって ほしいと 思[おも]って います。","ko":"요즘 아이에게 어릴 때부터 여러 가지 학원·배움을 시키는 부모가 늘고 있다고 합니다. 수영, 피아노, 영어 등 일주일에 네다섯 개나 배우러 다니는 아이도 있다고 합니다.\n저에게도 초등학교 2학년 딸이 있습니다. 딸은 지금 수영과 피아노를 배우고 있습니다. 피아노는 딸이 \"하고 싶다\"고 해서 시작하게 했습니다. 하지만 수영은 제가 몸을 튼튼하게 하고 싶어서 딸에게 묻지 않고 정해 버렸습니다.\n딸은 피아노 연습은 매일 즐겁게 하지만 수영 날이 되면 \"배가 아프다\"고 할 때가 있습니다. 지난달 딸의 마음을 천천히 들어 보았습니다. 딸은 \"물이 얼굴에 튀는 게 무섭다\"고 작은 목소리로 말했습니다.\n저는 아이를 위해서라고 생각했지만 딸의 마음을 생각하지 않았던 것입니다. 지금은 수영을 잠시 쉬게 하고 가족끼리 바다나 수영장에 놀러 가기로 했습니다. 우선 물을 좋아하게 되었으면 좋겠습니다.","gloss":[["習[なら]い事[ごと]","배우는 것(학원 등)"],["親[おや]","부모"],["水泳[すいえい]","수영"],["〜そうだ","~라고 한다"],["決[き]める","정하다"],["気持[きも]ち","마음"],["かかる","(물이) 튀다"],["怖[こわ]い","무섭다"]],"qs":[{"c":["g:45"],"q":"娘[むすめ]が 水泳[すいえい]を 習[なら]い始[はじ]めたのは どうしてですか。","o":["学校[がっこう]で 必要[ひつよう]だったから","娘[むすめ]が やりたいと 言[い]ったから","母親[ははおや]が 娘[むすめ]の 体[からだ]の ために 決[き]めたから","友達[ともだち]が 習[なら]って いたから"],"ex":"「水泳[すいえい]は私[わたし]が体[からだ]を強[つよ]くしたくて、娘[むすめ]に聞​かないで決[き]めてしまいました」. 하고 싶다고 한 건 피아노예요.","a":2},{"c":["g:45"],"q":"娘[むすめ]が「お腹[なか]が 痛[いた]い」と 言[い]うのは、本当[ほんとう]は どうしてですか。","o":["学校[がっこう]が 忙[いそが]しいから","水泳[すいえい]が 怖[こわ]いから","ピアノの 練習[れんしゅう]が 多[おお]いから","病気[びょうき]だから"],"ex":"실제 이유는 「水[みず]が顔[かお]にかかるのが怖[こわ]い」. 배가 아프다는 건 수영에 가기 싫어서 한 말이에요.","a":1},{"c":["g:45"],"q":"筆者[ひっしゃ]は 今[いま]、どう しようと 思[おも]って いますか。","o":["新[あたら]しい 習[なら]い事[ごと]を させる。","ピアノを やめさせる。","娘[むすめ]に もっと 水泳[すいえい]を 練習[れんしゅう]させる。","娘[むすめ]が 水[みず]を 好[す]きに なるように する。"],"ex":"수영을 쉬게 하고(休[やす]ませて) 가족끼리 물에서 놀며 「まず水[みず]を好[す]きになってほしい」. 사역형 休[やす]ませる(Day 45).","a":3}]},{"k":"情報検索","title":"子[こ]ども教室[きょうしつ]の 案内[あんない]","text":"【夏休[なつやす]み 子[こ]ども教室[きょうしつ]】（みどり市[し] 児童館[じどうかん]）\n教室[きょうしつ]　　　　　　対象[たいしょう]　　　　　日[ひ]にち　　　　　　　時間[じかん]　　　　　　料金[りょうきん]\n① 料理[りょうり]教室[きょうしつ]　　　小[ちい]学[まな]三[さん]〜六[ろく]年[ねん]　七月[しちがつ] 二十五日[にじゅうごにち]（金[きん]）　十時[じゅうじ]〜十[じゅう]二[に]時[じ]　　五[ご]百[ひゃく]円[えん]\n② 工作教室[こうさくきょうしつ]　　　小[ちい]学[まな]一[いち]〜三[さん]年[ねん]　七月[しちがつ] 二十八日[にじゅうはちにち]（月[げつ]）　十[じゅう]三[さん]時[じ]〜十[じゅう]五[ご]時[じ]　三[さん]百[びゃく]円[えん]\n③ 理科実験[りかじっけん]　　　小[ちい]学[まな]四[よん]〜六[ろく]年[ねん]　八[はち]月[がつ] 四日[よっか]（月[げつ]）　　　十時[じゅうじ]〜十[じゅう]二[に]時[じ]　　三[さん]百[びゃく]円[えん]\n④ 絵本[えほん]の 時間[じかん]　小[ちい]学[まな]一[いち]〜二[に]年[ねん]　八[はち]月[がつ] 六日[むいか]（水[すい]）　　　十一時[じゅういちじ]〜十[じゅう]二[に]時[じ]　無料[むりょう]\n◆ 申[もう]し込[こ]みは 七月[しちがつ] 十日[とおか]から。電話[でんわ]か 児童館[じどうかん]の 受付[うけつけ]で。\n◆ ① は エプロンを 持[も]って 来[こ]させて ください。\n◆ ① ② ③ は 先[さき]に 申[もう]し込[こ]んだ 二[に]十[じゅう]人[にん]まで です。","ko":"[여름방학 어린이 교실] (미도리시 아동관)\n① 요리 교실 초3~6 7/25(금) 10~12시 500엔 / ② 만들기 교실 초1~3 7/28(월) 13~15시 300엔 / ③ 과학 실험 초4~6 8/4(월) 10~12시 300엔 / ④ 그림책 시간 초1~2 8/6(수) 11~12시 무료\n◆ 신청은 7월 10일부터, 전화나 아동관 접수처에서.\n◆ ①은 앞치마를 가져오게 해 주세요.\n◆ ①②③은 선착순 20명까지입니다.","gloss":[["児童館[じどうかん]","아동관"],["対象[たいしょう]","대상"],["工作[こうさく]","만들기"],["理科実験[りかじっけん]","과학 실험"],["絵本[えほん]","그림책"],["無料[むりょう]","무료"],["エプロン","앞치마"]],"qs":[{"c":["g:45"],"q":"小[ちい]学[まな]二[に]年[ねん]生[せい]の ゆいちゃんが 参加[さんか]できる 教室[きょうしつ]は どれですか。","o":["②と ④","①と ②","①と ④","②と ③"],"ex":"2학년이 대상에 들어가는 건 ②(1~3학년)와 ④(1~2학년)뿐이에요.","a":0},{"c":["g:45"],"q":"小[ちい]学[まな]五[ご]年[ねん]生[せい]の 兄[あに]が 料理[りょうり]教室[きょうしつ]に 参加[さんか]する とき、親[おや]が 気[き]を つける ことは 何[なん]ですか。","o":["一緒[いっしょ]に 教室[きょうしつ]に 入[はい]る こと","無料[むりょう]なので お金[かね]は 要[い]らない こと","七月[しちがつ] 十日[とおか]より 前[まえ]に 申[もう]し込[こ]む こと","エプロンを 持[も]たせる こと"],"ex":"「①はエプロンを持[も]って来[こ]させてください」. 신청은 7월 10일부터이고 요금은 500엔이에요.","a":3}]}]},
{"id":"b49","after":49,"lv":"N4","k":"短文","title":"友達[ともだち]への メッセージ","text":"リサ、今[いま] 駅[えき]に 着[つ]いたよ。\nでも、電車[でんしゃ]が 止[と]まって いるみたい。駅[えき]の 人[ひと]が 何[なに]か 説明[せつめい]して いるけど、よく 聞[き]こえない。たぶん 事故[じこ]が あったようだ。\nバスで 行[い]くと 三十分[さんじゅっぷん] かかるから、約束[やくそく]の 一時[いちじ]には 間[ま]に合[あ]わないと 思[おも]う。ごめんね。お店[みせ]に 先[さき]に 入[はい]って いて。","ko":"리사, 지금 역에 도착했어.\n그런데 전철이 멈춘 것 같아. 역 직원이 뭔가 설명하는데 잘 안 들려. 아마 사고가 난 것 같아.\n버스로 가면 30분 걸리니까 약속한 1시에는 못 맞출 것 같아. 미안해. 가게에 먼저 들어가 있어.","gloss":[["メッセージ","메시지"],["〜みたい","~인 것 같다"],["聞[き]こえる","들리다"],["事故[じこ]","사고"],["間[ま]に合[あ]う","시간에 맞추다"]],"qs":[{"c":["g:49"],"q":"この 人[ひと]は リサさんに 何[なに]を 頼[たの]んで いますか。","o":["駅[えき]まで 迎[むか]えに 来[き]て ほしい。","先[さき]に 店[みせ]で 待[ま]って いて ほしい。","約束[やくそく]の 時間[じかん]を 変[か]えて ほしい。","バスで 来[き]て ほしい。"],"ex":"「お店[みせ]に先[さき]に入[はい]っていて」. 〜ようだ・〜みたい는 추측(Day 49). 전철이 멈춘 \"것 같다\"는 확실하지 않은 정보예요.","a":1}],"more":[{"k":"中文","title":"隣[となり]の 人[ひと]","text":"私[わたし]の アパートの 隣[となり]の 部屋[へや]に、先月[せんげつ] 新[あたら]しい 人[ひと]が 引[ひ]っ越[こ]して きました。まだ 一度[いちど]も 会[あ]った ことが ありませんが、どんな 人[ひと]か 少[すこ]し 分[わ]かるような 気[き]が します。\n朝[あさ] 六時[ろくじ]ごろに なると、隣[となり]から ラジオの 英語講座[えいごこうざ]が 聞[き]こえて きます。毎朝[まいあさ] 同[おな]じ 時間[じかん]なので、とても 真面目[まじめ]な 人[ひと]のようです。夜[よる]は 遅[おそ]くまで 電気[でんき]が ついて いて、ときどき パソコンの 音[おと]も します。仕事[しごと]か 勉強[べんきょう]が 忙[いそが]しいのでしょう。\nベランダには 小[ちい]さい 植物[しょくぶつ]の 鉢[ばち]が 十[じゅう]個[こ]ぐらい 並[なら]んで います。どれも 元気[げんき]に 育[そだ]って いて、大切[たいせつ]に 世話[せわ]を して いるようです。\n先週[せんしゅう]、私[わたし]の 部屋[へや]の 前[まえ]に 置[お]いて いた 傘[かさ]が 風[かぜ]で 飛[と]ばされて しまいました。次[つぎ]の 日[ひ]、ドアの 前[まえ]に その 傘[かさ]と 小[ちい]さい メモが ありました。メモには「下[した]に 落[お]ちて いました」と きれいな 字[じ]で 書[か]いて ありました。きっと 隣[となり]の 人[ひと]です。今度[こんど] 会[あ]ったら、お礼[れい]を 言[い]おうと 思[おも]います。","ko":"우리 아파트 옆방에 지난달 새 사람이 이사 왔습니다. 아직 한 번도 만난 적이 없지만 어떤 사람인지 조금 알 것 같은 기분이 듭니다.\n아침 6시쯤이 되면 옆에서 라디오 영어 강좌가 들려옵니다. 매일 아침 같은 시간이라 아주 성실한 사람 같습니다. 밤에는 늦게까지 불이 켜져 있고 가끔 컴퓨터 소리도 납니다. 일이나 공부가 바쁜 거겠죠.\n베란다에는 작은 화분이 열 개쯤 놓여 있습니다. 모두 잘 자라고 있어서 소중히 돌보고 있는 것 같습니다.\n지난주 제 방 앞에 두었던 우산이 바람에 날아가 버렸습니다. 다음 날 문 앞에 그 우산과 작은 메모가 있었습니다. 메모에는 \"아래에 떨어져 있었어요\"라고 예쁜 글씨로 쓰여 있었습니다. 분명 옆집 사람입니다. 다음에 만나면 고맙다고 말하려고 합니다.","gloss":[["気[き]が する","~한 기분이 들다"],["ラジオ","라디오"],["講座[こうざ]","강좌"],["ベランダ","베란다"],["植物[しょくぶつ]","식물"],["鉢[ばち]","화분"],["世話[せわ]","돌봄"],["飛[と]ばす","날리다"],["落[お]ちる","떨어지다"],["字[じ]","글씨"],["きっと","분명"],["お礼[れい]","감사 인사"]],"qs":[{"c":["g:49"],"q":"筆者[ひっしゃ]は 隣[となり]の 人[ひと]が 真面目[まじめ]だと 思[おも]って います。それは どうしてですか。","o":["植物[しょくぶつ]を たくさん 育[そだ]てて いるから","夜[よる] 遅[おそ]くまで 起[お]きて いるから","毎朝[まいあさ] 決[き]まった 時間[じかん]に 英語[えいご]を 勉強[べんきょう]して いるから","傘[かさ]を 返[かえ]して くれたから"],"ex":"「毎朝[まいあさ]同[おな]じ時間[じかん]なので、とても真面目[まじめ]な人[ひと]のようです」. 〜ようだ(Day 49)는 근거가 있는 추측이에요. 근거 = 매일 같은 시간 영어 강좌.","a":2},{"c":["g:49"],"q":"先週[せんしゅう]、何[なに]が ありましたか。","o":["隣[となり]の 人[ひと]の 植物[しょくぶつ]が 風[かぜ]で 倒[たお]れた。","隣[となり]の 人[ひと]が 筆者[ひっしゃ]の 傘[かさ]を 見[み]つけて くれた。","筆者[ひっしゃ]が 隣[となり]の 人[ひと]に 傘[かさ]を 貸[か]した。","筆者[ひっしゃ]が 隣[となり]の 人[ひと]と 初[はじ]めて 話[はな]した。"],"ex":"바람에 날아간 우산이 메모와 함께 문 앞에 돌아와 있었어요. 아직 만난 적은 없어요.","a":1},{"c":["g:32"],"q":"筆者[ひっしゃ]は これから どう しようと 思[おも]って いますか。","o":["会[あ]った ときに お礼[れい]を 言[い]う。","隣[となり]の 部屋[へや]へ あいさつに 行[い]く。","手紙[てがみ]で お礼[れい]を 書[か]く。","植物[しょくぶつ]を プレゼントする。"],"ex":"「今度[こんど]会[あ]ったら、お礼[れい]を言[い]おうと思[おも]います」. 〜ようと思[おも]う(Day 32)는 의지.","a":0}]},{"k":"情報検索","title":"電車[でんしゃ]の 遅[おく]れの 案内[あんない]","text":"【みどり線[せん]　運転[うんてん]の お知[し]らせ】（十[じゅう]月[がつ] 八日[ようか] 午前[ごぜん] 八時[はちじ] 現在[げんざい]）\n今朝[けさ] 七時[しちじ]十五分[じゅうごふん]ごろ、さくら駅[えき]で 事故[じこ]が ありました。そのため、次[つぎ]のように 運転[うんてん]して います。\n・さくら駅[えき]〜ひがし駅[えき]：運転[うんてん]を 止[と]めて います。午前[ごぜん] 十時[じゅうじ]ごろ 運転[うんてん]を 再開[さいかい]する 予定[よてい]です。\n・ひがし駅[えき]〜みなと駅[えき]：三十分[さんじゅっぷん] おきに 運転[うんてん]して います。\n・みどり駅[えき]〜さくら駅[えき]：いつもと 同[おな]じです。\n◆ さくら駅[えき]〜ひがし駅[えき]の 間[あいだ]は、駅前[えきまえ]から 臨時[りんじ]バスが 出[で]て います（二十分[にじゅっぷん] おき、約[やく] 四十分[よんじゅっぷん]）。\n◆ 電車[でんしゃ]の 切符[きっぷ]・定期券[ていきけん]で 臨時[りんじ]バスに 乗[の]れます。\n◆ 遅延[ちえん]証明書[しょうめいしょ]は 各駅[かくえき]の 改札[かいさつ]で もらえます。","ko":"[미도리선 운행 안내] (10월 8일 오전 8시 현재)\n오늘 아침 7시 15분쯤 사쿠라역에서 사고가 있었습니다. 그 때문에 다음과 같이 운행하고 있습니다.\n· 사쿠라역~히가시역: 운행 중지. 오전 10시쯤 운행 재개 예정.\n· 히가시역~미나토역: 30분 간격 운행.\n· 미도리역~사쿠라역: 평소와 같음.\n◆ 사쿠라역~히가시역 사이는 역 앞에서 임시 버스가 다닙니다(20분 간격, 약 40분).\n◆ 전철표·정기권으로 임시 버스를 탈 수 있습니다.\n◆ 지연 증명서는 각 역 개찰구에서 받을 수 있습니다.","gloss":[["〜線[せん]","~선"],["運転[うんてん]","운행"],["現在[げんざい]","현재"],["そのため","그 때문에"],["再開[さいかい]","재개"],["〜おきに","~간격으로"],["臨時[りんじ]","임시"],["約[やく]","약"],["定期券[ていきけん]","정기권"],["遅延[ちえん]証明書[しょうめいしょ]","지연 증명서"],["各駅[かくえき]","각 역"]],"qs":[{"c":["g:49"],"q":"午前[ごぜん] 八時[はちじ]半[はん]、さくら駅[えき]に いる 人[ひと]が ひがし駅[えき]へ 行[い]きたいです。どう するのが いいですか。","o":["定期券[ていきけん]で 臨時[りんじ]バスに 乗[の]る。","十時[じゅうじ]まで 電車[でんしゃ]を 待[ま]つ。","新[あたら]しい 切符[きっぷ]を 買[か]って、臨時[りんじ]バスに 乗[の]る。","電車[でんしゃ]で みなと駅[えき]へ 行[い]く。"],"ex":"사쿠라~히가시 구간은 운행 중지, 재개는 10시 예정. 임시 버스는 정기권·전철표로 탈 수 있으니 새 표는 필요 없어요.","a":0},{"c":["g:31"],"q":"会社[かいしゃ]に 遅[おく]れた 人[ひと]が、遅[おく]れた 理由[りゆう]を 会社[かいしゃ]に 見[み]せたいです。どう しますか。","o":["バスの 中[なか]で 証明書[しょうめいしょ]を もらう。","事故[じこ]の 写真[しゃしん]を 撮[と]る。","駅[えき]の 改札[かいさつ]で 証明書[しょうめいしょ]を もらう。","会社[かいしゃ]に 電話[でんわ]して もらう。"],"ex":"「遅延[ちえん]証明書[しょうめいしょ]は各​駅[えき]の改札[かいさつ]でもらえます」.","a":2}]}]},
{"id":"b52","after":52,"lv":"N4","k":"短文","title":"店長[てんちょう]からの 連絡[れんらく]","text":"アルバイトの みなさん\n来月[らいげつ]から 店[みせ]の 開[ひら]く 時間[じかん]が 一時間[いちじかん] 早[はや]く なり、朝[あさ] 九時[くじ]に なります。\n朝[あさ]の シフトに 入[い]れる 人[ひと]は、今週中[こんしゅうちゅう]に 私[わたし]に 言[い]って ください。\nほかの 時間[じかん]の シフトは 変[か]わらないと 思[おも]いますが、決[き]まったら また 連絡[れんらく]します。\n店長[てんちょう] 木村[きむら]","ko":"아르바이트생 여러분\n다음 달부터 가게 여는 시간이 한 시간 빨라져 아침 9시가 됩니다.\n아침 근무에 들어올 수 있는 사람은 이번 주 안에 저에게 말해 주세요.\n다른 시간대 근무는 바뀌지 않을 거라고 생각하지만, 정해지면 다시 연락하겠습니다.\n점장 기무라","gloss":[["アルバイト","아르바이트"],["シフト","근무 시간표"],["今週中[こんしゅうちゅう]","이번 주 안"]],"qs":[{"c":["g:52"],"q":"この メモから 分[わ]かる ことは 何[なん]ですか。","o":["店[みせ]の 閉[し]まる 時間[じかん]が 早[はや]く なる。","来月[らいげつ]から 店[みせ]が 休[やす]みに なる。","朝[あさ] 九時[くじ]から 働[はたら]ける 人[ひと]を 探[さが]して いる。","ほかの 時間[じかん]の シフトも 変[か]わった。"],"ex":"아침 근무(朝[あさ]のシフト) 들어올 사람을 찾고 있어요. 다른 시간은 \"바뀌지 않을 것 같다(〜と思[おも]う, Day 52)\"며 아직 확정이 아니에요.","a":2}],"more":[{"k":"中文","title":"スマホと 読書[どくしょ]","text":"電車[でんしゃ]の 中[なか]を 見[み]ると、ほとんどの 人[ひと]が スマホを 見[み]て います。本[ほん]や 新聞[しんぶん]を 読[よ]んで いる 人[ひと]は とても 少[すく]なく なりました。「若[わか]い 人[ひと]は 本[ほん]を 読[よ]まなく なった」と よく 言[い]われますが、本当[ほんとう]でしょうか。\nある 調査[ちょうさ]に よると、一[いっ]か月[げつ][げつ]に 一冊[いっさつ]も 本[ほん]を 読[よ]まない 人[ひと]は 二[に]十代[だい]より 六[ろく]十代[だい]の ほうが 多[おお]かったそうです。若[わか]い 人[ひと]は 紙[かみ]の 本[ほん]は 読[よ]まなくても、スマホで 小説[しょうせつ]や ニュースを 読[よ]んで いる ことが 多[おお]いのです。\n私[わたし]の 弟[おとうと]も 本[ほん]を 買[か]いませんが、毎晩[まいばん] スマホで 小説[しょうせつ]を 読[よ]んで います。弟[おとうと]は「スマホなら 重[おも]くないし、夜[よる] 暗[くら]い 部屋[へや]でも 読[よ]める」と 言[い]います。\n私[わたし]は 紙[かみ]の 本[ほん]が 好[す]きです。ページを めくる 音[おと]や、紙[かみ]の においが 好[す]きだからです。でも、どちらで 読[よ]むかは あまり 大切[たいせつ]では ないと 思[おも]います。大切[たいせつ]なのは、読[よ]んで、考[かんが]える ことでは ないでしょうか。","ko":"전철 안을 보면 대부분의 사람이 스마트폰을 보고 있습니다. 책이나 신문을 읽는 사람은 아주 적어졌습니다. \"젊은 사람은 책을 읽지 않게 되었다\"는 말을 자주 듣는데, 정말일까요?\n어느 조사에 따르면 한 달에 한 권도 책을 읽지 않는 사람은 20대보다 60대가 더 많았다고 합니다. 젊은 사람은 종이책은 읽지 않아도 스마트폰으로 소설이나 뉴스를 읽는 경우가 많은 것입니다.\n제 남동생도 책은 사지 않지만 매일 밤 스마트폰으로 소설을 읽습니다. 동생은 \"스마트폰이면 무겁지 않고 밤에 어두운 방에서도 읽을 수 있다\"고 말합니다.\n저는 종이책을 좋아합니다. 페이지를 넘기는 소리나 종이 냄새를 좋아하기 때문입니다. 하지만 어느 쪽으로 읽느냐는 그다지 중요하지 않다고 생각합니다. 중요한 것은 읽고 생각하는 것이 아닐까요.","gloss":[["読書[どくしょ]","독서"],["ほと {"id":"b56","after":56,"lv":"N4","k":"短文","title":"旅行[りょこう]の 前[まえ]の メモ","text":"明日[あした]から 北海道[ほっかいどう]へ 旅行[りょこう]に 行[い]く。\n今晩[こんばん] しておく こと：\n・ホテルの 予約[よやく]の 紙[かみ]を 印刷[いんさつ]して おく\n・カメラの 電池[でんち]を 充電[じゅうでん]して おく\n・冷蔵庫[れいぞうこ]の 牛乳[ぎゅうにゅう]を 飲[の]んで おく（三日[みっか] いないから）\n朝[あさ] する こと：窓[まど]を 閉[し]めて、ガスを 確認[かくにん]する。","ko":"내일부터 홋카이도로 여행을 간다.\n오늘 밤 해 둘 일:\n· 호텔 예약 종이를 인쇄해 두기\n· 카메라 배터리를 충전해 두기\n· 냉장고의 우유를 마셔 두기(3일 동안 없으니까)\n아침에 할 일: 창문을 닫고 가스를 확인한다.","gloss":[["北海道[ほっかいどう]","홋카이도"],["印刷[いんさつ]","인쇄"],["電池[でんち]","배터리"],["充電[じゅうでん]","충전"],["ガス","가스"],["確認[かくにん]","확인"]],"qs":[{"c":["g:56"],"q":"この 人[ひと]が 牛乳[ぎゅうにゅう]を 飲[の]んで おくのは どうしてですか。","o":["旅行中[りょこうちゅう]に 悪[わる]く なって しまうから","旅行[りょこう]に 持[も]って 行[い]くから","朝[あさ]ご飯[はん]の 代[か]わりだから","冷蔵庫[れいぞうこ]が 壊[こわ]れたから"],"ex":"3일 동안 집에 없으니 우유가 상하기 전에 미리 마셔 둬요. 〜ておく(Day 56)는 준비.","a":0}],"more":[{"k":"中文","title":"防災[ぼうさい]の 準備[じゅんび]","text":"日本[にほん]は 地震[じしん]が 多[おお]い 国[くに]です。いつ 大[おお]きい 地震[じしん]が 来[き]ても 困[こま]らないように、多[おお]くの 家庭[かてい]が 準備[じゅんび]を して います。\nまず、水[みず]と 食[た]べ物[もの]です。電気[でんき]や 水道[すいどう]が 止[と]まっても 生活[せいかつ]できるように、一人[ひとり] 三日[みっか]分[ぶん]の 水[みず]と 食[た]べ物[もの]を 用意[ようい]して おく ことが すすめられて います。食[た]べ物[もの]は、火[ひ]を 使[つか]わないで 食[た]べられる 物[もの]が 便利[べんり]です。\n次[つぎ]に、家族[かぞく]で 話[はな]し合[あ]って おく ことも 大切[たいせつ]です。地震[じしん]が 起[お]きた とき、家族[かぞく]が 別々[べつべつ]の 場所[ばしょ]に いる ことも あります。電話[でんわ]が つながらない ときに どこに 集[あつ]まるか、決[き]めて おきましょう。\n私[わたし]の 家[いえ]では、近[ちか]くの 小学校[しょうがっこう]に 集[あつ]まる ことに して います。去年[きょねん]、実際[じっさい]に 家族[かぞく] 四人[よにん]で 家[いえ]から 小学校[しょうがっこう]まで 歩[ある]いて みました。思[おも]ったより 坂[さか]が 多[おお]くて、二十分[にじゅっぷん]も かかりました。祖母[そぼ]は 足[あし]が 悪[わる]いので、もっと かかるでしょう。歩[ある]いて みて、初[はじ]めて 分[わ]かる ことも あるのです。","ko":"일본은 지진이 많은 나라입니다. 언제 큰 지진이 와도 곤란하지 않도록 많은 가정이 준비를 하고 있습니다.\n먼저 물과 음식입니다. 전기나 수도가 끊겨도 생활할 수 있도록 1인당 3일분의 물과 음식을 마련해 두는 것이 권장되고 있습니다. 음식은 불을 쓰지 않고 먹을 수 있는 것이 편리합니다.\n다음으로 가족끼리 의논해 두는 것도 중요합니다. 지진이 났을 때 가족이 각각 다른 곳에 있을 수도 있습니다. 전화가 연결되지 않을 때 어디에 모일지 정해 둡시다.\n우리 집에서는 근처 초등학교에 모이기로 하고 있습니다. 작년에 실제로 가족 네 명이 집에서 초등학교까지 걸어 보았습니다. 생각보다 언덕이 많아서 20분이나 걸렸습니다. 할머니는 다리가 불편해서 더 걸리겠지요. 걸어 보고 나서야 비로소 알게 되는 것도 있는 것입니다.","gloss":[["防災[ぼうさい]","방재" {"id":"b59","after":59,"lv":"N4","k":"短文","title":"会議室[かいぎしつ]の 張[は]り紙[がみ]","text":"この 会議室[かいぎしつ]を 使[つか]った 方[かた]へ\n使[つか]った 後[あと]は、机[つくえ]と 椅子[いす]を 元[もと]の 場所[ばしょ]に 戻[もど]して ください。\nホワイトボードに 書[か]いて ある 字[じ]は 消[け]して、電気[でんき]と エアコンを 消[け]して から 出[で]て ください。\n※ プロジェクターの リモコンは 受付[うけつけ]に 返[かえ]して ください。\n総務部[そうむぶ]","ko":"이 회의실을 사용한 분께\n사용한 후에는 책상과 의자를 원래 자리에 되돌려 주세요.\n화이트보드에 쓰여 있는 글씨는 지우고, 전등과 에어컨을 끈 다음 나가 주세요.\n※ 프로젝터 리모컨은 접수처에 반납해 주세요.\n총무부","gloss":[["張[は]り紙[がみ]","벽보"],["元[もと]の","원래의"],["ホワイトボード","화이트보드"],["エアコン","에어컨"],["プロジェクター","프로젝터"],["リモコン","리모컨"],["総務部[そうむぶ]","총무부"]],"qs":[{"c":["g:59"],"q":"会議室[かいぎしつ]を 出[で]る 前[まえ]に しなくても いい ことは どれですか。","o":["椅子[いす]を 元[もと]に 戻[もど]す。","ホワイトボードを 受付[うけつけ]に 返[かえ]す。","エアコンを 消[け]す。","字[じ]を 消[け]す。"],"ex":"반납하는 건 리모컨이지 화이트보드가 아니에요. 書[か]いてある(Day 59)는 누군가 써 둔 결과 상태.","a":1}],"more":[{"k":"中文","title":"駅[えき]の 忘[わす]れ物[もの]","text":"日本[にほん]では、駅[えき]や 電車[でんしゃ]の 中[なか]で 財布[さいふ]を 落[お]としても、戻[もど]って くる ことが 多[おお]いと よく 言[い]われます。ある 鉄道会社[てつどうかいしゃ]に よると、一年[いちねん]間[かん]に 届[とど]けられる 忘[わす]れ物[もの]は 約[やく] 三[さん]十[じゅう]万[まん]個[こ]で、その うち 財布[さいふ]は 三[さん]万[まん]個[こ]ぐらいだそうです。そして、その 七[なな]割[わり]が 持[も]ち主[ぬし]の 所[ところ]に 戻[もど]って いるそうです。\nいちばん 多[おお]い 忘[わす]れ物[もの]は 傘[かさ]です。特[とく]に 朝[あさ] 雨[あめ]が 降[ふ]って、昼[ひる]から 晴[は]れた 日[ひ]には、傘[かさ]の 忘[わす]れ物[もの]が とても 増[ふ]えます。ところが、傘[かさ]を 取[と]りに 来[く]る 人[ひと]は 少[すく]なく、戻[もど]るのは 一[いち]割[わり]ぐらいだそうです。安[やす]い 傘[かさ]なら、新[あたら]しく 買[か]った ほうが 早[はや]いと 考[かんが]える 人[ひと]が 多[おお]いのでしょう。\n忘[わす]れ物[もの]を した ときは、まず 駅[えき]の 事務室[じむしつ]に 行[い]って、いつ、どの 電車[でんしゃ]の 何両目[なんりょうめ]に 乗[の]ったかを 話[はな]すと 見[み]つかりやすく なります。また、かばんに 名前[なまえ]や 連絡先[れんらくさき]を 書[か]いて おくと、戻[もど]って くる 可能性[かのうせい]が 高[たか]く なります。","ko":"일본에서는 역이나 전철 안에서 지갑을 잃어버려도 돌아오는 경우가 많다고 자주 말합니다. 어느 철도 회사에 따르면 1년간 접수되는 분실물은 약 30만 개이고, 그중 지갑은 3만 개 정도라고 합니다. 그리고 그 70%가 주인에게 돌아간다고 합니다.\n가장 많은 분실물은 우산입니다. 특히 아침에 비가 오다가 낮부터 갠 날에는 우산 분실물이 아주 늘어납니다. 그런데 우산을 찾으러 오는 사람은 적어서 돌아가는 것은 10% 정도라고 합니다. 싼 우산이라면 새로 사는 편이 빠르다고 생각하는 사람이 많은 것이겠지요.\n분실물이 생겼을 때는 먼저 역 사무실에 가서 언제, 어느 전철의 몇 번째 칸에 탔는지 말하면 찾기 쉬워집니다. 또 가방에 이름이나 연락처를 써 두면 돌아올 가능성이 높아집니다.","gloss":[["鉄道[てつどう]","철도"],["届[とど]ける","신
