<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>かなみち — 일본어 한 걸음씩</title>
<meta name="description" content="하루 25단어로 시작하는 일본어 학습. 단어·문법·생활 표현, XP와 연속 학습일.">
<meta name="theme-color" content="#FAF6EE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="かなみち">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#FAF6EE;--card:#fff;--ink:#23262F;--sub:#6E717B;--line:#E7E0D2;--line2:#D8CFBD;--pri:#E4572E;--prid:#B23F1C;--ok:#3C9446;--okd:#2B6F33;--okbg:#E4F3E0;--bad:#D24B43;--badd:#A23630;--badbg:#FBE4E1;--blue:#3A5BA0;--blued:#283F73;--bluebg:#E7EEFA;--gold:#E3A019;--fire:#F07A1A;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overscroll-behavior-y:none;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5}
.jp{font-family:'Zen Maru Gothic','Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:disabled{cursor:default}
svg{width:1em;height:1em;display:block}
ruby rt{font-size:.5em;color:var(--sub);font-weight:500;letter-spacing:0}
#app{max-width:540px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:10;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));border-bottom:2px solid var(--line)}
.logo{font-weight:700;font-size:20px;color:var(--pri);line-height:1.1}
.logo small{display:block;font-family:'Noto Sans KR',sans-serif;font-size:11px;color:var(--sub);font-weight:500}
.stats{display:flex;gap:4px}
.st{display:flex;align-items:center;gap:5px;background:none;border:0;padding:6px 8px;border-radius:10px;font-weight:800;font-size:15px}
.st svg{font-size:20px}
.st.fire{color:#B9B2A5}.st.fire.on{color:var(--fire)}
.st.xp{color:var(--gold)}.st.heart{color:var(--bad)}
.st:active{background:var(--line)}
.main{flex:1;padding:14px 16px 110px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:540px;display:flex;background:#fff;border-top:2px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px 0;border-radius:12px;color:#A39C8F;font-size:11px;font-weight:700}
.nav button svg,.nav .glyph{font-size:24px;height:24px;line-height:24px}
.nav .glyph{font-weight:700}
.nav button.on{color:var(--pri);background:#FDEEE8}
/* 오늘의 목표 */
.daily{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:18px}
.drow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlab{font-size:12px;color:var(--sub);font-weight:700}
.dval{font-size:16px}.dval b{font-size:22px}.dxp{color:var(--gold);font-weight:700;font-size:14px}
.bar{height:12px;background:#EFE9DC;border-radius:8px;overflow:hidden;margin-top:10px}
.bar div{height:100%;background:linear-gradient(90deg,#F2A541,var(--pri));border-radius:8px;transition:width .4s}
.dok{margin-top:8px;font-size:13px;color:var(--ok);font-weight:700}
/* 유닛 */
.unit{margin-bottom:14px}
.ubanner{background:var(--c);color:#fff;border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 4px 0 var(--cd)}
.ulab{font-size:12px;font-weight:800;letter-spacing:.06em;opacity:.85}
.ubanner h2{margin:2px 0 0;font-size:20px;line-height:1.25}
.ubanner p{margin:2px 0 0;font-size:13px;opacity:.9}
.ubtn{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);color:#fff;border-radius:12px;padding:6px 10px;font-size:11px;font-weight:700}
.ubtn svg{font-size:20px}
.path{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 0 18px}
.nwrap.hascur{margin-top:30px}
.nwrap{position:relative;display:flex;flex-direction:column;align-items:center;width:96px}
.node{width:70px;height:64px;border-radius:50%;border:0;background:var(--c);color:#fff;box-shadow:0 6px 0 var(--cd);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;transition:transform .08s}
.node svg{font-size:30px}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 var(--cd)}
.node.done{background:var(--gold);box-shadow:0 6px 0 #B07A0C}
.node.locked{background:#E3DDD0;color:#B2AA9A;box-shadow:0 6px 0 #CBC3B3}
.node.cur{outline:5px solid color-mix(in srgb,var(--c) 30%,transparent);outline-offset:4px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{outline-offset:8px}}
.nlab{font-size:12px;color:var(--sub);font-weight:700;margin-top:10px;white-space:nowrap}
.bubble{position:absolute;top:-34px;background:#fff;color:var(--c);border:2px solid var(--line);font-weight:800;font-size:13px;padding:3px 12px;border-radius:10px;animation:bob 1.6s infinite;z-index:2}
.bubble:after{content:'';position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:#fff;border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-4px)}}
/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;padding:13px 18px;background:var(--pri);color:#fff;font-weight:800;font-size:16px;box-shadow:0 4px 0 var(--prid);letter-spacing:.02em}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--prid)}
.btn:disabled,.btn.dis{background:#E3DDD0;color:#A59D8E;box-shadow:0 4px 0 #CDC5B5}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:12px}
.btn.wide{width:100%}
.btn.col{background:var(--c);box-shadow:0 4px 0 var(--cd)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.danger{background:var(--bad);box-shadow:0 4px 0 var(--badd)}
.btn.ghost.danger{background:#fff;color:var(--bad)}
.btn.okb{background:var(--ok);box-shadow:0 4px 0 var(--okd)}
.btn.badb{background:var(--bad);box-shadow:0 4px 0 var(--badd)}
.link{background:none;border:0;color:var(--sub);font-weight:700;font-size:13px;padding:6px;margin-bottom:6px;text-decoration:underline}
.mini{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--bluebg);color:var(--blue);display:inline-flex;align-items:center;justify-content:center}
.mini svg{font-size:18px}
/* 카드 */
.card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:14px}
.card h2,.card h3{margin:0 0 8px}.card h3{font-size:16px}
.card p{margin:0 0 10px;color:#4A4D57}
.hint{font-size:13px;color:var(--sub);margin:8px 0}
.hint.c{text-align:center}
.seg{display:flex;background:#EFE9DC;border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font-weight:700;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--line)}
.seg.small{width:max-content;margin:0 auto 6px}.seg.small button{padding:6px 16px;font-size:14px}
.wl{list-style:none;margin:0;padding:0}
.wl li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #F1ECE2}
.wl li:last-child{border-bottom:0}
.wl .jp{font-size:18px;min-width:96px}
.wl .m{flex:1;font-size:14px}.wl .m small{display:block;color:var(--sub);font-size:12px}
.wl .cnt{color:var(--bad);font-weight:800;font-size:13px}
details{border-top:1px solid var(--line);padding:8px 0}
details summary{font-weight:700;cursor:pointer;padding:4px 0}
details summary small{color:var(--sub);font-weight:500}
/* 문자표 */
.ch{font-size:14px;color:var(--sub);margin:16px 0 8px}
.cgrid{display:grid;gap:6px}
.cc{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;box-shadow:0 2px 0 var(--line)}
.cc .jp{font-size:24px;line-height:1.2}
.cc small{font-size:11px;color:var(--sub)}
.cc.lr{background:#FFF3DA;border-color:#F0D48E}
.cc.empty{visibility:hidden}
/* 프로필 */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sc{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center}
.sc .ic{grid-row:span 2;font-size:26px}
.sc b{font-size:20px;line-height:1.1}.sc small{color:var(--sub);font-size:12px}
.ic.fire{color:var(--fire)}.ic.xp{color:var(--gold)}.ic.blue{color:var(--blue)}.ic.green{color:var(--ok)}
.week{display:flex;gap:8px;align-items:flex-end;height:130px}
.wcol{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.wv{font-size:11px;color:var(--sub);height:16px}
.wb{flex:1;width:100%;max-width:30px;background:#F2EDE3;border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.wb div{width:100%;background:#F2B15C;border-radius:8px}
.wb div.today{background:var(--pri)}
.wcol small{font-size:12px;color:var(--sub);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;font-weight:700}
.chip.on{border-color:var(--pri);color:var(--pri);background:#FDEEE8}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #F1ECE2}
.setrow small{display:block;color:var(--sub);font-size:12px;font-weight:400}
.sw{flex:none;width:52px;height:30px;border-radius:16px;border:0;background:#DDD6C8;position:relative;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.sw.on{background:var(--ok)}.sw.on i{left:25px}
.sync{font-size:12px;color:var(--sub);margin:12px 0}
.foot{font-size:12px;color:var(--sub);text-align:center}
/* 모달 */
#modal{position:fixed;inset:0;z-index:50;display:none}
#modal.show{display:block}
.ov{position:absolute;inset:0;background:rgba(30,28,24,.45);animation:fade .2s}
.sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:540px;max-height:86vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.sheet h2{margin:4px 0 6px;font-size:22px}
.sheet p{color:#4A4D57;margin:0 0 14px}
.sheet .btn+.btn{margin-top:10px}
.lsheet .ulab{color:var(--c)}
.big{font-size:26px!important;color:var(--ink)!important;letter-spacing:.08em}
.gsheet h3{font-size:15px;margin:16px 0 6px;color:var(--sub)}
.gl{margin:0 0 16px;padding-left:20px}.gl li{margin-bottom:8px;color:#3F424B}
.hearts{display:flex;gap:6px;justify-content:center;font-size:34px;color:var(--bad);margin:6px 0 12px}
.hearts .off{color:#E5DED1}
.sweek{display:flex;justify-content:space-between;margin:10px 0 14px}
.sweek div{display:flex;flex-direction:column;align-items:center;gap:4px}
.sweek span{width:36px;height:36px;border-radius:50%;background:#F1ECE2;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}
.sweek .on span{background:var(--fire)}
.sweek small{font-size:12px;color:var(--sub)}
/* 레슨 */
.lesson{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.lhead{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 16px 6px}
.iconbtn{background:none;border:0;color:#A9A193;font-size:26px;padding:4px}
.prog{flex:1;height:16px;background:#EBE4D6;border-radius:10px;overflow:hidden}
.prog div{height:100%;background:var(--ok);border-radius:10px;transition:width .35s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.lh{display:flex;align-items:center;gap:4px;color:var(--bad);font-weight:800}
.lh svg{font-size:22px}.lh.inf{font-size:22px}.lh.prac{font-size:13px;color:var(--blue);background:var(--bluebg);padding:3px 8px;border-radius:8px}
.lbody{flex:1;padding:12px 18px 18px}
.lfoot{position:sticky;bottom:0;padding:14px 18px calc(16px + env(safe-area-inset-bottom));border-top:2px solid var(--line);background:var(--bg)}
.lfoot.ok{background:var(--okbg);border-color:#BFE2B7}
.lfoot.bad{background:var(--badbg);border-color:#F1C3BE}
.q{font-size:21px;margin:6px 0 14px;line-height:1.35}
.tag{display:inline-block;background:#FDEEE8;color:var(--pri);font-weight:800;font-size:12px;padding:3px 10px;border-radius:8px;letter-spacing:.04em}
.pr{display:flex;flex-direction:column;align-items:center;margin:4px 0 18px}
.bigch{font-size:84px;line-height:1.15;font-weight:700}
.ptext{font-size:22px;font-weight:700;text-align:center;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 18px}
.ptext.mono{font-family:ui-monospace,Menlo,monospace;font-size:34px;letter-spacing:.04em}
.pjp{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 18px}
.pjp .jp{font-size:30px;line-height:1.7}
.prd{color:var(--sub);font-size:14px;margin-top:6px;text-align:center}
.bigspk{width:96px;height:96px;border-radius:24px;border:0;background:var(--blue);color:#fff;font-size:46px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 var(--blued)}
.bigspk svg{font-size:48px}
.bigspk:active{transform:translateY(3px);box-shadow:0 2px 0 var(--blued)}
.slow{margin-top:12px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:5px 14px;font-weight:700;font-size:13px;color:var(--blue)}
.cloze{font-size:26px;line-height:2;text-align:center;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 16px}
.blank{display:inline-block;min-width:64px;border-bottom:3px solid var(--blue);margin:0 4px;line-height:1.3;color:var(--blue);font-weight:700}
.cko{color:var(--sub);margin-top:8px;font-size:15px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:13px 14px;box-shadow:0 3px 0 var(--line);font-size:17px;min-height:56px}
.opt .num{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);color:#B1A999;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.opt .oh{flex:1}
.opt.jp .oh{font-size:22px;line-height:1.6}
.opt.bigopt .oh{font-size:32px;text-align:center}
.opt.rd .oh{font-family:ui-monospace,Menlo,monospace;font-size:20px;text-align:center}
.opt.sel{border-color:#86A6E0;background:var(--bluebg);box-shadow:0 3px 0 #86A6E0}
.opt.right{border-color:#8DCB85;background:var(--okbg);box-shadow:0 3px 0 #8DCB85}
.opt.wrong{border-color:#EBA19A;background:var(--badbg);box-shadow:0 3px 0 #EBA19A}
.tin{width:100%;font-size:26px;padding:14px 16px;border:2px solid var(--line2);border-radius:16px;background:#fff;text-align:center;font-family:ui-monospace,Menlo,monospace;outline:none}
.tin:focus{border-color:var(--blue)}
.ans{min-height:120px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);background:repeating-linear-gradient(transparent 0 58px,var(--line) 58px 60px);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;margin-bottom:18px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{background:#fff;border:2px solid var(--line2);border-radius:12px;padding:8px 13px;font-size:17px;box-shadow:0 3px 0 var(--line2);line-height:1.5}
.jp .tile,.tile.jp{font-size:20px}
.tile.ghost{background:#EDE7DB;color:transparent;box-shadow:none;border-color:#EDE7DB}
.tile.ghost ruby rt{color:transparent}
.match{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:12px}
.mt{display:flex;align-items:center;justify-content:center;text-align:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 8px;min-height:68px;box-shadow:0 3px 0 var(--line);font-size:15px;font-weight:600}
.mt.jp{font-size:21px;font-weight:500;line-height:1.6}
.mt.sel{border-color:#86A6E0;background:var(--bluebg)}
.mt.mbad{border-color:#EBA19A;background:var(--badbg);animation:shake .3s}
.mt.mdone{opacity:.35;border-color:#8DCB85;background:var(--okbg);box-shadow:none}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.mhint{text-align:center;color:var(--sub);font-size:14px;font-weight:700;padding:6px}
.fb .fbt{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:900;margin-bottom:4px}
.fb .fbt svg{font-size:24px}
.lfoot.ok .fbt{color:var(--okd)}.lfoot.bad .fbt{color:var(--badd)}
.fbd{font-size:15px;margin-bottom:12px;line-height:1.7}
.fbd .jp{font-size:19px}.fbd small{color:var(--sub)}
.lfoot.ok .fbd{color:#2E5E33}.lfoot.bad .fbd{color:#7E2C27}
/* 소개 카드 */
.icards{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.icard{position:relative;flex:1 1 120px;max-width:180px;background:#fff;border:2px solid var(--line);border-radius:20px;padding:16px 10px 14px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center}
.icard .bigch{font-size:68px}
.ird{font-family:ui-monospace,Menlo,monospace;font-size:22px;font-weight:700;color:var(--blue)}
.inote{font-size:12.5px;color:var(--sub);margin-top:6px;text-align:center;line-height:1.45}
.ispk{position:absolute;top:10px;right:10px;color:var(--blue);font-size:18px}
.wcards{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.wcard{position:relative;background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 16px 14px;box-shadow:0 4px 0 var(--line);text-align:center}
.wcard .mini{position:absolute;top:12px;right:12px}
.wjp{font-size:34px;line-height:1.8;font-weight:500}
.wko{font-size:18px;font-weight:700;margin-top:4px}
.sbox{position:relative;background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px 16px;margin-top:14px;text-align:center;box-shadow:0 4px 0 var(--line)}
.sbox .mini{position:absolute;top:12px;right:12px}
.sjp{font-size:25px;line-height:2;padding:0 26px}
.sko{font-size:17px;font-weight:700;margin-top:6px}
.toks{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KJ=/([㐀-鿿豈-﫿々〆]+)\[([^\]]+)\]/g;

const toKata=s=>[...s].map(c=>{const n=c.charCodeAt(0);return n>=0x3041&&n<=0x3096?String.fromCharCode(n+0x60):c}).join('');
const toHira=s=>[...s].map(c=>{const n=c.charCodeAt(0);return n>=0x30A1&&n<=0x30F6?String.fromCharCode(n-0x60):c}).join('');

const RM={};
'あa いi うu えe おo かka きki くku けke こko さsa しshi すsu せse そso たta ちchi つtsu てte とto なna にni ぬnu ねne のno はha ひhi ふfu へhe ほho まma みmi むmu めme もmo やya ゆyu よyo らra りri るru れre ろro わwa をo んn がga ぎgi ぐgu げge ごgo ざza じji ずzu ぜze ぞzo だda ぢji づzu でde どdo ばba びbi ぶbu べbe ぼbo ぱpa ぴpi ぷpu ぺpe ぽpo ゔvu'.split(' ').forEach(p=>RM[p[0]]=p.slice(1));
const SMALLY={'ゃ':'a','ゅ':'u','ょ':'o'}, SMALLV={'ぁ':'a','ぃ':'i','ぅ':'u','ぇ':'e','ぉ':'o'};
const PUNC={'、':', ','。':'.','？':'?','！':'!','〜':'~','　':' '};
function toRomaji(kana){
  const s=[...toHira(kana)]; const syl=[];
  for(let i=0;i<s.length;i++){
    const c=s[i], n=s[i+1];
    if(c==='っ'){syl.push({gem:true});continue}
    if(c==='ー'){syl.push({long:true});continue}
    if(PUNC[c]!=null){syl.push({r:PUNC[c],p:true});continue}
    let r=RM[c];
    if(r==null){syl.push({r:c,p:true});continue}
    if(n&&SMALLY[n]){ r=(['shi','chi','ji'].includes(r)?r.slice(0,-1):r.slice(0,-1)+'y')+SMALLY[n]; i++; }
    else if(n&&SMALLV[n]){ r=r.slice(0,-1)+SMALLV[n]; i++; }
    syl.push({r,n:c==='ん'});
  }
  let out='';
  for(let i=0;i<syl.length;i++){
    const x=syl[i];
    if(x.gem){const nx=syl[i+1]; if(nx&&nx.r&&!nx.p){ out+= nx.r.startsWith('ch')?'t':nx.r[0]; } continue}
    if(x.long){const m=out.match(/[aiueo]$/); if(m) out+=m[0]; continue}
    if(x.n){const nx=syl[i+1]; out+='n'; if(nx&&nx.r&&/^[aiueoy]/.test(nx.r)) out+="'"; continue}
    out+=x.r;
  }
  return out.replace(/aa/g,'ā').replace(/uu/g,'ū').replace(/ee/g,'ē').replace(/oo/g,'ō').replace(/ou/g,'ō');
}
const PARTICLE={'は':'wa','へ':'e','を':'o'};
const RD_OVERRIDE={'こんにちは':'konnichiwa','こんばんは':'konbanwa','じゃありません':'ja arimasen','じゃありませんでした':'ja arimasen deshita'};
function romajiTokens(tokens){
  return tokens.map(t=>{const k=kanaOf(t); if(PARTICLE[k]) return PARTICLE[k]; if(RD_OVERRIDE[k]) return RD_OVERRIDE[k]; return toRomaji(k)}).join(' ').replace(/ ,/g,',').replace(/\s+/g,' ').trim();
}

const ITEMS={}; // id → item

function mkKana(k,rd,script){
  const ch=script==='k'?toKata(k):k;
  const note=(script==='k'?KANA_NOTE_KATA[ch]:KANA_NOTE_HIRA[ch])||KANA_NOTE_SOUND[toHira(ch)]||'';
  let alts=(KANA_ALTS[rd]||[]).slice();
  if(k==='ぢ') alts.push('di'); if(k==='づ') alts.push('du');
  return reg({id:(script==='k'?'k:':'h:')+ch, kind:script==='k'?'kata':'hira', jp:ch, f:ch, kana:ch, rd, alts, note, say:toKata(k)});
}
function mkWord(line,day){
  const [f,ko,note,rdo]=line.split('|');
  const jp=plain(f), kana=kanaOf(f);
  return reg({id:'w:'+jp+'|'+kana, kind:'word', f, jp, kana, ko, note:note||'', rd:rdo||RD_OVERRIDE[kana]||toRomaji(kana), say:kana.replace(/〜/g,''), kanji:hasKanji(jp), day});
}
function mkSeq(line,day,kind,i){
  const [fs,ko,note]=line.split('|');
  let toks=fs.trim().split(/\s+/); let punct='';
  const last=toks[toks.length-1]; const m=last.match(/[。？！]$/);
  if(m){punct=m[0]; toks[toks.length-1]=last.slice(0,-1);}
  const f=toks.join('')+punct;
  const koT=ko.trim().split(/\s+/);
  return reg({id:(kind==='phr'?'p:':'s:')+plain(f), kind, toks, f, jp:plain(f), kana:kanaOf(f), ko, koT, note:note||'', punct, rd:romajiTokens(toks)+(punct==='？'?'?':punct==='！'?'!':punct?'.':''), say:kanaOf(toks.join('')), day});
}

const HEART_MAX=5, HEART_MS=30*60*1000, LSKEY='kanamichi-v1';
function defaultState(){return {v:1, xp:0, lessons:{}, streak:0, lastDay:'', dailyXP:{}, dailyWords:{}, hearts:HEART_MAX, heartTs:Date.now(), stats:{}, wrongNote:{}, tests:{}, settings:{goal:25, hearts:true, sfx:true, autoplay:true, listen:true, unlockAll:false, furi:true, romaji:true}, updatedAt:0}}
function normalize(s){const d=defaultState(); s=Object.assign(d,s||{}); s.settings=Object.assign(defaultState().settings,s.settings||{}); return s}

function refreshHearts(){

  if(n>0){state.hearts=Math.min(HEART_MAX,state.hearts+n); state.heartTs+=n*HEART_MS; if(state.hearts>=HEART_MAX) state.heartTs=Date.now();}
}
function shownStreak(){const t=dayKey(); return (state.lastDay===t||state.lastDay===addDays(t,-1))?state.streak:0}
const isDone=id=>!!(state.lessons[id]&&state.lessons[id].done);
function unitDone(u){return u.lessons.every(l=>isDone(l.id))}
function lessonUnlocked(L){

  const u=L.unit, li=u.lessons.indexOf(L), units=TRACKS[L.track], ui=units.indexOf(u);
  if(li>0) return isDone(u.lessons[li-1].id);

function currentLesson(tk){for(const u of TRACKS[tk]) for(const l of u.lessons) if(!isDone(l.id)&&lessonUnlocked(l)) return l; return null}
function learnedItems(){const out=new Map(); for(const id in state.lessons){const L=LESSONS[id]; if(!L||!state.lessons[id].done) continue; L.items.forEach(it=>out.set(it.id,it)); (L.clozes||[]).forEach(it=>out.set(it.id,it));} return [...out.values()]}

let jaVoice=null, voicesLoaded=false, ctts=null, actx=null;
function loadVoices(){try{const vs=speechSynthesis.getVoices(); if(vs&&vs.length){voicesLoaded=true; jaVoice=vs.find(v=>/^ja(-|_|$)/i.test(v.lang))||null;}}catch(e){}}
if('speechSynthesis' in window){loadVoices(); try{speechSynthesis.addEventListener('voiceschanged',loadVoices)}catch(e){}}
const synthOK=()=>('speechSynthesis' in window)&&(!voicesLoaded||!!jaVoice);
const audioOK=()=>state.settings.listen&&(!!AUDIO||synthOK()||!!ctts)&&!(LS&&LS.noListen);
// ---- 미리 녹음한 발음 파일 (VOICEVOX, audio/ 폴더) ----
// 파일 이름은 읽을 글자의 해시. 목록은 audio/index.json (GitHub Actions가 만든다).
function sayHash(t){
  const b=new TextEncoder().encode(t); let h1=0x811c9dc5, h2=0x84222325;
  for(const x of b){ h1^=x; h1=Math.imul(h1,0x01000193)>>>0; h2^=x; h2=Math.imul(h2,0x01000193)>>>0; h2=(h2^(h2>>>13))>>>0; }
  return h1.toString(16).padStart(8,'0')+h2.toString(16).padStart(8,'0');
}
let AUDIO=null; const audioEl=(typeof Audio!=='undefined')?new Audio():null;
if(audioEl){ audioEl.preload='auto';
  fetch('audio/index.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(j=>{ if(j&&j.files) AUDIO={files:new Set(Object.keys(j.files)),voice:j.voice||''}; }).catch(()=>{}); }
function clipUrl(t){ if(!AUDIO||!t) return null; const h=sayHash(t); return AUDIO.files.has(h)?'audio/'+h+'.mp3':null; }
// 즉시 재생: 녹음 파일을 Web Audio 버퍼로 미리 풀어 두고, 앞쪽 무음은 건너뛰고 바로 튼다
let curSrcs=[];
function ctx(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); return actx; }catch(e){ return null; } }
try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
const bufCache=new Map();
function loadBuf(url){
  if(bufCache.has(url)) return bufCache.get(url);
  const c=ctx(); if(!c) return Promise.reject(new Error('no audio'));
  const pr=fetch(url).then(r=>{ if(!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
    .then(ab=>new Promise((res,rej)=>c.decodeAudioData(ab,res,rej)))
    .then(buf=>{ // 소리가 시작되는 지점 찾기 (인코더 지연·앞 무음 제거)
      const d=buf.getChannelData(0); let k=0; const th=0.012; while(k<d.length&&Math.abs(d[k])<th) k++;
      buf._off=Math.max(0,k/buf.sampleRate-0.015); return buf; });
  pr.catch(()=>bufCache.delete(url)); bufCache.set(url,pr); return pr;
}
function stopClips(){ curSrcs.forEach(x=>{try{x.stop()}catch(e){}}); curSrcs=[]; try{audioEl&&audioEl.pause()}catch(e){} try{speechSynthesis.cancel()}catch(e){} }
function playClips(urls,rate){
  stopClips();
  const c=ctx();
  if(c&&(rate||1)===1){
    const token={}; playClips.token=token;
    Promise.all(urls.map(loadBuf)).then(bufs=>{
      if(playClips.token!==token) return;
      let t=c.currentTime+0.005;
      bufs.forEach(b=>{ const src=c.createBufferSource(); src.buffer=b; src.connect(c.destination); src.start(t,b._off||0); curSrcs.push(src); t+=b.duration-(b._off||0)+0.15; });
    }).catch(()=>{ if(playClips.token===token) playEl(urls,rate); });
    return;
  }
  playEl(urls,rate);
}
function playEl(urls,rate){ // 천천히 듣기(음높이 유지) 또는 Web Audio를 못 쓸 때
  if(!audioEl) return; let i=0;
  const next=()=>{
    if(i>=urls.length){ audioEl.onended=null; return; }
    audioEl.src=urls[i++]; audioEl.defaultPlaybackRate=audioEl.playbackRate=rate||1;
    try{audioEl.preservesPitch=true; audioEl.webkitPreservesPitch=true}catch(e){}
    audioEl.onended=()=>setTimeout(next,150);
    const pr=audioEl.play(); if(pr&&pr.catch) pr.catch(()=>{});
  };
  next();
}
function prefetchClips(texts,max){ if(!AUDIO) return; const seen=new Set(); for(const t of texts){ const u=clipUrl(t); if(u&&!seen.has(u)){ seen.add(u); loadBuf(u).catch(()=>{}); if(seen.size>=(max||60)) break; } } }
function synthSpeak(text,rate){
  if(synthOK()){try{speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='ja-JP'; if(jaVoice) u.voice=jaVoice; u.rate=rate||0.85; speechSynthesis.speak(u); return true}catch(e){}}
  if(ctts){try{ctts.speak(text,{language:'ja',rate:Math.max(0.7,rate||0.9)}).catch(()=>{}); return true}catch(e){}}
  return false;
}
function speak(text,slow){
  if(!text) return;
  if(audioEl){ const u=clipUrl(text); if(u){ playClips([u],slow?0.7:1); return; } }
  synthSpeak(text,slow?0.55:0.85);
}
function speakSeq(list){
  list=list.filter(Boolean); if(!list.length) return;
  if(audioEl&&AUDIO){ const urls=list.map(clipUrl); if(urls.every(Boolean)) return playClips(urls,1); }
  if(list.length===1) return speak(list[0]);
  if(synthOK()){try{speechSynthesis.cancel(); list.forEach(t=>{const u=new SpeechSynthesisUtterance(t); u.lang='ja-JP'; if(jaVoice) u.voice=jaVoice; u.rate=0.85; speechSynthesis.speak(u)}); return}catch(e){}}
  if(ctts){try{ctts.speak(list.join('、'),{language:'ja',rate:0.9}).catch(()=>{})}catch(e){}}
}
function sfx(kind){
  if(!state.settings.sfx) return;
  if(kind===true) kind='ok'; else if(kind===false) kind='bad';
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    const t0=actx.currentTime+0.01;

    const out=actx.createGain(); out.gain.value=0.9;
    const dl=actx.createDelay(); dl.delayTime.value=0.11; const fb=actx.createGain(); fb.gain.value=0.22; const wet=actx.createGain(); wet.gain.value=0.18;
    out.connect(actx.destination); out.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(actx.destination);
    // 종소리 같은 음 하나: 기본음 + 배음, 빠른 어택·부드러운 감쇠
    const bell=(f,at,dur,vol)=>{

        const o=actx.createOscillator(), v=actx.createGain();

        v.gain.setValueAtTime(0.0001,t0+at); v.gain.exponentialRampToValueAtTime(vol*g,t0+at+0.006);
        v.gain.exponentialRampToValueAtTime(0.0001,t0+at+dur*(m>1?0.55:1));
        o.connect(v); v.connect(out); o.start(t0+at); o.stop(t0+at+dur+0.05);
      });
    };

      const o=actx.createOscillator(), v=actx.createGain(), lp=actx.createBiquadFilter();
      o.type='triangle'; o.frequency.setValueAtTime(f1,t0+at); o.frequency.exponentialRampToValueAtTime(f2,t0+at+dur*0.8);
      lp.type='lowpass'; lp.frequency.value=900;
      v.gain.setValueAtTime(0.0001,t0+at); v.gain.exponentialRampToValueAtTime(vol,t0+at+0.02); v.gain.exponentialRampToValueAtTime(0.0001,t0+at+dur);
      o.connect(lp); lp.connect(v); v.connect(out); o.start(t0+at); o.stop(t0+at+dur+0.05);
    };
    if(kind==='ok'){ bell(1046.5,0,0.5,0.22); bell(1568,0.085,0.75,0.2); }          // 도(C6) → 솔(G6)
    else if(kind==='pair'){ bell(1318.5,0,0.35,0.14); }                              // 짝 하나 맞춤: 미(E6)
    else if(kind==='done'){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>bell(f,i*0.1,i===3?1.1:0.5,0.18)); bell(1318.5,0.42,1.2,0.12); } // 도미솔도 + 미
    else { soft(311,233,0,0.32,0.22); soft(247,185,0.13,0.36,0.18); }               // 오답: 낮게 내려가는 두 음
  }catch(e){}
}

function candsFor(it,maxIdx){
  const info=ITEM_UNIT[it.id]||{}; const track=info.track||'day';
  const pri=[],sec=[];
  for(const u of TRACKS[track]) for(const l of u.lessons){
    if(maxIdx!=null&&l.idx>maxIdx) continue;
    for(const x of [...l.items,...(l.clozes||[])]){ if(x.kind!==it.kind||x.id===it.id) continue; (u.id===info.u?pri:sec).push(x); }
  }
  const seen=new Set(); return [...shuffle(pri),...shuffle(sec)].filter(x=>!seen.has(x.id)&&seen.add(x.id));
}
function optItems(it,field,excl,cands,n=4){
  const out=[it], vals=new Set([it[field]]), ex=new Set([it[excl]]);
  for(const c of cands){ if(out.length>=n) break; const v=c[field]; if(v==null||vals.has(v)||ex.has(c[excl])) continue; vals.add(v); out.push(c); }
  return shuffle(out);
}
const OPT={
  rd:x=>({k:x.id,h:esc(x.rd),cls:'rd'}),
  jp:x=>({k:x.id,f:x.f,cls:'jp'}),
  jpPlain:x=>({k:x.id,h:esc(x.jp),cls:'jp'}),
  kana:x=>({k:x.id,h:esc(x.kana),cls:'jp'}),
  ko:x=>({k:x.id,h:esc(x.ko),cls:'ko'}),
};
const MK={
  c2r:(it,c)=>({t:'mc',it,q:'이 글자는 어떻게 읽을까요?',pr:{big:it.jp},opts:optItems(it,'rd','rd',c).map(OPT.rd),ans:it.id}),
  r2c:(it,c)=>({t:'mc',it,q:`“${it.rd}”에 해당하는 글자는?`,pr:{text:it.rd,mono:true},opts:optItems(it,'jp','rd',c).map(OPT.jp),ans:it.id,big:true}),
  klisten:(it,c)=>({t:'mc',it,q:'들리는 소리의 글자를 고르세요',pr:{listen:it.say},opts:optItems(it,'jp','rd',c).map(OPT.jp),ans:it.id,big:true,listen:true}),
  type:(it)=>({t:'type',it,q:'로마자로 입력하세요',pr:{big:it.jp},accept:[it.rd,...(it.alts||[])]}),
  j2k:(it,c)=>({t:'mc',it,q:it.kind==='word'?'이 단어의 뜻은?':'이 표현의 뜻은?',pr:{jp:it},opts:optItems(it,'ko','jp',c).map(OPT.ko),ans:it.id}),
  k2j:(it,c)=>({t:'mc',it,q:'알맞은 일본어를 고르세요',pr:{text:it.ko},opts:optItems(it,'jp','ko',c).map(OPT.jp),ans:it.id}),
  reading:(it,c)=>({t:'mc',it,q:'이 한자 단어의 읽는 법은?',pr:{big:it.jp,plain:true},opts:optItems(it,'kana','jp',c.filter(x=>x.kanji)).map(OPT.kana),ans:it.id}),
  listen:(it,c)=>({t:'mc',it,q:'들은 말을 고르세요',pr:{listen:it.say},opts:optItems(it,'jp','kana',c).map(OPT.jp),ans:it.id,listen:true}),
  buildJ:(it,c)=>({t:'build',it,q:'일본어로 만들어 보세요',pr:{text:it.ko},ans:it.toks,tiles:tilesFor(it.toks,c,'toks'),jpTiles:true}),
  buildK:(it,c)=>({t:'build',it,q:'한국어로 옮겨 보세요',pr:{jp:it},ans:it.koT,tiles:tilesFor(it.koT,c,'koT'),jpTiles:false}),
  listenB:(it,c)=>({t:'build',it,q:'들은 문장을 만들어 보세요',pr:{listen:it.say},ans:it.toks,tiles:tilesFor(it.toks,c,'toks'),jpTiles:true,listen:true}),
  cloze:(it,c)=>({t:'mc',it,q:it.q.includes('＿')?'빈칸에 알맞은 것은?':'알맞은 것을 고르세요',pr:{cloze:it},opts:shuffle(it.o).map(o=>({k:o,h:esc(o),cls:'jp'})),ans:it.a}),
};
function tilesFor(ans,cands,field){
  const set=new Set(ans), extra=[];
  for(const c of cands){ for(const t of shuffle(c[field]||[])){ if(extra.length>=3) break; if(!set.has(t)&&!extra.includes(t)) extra.push(t); } if(extra.length>=3) break; }
  return shuffle([...ans,...extra]);
}
function typesFor(it){
  const L=audioOK();
  switch(it.kind){
    case 'hira':case 'kata': return ['c2r','r2c','type',...(L?['klisten']:[])];
    case 'word': return ['j2k','k2j',...(it.kanji?['reading']:[]),...(L?['listen']:[])];
    case 'phr': return ['j2k','k2j',...(it.toks.length>=3?['buildJ']:[]),...(L?['listen']:[])];
    case 'sent': return ['buildJ',...(it.koT.length>=2?['buildK']:[]),...(L?['listenB']:[])];
    case 'cloze': return ['cloze'];
  }
  return [];
}
function matchEx(items,c){
  const kana=items[0].kind==='hira'||items[0].kind==='kata';
  const pool=[...items,...c.filter(x=>x.kind===items[0].kind)];
  const L=new Set(),R=new Set(),picked=[];
  for(const x of pool){ if(picked.length>=5) break; const r=kana?x.rd:x.ko; if(L.has(x.jp)||R.has(r)) continue; L.add(x.jp);R.add(r);picked.push(x); }
  if(picked.length<3) return null;
  return {t:'match',it:picked[0],q:'짝을 맞춰 보세요',left:shuffle(picked).map(x=>({k:x.id,f:x.f,say:x.say})),right:shuffle(picked).map(x=>({k:x.id,h:esc(kana?x.rd:x.ko)})),items:picked};
}
const chunks=(a,n)=>{const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o};
function genLesson(L){
  const C=it=>candsFor(it,L.idx); const ex=[]; const its=L.items; const A=audioOK();
  const push=e=>{if(e) ex.push(e)};
  if(L.kind==='kana'){
    chunks(its,L.chunk).forEach(g=>{ ex.push({t:'intro',items:g}); g.slice(0,2).forEach(it=>push(MK.c2r(it,C(it)))) });
    push(matchEx(shuffle(its),C(its[0])));
    shuffle(its).slice(0,2).forEach(it=>push(MK.r2c(it,C(it))));
    if(A) shuffle(its).slice(0,2).forEach(it=>push(MK.klisten(it,C(it))));
    shuffle(its).slice(0,2).forEach(it=>push(MK.type(it)));
  } else if(L.kind==='word'){
    // 새 단어를 한 화면에 먼저 모두 보여 준 뒤 문제를 낸다
    ex.push({t:'intro',items:its});
    shuffle(its).forEach(it=>push(MK.j2k(it,C(it))));
    const rest=[];
    rest.push(matchEx(shuffle(its),C(its[0])));
    shuffle(its).slice(0,2).forEach(it=>rest.push(MK.k2j(it,C(it))));
    shuffle(its.filter(x=>x.kanji)).slice(0,2).forEach(it=>rest.push(MK.reading(it,C(it))));
    if(A) shuffle(its).slice(0,2).forEach(it=>rest.push(MK.listen(it,C(it))));
    shuffle(rest.filter(Boolean)).forEach(push);
  } else if(L.kind==='gram'){
    // 문법 설명 → 예문은 미리 보여 주지 않고 바로 해석(일본어 → 한국어)과 빈칸 문제를 번갈아 낸다
    ex.push({t:'intro',gram:L.gram});
    const ss=shuffle(its), cz=L.clozes.slice(), n=Math.max(ss.length,cz.length);
    for(let k=0;k<n;k++){ if(ss[k]) push(MK.buildK(ss[k],C(ss[k]))); if(cz[k]) push(MK.cloze(cz[k],[])); }
  } else if(L.kind==='phr'){
    // 표현을 한 화면에 모두 보여 준 뒤, 표현마다 한 문제씩 + 짝 맞추기 (같은 문제 반복을 줄임)
    ex.push({t:'intro',items:its});
    const ts=['j2k','k2j','buildJ',...(A?['listen']:[])];
    shuffle(its).forEach((it,k)=>{ let ty=ts[k%ts.length]; if(ty==='buildJ'&&it.toks.length<3) ty='j2k'; push(MK[ty](it,C(it))); });
    push(matchEx(shuffle(its),C(its[0])));
    const b=shuffle(its.filter(x=>x.koT.length>=2))[0]; if(b) push(MK.buildK(b,C(b)));
  } else {
    return genMixed(its,L.idx,12);
  }
  return ex;
}
function genMixed(items,maxIdx,n){
  const ex=[]; const pick=shuffle(items).slice(0,n);
  pick.forEach(it=>{const ts=typesFor(it); if(!ts.length) return; const t=ts[Math.floor(Math.random()*ts.length)]; ex.push(MK[t](it,candsFor(it,maxIdx)))});
  const mi=items.filter(x=>['word','hira','kata','phr'].includes(x.kind));
  if(mi.length>=3){ const grp=mi.filter(x=>x.kind===mi[0].kind); const m=matchEx(shuffle(grp),candsFor(grp[0],maxIdx)); if(m) ex.splice(Math.min(4,ex.length),0,m); }
  return ex;
}
function genPractice(){
  const items=learnedItems().filter(x=>x.kind!=='gram');
  const score=x=>{const s=state.stats[x.id]||[0,0]; return s[1]*2-s[0]*0.5+Math.random()};
  const chosen=items.sort((a,b)=>score(b)-score(a)).slice(0,10);
  return genMixed(chosen,null,10);
}

  <button class="btn wide" data-a="home">계속</button></div>`;

// ================= 오답노트 =================
// 문제 자체가 아니라, 그 문제가 다룬 단어·표현·가나 또는 문법 항목을 모아 둔다.
// 저장: state.wrongNote[키] = 넣은 시각(양수) / 뺀 시각(음수, 기기 간 동기화용)
function noteKey(it){ if(!it||!it.id) return null; if(it.kind==='sent'||it.kind==='cloze') return it.day?'g:'+it.day:null; if(['word','phr','hira','kata'].includes(it.kind)) return it.id; return null; }
function noteTarget(k){ if(!k) return null; if(k.startsWith('g:')){ const u=TRACKS.day[+k.slice(2)-1]; return u?{type:'gram',g:u.gram,u}:null; } const it=ITEMS[k]; return it?{type:'item',it}:null; }
function inNote(it){ const k=noteKey(it); return !!(k&&state.wrongNote[k]>0); }
function noteAdd(it){ const k=noteKey(it); if(!k) return; state.wrongNote[k]=Date.now(); }
function noteList(){ return Object.entries(state.wrongNote).filter(([k,v])=>v>0&&noteTarget(k)).sort((a,b)=>b[1]-a[1]).map(([k])=>k); }
function renderNote(){
  const ks=noteList();
  if(!ks.length) return `<section class="card empty"><p>오답노트가 비어 있어요.<br>테스트나 레슨에서 틀린 문제의 <b>+ 오답노트에 넣기</b>를 누르면,<br>그 문제에 나온 단어·표현·문법이 여기에 모여요.</p></section>`;
  const grams=ks.filter(k=>k.startsWith('g:')), items=ks.filter(k=>!k.startsWith('g:'));
  const del=k=>`<button class="ndel" data-a="wndel" data-v="${esc(k)}" aria-label="오답노트에서 빼기">${I.x}</button>`;
  return `${grams.length?`<section class="card"><h3>문법 ${grams.length}</h3>${grams.map(k=>{const {g,u}=noteTarget(k); return `<details class="ngram"><summary><span class="lvb">${esc(u.label)}</span> ${esc(g.t)}${del(k)}</summary><div class="pat jp">${esc(g.p)}</div><ul class="gl">${g.ex.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></details>`}).join('')}</section>`:''}
  ${items.length?`<section class="card"><h3>단어·표현 ${items.length}</h3><ul class="wl">${items.map(k=>{const it=ITEMS[k]; return `<li><button class="mini" data-a="say" data-v="${esc(it.say)}">${I.spk}</button><span class="jp ${it.kind==='phr'?'long':''}">${ruby(it.f)}</span><span class="m">${esc(it.ko||it.rd)}${state.settings.romaji&&it.ko?`<small>${esc(it.rd)}</small>`:''}</span>${del(k)}</li>`}).join('')}</ul></section>`:''}`;
}

const OFFS=[0,42,64,42,0,-42,-64,-42];
function pathHTML(units,tk){
  const cur=currentLesson(tk);
  let prevLv=null;
  return units.map(u=>{
    const done=u.lessons.filter(l=>isDone(l.id)).length;
    let sep=''; if(u.lv&&u.lv!==prevLv){ const L=LEVELS.find(x=>x.lv===u.lv); sep=`<div class="lvsep"><b>${u.lv}</b><span>Day ${L.from}~${L.to} · ${LV_DESC[u.lv]}</span></div>`; prevLv=u.lv; }
    return sep+`<section class="unit" style="--c:${u.col[0]};--cd:${u.col[1]}">
    <div class="ubanner"><div><div class="ulab">${esc(u.label)}${u.lv?` · ${u.lv}`:''} · ${done}/${u.lessons.length}</div><h2>${esc(u.title)}</h2><p>${esc(u.desc)}</p></div>
    <button class="ubtn" data-a="guide" data-v="${u.id}" aria-label="가이드">${I.book}<span>${tk==='day'?'목록':'가이드'}</span></button></div>
    <div class="path">${u.lessons.map((l,i)=>{
      const dn=isDone(l.id), un=lessonUnlocked(l), isCur=cur&&cur.id===l.id;

      <button class="node ${dn?'done':''} ${un?'':'locked'} ${isCur?'cur':''}" data-a="open" data-v="${l.id}" aria-label="${esc(l.title)}">${icon}</button><div class="nlab">${esc(l.title)}</div></div>`}).join('')}</div></section>`;
  }).join('')+(tk==='day'?upcomingCard():'');
}
const LV_DESC={N5:'기초 단어와 기본 문형',N4:'일상 회화와 동사 활용',N3:'신문·드라마 일부를 이해하는 중급'};

function renderKana(){

function chartHTML(){
  const learned=new Set(learnedItems().map(x=>x.id));
  const cell=(k,rd,sc)=>{ if(!k) return '<div class="cc empty"></div>'; const ch=sc==='k'?toKata(k):k; return `<button class="cc ${learned.has((sc==='k'?'k:':'h:')+ch)?'lr':''}" data-a="say" data-v="${esc(toKata(k))}"><span class="jp">${ch}</span><small>${rd}</small></button>`};
  const grid=(rows,sc,cols)=>`<div class="cgrid" style="grid-template-columns:repeat(${cols},1fr)">${rows.map(r=>r.map(c=>c?cell(c[0],c[1],sc):cell()).join('')).join('')}</div>`;
  const R=KROWS, gap=(row,pos)=>{const o=[null,null,null,null,null]; row.forEach((c,i)=>o[pos[i]]=c); return o};
  const main=[R.a,R.ka,R.sa,R.ta,R.na,R.ha,R.ma,gap(R.ya,[0,2,4]),R.ra,gap(R.wa.slice(0,2),[0,4]),gap([R.wa[2]],[0])];

  return `<div class="seg small"><button class="${sc==='h'?'on':''}" data-a="cscript" data-v="h">히라가나</button><button class="${sc==='k'?'on':''}" data-a="cscript" data-v="k">가타카나</button></div>

  <h3 class="ch">청음</h3>${grid(main,sc,5)}<h3 class="ch">탁음·반탁음</h3>${grid(dak,sc,5)}<h3 class="ch">요음</h3>${grid(yo,sc,3)}`;
}

  const L=LESSONS[id]; if(!L) return; const un=lessonUnlocked(L), dn=isDone(id);
  const noHeart=false;
  const desc={word:`새 단어 ${L.items.length}개`,gram:`${L.gram&&L.gram.t}`,phr:`생활 표현 ${L.items.length}개`,review:'이 유닛 전체를 섞어서 복습',kana:`${L.items.map(x=>x.jp).join(' ')}`}[L.kind];
  modal(`<div class="lsheet" style="--c:${L.unit.col[0]};--cd:${L.unit.col[1]}"><div class="ulab">${esc(L.unit.label)} · ${esc(L.unit.title)}</div><h2>${esc(L.title)}</h2><p class="${L.kind==='kana'?'jp big':''}">${esc(desc)}</p>
  ${!un?`<p class="hint">이전 레슨을 먼저 끝내면 열려요.</p><button class="btn ghost wide" data-a="mclose">닫기</button>`:
   noHeart?`<p class="hint">하트가 없어요. 복습 탭의 약점 연습으로 하트를 얻거나, 30분마다 1개씩 회복돼요.</p><button class="btn wide" data-a="practice">약점 연습으로 하트 얻기</button>`:
   `<button class="btn wide col" data-a="start" data-v="${id}">${dn?'다시 하기 +5 XP':'시작하기 +10 XP'}</button>`}</div>`);
}
function guideSheet(uid){
  const u=[...TRACKS.day,...TRACKS.kana].find(x=>x.id===uid); if(!u) return;
  if(u.words){
    modal(`<div class="gsheet"><div class="ulab">${esc(u.label)}</div><h2>${esc(u.title)}</h2><h3>단어 ${u.words.length}개</h3><ul class="wl">${u.words.map(wordRow).join('')}</ul>
    <h3>문법 · ${esc(u.gram.t)}</h3><div class="pat jp">${esc(u.gram.p)}</div><h3>표현</h3><ul class="wl">${u.phr.map(x=>`<li><button class="mini" data-a="say" data-v="${esc(x.say)}">${I.spk}</button><span class="jp">${ruby(x.f)}</span><span class="m">${esc(x.ko)}</span></li>`).join('')}</ul><button class="btn ghost wide" data-a="mclose">닫기</button></div>`);
  } else {
    modal(`<div class="gsheet"><div class="ulab">${esc(u.label)}</div><h2>${esc(u.title)}</h2><ul class="gl">${u.guide.map(g=>`<li>${esc(g)}</li>`).join('')}</ul><button class="btn ghost wide" data-a="mclose">닫기</button></div>`);
  }
}
function infoSheet(v){
  refreshHearts();
  if(v==='hearts'){
    const S=state.settings; let next='';
    if(S.hearts&&state.hearts<HEART_MAX){const ms=HEART_MS-((Date.now()-state.heartTs)%HEART_MS); next=`다음 하트까지 약 ${Math.ceil(ms/60000)}분`;}
    modal(`<div class="isheet"><h2>하트</h2><div class="hearts">${[...Array(HEART_MAX)].map((_,i)=>`<span class="${S.hearts&&i>=state.hearts?'off':''}">${I.heart}</span>`).join('')}</div>
    <p>${S.hearts?`레슨에서 틀리면 하트가 1개 줄어요. 0개가 되면 레슨이 중단돼요. ${next}`:'하트 제한이 꺼져 있어요. 프로필 탭에서 켤 수 있어요.'}</p>
    <p class="hint">복습 탭의 약점 연습을 끝내면 하트를 1개 얻어요.</p><button class="btn ghost wide" data-a="mclose">닫기</button></div>`);
  } else {
    const t=dayKey(); const days=[...Array(7)].map((_,i)=>addDays(t,i-6)); const wd=['일','월','화','수','목','금','토'];
    modal(`<div class="isheet"><h2>연속 학습 ${shownStreak()}일</h2><div class="sweek">${days.map(d=>{const [y,m,dd]=d.split('-').map(Number); return `<div class="${state.dailyXP[d]?'on':''}"><span>${state.dailyXP[d]?I.flame:''}</span><small>${wd[new Date(y,m-1,dd).getDay()]}</small></div>`}).join('')}</div>
    <p>하루에 레슨을 1개 이상 끝내면 연속 기록이 이어져요. ${state.lastDay===t?'오늘 기록은 이미 채웠어요.':'오늘 레슨을 하나 끝내면 기록이 이어져요.'}</p><button class="btn ghost wide" data-a="mclose">닫기</button></div>`);
  }
}

// ================= 레슨 진행 =================
function startLesson(id){
  const L=LESSONS[id]; refreshHearts();
  mclose(); LS={mode:'lesson',L,queue:[],done:0,mistakes:0,correct:0,start:Date.now()};
  LS.queue=genLesson(L).filter(Boolean); prefetchClips(LS.queue.flatMap(exSays)); nextEx(true);
}
function startPractice(){
  mclose(); const q=genPractice(); if(q.length<3) return;
  LS={mode:'practice',L:null,queue:q,done:0,mistakes:0,correct:0,start:Date.now()}; prefetchClips(q.flatMap(exSays)); nextEx(true);
}
const TILE_PART={'は':'わ','へ':'え','を':'お'}; // 조사 타일은 실제 발음으로 읽는다
function tileSay(t){ const k=kanaOf(t); return TILE_PART[k]||k; }
function exSays(c){ const o=[]; if(c.items) c.items.forEach(x=>o.push(x.say)); if(c.it&&c.it.say) o.push(c.it.say); if(c.pr&&c.pr.listen) o.push(c.pr.listen); return o; }
function nextEx(first){
  if(LS&&LS.mode==='test') LS.idx=(LS.idx||0)+1;
  if(!first&&LS.cur&&LS.cur.t!=='intro'&&!LS.ok){} // 오답은 이미 큐 뒤에 재삽입됨
  LS.cur=LS.queue.shift(); LS.sel=null; LS.input=''; LS.built=[]; LS.checked=false; LS.ok=false; LS.m={l:null,r:null,done:new Set(),bad:null};
  if(!LS.cur) return finish();
  if(LS.cur.listen&&!audioOK()){ return nextEx(); }
  ui.screen='lesson'; render(); window.scrollTo(0,0);
  const c=LS.cur;
  // 화면이 바뀌자마자 일본어를 읽어 준다: 듣기 문제는 항상, 새 단어·일본어 제시 문제는 '발음 자동 재생'이 켜져 있을 때
  if(c.pr&&c.pr.listen) speak(c.pr.listen);
  else if(state.settings.autoplay){
    if(c.t==='intro'&&c.items) speakSeq(c.items.map(x=>x.say));
    else if(c.pr&&c.pr.jp) speak(c.pr.jp.say);
  }
  if(c.t==='type') setTimeout(()=>{const i=document.getElementById('tin'); if(i) i.focus()},60);
}
function progress(){const total=LS.done+LS.queue.length+1; return Math.round(LS.done/total*100)}
function testCount(){ return LS.mode==='test'?`<span class="lh prac">${Math.min(LS.total,LS.idx)}/${LS.total}</span>`:''; }
function renderLesson(){
  const c=LS.cur; const S=state.settings;
  const hearts=LS.mode==='practice'?'<span class="lh prac">연습</span>':testCount();
  app.innerHTML=`<div class="lesson"><div class="lhead"><button class="iconbtn" data-a="quit" aria-label="그만하기">${I.x}</button><div class="prog"><div style="width:${progress()}%"></div></div><button class="furi ${S.furi?'on':''}" data-a="furi" aria-label="후리가나 표시">${S.furi?'<ruby>漢<rt>かん</rt></ruby>':'漢'}</button>${hearts}</div>
  <div class="lbody">${exBody(c)}</div><div class="lfoot ${LS.checked?(LS.ok?'ok':'bad'):''}"><div class="fin">${footer(c)}</div></div></div>`;
}
function prompt(pr){
  if(!pr) return '';
  if(pr.listen!=null) return `<div class="pr"><button class="bigspk" data-a="say" data-v="${esc(pr.listen)}" aria-label="다시 듣기">${I.spk}</button><button class="slow" data-a="sayslow" data-v="${esc(pr.listen)}">천천히</button></div>`;
  if(pr.big!=null) return `<div class="pr"><div class="bigch jp">${esc(pr.big)}</div></div>`;
  if(pr.text!=null) return `<div class="pr"><div class="ptext ${pr.mono?'mono':''}">${esc(pr.text)}</div></div>`;
  if(pr.jp) return `<div class="pr"><div class="pjp"><button class="mini" data-a="say" data-v="${esc(pr.jp.say)}">${I.spk}</button><span class="jp">${ruby(pr.jp.f)}</span></div>${state.settings.romaji?`<div class="prd">${esc(pr.jp.rd)}</div>`:''}</div>`;
  if(pr.cloze){const z=pr.cloze; const blank=LS.checked?`<span class="blank fill">${esc(z.a)}</span>`:(LS.sel?`<span class="blank fill">${esc(LS.sel)}</span>`:'<span class="blank"></span>');
    return `<div class="pr"><div class="cloze jp">${ruby(z.q).replace('＿',blank)}</div>${z.ko?`<div class="cko">${esc(z.ko)}</div>`:''}</div>`;}
  return '';
}
function exBody(c){
  if(c.t==='intro') return introBody(c);
  let h=`<h2 class="q">${esc(c.q)}</h2>`+prompt(c.pr);
  if(c.t==='mc'){
    h+=`<div class="opts ${c.opts.every(o=>o.cls!=='ko')&&c.opts.every(o=>(o.f!=null?plain(o.f):o.h.replace(/<[^>]+>/g,'')).length<=6)?'two':''}">${c.opts.map((o,i)=>{
      let st=''; if(LS.checked){ if(o.k===c.ans) st='right'; else if(o.k===LS.sel) st='wrong'; } else if(LS.sel===o.k) st='sel';
      return `<button class="opt ${o.cls} ${c.big?'bigopt':''} ${st}" data-a="opt" data-v="${esc(o.k)}" ${LS.checked?'disabled':''}><span class="num">${i+1}</span><span class="oh">${o.f!=null?ruby(o.f):o.h}</span></button>`}).join('')}</div>`;
  } else if(c.t==='type'){
    h+=`<input id="tin" class="tin" type="text" inputmode="latin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="예: ka" value="${esc(LS.input)}" ${LS.checked?'disabled':''}>`;
  } else if(c.t==='build'){
    const used=new Set(LS.built);
    h+=`<div class="ans ${c.jpTiles?'jp':''}">${LS.built.map(i=>`<button class="tile" data-a="untile" data-v="${i}" ${LS.checked?'disabled':''}>${c.jpTiles?ruby(c.tiles[i]):esc(c.tiles[i])}</button>`).join('')}</div>
    <div class="bank ${c.jpTiles?'jp':''}">${c.tiles.map((t,i)=>`<button class="tile ${used.has(i)?'ghost':''}" data-a="tile" data-v="${i}" ${used.has(i)||LS.checked?'disabled':''}>${c.jpTiles?ruby(t):esc(t)}</button>`).join('')}</div>`;
  } else if(c.t==='match'){
    const M=LS.m;
    const btn=(side,o)=>{const d=M.done.has(o.k); const s=M[side]===o.k; const bad=M.bad&&M.bad[side]===o.k; return `<button class="mt ${side==='l'?'jp':''} ${d?'mdone':''} ${s?'sel':''} ${bad?'mbad':''}" data-a="m" data-s="${side}" data-v="${esc(o.k)}" ${d?'disabled':''}>${o.f!=null?ruby(o.f):o.h}</button>`};
    h+=`<div class="match">${c.left.map((o,i)=>btn('l',o)+btn('r',c.right[i])).join('')}</div>`;
  }
  return h;
}
function introBody(c){
  const S=state.settings;
  if(c.gram){const g=c.gram; return `<div class="tag">문법</div><h2 class="q">${esc(g.t)}</h2><div class="pat jp">${esc(g.p)}</div><ul class="gl">${g.ex.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`;}
  const its=c.items; const k=its[0].kind;
  if(k==='hira'||k==='kata') return `<div class="tag">새 글자</div><div class="icards">${its.map(it=>`<button class="icard" data-a="say" data-v="${esc(it.say)}"><span class="bigch jp">${esc(it.jp)}</span><span class="ird">${esc(it.rd)}</span>${it.note?`<span class="inote">${esc(it.note)}</span>`:''}<span class="ispk">${I.spk}</span></button>`).join('')}</div><p class="hint c">카드를 누르면 발음을 들을 수 있어요.</p>`;
  if(k==='sent') {const it=its[0]; return `<div class="tag">예문</div><div class="sbox"><button class="mini" data-a="say" data-v="${esc(it.say)}">${I.spk}</button><div class="jp sjp">${ruby(it.f)}</div>${S.romaji?`<div class="prd">${esc(it.rd)}</div>`:''}<div class="sko">${esc(it.ko)}</div><div class="toks jp">${it.toks.map(t=>`<span>${ruby(t)}</span>`).join('')}</div></div>`;}
  return `<div class="tag">${k==='word'?'새 단어':'새 표현'}${its.length>2?` ${its.length}개`:''}</div>${its.length>2?'<p class="hint">하나씩 눌러 발음을 들어 보고, 다 외웠으면 계속을 누르세요.</p>':''}<div class="wcards ${its.length>2?'many':''}">${its.map(it=>`<div class="wcard"><button class="mini" data-a="say" data-v="${esc(it.say)}">${I.spk}</button><div class="wjp jp">${ruby(it.f)}</div>${S.romaji?`<div class="prd">${esc(it.rd)}</div>`:''}<div class="wko">${esc(it.ko)}</div>${it.note?`<div class="inote">${esc(it.note)}</div>`:''}</div>`).join('')}</div>`;
}
function canCheck(c){ if(c.t==='mc') return LS.sel!=null; if(c.t==='type') return LS.input.trim().length>0; if(c.t==='build') return LS.built.length>0; return false }
function footer(c){
  if(c.t==='intro') return `<button class="btn wide" data-a="next">계속</button>`;
  if(c.t==='match'&&!LS.checked) return `<div class="mhint">왼쪽과 오른쪽에서 하나씩 눌러 짝을 맞추세요</div>`;
  if(!LS.checked) return `${c.listen?'<button class="link" data-a="nolisten">지금은 들을 수 없어요</button>':''}<button class="btn wide" id="chk" data-a="check" ${canCheck(c)?'':'disabled'}>확인</button>`;
  const it=c.it; let det='';
  if(c.t==='mc'&&c.pr&&c.pr.cloze){ det=`정답: <span class="jp">${esc(c.ans)}</span>`; }
  else if(it) det=answerLine(it,c);
  const wn=!LS.ok&&it&&noteKey(it)?`<button class="wnadd ${inNote(it)?'on':''}" data-a="wnadd" data-v="${esc(it.id)}">${inNote(it)?I.check+'오답노트에 있어요':'+ 오답노트에 넣기'}</button>`:'';
  return `<div class="fb"><div class="fbt">${LS.ok?I.check+(c.t==='match'?'모두 맞췄어요!':'정답이에요!'):I.x+'아쉬워요'}${wn}</div><div class="fbd">${LS.ok&&c.t!=='build'?det:(!LS.ok?'정답: ':'')+det}</div>
  <button class="btn wide ${LS.ok?'okb':'badb'}" data-a="next">계속</button></div>`;
}
function answerLine(it,c){
  const S=state.settings, rd=S.romaji?` <small>${esc(it.rd)}</small>`:'';
  if(c.t==='match') return '';
  if(it.kind==='hira'||it.kind==='kata') return `<span class="jp">${esc(it.jp)}</span> = ${esc(it.rd)}`;
  if(it.kind==='word') return `<span class="jp">${ruby(it.f)}</span>${rd} = ${esc(it.ko)}`;
  if(c.t==='build'&&!c.jpTiles) return `${esc(it.ko)}`;
  return `<span class="jp">${ruby(it.f)}</span>${rd}<br>${esc(it.ko)}`;
}
function record(it,ok){ if(!it||!it.id) return; const s=state.stats[it.id]||[0,0]; s[ok?0:1]++; state.stats[it.id]=s; }
function check(){
  const c=LS.cur; if(LS.checked||!canCheck(c)) return;
  let ok=false;
  if(c.t==='mc') ok=LS.sel===c.ans;
  else if(c.t==='type'){ const v=LS.input.trim().toLowerCase().replace(/\s+/g,''); ok=c.accept.includes(v); }
  else if(c.t==='build') ok=LS.built.map(i=>c.tiles[i]).join('\u0001')===c.ans.join('\u0001');
  LS.checked=true; LS.ok=ok; record(c.it,ok);
  if(ok){ LS.correct++; sfx(true); }
  else { sfx(false); LS.mistakes++; if(LS.mode==='test') LS.wrongs.push(c.it); else LS.queue.push(regen(c)); }
  save(); render();
}
function regen(c){ // 같은 문제를 보기 순서만 바꿔 다시
  const n=Object.assign({},c); if(n.opts) n.opts=shuffle(n.opts); if(n.tiles) n.tiles=shuffle(n.tiles); if(n.left){n.left=shuffle(n.left);n.right=shuffle(n.right)} return n;
}
function loseHeart(){
  return; // 하트(체력) 기능 없음
}
function onNext(){
  const c=LS.cur;
  if(c.t==='intro'||LS.ok||LS.mode==='test') LS.done++;
  nextEx();
}
function finish(){
  if(LS.mode==='test') return finishTest();
  const L=LS.L; const t=dayKey(); const first=L?!isDone(L.id):false;
  let xp=LS.mode==='practice'?5:(first?10:5); const perfect=LS.mistakes===0; if(perfect) xp+=5;
  state.xp+=xp; state.dailyXP[t]=(state.dailyXP[t]||0)+xp;
  let streakUp=false; if(state.lastDay!==t){ state.streak=(state.lastDay===addDays(t,-1))?state.streak+1:1; state.lastDay=t; streakUp=true; }
  let newWords=0;
  if(L){ const r=state.lessons[L.id]||{done:0}; r.done=(r.done||0)+1; state.lessons[L.id]=r; if(first&&L.kind==='word'){ newWords=L.items.length; state.dailyWords[t]=(state.dailyWords[t]||0)+newWords; } }
  const goal=state.settings.goal, reached=newWords>0&&(state.dailyWords[t]||0)>=goal&&(state.dailyWords[t]-newWords)<goal;
  const answered=LS.correct+LS.mistakes; const acc=answered?Math.round(LS.correct/answered*100):100; const sec=Math.round((Date.now()-LS.start)/1000);
  LS.result={xp,perfect,acc,sec,streakUp,newWords,reached};
  save(true); ui.screen='result'; render(); sfx('done');
}
function renderResult(){
  if(LS.mode==='test') return renderTestResult();
  const r=LS.result; const mm=Math.floor(r.sec/60), ss=String(r.sec%60).padStart(2,'0');
  app.innerHTML=`<div class="result"><div class="burst">${r.perfect?I.check:I.bolt}</div><h1>${LS.mode==='practice'?'연습 완료!':'레슨 완료!'}</h1>
  <p class="rsub">${r.perfect?'한 번도 틀리지 않았어요. 보너스 +5 XP':LS.mode==='practice'?'약한 부분을 한 번 더 다졌어요':'틀린 문제는 복습 탭에서 다시 연습할 수 있어요'}</p>
  <div class="rgrid"><div class="rc xp"><small>획득 XP</small><b>+${r.xp}</b></div><div class="rc acc"><small>정확도</small><b>${r.acc}%</b></div><div class="rc tm"><small>시간</small><b>${mm}:${ss}</b></div></div>
  ${r.newWords?`<p class="rnote">새 단어 <b>${r.newWords}개</b> · 오늘 ${state.dailyWords[dayKey()]||0}/${state.settings.goal}개</p>`:''}
  ${r.reached?'<p class="rnote goal">오늘의 목표를 달성했어요!</p>':''}
  ${r.streakUp?`<p class="rnote fire">${I.flame} 연속 학습 ${state.streak}일째</p>`:''}
  <button class="btn wide" data-a="home">계속</button></div>`;
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return; const a=el.dataset.a, v=el.dataset.v;
  const H={
    tab:()=>{ui.tab=v; render(); scrollToCur(); if(v==='words') prefetchClips(wbItems().map(x=>x.say),150)},
    plan:()=>planSheet(),
    furi:()=>{ state.settings.furi=!state.settings.furi; save(); render(); },
    test:()=>startTest(),
    wnadd:()=>{ const it=ITEMS[v]; if(!it) return; if(inNote(it)) state.wrongNote[noteKey(it)]=-Date.now(); else noteAdd(it); save(); render(); },
    wnall:()=>{ (LS&&LS.wrongs||[]).forEach(x=>{ if(!inNote(x)) noteAdd(x); }); save(); render(); },
    wndel:()=>{ e.stopPropagation(); state.wrongNote[v]=-Date.now(); save(); render(); },
    wbkind:()=>{ui.wbKind=v; render(); prefetchClips(wbItems().map(x=>x.say),150)},
    hideko:()=>{ui.hideKo=!ui.hideKo; render()},
    reveal:()=>{el.classList.add('open')},
    gocur:()=>{ const n=document.querySelector('.node.cur'); if(!n) return; const r=n.getBoundingClientRect(); window.scrollTo({top:Math.max(0,window.scrollY+r.top-(window.innerHeight/2-r.height/2)),behavior:'smooth'}); },
    kview:()=>{ui.kanaView=v; render(); if(v==='path') scrollToCur(); else window.scrollTo(0,0)}, cscript:()=>{ui.chartScript=v; render()},
    open:()=>openLessonSheet(v), start:()=>startLesson(v), guide:()=>{guideSheet(v); const u=TRACKS.day.find(x=>x.id===v); if(u) prefetchClips([...u.words,...u.phr].map(x=>x.say),40)}, info:()=>infoSheet(v),
    mclose, practice:()=>startPractice(),
    home:()=>{mclose(); LS=null; ui.screen='home'; render(); scrollToCur()},
    quit:()=>modal(`<div class="isheet"><h2>그만할까요?</h2><p>지금 나가면 이 레슨의 진행은 저장되지 않아요.</p><button class="btn wide" data-a="mclose">계속 학습하기</button><button class="btn ghost danger wide" data-a="home">나가기</button></div>`),
    say:()=>speak(v),

const lsKey=uid=>LSKEY+':'+(uid===undefined?(ACC.user?ACC.user.id:'guest'):uid);
function loadLocal(key){try{const r=localStorage.getItem(key);return r?normalize(JSON.parse(r)):null}catch(e){return null}}
function saveLocal(){try{localStorage.setItem(lsKey(),JSON.stringify(state))}catch(e){}}
function save(immediate){
  state.updatedAt=Date.now(); saveLocal();
  if(!ACC.user) return;
  clearTimeout(saveTimer); saveTimer=setTimeout(pushRemote, immediate?50:1500);
}
function trimState(s){ // 일별 기록은 최근 60일만 보관
  const lim=addDays(dayKey(),-60);
  for(const key of ['dailyXP','dailyWords']) for(const k of Object.keys(s[key]||{})) if(k<lim) delete s[key][k];
  return s;
}
// 두 기록을 합친다: 최신 쪽을 바탕으로, 완료한 레슨·일별 기록·XP·오답 통계는 잃지 않게 합친다.
function mergeState(a,b){
  const [n,o]=(a.updatedAt||0)>=(b.updatedAt||0)?[a,b]:[b,a];
  if(n.resetAt&&(o.updatedAt||0)<=n.resetAt) return normalize(JSON.parse(JSON.stringify(n)));
  const r=JSON.parse(JSON.stringify(n));
  for(const id in o.lessons||{}){const x=o.lessons[id], y=r.lessons[id]; if(!y||(x.done||0)>(y.done||0)) r.lessons[id]=Object.assign({},x);}
  for(const k of ['dailyXP','dailyWords']) for(const d in o[k]||{}) r[k][d]=Math.max(r[k][d]||0,o[k][d]);
  r.xp=Math.max(r.xp||0,o.xp||0);
  r.wrongNote=r.wrongNote||{}; for(const k in o.wrongNote||{}){ const x=o.wrongNote[k], y=r.wrongNote[k]; if(y==null||Math.abs(x)>Math.abs(y)) r.wrongNote[k]=x; }
  r.tests=r.tests||{}; for(const d in o.tests||{}){ if(!r.tests[d]||(o.tests[d].score||0)>(r.tests[d].score||0)) r.tests[d]=o.tests[d]; }
  for(const id in o.stats||{}){const s=r.stats[id]||[0,0], t=o.stats[id]; r.stats[id]=[Math.max(s[0],t[0]),Math.max(s[1],t[1])];}
  if((o.lastDay||'')>(r.lastDay||'')){r.lastDay=o.lastDay; r.streak=o.streak;} else if(o.lastDay===r.lastDay) r.streak=Math.max(r.streak||0,o.streak||0);
  r.updatedAt=Math.max(a.updatedAt||0,b.updatedAt||0);
  return normalize(r);
}
const tableMissing=err=>!!err&&(err.code==='42P01'||err.code==='PGRST205'||/does not exist|schema cache|Could not find the table/i.test(err.message||''));
async function pushRemote(){
  if(!ACC.user||!ACC.sb||ACC.status==='notable') return;
  if(ACC.busy){ACC.dirty=true;return}
  ACC.busy=true; ACC.status='saving'; updateSyncLabel();
  const uid=ACC.user.id;
  try{
    const {error}=await ACC.sb.from(SB_TABLE).upsert({user_id:uid,data:trimState(JSON.parse(JSON.stringify(state))),updated_at:new Date().toISOString()});
    ACC.status=error?(tableMissing(error)?'notable':'error'):'synced';
  }catch(e){ACC.status='error'}
  ACC.busy=false; updateSyncLabel();
  if(ACC.dirty&&ACC.user&&ACC.user.id===uid){ACC.dirty=false; pushRemote();}
}
async function pullRemote(first){
  if(!ACC.user||!ACC.sb) return;
  const uid=ACC.user.id; ACC.status='loading'; updateSyncLabel();
  let res; try{ res=await ACC.sb.from(SB_TABLE).select('data,updated_at').eq('user_id',uid).maybeSingle(); }catch(e){ res={error:e}; }
  if(!ACC.user||ACC.user.id!==uid) return;
  if(res.error){ ACC.status=tableMissing(res.error)?'notable':'error'; updateSyncLabel(); return; }
  const remote=res.data?normalize(res.data.data):null;
  if(first&&!remote) offerGuestImport();
  const merged=remote?mergeState(state,remote):state;
  const changedLocal=JSON.stringify(merged)!==JSON.stringify(state);
  state=merged; saveLocal();
  if(!remote||JSON.stringify(trimState(JSON.parse(JSON.stringify(merged))))!==JSON.stringify(trimState(JSON.parse(JSON.stringify(remote))))) await pushRemote();
  else { ACC.status='synced'; updateSyncLabel(); }
  if(changedLocal&&(ui.screen==='home')){ render(); scrollToCur(); }
}
function offerGuestImport(){
  const g=loadLocal(lsKey('guest'));
  if(!g||!(g.xp>0)) return;
  if(localStorage.getItem(MODEKEY+'.imported:'+ACC.user.id)) return;
  modal(`<div class="isheet"><h2>이 기기의 기록 가져오기</h2><p>로그인 없이 학습한 기록(${g.xp} XP, 완료한 레슨 ${Object.values(g.lessons).filter(x=>x.done).length}개)이 이 기기에 있어요. 이 계정으로 가져올까요?</p>
  <button class="btn wide" data-a="gimport">가져오기</button><button class="btn ghost wide" data-a="gskip">가져오지 않기</button></div>`);
}

function syncText(){return {synced:'계정에 저장됨 — 다른 기기에서도 이어서 학습할 수 있어요',saving:'저장 중…',loading:'계정 기록을 불러오는 중…',error:'서버에 저장하지 못했어요. 이 기기에는 저장되어 있어요',notable:'서버에 기록 표가 아직 없어요 (supabase/kanamichi.sql 실행 필요). 지금은 이 기기에만 저장돼요',guest:'로그인하지 않음 — 이 기기(브라우저)에만 저장돼요'}[ACC.status]||''}

  if(user) pullRemote(true);
}
function showGate(tab){ ACC.entered=null; ACC.gate={tab:tab||'login',msg:'',err:false,busy:false}; LS=null; ui.screen='gate'; mclose(); render(); window.scrollTo(0,0); }
async function logout(){
  clearTimeout(saveTimer); if(ACC.user) await pushRemote();
  try{ await ACC.sb.auth.signOut(); }catch(e){}
  ACC.user=null; showGate('login');
}

const ACC_H={
  gtab:el=>{ACC.gate.tab=el.dataset.v; ACC.gate.msg=''; render()},
  guest:()=>enterApp(null),
  togate:()=>showGate('login'),
  gforgot:()=>doForgot(),
  cgo:el=>codeGo(el), cagain:el=>codeAgain(el),
  npgo:async el=>{const pw=document.getElementById('nPw').value; if(pw.length<6) return cmsg('6자 이상 입력하세요.',true); el.disabled=true; const r=await ACC.sb.auth.updateUser({password:pw}); if(r.error){cmsg('바꾸지 못했어요: '+r.error.message,true); el.disabled=false} else {mclose()}},
  logout:()=>modal(`<div class="isheet"><h2>로그아웃할까요?</h2><p>학습 기록은 계정에 저장되어 있어요. 다시 로그인하면 이어서 할 수 있어요.</p><button class="btn danger wide" data-a="dologout">로그아웃</button><button class="btn ghost wide" data-a="mclose">취소</button></div>`),
  dologout:()=>{mclose(); logout()},
  syncnow:()=>{clearTimeout(saveTimer); pullRemote(false)},
  gimport:()=>{const g=loadLocal(lsKey('guest')); if(g){ g.updatedAt=Math.max(g.updatedAt||0,(state.updatedAt||0)+1); state=mergeState(state,g); } try{localStorage.setItem(MODEKEY+'.imported:'+ACC.user.id,'1')}catch(e){} mclose(); save(true); render()},
  gskip:()=>{try{localStorage.setItem(MODEKEY+'.imported:'+ACC.user.id,'1')}catch(e){} mclose()},
};

function boot(){
  try{ if(window.claude&&typeof window.claude.use==='function') claude.use('tts').then(t=>{ctts=t||null}).catch(()=>{}); }catch(e){}
  let guestMode=false; try{guestMode=localStorage.getItem(MODEKEY)==='guest'}catch(e){}
  if(!window.supabase||!window.supabase.createClient){ if(guestMode) enterApp(null); else showGate(); return; }
  try{ ACC.sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{storageKey:AUTHKEY,persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}); }
  catch(e){ ACC.sb=null; if(guestMode) enterApp(null); else showGate(); return; }
  let resolved=false;
  ACC.sb.auth.onAuthStateChange((ev,session)=>{
    setTimeout(()=>{ // 콜백 안에서 바로 supabase를 다시 부르면 잠금이 걸릴 수 있어 한 박자 미룬다
      if(ev==='PASSWORD_RECOVERY'){ if(session) enterApp(session.user); newPwDialog(); return; }
      if(session&&session.user){ resolved=true; enterApp(session.user); }
      else if(ev==='SIGNED_OUT'){ if(ACC.entered&&ACC.entered!=='guest') showGate('login'); }
      else if(ev==='INITIAL_SESSION'&&!resolved){ resolved=true; if(guestMode) enterApp(null); else showGate(); }
    },0);
  });
  setTimeout(()=>{ if(!resolved){ resolved=true; if(guestMode) enterApp(null); else showGate(); } },6000);
}
// 새 버전 확인: 홈 화면 앱이 예전 페이지를 붙잡고 있을 때 업데이트를 알려 준다
let NEWVER=null;
function checkUpdate(){
  if(!/^https?:/.test(location.protocol)) return;
  fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{
    const m=t.match(/APP_VERSION='([\d.]+)'/); if(m&&m[1]!==APP_VERSION){ NEWVER=m[1]; showUpdateBar(); }
  }).catch(()=>{});
}
function showUpdateBar(){
  if(!NEWVER||document.getElementById('upd')) return;
  const d=document.createElement('div'); d.id='upd'; d.className='upd';
  d.innerHTML=`<span>새 버전 v${esc(NEWVER)}이 나왔어요</span><button data-a="doupdate">업데이트</button>`;
  document.body.appendChild(d);
}
ACC_H.doupdate=()=>{ if(ACC.user){clearTimeout(saveTimer); pushRemote();} setTimeout(()=>location.replace(location.pathname+'?v='+NEWVER),300); };
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible') checkUpdate();
  if(!ACC.user) return;
  if(document.visibilityState==='hidden'){ clearTimeout(saveTimer); pushRemote(); }
  else if(ui.screen==='home') pullRemote(false);
});
boot();
setTimeout(checkUpdate,1500);

</script>
